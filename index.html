<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Gestor · Use Arcanju</title>
<meta name="theme-color" content="#f3eee9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ARCANJU OS — sistema de gestão
   Tokens de design derivados da identidade Use Arcanju
   ============================================================ */
:root{
  --vinho:#5a332e;          /* marrom/vinho oficial da marca */
  --vinho-escuro:#2a1714;   /* superfície do menu lateral */
  --vinho-profundo:#1d0f0d;
  --vinho-claro:#8a5a52;
  --tinta:#141414;          /* preto oficial */
  --verde:#1f9d6c;          /* verde oficial — saudável */
  --verde-fundo:#e8f5ef;
  --ambar:#b07a1e;          /* atenção */
  --ambar-fundo:#fbf2e0;
  --rubro:#a8322c;          /* crítico */
  --rubro-fundo:#fbeceb;
  --papel:#fbf9f7;          /* canvas */
  --carta:#ffffff;          /* cartões */
  --rail-fundo:#f2ece6;     /* menu lateral em papel */
  --linha:#e9e3dc;
  --linha-forte:#d8cfc6;
  --texto:#1f1a18;
  --texto-medio:#6b615b;
  --texto-fraco:#94897f;
  --sombra:0 1px 2px rgba(42,23,20,.05);
  --sombra-alta:0 24px 60px -20px rgba(42,23,20,.35);
  --r-sm:6px; --r:10px; --r-lg:16px;
  --rail:248px;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--papel);
  color:var(--texto);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv05" 1;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--vinho)}
:focus-visible{outline:2px solid var(--vinho);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- Estrutura ---------------- */
.app{display:flex;min-height:100vh}

/* ---------------- Menu lateral ---------------- */
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--rail-fundo);
  color:var(--vinho);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  scrollbar-width:thin;border-right:1px solid #e3dbd3;
}
.rail::-webkit-scrollbar{width:6px}
.rail::-webkit-scrollbar-thumb{background:#d8cfc6;border-radius:3px}
.marca{padding:24px 20px 20px;border-bottom:1px solid #e3dbd3}
.marca-logo{width:152px;height:auto;display:block;margin-bottom:14px}
.marca-nome{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--vinho);letter-spacing:.005em;line-height:1.15}
.marca-sub{font-size:11px;color:#9b877f;margin-top:2px}
.nav{padding:12px 10px;flex:1}
.nav-grupo{font-size:10.5px;color:#a5908a;padding:16px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:var(--r-sm);
  color:#5d4841;font-size:13.5px;text-align:left;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:#e8dfd7;color:var(--vinho)}
.nav-item.ativo{background:var(--vinho);color:#fff;font-weight:500;box-shadow:0 1px 3px rgba(90,51,46,.22)}
.nav-ico{width:16px;height:16px;flex:0 0 16px;opacity:.75}
.nav-item.ativo .nav-ico{opacity:1}
.nav-tag{margin-left:auto;font-size:9.5px;background:#e3dbd3;color:#9b877f;padding:2px 6px;border-radius:99px}
.rail-rodape{padding:16px 18px;border-top:1px solid #e3dbd3;font-size:11.5px;color:#8d7a73;font-family:var(--serif);font-style:italic;line-height:1.45}

/* ---------------- Área principal ---------------- */
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{
  position:sticky;top:0;z-index:40;
  background:rgba(251,249,247,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linha);
  padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.barra-tit{font-family:var(--serif);font-size:19px;font-weight:600}
.barra-dir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.periodo{display:flex;align-items:center;gap:2px;background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:3px}
.periodo button{padding:5px 9px;border-radius:var(--r-sm);color:var(--texto-medio);line-height:1}
.periodo button:hover{background:var(--papel);color:var(--texto)}
.periodo-rot{font-size:13px;font-weight:600;padding:0 10px;min-width:118px;text-align:center;text-transform:capitalize}
.conteudo{padding:24px 28px 80px;max-width:1320px;width:100%}
.abas{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--linha);margin:-6px -28px 22px;padding:0 28px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{padding:9px 12px;font-size:13px;color:var(--texto-medio);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.aba:hover{color:var(--texto)}
.aba.ativa{color:var(--vinho);border-bottom-color:var(--vinho);font-weight:600}

/* ---------------- Veredito (herói) ---------------- */
.veredito{
  background:var(--carta);border:1px solid var(--linha);border-left:3px solid var(--verde);
  border-radius:var(--r-lg);padding:28px 30px;margin-bottom:20px;
  box-shadow:0 1px 2px rgba(90,51,46,.045);
}
.veredito.atencao{border-left-color:var(--ambar)}
.veredito.critico{border-left-color:var(--rubro)}
.veredito.neutro{border-left-color:var(--linha-forte)}
.veredito-eixo{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.veredito-frase{font-family:var(--serif);font-size:clamp(22px,3.2vw,32px);line-height:1.22;font-weight:500;letter-spacing:-.015em;max-width:26ch}
.veredito-apoio{margin-top:12px;font-size:13.5px;color:var(--texto-medio);max-width:64ch;line-height:1.6}
.veredito-linha{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--linha)}
.mini{min-width:108px}
.mini-rot{font-size:11.5px;color:var(--texto-fraco);margin-bottom:2px}
.mini-val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------------- Cartões / KPI ---------------- */
.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:18px}
.cartao-tit{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:2px}
.cartao-sub{font-size:12.5px;color:var(--texto-fraco);margin-bottom:14px}
.kpi{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:15px 16px;position:relative}
.kpi-rot{font-size:11.5px;color:var(--texto-medio);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.kpi-val{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-val.sm{font-size:20px}
.kpi-nota{font-size:11.5px;color:var(--texto-fraco);margin-top:5px;display:flex;align-items:center;gap:5px}
.kpi.destaque{border-color:var(--linha-forte);box-shadow:0 1px 2px rgba(90,51,46,.045)}
.pt{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}
.pt.ok{background:var(--verde)} .pt.at{background:var(--ambar)} .pt.cr{background:var(--rubro)} .pt.nu{background:var(--linha-forte)}
.pos{color:var(--verde)} .neg{color:var(--rubro)} .warn{color:var(--ambar)}
.num{font-variant-numeric:tabular-nums}

/* ---------------- Diagnósticos ---------------- */
.diag{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--linha);background:var(--carta);margin-bottom:8px;align-items:flex-start}
.diag.ok{border-left:3px solid var(--verde)}
.diag.at{border-left:3px solid var(--ambar)}
.diag.cr{border-left:3px solid var(--rubro)}
.diag.nu{border-left:3px solid var(--linha-forte)}
.diag-corpo{flex:1;min-width:0}
.diag-tit{font-weight:600;font-size:13.5px;margin-bottom:2px}
.diag-txt{font-size:12.5px;color:var(--texto-medio);line-height:1.55}
.diag-acao{font-size:12.5px;color:var(--vinho);margin-top:5px;font-weight:500}

/* ---------------- Barras / progresso ---------------- */
.barra-prog{height:7px;background:#efe9e4;border-radius:99px;overflow:hidden;margin-top:8px}
.barra-prog span{display:block;height:100%;border-radius:99px;background:var(--verde);transition:width .35s ease}
.barra-prog span.at{background:var(--ambar)} .barra-prog span.cr{background:var(--rubro)} .barra-prog span.vi{background:var(--vinho)}
.leg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--texto-medio);margin-top:6px}

/* ---------------- Tabelas ---------------- */
.tabela-env{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--r);background:var(--carta)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--texto-medio);
  background:#fbf9f8;border-bottom:1px solid var(--linha);white-space:nowrap;position:sticky;top:0;
}
td{padding:9px 12px;border-bottom:1px solid #f1ece8;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fdfcfb}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.total td{font-weight:700;background:#fbf9f8;border-top:1px solid var(--linha-forte)}
tr.hoje td{background:#fdf7f0}
.etq{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.etq.rec{background:var(--verde-fundo);color:#136c4a}
.etq.des{background:#f4eeec;color:var(--vinho)}
.etq.fal{background:var(--rubro-fundo);color:var(--rubro)}
.etq.pen{background:var(--ambar-fundo);color:#8a5e13}
.etq.pag{background:#eef0ef;color:var(--texto-medio)}

/* ---------------- Formulários ---------------- */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;color:var(--texto-medio);margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--linha-forte);border-radius:var(--r-sm);
  background:#fff;font-size:13.5px;transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vinho);box-shadow:0 0 0 3px rgba(90,51,46,.10)}
input:disabled{background:#f6f3f1;color:var(--texto-fraco)}
textarea{resize:vertical;min-height:62px}
.linha-campos{display:grid;gap:12px}
.lc2{grid-template-columns:1fr 1fr}
.lc3{grid-template-columns:1fr 1fr 1fr}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
  background:var(--vinho);color:#fff;border:1px solid var(--vinho);transition:background .12s,transform .06s;
}
.btn:hover{background:#6b3e37}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--texto);border-color:var(--linha-forte)}
.btn.sec:hover{background:var(--papel)}
.btn.perigo{background:#fff;color:var(--rubro);border-color:#e8c7c4}
.btn.perigo:hover{background:var(--rubro-fundo)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.bloco{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-icone{padding:4px 6px;border-radius:var(--r-sm);color:var(--texto-fraco)}
.btn-icone:hover{background:var(--papel);color:var(--vinho)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--vinho);cursor:pointer}
.segm{display:inline-flex;background:#f2ede9;border-radius:var(--r-sm);padding:2px;gap:2px}
.segm button{padding:5px 11px;border-radius:5px;font-size:12.5px;color:var(--texto-medio);font-weight:500}
.segm button.ativo{background:#fff;color:var(--vinho);box-shadow:var(--sombra);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#e7e1db;border-radius:99px;padding:0;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--vinho);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--vinho);cursor:pointer;border:2px solid #fff}

/* ---------------- Ajuda ---------------- */
.ajuda{
  width:14px;height:14px;border-radius:50%;border:1px solid var(--linha-forte);
  color:var(--texto-fraco);font-size:9.5px;line-height:12px;text-align:center;flex:0 0 14px;
  position:relative;font-weight:700;
}
.ajuda:hover{border-color:var(--vinho);color:var(--vinho)}
.ajuda:hover::after{
  content:attr(data-ajuda);position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
  background:var(--tinta);color:#fff;padding:8px 10px;border-radius:var(--r-sm);
  font-size:11.5px;font-weight:400;line-height:1.45;width:230px;z-index:60;text-align:left;
  box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;
}

/* ---------------- Modal ---------------- */
.fundo{position:fixed;inset:0;background:rgba(29,15,13,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.modal{background:var(--carta);border-radius:var(--r-lg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:var(--sombra-alta)}
.modal.larga{max-width:820px}
.modal-topo{padding:18px 22px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--carta);z-index:2;border-radius:var(--r-lg) var(--r-lg) 0 0}
.modal-tit{font-family:var(--serif);font-size:18px;font-weight:600}
.modal-corpo{padding:20px 22px}
.modal-rodape{padding:14px 22px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--carta)}

/* ---------------- Onboarding ---------------- */
.ob{max-width:560px;text-align:left}
.ob-passo{padding:34px 34px 26px}
.ob-conta{font-size:11.5px;color:var(--texto-fraco);margin-bottom:14px}
.ob-tit{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.2;margin-bottom:10px;letter-spacing:-.02em}
.ob-txt{font-size:14px;color:var(--texto-medio);line-height:1.65;max-width:52ch}
.ob-pontos{display:flex;gap:6px;margin-right:auto;align-items:center}
.ob-ponto{width:7px;height:7px;border-radius:50%;background:var(--linha-forte)}
.ob-ponto.on{background:var(--vinho);width:20px;border-radius:99px}

/* ---------------- Gráficos ---------------- */
.grafico{width:100%;overflow:visible}
.gr-legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--texto-medio);margin-top:10px}
.gr-legenda i{width:11px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ---------------- Vazio ---------------- */
.vazio{text-align:center;padding:46px 22px;color:var(--texto-medio)}
.vazio-tit{font-family:var(--serif);font-size:19px;color:var(--texto);margin-bottom:7px;font-weight:600}
.vazio-txt{font-size:13.5px;max-width:42ch;margin:0 auto 18px;line-height:1.6}

/* ---------------- Aviso / toast ---------------- */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;
  z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.2,.8,.3,1);max-width:90vw;
}
.toast.on{transform:translateX(-50%) translateY(0)}
.aviso{background:var(--ambar-fundo);border:1px solid #ecd9ae;color:#7a5411;padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:12px;line-height:1.55}
.info{background:#f4f1ef;border:1px solid var(--linha);color:var(--texto-medio);padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:12px;line-height:1.55}

/* ---------------- Em breve ---------------- */
.breve{max-width:560px;padding:44px 0}
.breve-tit{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:10px;letter-spacing:-.02em}
.breve-txt{color:var(--texto-medio);font-size:14px;line-height:1.7;margin-bottom:22px}
.breve-lista{border-top:1px solid var(--linha)}
.breve-item{padding:11px 0;border-bottom:1px solid var(--linha);font-size:13.5px;display:flex;gap:12px;align-items:baseline}
.breve-item b{font-weight:600;min-width:150px}
.breve-item span{color:var(--texto-fraco);font-size:12.5px}

/* ---------------- Mobile ---------------- */
.menu-btn{display:none}
.rail-fundo{display:none}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;z-index:120;height:100dvh}
  .rail.aberto{transform:translateX(0)}
  .rail-fundo.on{display:block;position:fixed;inset:0;background:rgba(29,15,13,.5);z-index:110}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--linha-forte);border-radius:var(--r-sm);background:var(--carta)}
  .rail{box-shadow:0 0 60px rgba(42,23,20,.28)}
  .barra{padding:10px 14px}
  .conteudo{padding:16px 14px 90px}
  .abas{margin:-2px -14px 16px;padding:0 14px}
  .g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .lc2,.lc3{grid-template-columns:1fr}
  .veredito{padding:20px;border-radius:var(--r)}
  .barra-tit{font-size:16px}
  .periodo-rot{min-width:96px;font-size:12.5px}
  .kpi-val{font-size:21px}
  .modal{max-height:96vh}
  .ob-passo{padding:26px 22px 20px}
  .ob-tit{font-size:23px}
  .ajuda:hover::after{width:180px;left:auto;right:-6px;transform:none}
}
@media (max-width:520px){
  .g3,.g4,.g5{grid-template-columns:1fr 1fr}
  .veredito-linha{gap:16px}
  .mini{min-width:calc(50% - 8px)}
}
/* ---------------- Tela de acesso ---------------- */
.trava{position:fixed;inset:0;z-index:500;background:var(--rail-fundo);display:flex;align-items:center;justify-content:center;padding:24px}
.trava-caixa{width:100%;max-width:372px;text-align:center}
.trava-logo{width:190px;max-width:70vw;height:auto;margin:0 auto 30px;display:block}
.trava-frase{font-family:var(--serif);font-size:16px;font-style:italic;color:#8d7a73;line-height:1.5;margin-bottom:26px;min-height:48px;max-width:34ch;margin-left:auto;margin-right:auto}
.trava-campo{position:relative}
.trava-campo input{text-align:center;padding:12px 14px;font-size:15px;border-radius:var(--r);border-color:#dbd1c8;background:#fffdfc}
.trava-btn{margin-top:10px;width:100%;padding:11px}
.trava-erro{color:var(--rubro);font-size:12.5px;margin-top:12px;min-height:18px}
.trava-rodape{margin-top:34px;font-size:11px;color:#a5908a}
.saindo{opacity:0;transition:opacity .35s ease}

/* ---------------- Aviso de humor ---------------- */

    if(v===null||v===undefined||isNaN(v)) v=0;

    if(v===null||v===undefined||isNaN(v)) v=0;
    var a=Math.abs(v), s=v<0?'-':'';

    return U.brl(v,0);

  pct: function(v, casas){
    if(v===null||v===undefined||!isFinite(v)) return '—';

  dataBr: function(iso){
    if(!iso) return '—';
    var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
  },
  somaMes: function(ym, delta){
    var p=ym.split('-'); var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1+delta, 1);

  clamp: function(v,a,b){ return Math.max(a,Math.min(b,v)); },
  div: function(a,b){ return (!b||!isFinite(b)) ? 0 : a/b; }
};

/* ------------------------------------------------------------
   STORE — toda persistência passa por aqui.
   Hoje: localStorage. Amanhã: trocar só estes 4 métodos por API.
------------------------------------------------------------ */
var Store = {
  dados: null,
  ouvintes: [],
  disponivel: (function(){
    try{ var k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })(),

  carregar: function(){
    if(!Store.disponivel){ Store.dados = estadoPadrao(); return Store.dados; }
    try{
      var bruto = localStorage.getItem(CHAVE);
      if(!bruto){ Store.dados = estadoPadrao(); Store.salvar(); return Store.dados; }
      var d = JSON.parse(bruto);
      Store.dados = Store.migrar(d);
      return Store.dados;
    }catch(e){
      console.error('Falha ao ler dados salvos:', e);
      Store.dados = estadoPadrao();
      return Store.dados;
    }
  },

  migrar: function(d){
    var base = estadoPadrao();
    if(!d || typeof d!=='object') return base;
    /* preenche campos novos sem apagar o que já existe */
    d.esquema = ESQUEMA;
    d.config = Object.assign({}, base.config, d.config||{});
    d.config.modo = Object.assign({}, base.config.modo, (d.config&&d.config.modo)||{});
    if(!Array.isArray(d.config.produtos) || !d.config.produtos.length) d.config.produtos = base.config.produtos;
    if(!Array.isArray(d.config.insumos)) d.config.insumos = base.config.insumos;
    if(!Array.isArray(d.config.embalagemFaixas) || !d.config.embalagemFaixas.length)
      d.config.embalagemFaixas = base.config.embalagemFaixas;
    if(!Array.isArray(d.vigencias)) d.vigencias = [];
    if(!Array.isArray(d.config.canais) || !d.config.canais.length) d.config.canais = base.config.canais;
    if(!Array.isArray(d.lancamentos)) d.lancamentos = [];
    if(!Array.isArray(d.ofertas)) d.ofertas = [];
    if(!Array.isArray(d.reservaMovs)) d.reservaMovs = [];
    if(!Array.isArray(d.contas)) d.contas = [];
    if(!Array.isArray(d.campanhas)) d.campanhas = [];
    if(!d.fechamento || typeof d.fechamento!=='object') d.fechamento = {};
    if(!d.ajusteFrete || typeof d.ajusteFrete!=='object') d.ajusteFrete = {};
    d.integracoes = Object.assign({}, base.integracoes, d.integracoes||{});
    d.integracoes.loja = Object.assign({}, base.integracoes.loja, d.integracoes.loja||{});
    d.integracoes.ads = Object.assign({}, base.integracoes.ads, d.integracoes.ads||{});
    d.integracoes.frete = Object.assign({}, base.integracoes.frete, d.integracoes.frete||{});
    if(!d.metas || typeof d.metas!=='object') d.metas = {};
    d.onboarding = !!d.onboarding;
    /* normaliza lançamentos */
    d.lancamentos = d.lancamentos.map(function(l){
      return {
        id: l.id || U.id(),
        data: l.data || U.hoje(),
        tipo: l.tipo==='receita'?'receita':'despesa',
        grupo: GRUPOS[l.grupo] ? l.grupo : (l.tipo==='receita'?'vendas':'outros'),
        categoria: l.categoria || '',
        descricao: l.descricao || '',
        canal: l.canal || '',
        referencia: l.referencia || '',
        valor: U.n(l.valor),
        freteCobrado: U.n(l.freteCobrado),
        valorBruto: U.n(l.valorBruto),
        desconto: U.n(l.desconto),
        uf: l.uf || '',
        pedidos: U.n(l.pedidos),
        camisetas: U.n(l.camisetas),
        pagamento: l.pagamento || '',
        status: l.status==='pendente'?'pendente':'pago',
        obs: l.obs || '',
        origem: l.origem || 'manual',
        externoId: l.externoId || '',
        criadoEm: l.criadoEm || new Date().toISOString()
      };
    });
    return d;
  },

  salvar: function(){
    if(!Store.disponivel) return false;
    try{
      localStorage.setItem(CHAVE, JSON.stringify(Store.dados));
      return true;
    }catch(e){
      console.error('Falha ao salvar:', e);
      UI.toast('Não foi possível salvar. O armazenamento do navegador pode estar cheio.');
      return false;
    }
  },

  commit: function(msg){
    Store.salvar();
    Store.ouvintes.forEach(function(f){ f(); });
    if(msg) UI.toast(msg);
  },

  /* ---- Lançamentos ---- */
  addLancamento: function(l){
    l.id = U.id(); l.criadoEm = new Date().toISOString();

    Store.dados.lancamentos[i] = l;
    Store.commit('Lançamento atualizado');
    return true;
  },
  delLancamento: function(id){
    Store.dados.lancamentos = Store.dados.lancamentos.filter(function(x){ return x.id!==id; });
    Store.commit('Lançamento excluído');
  },
  getLancamento: function(id){
    return Store.dados.lancamentos.find(function(x){ return x.id===id; });
  },
  /* ---- Vigências de custo ----
     Trocar um custo hoje não pode alterar o que já aconteceu.
     Cada mudança vale a partir de um mês; meses anteriores mantêm o custo da época. ---- */
  CAMPOS_VIGENCIA: ['produtos','insumos','embalagemFaixas','freteMedio','gateway','gatewayFixo',
                    'checkout','imposto','marketingBase','operacionalPct'],

  snapshotPremissas: function(cfg){
    var o = {};
    Store.CAMPOS_VIGENCIA.forEach(function(k){
      o[k] = JSON.parse(JSON.stringify(cfg[k]));
    });
    return o;
  },

  /* premissas válidas num mês */
  premissasDe: function(ym){
    var vs = (Store.dados.vigencias||[]).filter(function(v){ return v.desde<=ym; })
      .sort(function(a,b){ return a.desde<b.desde?-1:1; });
    if(!vs.length) return null;
    return vs[vs.length-1].premissas;
  },

  salvarVigencia: function(desde, premissas, obs){
    var i = Store.dados.vigencias.findIndex(function(v){ return v.desde===desde; });
    var reg = {desde:desde, premissas:premissas, obs:obs||'', em:new Date().toISOString()};
    if(i>=0) Store.dados.vigencias[i] = reg; else Store.dados.vigencias.push(reg);
    Store.dados.vigencias.sort(function(a,b){ return a.desde<b.desde?-1:1; });
    /* a vigência mais recente também vira a configuração corrente */
    var ultima = Store.dados.vigencias[Store.dados.vigencias.length-1];
    Object.keys(ultima.premissas).forEach(function(k){
      Store.dados.config[k] = JSON.parse(JSON.stringify(ultima.premissas[k]));
    });
    Store.commit('Premissas salvas, valendo a partir de '+desde);
  },

  removerVigencia: function(desde){
    Store.dados.vigencias = Store.dados.vigencias.filter(function(v){ return v.desde!==desde; });
    Store.commit('Vigência removida');
  },

  /* ---- Ajuste do frete real do mês ---- */
  ajusteFreteDe: function(ym){
    var v = Store.dados.ajusteFrete[ym];
    return (v===undefined || v===null || v==='') ? null : U.n(v);
  },
  setAjusteFrete: function(ym, valor){
    if(valor===null) delete Store.dados.ajusteFrete[ym];
    else Store.dados.ajusteFrete[ym] = U.n(valor);
    Store.commit(valor===null ? 'Ajuste removido' : 'Frete do mês ajustado');
  },

  /* ---- Fechamento do mês ---- */
  fecho: function(ym){
    return Store.dados.fechamento[ym] || {conciliadoAte:'', ofertaAprovada:false, custosConferidos:false,
      falhasApuradas:false, aprendizado:'', acao:'', fechado:false};
  },
  setFecho: function(ym, f){ Store.dados.fechamento[ym]=f; Store.commit('Mês atualizado'); },

  /* ---- Metas ---- */
  meta: function(ym){
    return Store.dados.metas[ym] || {faturamento:0, lucro:0, pedidos:0, margem:Store.dados.config.metaMargem, cpaMax:0};
  },
  setMeta: function(ym, m){ Store.dados.metas[ym]=m; Store.commit('Meta salva'); },

  /* ---- Meses com dados ---- */
  meses: function(){
    var s={};
    Store.dados.lancamentos.forEach(function(l){ s[U.ym(l.data)]=1; });
    Object.keys(Store.dados.metas).forEach(function(m){ s[m]=1; });
    s[U.ymAtual()]=1;
    return Object.keys(s).sort();
  },

  /* ---- Backup ---- */
  exportarJSON: function(){
    var nome = 'arcanju-backup-'+U.hoje()+'.json';
    Store.baixar(nome, JSON.stringify(Store.dados, null, 2), 'application/json');
  },
  exportarCSV: function(lista){
    var ls = lista || Store.dados.lancamentos;
    var cab = ['data','tipo','grupo','categoria','descricao','canal','uf','referencia','valor','freteCobrado','pedidos','camisetas','pagamento','status','obs','origem','externoId'];
    var linhas = [cab.join(';')];
    ls.forEach(function(l){
      linhas.push(cab.map(function(c){
        var v = l[c]===undefined?'':l[c];
        if(c==='valor') v = String(v).replace('.',',');
        return '"'+String(v).replace(/"/g,'""')+'"';
      }).join(';'));
    });
    Store.baixar('arcanju-lancamentos-'+U.hoje()+'.csv', '\ufeff'+linhas.join('\n'), 'text/csv;charset=utf-8');
  },
  baixar: function(nome, conteudo, tipo){
    try{
      var blob = new Blob([conteudo], {type:tipo});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nome;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
      UI.toast('Arquivo gerado: '+nome);
    }catch(e){ UI.toast('Não foi possível gerar o arquivo neste navegador.'); }
  },
  importarJSON: function(texto){
    var d = JSON.parse(texto);
    if(!d || !d.lancamentos || !d.config) throw new Error('Arquivo fora do formato do Arcanju OS.');
    Store.dados = Store.migrar(d);
    Store.commit('Backup restaurado');
  },
  importarCSV: function(texto){
    var linhas = texto.replace(/^\ufeff/,'').split(/\r?\n/).filter(function(l){ return l.trim(); });
    if(linhas.length<2) throw new Error('CSV vazio.');
    var sep = (linhas[0].split(';').length > linhas[0].split(',').length) ? ';' : ',';
    var cab = quebrar(linhas[0], sep).map(function(c){ return c.trim().toLowerCase(); });
    var novos = 0;
    for(var i=1;i<linhas.length;i++){
      var c = quebrar(linhas[i], sep);
      var o = {}; cab.forEach(function(k,j){ o[k]=(c[j]||'').trim(); });
      if(!o.data || !o.valor) continue;
      var tipo = (o.tipo==='receita')?'receita':'despesa';
      var grupo = GRUPOS[o.grupo] ? o.grupo : (tipo==='receita'?'vendas':'outros');
      Store.dados.lancamentos.push({
        id:U.id(), data:o.data, tipo:tipo, grupo:grupo,
        categoria:o.categoria||'', descricao:o.descricao||'', canal:o.canal||'',
        uf:(o.uf||'').toUpperCase(), freteCobrado:U.n(o.fretecobrado||o.freteCobrado),
        referencia:o.referencia||'', valor:U.n(o.valor), pedidos:U.n(o.pedidos),
        camisetas:U.n(o.camisetas), pagamento:o.pagamento||'',
        status:(o.status==='pendente'?'pendente':'pago'), obs:o.obs||'',
        origem:o.origem||'csv', externoId:o.externoid||o.externoId||'',
        criadoEm:new Date().toISOString()
      });
      novos++;
    }
    Store.commit(novos+' lançamento(s) importado(s)');
    return novos;
    function quebrar(linha, s){
      var out=[], atual='', aspas=false;
      for(var k=0;k<linha.length;k++){
        var ch=linha[k];
        if(ch==='"'){ if(aspas && linha[k+1]==='"'){ atual+='"'; k++; } else aspas=!aspas; }
        else if(ch===s && !aspas){ out.push(atual); atual=''; }
        else atual+=ch;
      }
      out.push(atual); return out;
    }
  },
  /* ---- Contas da agenda ---- */
  addConta: function(c){ c.id=U.id(); c.pagos=c.pagos||{}; Store.dados.contas.push(c); Store.commit('Conta salva'); },
  editConta: function(id,c){

  delConta: function(id){

    if(i>=0){ Store.dados.campanhas[i]=c; return 'atualizado'; }

  /* ---- Upsert de dados vindos de integração (evita duplicar) ---- */
  upsertExterno: function(l){
    var i = Store.dados.lancamentos.findIndex(function(x){
      return x.externoId && l.externoId && x.origem===l.origem && x.externoId===l.externoId;

    if(i>=0){
      var antigo = Store.dados.lancamentos[i];
      l.id=antigo.id; l.criadoEm=antigo.criadoEm;
      Store.dados.lancamentos[i]=l;
      return 'atualizado';
    }
    l.id=U.id(); l.criadoEm=new Date().toISOString();
    Store.dados.lancamentos.push(l);
    return 'novo';
  },

  limparTudo: function(){
    Store.dados = estadoPadrao();
    Store.dados.onboarding = true;
    Store.commit('Dados apagados');
  }
};
/* ------------------------------------------------------------
   CALC — motor de cálculo
   Nenhuma tela guarda número. Tudo é derivado daqui.
------------------------------------------------------------ */
var Calc = {

  cfg: function(){ return Store.dados.config; },

  /* Premissas válidas num mês. Sem vigência cadastrada, usa a configuração atual. */
  cfgM: function(ym){
    if(!ym) return Store.dados.config;
    var p = Store.premissasDe(ym);
    return p ? Object.assign({}, Store.dados.config, p) : Store.dados.config;
  },

  custoCamiseta: function(ym){
    var ps = Calc.cfgM(ym).produtos || [];
    var p = ps.find(function(x){ return x.padrao; }) || ps[0];
    return p ? U.n(p.custo) : 0;
  },
  /* custo do kit de embalagem para um pedido com N camisetas */
  kitEmbalagem: function(qtd, ym){
    var faixas = (Calc.cfgM(ym).embalagemFaixas||[]).slice()
      .sort(function(a,b){ return U.n(a.ate)-U.n(b.ate); });
    if(!faixas.length) return 0;
    var q = Math.max(1, Math.round(U.n(qtd,1)||1));
    for(var i=0;i<faixas.length;i++){ if(q<=U.n(faixas[i].ate)) return U.n(faixas[i].custo); }
    return U.n(faixas[faixas.length-1].custo);
  },
  insumosPorPedido: function(ym){
    return (Calc.cfgM(ym).insumos||[]).filter(function(i){ return i.ativo!==false && i.base==='pedido'; })
      .reduce(function(s,i){ return s+U.n(i.custo); },0);
  },
  insumosPorCamiseta: function(ym){
    return (Calc.cfgM(ym).insumos||[]).filter(function(i){ return i.ativo!==false && i.base==='camiseta'; })
      .reduce(function(s,i){ return s+U.n(i.custo); },0);
  },
  pctTaxas: function(ym){ var c=Calc.cfgM(ym); return U.n(c.gateway)+U.n(c.checkout); },

  lancamentosDoMes: function(ym){
    return Store.dados.lancamentos.filter(function(l){ return U.ym(l.data)===ym; });
  },

  camisetasDe: function(l){
    if(U.n(l.camisetas)>0) return U.n(l.camisetas);
    return U.n(l.pedidos) * U.n(Calc.cfg().camisetasPorPedidoPadrao, 1);
  },
  /* embalagem de um conjunto de pedidos, pela média de peças por pedido */
  embalagemDe: function(pedidos, camisetas, ym){
    if(!pedidos) return 0;
    var media = U.div(camisetas, pedidos);
    return pedidos * (Calc.kitEmbalagem(media, ym) + Calc.insumosPorPedido(ym))
         + camisetas * Calc.insumosPorCamiseta(ym);
  },

  /* ---------- APURAÇÃO DO PERÍODO ---------- */
  apurar: function(ym){
    var c = Calc.cfgM(ym);
    var ls = Calc.lancamentosDoMes(ym);
    var a = {
      ym: ym, temDados: ls.length>0,
      faturamento:0, outrasReceitas:0, freteCobrado:0, pedidos:0, camisetas:0,
      manual:{}, auto:{}, custo:{}, conflitos:[],
      recebido:0, aReceber:0, pagoSaida:0, aPagar:0
    };
    Object.keys(GRUPOS).forEach(function(g){ a.manual[g]=0; });

    ls.forEach(function(l){
      var v = U.n(l.valor);
      a.manual[l.grupo] = (a.manual[l.grupo]||0) + v;
      if(l.tipo==='receita'){
        if(l.grupo==='vendas'){
          a.faturamento += v;
          a.freteCobrado += U.n(l.freteCobrado);
          a.pedidos += U.n(l.pedidos);
          a.camisetas += Calc.camisetasDe(l);
        } else a.outrasReceitas += v;
        if(l.status==='pago') a.recebido += v; else a.aReceber += v;
      }else{
        if(l.status==='pago') a.pagoSaida += v; else a.aPagar += v;
      }
    });

    /* Valores que o sistema calcula sozinho a partir de poucos dados */
    a.baseTaxavel     = a.faturamento + a.freteCobrado;
    a.auto.taxas      = a.baseTaxavel * Calc.pctTaxas(ym)/100 + a.pedidos * U.n(c.gatewayFixo);
    a.auto.imposto    = a.baseTaxavel * U.n(c.imposto)/100;
    a.auto.cmv        = a.camisetas * Calc.custoCamiseta(ym);
    a.auto.embalagem  = Calc.embalagemDe(a.pedidos, a.camisetas, ym);
    a.auto.frete      = a.pedidos * U.n(c.freteMedio);
    a.auto.operacional= a.faturamento * U.n(c.operacionalPct)/100;

    ['cmv','embalagem','frete','taxas','imposto','operacional'].forEach(function(g){
      var modo = c.modo[g]==='auto' ? 'auto' : 'manual';
      a.custo[g] = modo==='auto' ? a.auto[g] : a.manual[g];
      if(modo==='auto' && a.manual[g] > 0.009){
        a.conflitos.push({grupo:g, valor:a.manual[g]});
      }
    });
    ['marketing','comissao','falha','outros'].forEach(function(g){ a.custo[g] = a.manual[g]; });

    /* Frete real informado no fechamento do mês vence qualquer estimativa. */
    a.fretePrevisto = a.custo.frete;
    var aj = Store.ajusteFreteDe(ym);
    a.freteAjustado = (aj !== null);
    if(a.freteAjustado) a.custo.frete = aj;

    a.despesaTotal = Object.keys(a.custo).reduce(function(s,g){ return s+a.custo[g]; },0);
    a.receitaTotal = a.faturamento + a.outrasReceitas + a.freteCobrado;
    a.lucro   = a.receitaTotal - a.despesaTotal;
    a.margem  = U.div(a.lucro, a.faturamento)*100;
    a.ticket  = U.div(a.faturamento, a.pedidos);
    a.lucroPorPedido = U.div(a.lucro, a.pedidos);
    a.lucroPorCamiseta = U.div(a.lucro, a.camisetas);
    a.cpa     = U.div(a.custo.marketing, a.pedidos);
    a.marketingPct = U.div(a.custo.marketing, a.faturamento)*100;
    a.roas    = U.div(a.faturamento, a.custo.marketing);
    a.falhaPct= U.div(a.custo.falha, a.faturamento)*100;
    a.falhaPorPedido = U.div(a.custo.falha, a.pedidos);
    a.cmvPct  = U.div(a.custo.cmv, a.faturamento)*100;
    a.fretePct= U.div(a.custo.frete, a.faturamento)*100;
    a.fretePorPedido = U.div(a.custo.frete, a.pedidos);
    a.camisetasPorPedido = U.div(a.camisetas, a.pedidos);

    /* margem de contribuição: tudo que varia com a venda */
    var variaveis = a.custo.cmv+a.custo.embalagem+a.custo.frete+a.custo.taxas+a.custo.imposto+a.custo.marketing+a.custo.comissao;
    a.contribuicao = a.faturamento + a.freteCobrado - variaveis;
    a.contribuicaoPct = U.div(a.contribuicao, a.faturamento)*100;

    /* custo fixo do mês = operacional quando lançado manualmente */
    a.operacionalEhFixo = c.modo.operacional !== 'auto';
    a.custoFixoMes = a.operacionalEhFixo ? a.custo.operacional : 0;
    return a;
  },

  /* ---------- PROJEÇÃO ---------- */
  projetar: function(a){
    var ym = a.ym, hoje = U.hoje(), ymAtual = U.ymAtual();
    var dias = U.diasNoMes(ym);
    var p = {dias:dias, encerrado:false, futuro:false};
    if(ym < ymAtual){ p.decorridos = dias; p.encerrado = true; }
    else if(ym > ymAtual){ p.decorridos = 0; p.futuro = true; }
    else p.decorridos = Math.min(parseInt(hoje.slice(8,10),10), dias);
    p.restantes = Math.max(0, dias - p.decorridos);

    p.ritmoFat = U.div(a.faturamento, p.decorridos);
    p.ritmoPedidos = U.div(a.pedidos, p.decorridos);
    p.projFat = p.encerrado ? a.faturamento : p.ritmoFat * dias;
    p.projPedidos = p.encerrado ? a.pedidos : p.ritmoPedidos * dias;

    /* lucro projetado = contribuição projetada − custo fixo do mês */
    var contribPct = U.div(a.contribuicao, a.faturamento);
    var opPct = a.operacionalEhFixo ? 0 : U.div(a.custo.operacional, a.faturamento);
    var outrosPct = U.div(a.custo.falha + a.custo.outros, a.faturamento);
    p.margemVarPct = (contribPct - opPct - outrosPct);
    p.projLucro = p.encerrado ? a.lucro : (p.projFat * p.margemVarPct - a.custoFixoMes + a.outrasReceitas);
    p.projMargem = U.div(p.projLucro, p.projFat)*100;

    var meta = Store.meta(ym);
    p.metaFat = U.n(meta.faturamento); p.metaLucro = U.n(meta.lucro);
    p.metaPedidos = U.n(meta.pedidos); p.metaMargem = U.n(meta.margem, Calc.cfg().metaMargem);
    p.metaCpa = U.n(meta.cpaMax);

    p.faltaFat = Math.max(0, p.metaFat - a.faturamento);
    p.faltaLucro = Math.max(0, p.metaLucro - a.lucro);
    p.precisaFatDia = p.restantes>0 ? p.faltaFat/p.restantes : p.faltaFat;
    p.precisaLucroDia = p.restantes>0 ? p.faltaLucro/p.restantes : p.faltaLucro;
    p.atingeFat = p.metaFat>0 ? p.projFat >= p.metaFat : null;
    p.atingeLucro = p.metaLucro>0 ? p.projLucro >= p.metaLucro : null;
    p.pctMetaFat = U.div(a.faturamento, p.metaFat)*100;
    p.pctMetaLucro = U.div(a.lucro, p.metaLucro)*100;
    p.pctProjMetaFat = U.div(p.projFat, p.metaFat)*100;
    p.pctProjMetaLucro = U.div(p.projLucro, p.metaLucro)*100;
    return p;
  },

  /* ---------- SÉRIE DIÁRIA ---------- */
  serieDiaria: function(ym){
    var dias = U.diasNoMes(ym), c = Calc.cfgM(ym);
    var ls = Calc.lancamentosDoMes(ym);
    var mapa = {};
    for(var d=1; d<=dias; d++){
      var iso = ym+'-'+String(d).padStart(2,'0');
      mapa[iso] = {data:iso, dia:d, fat:0, freteCob:0, pedidos:0, camisetas:0, mkt:0, outrasDesp:0, falha:0};
    }
    ls.forEach(function(l){
      var m = mapa[l.data]; if(!m) return;
      if(l.tipo==='receita'){
        if(l.grupo==='vendas'){ m.fat+=U.n(l.valor); m.freteCob+=U.n(l.freteCobrado); m.pedidos+=U.n(l.pedidos); m.camisetas+=Calc.camisetasDe(l); }
      }else{
        if(l.grupo==='marketing'||l.grupo==='comissao') m.mkt+=U.n(l.valor);
        else if(l.grupo==='falha') m.falha+=U.n(l.valor);
        else if(['cmv','embalagem','frete','taxas','imposto','operacional'].indexOf(l.grupo)>=0){
          if(c.modo[l.grupo]!=='auto') m.outrasDesp+=U.n(l.valor);
        } else m.outrasDesp+=U.n(l.valor);
      }
    });
    var lista = Object.keys(mapa).sort().map(function(k){ return mapa[k]; });
    var accF=0, accL=0;
    lista.forEach(function(d){
      var autoCustos = 0;
      var baseT = d.fat + d.freteCob;
      if(c.modo.taxas==='auto')      autoCustos += baseT*Calc.pctTaxas(ym)/100 + d.pedidos*U.n(c.gatewayFixo);
      if(c.modo.imposto==='auto')    autoCustos += baseT*U.n(c.imposto)/100;
      if(c.modo.cmv==='auto')        autoCustos += d.camisetas*Calc.custoCamiseta(ym);
      if(c.modo.embalagem==='auto')  autoCustos += Calc.embalagemDe(d.pedidos, d.camisetas, ym);
      if(c.modo.frete==='auto')      autoCustos += d.pedidos*U.n(c.freteMedio);
      if(c.modo.operacional==='auto')autoCustos += d.fat*U.n(c.operacionalPct)/100;
      d.custoAuto = autoCustos;
      d.lucro = d.fat + d.freteCob - autoCustos - d.mkt - d.falha - d.outrasDesp;
      accF += d.fat; accL += d.lucro;
      d.accFat = accF; d.accLucro = accL;
      d.ticket = U.div(d.fat, d.pedidos);
      d.cpa = U.div(d.mkt, d.pedidos);
    });
    return lista;
  },

  /* ---------- CAIXA ---------- */
  caixa: function(){
    var c = Calc.cfg(), hoje = U.hoje();
    var entradas=0, saidas=0, aReceber=0, aPagar=0, atrasadoReceber=0, atrasadoPagar=0;
    Store.dados.lancamentos.forEach(function(l){
      var v=U.n(l.valor);
      if(l.tipo==='receita'){
        if(l.status==='pago') entradas+=v;
        else { aReceber+=v; if(l.data<hoje) atrasadoReceber+=v; }
      }else{
        if(l.status==='pago') saidas+=v;
        else { aPagar+=v; if(l.data<hoje) atrasadoPagar+=v; }
      }
    });
    /* custos automáticos já ocorridos também saem do caixa */
    var autoSaidas = 0;
    Store.meses().forEach(function(ym){
      var a = Calc.apurar(ym);
      ['cmv','embalagem','frete','taxas','imposto','operacional'].forEach(function(g){
        if(Calc.cfgM(ym).modo[g]==='auto') autoSaidas += a.auto[g];
      });
    });
    var reservaAportes = Store.dados.reservaMovs.reduce(function(s,m){
      return s + (m.tipo==='aporte' ? U.n(m.valor) : -U.n(m.valor));
    },0);

    var atual = U.n(c.saldoInicial) + entradas - saidas - autoSaidas;
    var projetado = atual + aReceber - aPagar;
    var custoFixo = U.n(c.custoFixoMensal);
    var metaReserva = custoFixo * U.n(c.reservaMetaMeses,3);
    return {
      saldoInicial:U.n(c.saldoInicial), entradas:entradas, saidas:saidas+autoSaidas,
      custosAutomaticos:autoSaidas, atual:atual, aReceber:aReceber, aPagar:aPagar,
      atrasadoReceber:atrasadoReceber, atrasadoPagar:atrasadoPagar, projetado:projetado,
      reserva:reservaAportes, metaReserva:metaReserva,
      pctReserva: U.div(reservaAportes, metaReserva)*100,
      mesesProtegidos: U.div(reservaAportes, custoFixo),
      custoFixoMensal:custoFixo,
      disponivel: atual - reservaAportes
    };
  },

  /* ---------- HISTÓRICO ---------- */
  historico: function(){
    return Store.meses().map(function(ym){
      var a = Calc.apurar(ym); var p = Calc.projetar(a);
      return {ym:ym, a:a, p:p};
    });
  },

  /* ---------- VENDAS POR CANAL ---------- */
  porCanal: function(ym){
    var ls = Calc.lancamentosDoMes(ym).filter(function(l){ return l.grupo==='vendas'; });
    var mapa = {};
    ls.forEach(function(l){
      var k = l.canal || 'Sem canal';
      if(!mapa[k]) mapa[k]={canal:k, fat:0, pedidos:0, camisetas:0};
      mapa[k].fat += U.n(l.valor);
      mapa[k].pedidos += U.n(l.pedidos);
      mapa[k].camisetas += Calc.camisetasDe(l);
    });
    var tot = Object.keys(mapa).reduce(function(s,k){ return s+mapa[k].fat; },0);
    return Object.keys(mapa).map(function(k){
      var o = mapa[k];
      o.ticket = U.div(o.fat, o.pedidos);
      o.part = U.div(o.fat, tot)*100;
      return o;
    }).sort(function(x,y){ return y.fat-x.fat; });
  },

  /* ---------- VENDAS POR ESTADO ---------- */
  porEstado: function(ym){
    var ls = Calc.lancamentosDoMes(ym).filter(function(l){ return l.grupo==='vendas'; });
    var mapa = {}, tot = 0, semUf = 0;
    ls.forEach(function(l){
      var v = U.n(l.valor); tot += v;
      var k = (l.uf||'').toUpperCase();
      if(!k){ semUf += v; return; }
      if(!mapa[k]) mapa[k] = {uf:k, fat:0, pedidos:0, camisetas:0};
      mapa[k].fat += v; mapa[k].pedidos += U.n(l.pedidos); mapa[k].camisetas += Calc.camisetasDe(l);
    });
    var lista = Object.keys(mapa).map(function(k){
      var o = mapa[k];
      o.ticket = U.div(o.fat, o.pedidos);
      o.part = U.div(o.fat, tot)*100;
      return o;
    }).sort(function(x,y){ return y.fat-x.fat; });
    lista.semUf = semUf; lista.total = tot;
    return lista;
  },

  /* ---------- CHECKLIST DE ESCALA ---------- */
  podeEscalar: function(a, p, cx){
    var c = Calc.cfg(), f = Store.fecho(a.ym);
    var itens = [
      {rot:'Margem na meta', ok: a.faturamento>0 && a.margem >= U.n(c.metaMargem,30),
       nota:'margem de '+U.pct(a.margem)+' contra '+U.pct(c.metaMargem,0)},
      {rot:'CPA dentro do teto', ok: !(p.metaCpa>0) || a.cpa<=p.metaCpa,
       nota: p.metaCpa>0 ? ('CPA de '+U.brl(a.cpa)+' contra teto de '+U.brl(p.metaCpa)) : 'nenhum teto de CPA definido'},
      {rot:'Caixa positivo', ok: cx.atual>0, nota:'caixa de '+U.brl(cx.atual,0)},
      {rot:'Reserva acima da metade', ok: cx.metaReserva===0 || cx.pctReserva>=50,
       nota: cx.metaReserva>0 ? (U.pct(cx.pctReserva,0)+' da reserva formada') : 'meta de reserva não definida'},
      {rot:'Custo da falha abaixo de 3%', ok: a.falhaPct < 3, nota:U.pct(a.falhaPct)+' do faturamento'},
      {rot:'Oferta aprovada', ok: !!f.ofertaAprovada, nota:'confirmado no fechamento do mês'},
      {rot:'Custos conferidos', ok: !!f.custosConferidos, nota:'inclui encargos e taxas reais'},
      {rot:'Falhas apuradas', ok: !!f.falhasApuradas, nota:'reenvios e devoluções lançados'}
    ];
    return {itens:itens, liberado: itens.every(function(i){ return i.ok; }),
            pendentes: itens.filter(function(i){ return !i.ok; }).length};
  },

  /* ---------- SIMULADOR DE OFERTAS (unit economics) ---------- */
  simular: function(o){
    var c = Calc.cfg();
    var qtd = Math.max(1, U.n(o.camisetas,1));
    var preco = U.n(o.preco);
    var custoCam = (o.custoCamiseta!==undefined && o.custoCamiseta!=='') ? U.n(o.custoCamiseta) : Calc.custoCamiseta();
    var kit = (o.kit!==undefined && o.kit!=='') ? U.n(o.kit) : Calc.kitEmbalagem(qtd);
    var insumoPed = (o.insumoPedido!==undefined && o.insumoPedido!=='') ? U.n(o.insumoPedido) : Calc.insumosPorPedido();
    var insumoCam = (o.insumoCamiseta!==undefined && o.insumoCamiseta!=='') ? U.n(o.insumoCamiseta) : Calc.insumosPorCamiseta();
    var brindes = U.n(o.brindes);
    var frete = U.n(o.frete!==undefined&&o.frete!==''?o.frete:c.freteMedio);
    /* se o frete não é grátis, o cliente paga: vira receita e não sai da margem */
    var receitaFrete = o.freteGratis===false ? U.n(o.freteCobrado!==undefined&&o.freteCobrado!==''?o.freteCobrado:frete) : 0;

    var r = {qtd:qtd, preco:preco, receitaFrete:receitaFrete, total:preco+receitaFrete};
    r.cmv = qtd * custoCam;
    r.kit = kit;
    r.embalagem = kit + insumoPed + qtd*insumoCam + brindes;
    r.frete = frete;
    r.custoFisico = r.cmv + r.embalagem + r.frete;

    r.pctGateway = U.n(c.gateway); r.pctCheckout = U.n(c.checkout); r.pctImposto = U.n(c.imposto);
    r.gatewayFixo = U.n(o.gatewayFixo!==undefined&&o.gatewayFixo!=='' ? o.gatewayFixo : c.gatewayFixo);
    r.pctOperacional = (o.operacionalPct!==undefined&&o.operacionalPct!=='') ? U.n(o.operacionalPct) : U.n(c.operacionalPct);
    r.gateway = r.total*r.pctGateway/100 + r.gatewayFixo;
    r.checkout = r.total*r.pctCheckout/100;
    r.imposto = r.total*r.pctImposto/100;
    r.taxas = r.gateway + r.checkout;

    r.modoMkt = o.modoMkt==='cpa' ? 'cpa' : 'pct';
    if(r.modoMkt==='cpa'){
      r.marketing = U.n(o.cpa);
      r.marketingPct = U.div(r.marketing, r.total)*100;
    }else{
      r.marketingPct = (o.marketingPct!==undefined&&o.marketingPct!=='') ? U.n(o.marketingPct) : U.n(c.marketingBase);
      r.marketing = r.total*r.marketingPct/100;
    }

    r.contribuicao = r.total - r.custoFisico - r.taxas - r.imposto - r.marketing;
    r.contribuicaoPct = U.div(r.contribuicao, r.total)*100;
    r.operacional = r.total*r.pctOperacional/100;
    r.lucro = r.contribuicao - r.operacional;
    r.margem = U.div(r.lucro, r.total)*100;
    r.lucroPorCamiseta = r.lucro/qtd;
    r.precoPorCamiseta = preco/qtd;
    r.custoTotal = r.total - r.lucro;

    /* percentuais que variam com o preço (sem marketing) */
    var pctSemMkt = (r.pctGateway + r.pctCheckout + r.pctImposto + r.pctOperacional)/100;
    r.pctSemMkt = pctSemMkt;

    /* CPA máximo para diferentes margens */
    var fixosTotais = r.custoFisico + r.gatewayFixo - r.receitaFrete;
    r.cpaBreakeven = preco*(1-pctSemMkt) - fixosTotais;
    var alvo = (o.margemAlvo!==undefined&&o.margemAlvo!=='') ? U.n(o.margemAlvo) : U.n(c.metaMargem);
    r.margemAlvo = alvo;
    r.cpaMaxAlvo = preco*(1 - pctSemMkt - alvo/100) - fixosTotais;
    r.roasMinBreakeven = r.cpaBreakeven>0 ? preco/r.cpaBreakeven : Infinity;
    r.roasMinAlvo = r.cpaMaxAlvo>0 ? preco/r.cpaMaxAlvo : Infinity;
    r.roasAtual = r.marketing>0 ? preco/r.marketing : Infinity;

    /* preço necessário para a margem alvo, mantendo o modo de marketing */
    var denom;
    if(r.modoMkt==='pct'){
      denom = 1 - pctSemMkt - r.marketingPct/100 - alvo/100;
      r.precoParaAlvo = denom>0 ? fixosTotais/denom : null;
    }else{
      denom = 1 - pctSemMkt - alvo/100;
      r.precoParaAlvo = denom>0 ? (fixosTotais + r.marketing)/denom : null;
    }
    /* preço de equilíbrio (lucro zero) */
    var d0 = (r.modoMkt==='pct') ? (1 - pctSemMkt - r.marketingPct/100) : (1 - pctSemMkt);
    r.precoEquilibrio = d0>0 ? ((r.modoMkt==='pct'? fixosTotais : fixosTotais+r.marketing)/d0) : null;

    r.saudavel = r.margem >= alvo ? 'ok' : (r.margem >= alvo*0.7 ? 'at' : 'cr');
    return r;
  },

  /* escada de ofertas 1..n camisetas mantendo o preço por camiseta proporcional */
  escada: function(base, precos){
    return [1,2,3,4].map(function(q){
      var p = precos && precos[q]!==undefined && precos[q]!=='' ? U.n(precos[q]) : null;
      var o = Object.assign({}, base, {camisetas:q, preco: p!==null ? p : U.n(base.preco)/U.n(base.camisetas,1)*q});
      return Calc.simular(o);
    });
  },

  /* ---------- DIAGNÓSTICOS ---------- */
  diagnosticar: function(a, p, cx){
    var c = Calc.cfgM(a.ym), d = [];
    var nivel = {ok:0, at:1, cr:2, nu:-1};

    if(!a.temDados){
      d.push({n:'nu', t:'Sem lançamentos neste mês',
        x:'Registre a primeira venda em Lançamentos e todo o restante do sistema se preenche sozinho.',
        acao:'Registrar lançamento', ir:'novo'});
      return d;
    }

    /* Margem */
    if(a.faturamento>0){
      var alvo = U.n(c.metaMargem,30);
      if(a.margem >= alvo) d.push({n:'ok', t:'Margem dentro da meta', x:'Margem líquida de '+U.pct(a.margem)+' contra meta de '+U.pct(alvo,0)+'.'});
      else if(a.margem >= alvo*0.7) d.push({n:'at', t:'Margem abaixo da meta', x:'Margem líquida de '+U.pct(a.margem)+' contra meta de '+U.pct(alvo,0)+'. Faltam '+U.pct(alvo-a.margem)+' para o alvo estrutural.', acao:'Revisar a oferta no simulador', ir:'fin:simulador'});
      else if(a.margem >= 0) d.push({n:'cr', t:'Margem crítica', x:'Margem líquida de '+U.pct(a.margem)+'. A operação está trabalhando perto do limite.', acao:'Revisar preço e marketing', ir:'fin:simulador'});
      else d.push({n:'cr', t:'Prejuízo no período', x:'O resultado do mês está negativo em '+U.brl(Math.abs(a.lucro))+'. Cada venda adicional nas condições atuais aumenta a perda.', acao:'Revisar a oferta agora', ir:'fin:simulador'});
    }

    /* Marketing / CPA */
    if(a.custo.marketing>0 && a.faturamento>0){
      var base = U.n(c.marketingBase,25);
      if(a.marketingPct <= base) d.push({n:'ok', t:'Marketing dentro do cenário-base', x:'Marketing consumiu '+U.pct(a.marketingPct)+' do faturamento (base: '+U.pct(base,0)+'). ROAS de '+U.num(a.roas,2)+'.'});
      else d.push({n:'at', t:'Marketing acima do cenário-base', x:'Marketing consumiu '+U.pct(a.marketingPct)+' do faturamento, acima da base de '+U.pct(base,0)+'. Cada ponto acima sai direto da margem.'});
      if(p.metaCpa>0){
        if(a.cpa<=p.metaCpa) d.push({n:'ok', t:'CPA dentro do limite', x:'CPA de '+U.brl(a.cpa)+' contra limite de '+U.brl(p.metaCpa)+'.'});
        else d.push({n:'cr', t:'CPA acima do limite', x:'CPA de '+U.brl(a.cpa)+' contra limite de '+U.brl(p.metaCpa)+'. Escalar assim reduz o lucro por pedido.'});
      }
    }else if(a.faturamento>0){
      d.push({n:'nu', t:'Marketing ainda não lançado', x:'Sem o gasto de tráfego, o CPA e a margem real do mês ficam otimistas.', acao:'Lançar investimento em marketing', ir:'novo'});
    }

    /* Meta de lucro */
    if(p.metaLucro>0){
      if(p.encerrado){
        if(a.lucro>=p.metaLucro) d.push({n:'ok', t:'Meta de lucro atingida', x:'Lucro de '+U.brl(a.lucro)+' contra meta de '+U.brl(p.metaLucro)+'.'});
        else d.push({n:'cr', t:'Meta de lucro não atingida', x:'Fechou em '+U.brl(a.lucro)+', '+U.brl(p.metaLucro-a.lucro)+' abaixo da meta.'});
      }else if(p.atingeLucro){
        d.push({n:'ok', t:'Mantendo o ritmo, a meta de lucro será atingida', x:'Projeção de '+U.brl(p.projLucro)+' contra meta de '+U.brl(p.metaLucro)+'.'});
      }else{
        d.push({n:'at', t:'No ritmo atual a meta de lucro não será atingida',
          x:'Projeção de '+U.brl(p.projLucro)+' contra meta de '+U.brl(p.metaLucro)+'. Faltam '+U.brl(p.faltaLucro)+' em '+p.restantes+' dia(s): '+U.brl(p.precisaLucroDia)+' de lucro por dia.',
          acao:'Ver projeção diária', ir:'fin:projecao'});
      }
    }else{
      d.push({n:'nu', t:'Sem meta definida para o mês', x:'Sem meta, o sistema mostra o que aconteceu mas não consegue dizer se está bom.', acao:'Definir metas do mês', ir:'fin:metas'});
    }

    /* Custo da falha */
    if(a.custo.falha>0){
      if(a.falhaPct>=3) d.push({n:'cr', t:'Custo da falha alto', x:U.brl(a.custo.falha)+' gastos corrigindo erros ('+U.pct(a.falhaPct)+' do faturamento, '+U.brl(a.falhaPorPedido)+' por pedido). Esse dinheiro sai inteiro do lucro.', acao:'Abrir custo da falha', ir:'fin:falha'});
      else if(a.falhaPct>=1) d.push({n:'at', t:'Custo da falha em observação', x:U.brl(a.custo.falha)+' ('+U.pct(a.falhaPct)+' do faturamento) foram gastos corrigindo problemas.', acao:'Abrir custo da falha', ir:'fin:falha'});
      else d.push({n:'ok', t:'Custo da falha sob controle', x:U.brl(a.custo.falha)+' ('+U.pct(a.falhaPct)+' do faturamento).'});
    }

    /* Caixa e reserva */
    if(cx.atual < 0) d.push({n:'cr', t:'Caixa negativo', x:'O caixa apurado está em '+U.brl(cx.atual)+'. Confira o saldo inicial em Configurações e os lançamentos pendentes.', acao:'Abrir caixa', ir:'fin:caixa'});
    else if(cx.custoFixoMensal>0 && cx.metaReserva>0){
      if(cx.pctReserva>=100) d.push({n:'ok', t:'Reserva operacional completa', x:'A reserva cobre '+U.num(cx.mesesProtegidos,1)+' mês(es) de custo fixo.'});
      else if(cx.pctReserva>=50) d.push({n:'at', t:'Reserva em construção', x:U.pct(cx.pctReserva,0)+' da reserva formada — protege '+U.num(cx.mesesProtegidos,1)+' mês(es). Reserva não é lucro disponível.', acao:'Abrir caixa e reserva', ir:'fin:caixa'});
      else d.push({n:'cr', t:'Reserva insuficiente', x:'Apenas '+U.pct(cx.pctReserva,0)+' da reserva está formada. A empresa está exposta a qualquer imprevisto de produção ou logística.', acao:'Abrir caixa e reserva', ir:'fin:caixa'});
    }

    /* Conflito de apuração */
    if(a.conflitos.length){
      var nomes = a.conflitos.map(function(k){ return GRUPOS[k.grupo].nome; }).join(', ');
      d.push({n:'at', t:'Lançamentos ignorados no cálculo', x:'Estes grupos estão no modo automático e têm lançamentos manuais no mês: '+nomes+'. O sistema usou o valor calculado para não contar duas vezes.', acao:'Ajustar modo de apuração', ir:'config'});
    }

    /* Recomendação de escala */
    if(a.faturamento>0 && a.custo.marketing>0){
      var margemOk = a.margem >= U.n(c.metaMargem,30);
      var caixaOk = cx.atual>0 && (cx.metaReserva===0 || cx.pctReserva>=50);
      var falhaOk = a.falhaPct < 3;
      if(margemOk && caixaOk && falhaOk) d.push({n:'ok', t:'Condições favoráveis para escalar', x:'Margem na meta, caixa positivo e custo da falha sob controle. O limite é o CPA: mantenha abaixo de '+U.brl(a.ticket*(1-U.n(c.metaMargem)/100-(U.n(c.gateway)+U.n(c.checkout)+U.n(c.imposto)+U.n(c.operacionalPct))/100)-(Calc.custoCamiseta(a.ym)*Math.max(1,a.camisetasPorPedido)+Calc.kitEmbalagem(a.camisetasPorPedido,a.ym)+Calc.insumosPorPedido(a.ym)+U.n(c.freteMedio)))+' por pedido.'});
      else d.push({n:'at', t:'Não recomendado escalar neste momento', x:'Escalar multiplica o que já existe. Antes de aumentar o investimento, corrija: '+[!margemOk?'margem abaixo da meta':null,!caixaOk?'caixa/reserva frágeis':null,!falhaOk?'custo da falha alto':null].filter(Boolean).join(', ')+'.'});
    }

    d.sort(function(x,y){ return nivel[y.n]-nivel[x.n]; });
    return d;
  },

  /* veredito do topo */
  veredito: function(a, p, cx, diags){
    if(!a.temDados) return {n:'neutro', frase:'Nenhum dado registrado em '+U.nomeMes(a.ym)+'.', apoio:'Comece registrando as vendas do período. O sistema calcula custos, margem, projeção e diagnóstico a partir disso.'};
    var temCritico = diags.some(function(x){ return x.n==='cr'; });
    var temAtencao = diags.some(function(x){ return x.n==='at'; });
    var frase, apoio, n;
    if(a.lucro<0){ n='critico'; frase='A operação está dando prejuízo.'; }
    else if(temCritico){ n='critico'; frase='Há um problema que precisa de decisão agora.'; }
    else if(temAtencao){ n='atencao'; frase='A operação está de pé, mas fora do alvo.'; }
    else { n='ok'; frase='A empresa está saudável neste período.'; }

    var partes = [];
    partes.push('Lucro de '+U.brl(a.lucro)+' sobre '+U.brl(a.faturamento)+' faturados ('+U.pct(a.margem)+' de margem).');
    if(!p.encerrado && p.ritmoFat>0) partes.push('Mantendo o ritmo, o mês fecha em '+U.brl(p.projFat)+' faturados e '+U.brl(p.projLucro)+' de lucro.');
    if(p.metaLucro>0 && !p.encerrado) partes.push(p.atingeLucro ? 'A meta de lucro deve ser atingida.' : 'A meta de lucro não será atingida neste ritmo.');
    apoio = partes.join(' ');
    return {n:n, frase:frase, apoio:apoio};
  }
};
/* ------------------------------------------------------------
   GRÁFICOS — SVG puro, sem dependências externas
------------------------------------------------------------ */
var Chart = {
  linha: function(op){
    var W=720, H=op.altura||220, ml=54, mr=12, mt=14, mb=26;
    var series = op.series.filter(function(s){ return s.pontos && s.pontos.length; });
    if(!series.length) return '<div class="vazio"><div class="vazio-txt">Sem dados para o gráfico.</div></div>';
    var n = op.n || Math.max.apply(null, series.map(function(s){ return s.pontos.length; }));
    if(n<1) n=1;
    var todos = [];
    series.forEach(function(s){ s.pontos.forEach(function(v){ todos.push(v); }); });
    var max = Math.max.apply(null, todos), min = Math.min.apply(null, todos.concat([0]));
    if(max===min) max = min+1;
    var pad = (max-min)*0.12; max+=pad; if(min<0) min-=pad;
    var px = function(i){ return ml + (n<=1?0:(W-ml-mr)*i/(n-1)); };
    var py = function(v){ return mt + (H-mt-mb)*(1-(v-min)/(max-min)); };
    var s='<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+U.esc(op.titulo||'gráfico')+'">';
    /* grade */
    for(var g=0; g<=4; g++){
      var v = min + (max-min)*g/4, y = py(v);
      s+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'" stroke="#eee7e2" stroke-width="1"/>';
      s+='<text x="'+(ml-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.brlCurto(v)+'</text>';
    }
    /* zero */
    if(min<0 && max>0) s+='<line x1="'+ml+'" y1="'+py(0)+'" x2="'+(W-mr)+'" y2="'+py(0)+'" stroke="#d6cec6" stroke-width="1"/>';
    /* séries */
    series.forEach(function(se){
      var d = se.pontos.map(function(v,i){ return (i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1); }).join(' ');
      if(se.area){
        s+='<path d="'+d+' L'+px(n-1).toFixed(1)+' '+py(Math.max(0,min)).toFixed(1)+' L'+px(0).toFixed(1)+' '+py(Math.max(0,min)).toFixed(1)+' Z" fill="'+se.cor+'" opacity=".07"/>';
      }
      s+='<path d="'+d+'" fill="none" stroke="'+se.cor+'" stroke-width="'+(se.largura||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.tracejado?' stroke-dasharray="5 4"':'')+'/>';
      if(se.marcarFim && n>0){
        s+='<circle cx="'+px(n-1)+'" cy="'+py(se.pontos[n-1])+'" r="3.5" fill="'+se.cor+'" stroke="#fff" stroke-width="1.5"/>';
      }
    });
    /* eixo x */
    var passos = Math.min(n, 6);
    for(var i=0;i<passos;i++){
      var idx = Math.round((n-1)*i/(passos-1||1));
      s+='<text x="'+px(idx)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.esc(op.labels[idx]||'')+'</text>';
    }
    s+='</svg>';
    var leg = '<div class="gr-legenda">'+op.series.map(function(se){
      return '<span><i style="background:'+se.cor+(se.tracejado?';opacity:.6':'')+'"></i>'+U.esc(se.nome)+'</span>';
    }).join('')+'</div>';
    return s+leg;
  },

  barras: function(itens, op){
    op = op||{};
    if(!itens.length) return '<div class="vazio"><div class="vazio-txt">Sem dados.</div></div>';
    var max = Math.max.apply(null, itens.map(function(i){ return Math.abs(i.valor); }).concat([1]));
    return '<div style="display:flex;flex-direction:column;gap:9px">'+itens.map(function(i){
      var w = U.clamp(Math.abs(i.valor)/max*100, i.valor?1.5:0, 100);
      return '<div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;gap:10px;margin-bottom:3px">'+
          '<span style="color:var(--texto);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+U.esc(i.rot)+'</span>'+
          '<span class="num" style="color:var(--texto-medio);white-space:nowrap">'+(op.pct?U.pct(i.pct):U.brl(i.valor))+(op.pct===undefined&&i.pct!==undefined?' <span style="color:var(--texto-fraco)">· '+U.pct(i.pct)+'</span>':'')+'</span>'+
        '</div>'+
        '<div class="barra-prog"><span style="width:'+w+'%;background:'+(i.cor||'var(--vinho)')+'"></span></div>'+
      '</div>';
    }).join('')+'</div>';
  },

  colunas: function(itens, op){
    op=op||{};
    var W=720,H=op.altura||190, mb=30, mt=12, ml=50;
    if(!itens.length) return '<div class="vazio"><div class="vazio-txt">Sem dados.</div></div>';
    var max = Math.max.apply(null, itens.map(function(i){ return i.valor; }).concat([1]));
    var min = Math.min.apply(null, itens.map(function(i){ return i.valor; }).concat([0]));
    if(max===min) max=min+1;
    var faixa = max-min;
    var lw = (W-ml-10)/itens.length;
    var bw = Math.min(42, lw*0.62);
    var py = function(v){ return mt + (H-mt-mb)*(1-(v-min)/faixa); };
    var s='<svg class="grafico" viewBox="0 0 '+W+' '+H+'">';
    for(var g=0;g<=3;g++){
      var v=min+faixa*g/3, y=py(v);
      s+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-10)+'" y2="'+y+'" stroke="#eee7e2"/>';
      s+='<text x="'+(ml-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.brlCurto(v)+'</text>';
    }
    itens.forEach(function(it,i){
      var x = ml + lw*i + (lw-bw)/2;
      var y0 = py(Math.max(0,min)), y1 = py(it.valor);
      var y = Math.min(y0,y1), h = Math.max(2, Math.abs(y1-y0));
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(it.cor||'var(--vinho)')+'"><title>'+U.esc(it.rot)+': '+U.brl(it.valor)+'</title></rect>';
      s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.esc(it.rot)+'</text>';
    });
    s+='</svg>';
    return s;
  },

  rosca: function(itens, op){
    op=op||{};
    var tot = itens.reduce(function(s,i){ return s+Math.abs(i.valor); },0);
    if(!tot) return '<div class="vazio"><div class="vazio-txt">Sem custos lançados.</div></div>';
    var R=62, r=40, cx=72, cy=72, ang=-Math.PI/2, s='<svg viewBox="0 0 144 144" style="width:144px;height:144px;flex:0 0 144px">';
    itens.forEach(function(it){
      var frac = Math.abs(it.valor)/tot; if(frac<=0) return;
      var a2 = ang + frac*Math.PI*2, grande = frac>0.5?1:0;
      var x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
      var x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang);
      if(frac>=0.9999){
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="'+it.cor+'" stroke-width="'+(R-r)+'"/>';
      }else{
        s+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+grande+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
            ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+r+' '+r+' 0 '+grande+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+' Z" fill="'+it.cor+'"><title>'+U.esc(it.rot)+': '+U.brl(it.valor)+'</title></path>';
      }
      ang = a2;
    });
    s+='</svg>';
    var leg='<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">'+itens.filter(function(i){return i.valor>0;}).map(function(i){
      return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px">'+
        '<i style="width:9px;height:9px;border-radius:2px;background:'+i.cor+';flex:0 0 9px"></i>'+
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+U.esc(i.rot)+'</span>'+
        '<span class="num" style="color:var(--texto-medio)">'+U.pct(i.valor/tot*100,1)+'</span></div>';
    }).join('')+'</div>';
    return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+s+leg+'</div>';
  }
};

var UI = {
  tela: 'geral',
  aba: 'dashboard',
  ym: U.ymAtual(),

  toast: function(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg; t.classList.add('on');
    clearTimeout(UI._tt);
    UI._tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
  },

  modal: function(op){
    var mount = document.getElementById('modais');
    var fundo = document.createElement('div');
    fundo.className = 'fundo';
    fundo.innerHTML =
      '<div class="modal '+(op.larga?'larga':'')+(op.classe?' '+op.classe:'')+'" role="dialog" aria-modal="true">'+
        (op.titulo!==false ? '<div class="modal-topo"><div class="modal-tit">'+U.esc(op.titulo)+'</div>'+
          '<button class="btn-icone" data-fechar style="margin-left:auto" aria-label="Fechar">'+
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' : '')+
        '<div class="modal-corpo">'+op.corpo+'</div>'+
        (op.rodape ? '<div class="modal-rodape">'+op.rodape+'</div>' : '')+
      '</div>';
    mount.appendChild(fundo);
    var fechar = function(){ fundo.remove(); if(op.aoFechar) op.aoFechar(); };
    fundo.addEventListener('click', function(e){
      if(e.target===fundo && op.travado!==true) fechar();
      if(e.target.closest('[data-fechar]')) fechar();
    });
    var esc = function(e){ if(e.key==='Escape' && op.travado!==true){ fechar(); document.removeEventListener('keydown',esc); } };
    document.addEventListener('keydown', esc);
    if(op.aoAbrir) op.aoAbrir(fundo, fechar);
    var foco = fundo.querySelector('input,select,textarea,button:not([data-fechar])');
    if(foco) setTimeout(function(){ foco.focus(); }, 60);
    return {el:fundo, fechar:fechar};

  confirmar: function(titulo, texto, aoConfirmar, rotulo){

      titulo: titulo,

      rodape: '<button class="btn sec" data-fechar>Cancelar</button><button class="btn perigo" id="okConf">'+(rotulo||'Excluir')+'</button>',
      aoAbrir: function(el, fechar){
        el.querySelector('#okConf').addEventListener('click', function(){ fechar(); aoConfirmar(); });
      }
    });
  },

  ajuda: function(txt){ return '<span class="ajuda" data-ajuda="'+U.esc(txt)+'" tabindex="0">?</span>'; },

  kpi: function(op){
    return '<div class="kpi'+(op.destaque?' destaque':'')+'">'+
      '<div class="kpi-rot">'+U.esc(op.rot)+(op.ajuda?UI.ajuda(op.ajuda):'')+'</div>'+
      '<div class="kpi-val'+(op.pequeno?' sm':'')+''+(op.classe?' '+op.classe:'')+'">'+op.val+'</div>'+
      (op.nota?'<div class="kpi-nota">'+(op.pt?'<span class="pt '+op.pt+'"></span>':'')+op.nota+'</div>':'')+
    '</div>';
  },

  vazio: function(tit, txt, botao){
    return '<div class="vazio"><div class="vazio-tit">'+U.esc(tit)+'</div><div class="vazio-txt">'+U.esc(txt)+'</div>'+(botao||'')+'</div>';
  },

  nivelMargem: function(m){
    var alvo = U.n(Calc.cfg().metaMargem,30);
    if(m>=alvo) return 'ok'; if(m>=alvo*0.7) return 'at'; return 'cr';
  }
};

  {id:'projecao', nome:'Projeção diária'},
  {id:'simulador', nome:'Simulador de ofertas'},
  {id:'produto', nome:'CMV & Produto'},
  {id:'frete', nome:'Frete & Logística'},
  {id:'canal', nome:'Vendas por canal'},
  {id:'campanhas', nome:'Campanhas'},
  {id:'caixa', nome:'Caixa & Reserva'},

  {id:'metas', nome:'Metas & Histórico'}
];
