        'PRETO|Baby look|P':26,'PRETO|Baby look|M':26,'PRETO|Baby look|G':17,'PRETO|Baby look|GG':11
      },
      estoque: {
        lisas: {}, malhaKg: {}, dtf: [],
        insumos: {capelinha:0, sacolinha:0, saqT:0, saqP:0, etiquetas:0, cheirinho:0}
      },
      pedidos: [],
      compras: [],
      contagens: []
    };
  },

  d: function(){
    if(!Store.dados.logistica || typeof Store.dados.logistica!=='object') Store.dados.logistica = Log.padrao();
    var x = Store.dados.logistica, b = Log.padrao();
    if(!x._ok){
      x.config = Object.assign({}, b.config, x.config||{});
      if(!Array.isArray(x.cores) || !x.cores.length) x.cores = b.cores;
      if(!Array.isArray(x.tamanhos) || !x.tamanhos.length) x.tamanhos = b.tamanhos;
      if(!Array.isArray(x.mods) || !x.mods.length) x.mods = b.mods;
      if(!x.grade || typeof x.grade!=='object') x.grade = b.grade;
      x.estoque = Object.assign({}, b.estoque, x.estoque||{});
      x.estoque.insumos = Object.assign({}, b.estoque.insumos, x.estoque.insumos||{});
      if(!x.estoque.lisas || typeof x.estoque.lisas!=='object') x.estoque.lisas = {};
      if(!x.estoque.malhaKg || typeof x.estoque.malhaKg!=='object') x.estoque.malhaKg = {};
      if(!Array.isArray(x.estoque.dtf)) x.estoque.dtf = [];
      ['pedidos','compras','contagens'].forEach(function(k){ if(!Array.isArray(x[k])) x[k] = []; });
      Object.defineProperty(x, '_ok', {value:true, enumerable:false, configurable:true});
    }
    return x;
  },
  cfg: function(){ return Log.d().config; },
  salvar: function(msg){ Store.commit(msg); },

  /* ---------- datas e dias úteis ---------- */
  feriados: function(){
    var s = {};
    (Log.cfg().feriados||'').split('\n').forEach(function(l){ var m=l.trim().match(/^(\d{4}-\d{2}-\d{2})/); if(m) s[m[1]]=1; });
    return s;
  },
  dt: function(iso){ var p=String(iso).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); },
  util: function(d, H){ var w=d.getDay(); return w!==0 && w!==6 && !H[U.iso(d)]; },
  somaUteis: function(iso, k){
    var H = Log.feriados(), d = Log.dt(iso);
    while(!Log.util(d,H)) d.setDate(d.getDate()+1);
    var c=0; while(c<k){ d.setDate(d.getDate()+1); if(Log.util(d,H)) c++; }
    return U.iso(d);
  },
  uteisEntre: function(a, b){
    if(!a || !b || b<=a) return 0;
    var H = Log.feriados(), d = Log.dt(a), fim = Log.dt(b), c=0;
    while(d<fim){ d.setDate(d.getDate()+1); if(Log.util(d,H)) c++; }
    return c;
  },
  somaDias: function(iso, k){ var d=Log.dt(iso); d.setDate(d.getDate()+k); return U.iso(d); },

  /* ---------- variações ---------- */
  chave: function(cor,mod,tam){ return cor+'|'+mod+'|'+tam; },
  variacoes: function(){
    var x = Log.d(), out = [];
    x.cores.forEach(function(c){ x.mods.forEach(function(m){ x.tamanhos.forEach(function(t){
      out.push({k:Log.chave(c.id,m,t), cor:c, mod:m, tam:t});
    }); }); });
    return out;
  },
  nomeCor: function(id){ var c = Log.d().cores.find(function(x){ return x.id===id; }); return c ? c.nome : id; },
  nomeVar: function(k){ var p=k.split('|'); return Log.nomeCor(p[0])+' '+(p[1]==='Baby look'?'baby look':'tradicional')+' '+p[2]; },

  /* ---------- leitura do nome do produto da Nuvemshop ---------- */
  lerProduto: function(nome, variantes){
    nome = String(nome||'');
    var up = nome.toUpperCase();
    if(!/CAMISETA|BLUSA|BABY|T-SHIRT/.test(up)) return null;
    var m = nome.match(/\(([^()]*)\)\s*$/);
    var partes = (m ? m[1].split(',') : []).concat(variantes||[]).map(function(s){ return String(s).trim(); }).filter(Boolean);
    var tam = partes.find(function(p){ return Log.TAMS.indexOf(p.toUpperCase())>=0; });
    if(!tam) return null;
    var low = partes.map(function(p){ return p.toLowerCase(); });
    var baby = /BABY|FEMININ/.test(up) || low.some(function(p){ return ['acólita','acolita','feminina','baby look'].indexOf(p)>=0; });
    var cv = low.join(' '), cor = '?';
    if(/bege|off/.test(cv)) cor='OFF'; else if(/pret/.test(cv)) cor='PRETO'; else if(/branc/.test(cv)) cor='BRANCA'; else if(/azul/.test(cv)) cor='AZUL';
    else if(/OFF-WHITE|OFF WHITE/.test(up)) cor='OFF'; else if(/PRETA|PRETO/.test(up)) cor='PRETO'; else if(/AZUL/.test(up)) cor='AZUL'; else if(/BRANCA/.test(up)) cor='BRANCA';
    var base = m ? nome.slice(0, m.index).trim() : nome;
    var estampa = base.indexOf(' - ')>=0 ? base.slice(base.indexOf(' - ')+3) : base;
    estampa = estampa.replace(/["“”]/g,'').replace(/\s+FT\..*$/i,'').trim().toUpperCase();
    return {cor:cor, mod: baby?'Baby look':'Tradicional', tam: tam.toUpperCase(), estampa:estampa};
  },

  /* ---------- pedidos ---------- */
  statusNome: {novo:'A separar', separado:'Separado', pronto:'Pronto para postar', enviado:'Enviado'},

  upsertPedido: function(p){
    var lista = Log.d().pedidos;
    var i = lista.findIndex(function(x){ return x.id===p.id; });
    if(i>=0){
      var a = lista[i];
      a.numero = p.numero || a.numero; a.cliente = p.cliente || a.cliente; a.uf = p.uf || a.uf;
      a.data = p.data || a.data;
      if(p.destino && (p.destino.endereco || p.destino.nome)) a.destino = p.destino;
      if(p.link) a.link = p.link;
      if(!a.baixa && p.itens && p.itens.length) a.itens = p.itens;
      if(p.enviadoLoja && a.status!=='enviado'){
        if(a.status==='novo') Log.consumir(a, true);
        a.status='enviado'; a.enviadoEm = p.enviadoEm || a.enviadoEm || U.hoje();
      }
      return 'atualizado';
    }
    var n = {
      id:p.id, numero:p.numero||p.id, data:p.data, cliente:p.cliente||'', uf:p.uf||'',
      itens:p.itens||[], status:'novo', criado:new Date().toISOString(), origem:p.origem||'manual',
      destino:p.destino||null, link:p.link||'', outros:p.outros||[]
    };
    if(p.enviadoLoja){ n.status='enviado'; n.enviadoEm=p.enviadoEm||p.data; n.historico=true; }
    else if(p.prontoLoja){ n.status='pronto'; n.historico=true; }
    lista.push(n);
    return 'novo';
  },

  prazo: function(p){ return Log.somaUteis(p.data, U.n(Log.cfg().prazoEnvio,2)); },

  camisetasDoPedido: function(p){ return (p.itens||[]).reduce(function(s,i){ return s+U.n(i.qty); },0); },

  /* verifica se há tudo para separar */
  checar: function(p){
    var e = Log.d().estoque, falta = [], dtfLocal = [];
    var precisa = {}, dtfPrec = {};
    (p.itens||[]).forEach(function(i){
      var k = Log.chave(i.cor,i.mod,i.tam); precisa[k]=(precisa[k]||0)+U.n(i.qty);
      var kd = i.estampa+'|'+i.cor; dtfPrec[kd]=(dtfPrec[kd]||0)+U.n(i.qty);
    });
    Object.keys(precisa).forEach(function(k){
      var tem = U.n(e.lisas[k]);
      if(tem < precisa[k]) falta.push({k:k, qtd:precisa[k]-tem});
    });
    Object.keys(dtfPrec).forEach(function(kd){
      var pr = kd.split('|');
      var tem = e.dtf.filter(function(x){ return x.estampa===pr[0] && x.cor===pr[1]; }).reduce(function(s,x){ return s+U.n(x.qty); },0);
      if(tem < dtfPrec[kd]) dtfLocal.push({estampa:pr[0], cor:pr[1], qtd:dtfPrec[kd]-tem});
    });
    return {falta:falta, dtfLocal:dtfLocal, precisa:precisa, dtfPrec:dtfPrec};
  },

  /* dá baixa no estoque (lisas, DTF que houver, insumos) */
  consumir: function(p, forcar){
    if(p.baixa) return true;
    var ch = Log.checar(p);
    if(ch.falta.length && !forcar){ p.falta = ch.falta; return false; }
    var e = Log.d().estoque, b = {lisas:{}, dtf:{}, insumos:{}};
    Object.keys(ch.precisa).forEach(function(k){
      var q = Math.min(ch.precisa[k], U.n(e.lisas[k]));
      e.lisas[k] = U.n(e.lisas[k]) - q; b.lisas[k] = q;
    });
    Object.keys(ch.dtfPrec).forEach(function(kd){
      var pr = kd.split('|'), resta = ch.dtfPrec[kd], usado = 0;
      e.dtf.forEach(function(x){ if(resta>0 && x.estampa===pr[0] && x.cor===pr[1]){ var t=Math.min(U.n(x.qty),resta); x.qty=U.n(x.qty)-t; resta-=t; usado+=t; } });
      if(usado) b.dtf[kd] = usado;
    });
    e.dtf = e.dtf.filter(function(x){ return U.n(x.qty)>0; });
    var cam = Log.camisetasDoPedido(p);
    var ins = {capelinha:1, sacolinha:1, saqP:1, saqT:cam, etiquetas:1, cheirinho:1};
    Object.keys(ins).forEach(function(k){
      var q = Math.min(ins[k], U.n(e.insumos[k])); e.insumos[k] = U.n(e.insumos[k]) - q; b.insumos[k] = q;
    });
    p.baixa = b; p.dtfLocal = ch.dtfLocal; p.falta = ch.falta.length ? ch.falta : null;
    return true;
  },

  devolver: function(p){
    if(!p.baixa) return;
    var e = Log.d().estoque, b = p.baixa;
    Object.keys(b.lisas||{}).forEach(function(k){ e.lisas[k] = U.n(e.lisas[k]) + b.lisas[k]; });
    Object.keys(b.dtf||{}).forEach(function(kd){ Log.addDtf(kd.split('|')[0], kd.split('|')[1], b.dtf[kd]); });
    Object.keys(b.insumos||{}).forEach(function(k){ e.insumos[k] = U.n(e.insumos[k]) + b.insumos[k]; });
    p.baixa = null; p.dtfLocal = null;
  },

  addDtf: function(estampa, cor, q){
    var e = Log.d().estoque;
    var x = e.dtf.find(function(y){ return y.estampa===estampa && y.cor===cor; });
    if(x) x.qty = U.n(x.qty) + q; else e.dtf.push({estampa:estampa, cor:cor, qty:q});
  },

  mudarStatus: function(id, novo){
    var p = Log.d().pedidos.find(function(x){ return x.id===id; });
    if(!p) return;
    if(novo==='novo'){ Log.devolver(p); p.status='novo'; p.enviadoEm=null; Log.salvar('Pedido voltou para a separação'); return; }
    if(p.status==='novo'){
      if(!Log.consumir(p, false)){
        Log.salvar();
        UI.toast('Falta camiseta lisa para este pedido. Ele entra na próxima reposição.');
        return;
      }
    }
    p.status = novo;
    if(novo==='enviado') p.enviadoEm = U.hoje();
    else p.enviadoEm = null;
    Log.salvar(novo==='enviado' ? 'Pedido marcado como enviado' : 'Pedido atualizado');
  },

  pedidosAbertos: function(){ return Log.d().pedidos.filter(function(p){ return p.status!=='enviado'; }); },

  /* guarda só o necessário: pedidos enviados há mais de 150 dias saem da lista */
  podar: function(){
    var lim = Log.somaDias(U.hoje(), -150);
    Log.d().pedidos = Log.d().pedidos.filter(function(p){ return p.status!=='enviado' || (p.enviadoEm||p.data) >= lim; });
  },

  /* ---------- CSV da Nuvemshop ---------- */
  csv: function(texto){
    var first = texto.slice(0, texto.indexOf('\n'));
    var sep = first.split(';').length > first.split(',').length ? ';' : ',';
    var rows = [], row = [], campo = '', q = false;
    for(var i=0;i<texto.length;i++){
      var ch = texto[i];
      if(q){ if(ch==='"'){ if(texto[i+1]==='"'){ campo+='"'; i++; } else q=false; } else campo+=ch; }
      else if(ch==='"') q=true;
      else if(ch===sep){ row.push(campo); campo=''; }
      else if(ch==='\n'){ row.push(campo); rows.push(row); row=[]; campo=''; }
      else if(ch!=='\r') campo+=ch;
    }
    if(campo.length || row.length){ row.push(campo); rows.push(row); }
    var head = rows[0].map(function(h){ return h.trim().toLowerCase(); });
    var col = function(n){ return head.indexOf(n.toLowerCase()); };
    var I = {num:col('Número do Pedido'), data:col('Data'), st:col('Status do Pedido'), pag:col('Status do Pagamento'),
      env:col('Status do Envio'), cli:col('Nome do comprador'), uf:col('Estado'), prod:col('Nome do Produto'),
      qtd:col('Quantidade Comprada'), ide:col('Identificador do pedido'), denv:col('Data de envío'),
      nEnt:col('Nome para a entrega'), tEnt:col('Telefone para a entrega'), tel:col('Telefone'), end:col('Endereço'), num2:col('Número'),
      comp:col('Complemento'), bai:col('Bairro'), cid:col('Cidade'), cep:col('Código postal'), forma:col('Forma de Entrega'),
      nota:col('Anotações do Comprador'), link:col('Link do pedido'), rast:col('Código de rastreio do envio')};
    if(I.num<0 || I.data<0 || I.prod<0) throw new Error('Esse arquivo não parece a exportação de vendas da Nuvemshop.');
    var ufs = {'são paulo':'SP','minas gerais':'MG','rio de janeiro':'RJ','bahia':'BA','paraná':'PR','rio grande do sul':'RS','pernambuco':'PE','ceará':'CE','pará':'PA','santa catarina':'SC','goiás':'GO','maranhão':'MA','paraíba':'PB','amazonas':'AM','espírito santo':'ES','mato grosso':'MT','rio grande do norte':'RN','piauí':'PI','alagoas':'AL','distrito federal':'DF','mato grosso do sul':'MS','sergipe':'SE','rondônia':'RO','tocantins':'TO','acre':'AC','amapá':'AP','roraima':'RR'};
    var out = [], cur = null;
    for(var r=1;r<rows.length;r++){
      var L = rows[r]; if(L.length < head.length/2) continue;
      var v = function(i){ return i>=0 ? String(L[i]||'').trim() : ''; };
      if(L[I.data]){
        var m = L[I.data].match(/(\d{2})\/(\d{2})\/(\d{4})/);
        var st = (L[I.st]||'').toLowerCase(), pg = (L[I.pag]||'').toLowerCase(), en = (L[I.env]||'').toLowerCase();
        var ok = m && !/cancel/.test(st) && !/cancel|estorn|recus|pendente/.test(pg);
        if(ok){
          var de = I.denv>=0 ? (L[I.denv]||'').match(/(\d{2})\/(\d{2})\/(\d{4})/) : null;
          var ufTxt = (L[I.uf]||'').trim();
          cur = {id: (I.ide>=0 && L[I.ide]) ? L[I.ide] : 'n'+L[I.num], numero:L[I.num], data:m[3]+'-'+m[2]+'-'+m[1],
            cliente:(L[I.cli]||'').split(' ')[0], uf: ufTxt.length===2 ? ufTxt.toUpperCase() : (ufs[ufTxt.toLowerCase()]||''),
            itens:[], origem:'csv',
            enviadoLoja: /enviado|entregue/.test(en), prontoLoja: /pronto/.test(en),
            enviadoEm: de ? de[3]+'-'+de[2]+'-'+de[1] : '',
            link: I.link>=0 ? (L[I.link]||'') : '',
            destino: {nome: v(I.nEnt)||v(I.cli), telefone: v(I.tEnt)||v(I.tel), endereco: v(I.end), numero: v(I.num2), complemento: v(I.comp),
              bairro: v(I.bai), cidade: v(I.cid), uf: ufTxt.length===2 ? ufTxt.toUpperCase() : (ufs[ufTxt.toLowerCase()]||ufTxt), cep: v(I.cep),
              envio: v(I.forma), rastreio: v(I.rast), nota: v(I.nota)}};
          out.push(cur);
        } else cur = null;
      }
      if(!cur) continue;
      var pr = Log.lerProduto(L[I.prod]);
      if(pr) cur.itens.push({estampa:pr.estampa, cor:pr.cor, mod:pr.mod, tam:pr.tam, qty:U.n(L[I.qtd])});
    }
    return out;
  },

  importar: function(lista){
    var novos=0, atu=0, velhos=0, lim = Log.somaDias(U.hoje(), -60);
    lista.forEach(function(p){
      if(!p.data || p.data < lim){ velhos++; return; }
      if(Log.upsertPedido(p)==='novo') novos++; else atu++;
    });
    Log.podar();
    Log.salvar(novos+' pedido(s) novo(s) e '+atu+' atualizado(s)'+(velhos?'. '+velhos+' com mais de 60 dias ficaram de fora':''));
  },

  sincronizar: function(dias){
    var c = Integra.cfg();
    var ate = U.hoje(), de = Log.somaDias(ate, -(dias||10));
    var u = Integra.url('expedicao', {de:de, ate:ate});
    if(!u){ UI.toast('Configure o conector em Integrações, ou importe o CSV da Nuvemshop.'); return; }
    UI.toast('Buscando pedidos…');
    fetch(u, {headers: c.chave ? {'x-arcanju-key': c.chave} : {}})
      .then(function(r){ if(!r.ok) throw new Error('O conector respondeu com erro '+r.status+'. Confira se o arquivo api/expedicao.js foi publicado.'); return r.json(); })
      .then(function(json){
        var lista = (Array.isArray(json)?json:[]).map(function(x){
          var itens = [];
          (x.itens||[]).forEach(function(i){
            var pr = Log.lerProduto(i.nome, i.variantes);
            if(pr) itens.push({estampa:pr.estampa, cor:pr.cor, mod:pr.mod, tam:pr.tam, qty:U.n(i.quantidade)});
          });
          return {id:String(x.id), numero:x.numero, data:x.data, cliente:x.cliente, uf:x.uf, itens:itens, origem:'api',
            enviadoLoja: !!x.enviado, enviadoEm: x.enviadoEm||'', destino: x.destino||null, link: x.link||''};
        });
        Log.importar(lista);
        App.render();
      })
      .catch(function(e){
        var msg = e.message||'falha';
        if(/Failed to fetch|NetworkError/i.test(msg)) msg = 'Não foi possível falar com o conector.';
        UI.toast(msg);
      });
  },

  /* ---------- consumo (conversa com o Financeiro) ---------- */
  ritmo: function(){
    var c = Log.cfg(), hoje = U.hoje(), ini = Log.somaDias(hoje, -30);
    var cam = 0, ped = 0;
    Store.dados.lancamentos.forEach(function(l){
      if(l.tipo!=='receita' || l.grupo!=='vendas') return;
      if(l.data < ini || l.data >= hoje) return;
      cam += Calc.camisetasDe(l); ped += U.n(l.pedidos);
    });
    var r = {fonte:'vendas', camDia: cam/30, pedDia: ped/30, cam30:cam, ped30:ped};
    var meta = Store.meta(U.ymAtual());
    var cpp = U.n(Calc.cfg().camisetasPorPedidoPadrao, 2) || 2;
    if(c.base==='meta' && U.n(meta.pedidos)>0){
      var dias = U.diasNoMes(U.ymAtual());
      r = {fonte:'meta', pedDia: U.n(meta.pedidos)/dias, camDia: U.n(meta.pedidos)*cpp/dias, cam30:cam, ped30:ped};
    }
    if(!r.camDia && !r.pedDia && U.n(meta.pedidos)>0){
      var dd = U.diasNoMes(U.ymAtual());
      r = {fonte:'meta', pedDia: U.n(meta.pedidos)/dd, camDia: U.n(meta.pedidos)*cpp/dd, cam30:cam, ped30:ped, semVendas:true};
    }
    return r;
  },

  /* participação de cada variação: pedidos dos últimos 60 dias, ou a grade padrão */
  participacao: function(){
    var x = Log.d(), lim = Log.somaDias(U.hoje(), -60), acc = {}, tot = 0;
    x.pedidos.forEach(function(p){
      if(p.data < lim) return;
      (p.itens||[]).forEach(function(i){ var k=Log.chave(i.cor,i.mod,i.tam); acc[k]=(acc[k]||0)+U.n(i.qty); tot+=U.n(i.qty); });
    });
    var usar = tot >= 40 ? acc : x.grade;
    var soma = 0; Log.variacoes().forEach(function(v){ soma += U.n(usar[v.k]); });
    var out = {};
    Log.variacoes().forEach(function(v){ out[v.k] = soma ? U.n(usar[v.k])/soma : 0; });
    out._fonte = tot >= 40 ? 'pedidos' : 'grade';
    return out;
  },

  /* estampas mais vendidas nos últimos 30 dias */
  estampas: function(){
    var lim = Log.somaDias(U.hoje(), -30), acc = {}, tot = 0;
    Log.d().pedidos.forEach(function(p){
      if(p.data < lim) return;
      (p.itens||[]).forEach(function(i){ var k=i.estampa+'|'+i.cor; acc[k]=(acc[k]||0)+U.n(i.qty); tot+=U.n(i.qty); });
    });
    return Object.keys(acc).map(function(k){ var pr=k.split('|'); return {estampa:pr[0], cor:pr[1], qtd:acc[k], part: tot?acc[k]/tot:0}; })
      .sort(function(a,b){ return b.qtd-a.qtd; });
  },

  /* ---------- custos ---------- */
  custos: function(){
    var c = Log.cfg(), pc = Log.participacao(), malha = 0;
    Log.d().cores.forEach(function(co){
      var share = 0; Log.variacoes().forEach(function(v){ if(v.cor.id===co.id) share += pc[v.k]; });
      malha += share * U.n(co.clara===false ? c.precoKgEscuro : c.precoKgClaro) * U.n(c.kgPorPeca);
    });
    var dtf = U.div(U.n(c.dtfMetro), U.n(c.dtfPorMetro,8));
    var lisa = malha + U.n(c.corte) + U.n(c.costura);
    var brindes = U.n(c.kit) + U.n(c.saqP) + U.n(c.saqT)*U.n(Calc.cfg().camisetasPorPedidoPadrao,2) +
      U.div(U.n(c.etiquetaPacote), U.n(c.etiquetasPacote)) + U.div(U.n(c.cheirinho), U.n(c.cheirinhoRende));
    return {malha:malha, lisa:lisa, dtf:dtf, camiseta:lisa+dtf, brindes:brindes};
  },
  custoLisa: function(corId){
    var c = Log.cfg(), co = Log.d().cores.find(function(x){ return x.id===corId; });
    return U.n(co && co.clara===false ? c.precoKgEscuro : c.precoKgClaro)*U.n(c.kgPorPeca) + U.n(c.corte) + U.n(c.costura);
  },
  valorEstoque: function(){
    var x = Log.d(), c = Log.cfg(), e = x.estoque, v = {lisas:0, malha:0, dtf:0, insumos:0};
    Object.keys(e.lisas).forEach(function(k){ v.lisas += U.n(e.lisas[k]) * Log.custoLisa(k.split('|')[0]); });
    Object.keys(e.malhaKg).forEach(function(cor){
      var co = x.cores.find(function(y){ return y.id===cor; });
      v.malha += U.n(e.malhaKg[cor]) * U.n(co && co.clara===false ? c.precoKgEscuro : c.precoKgClaro);
    });
    v.dtf = e.dtf.reduce(function(s,d){ return s+U.n(d.qty); },0) * U.div(U.n(c.dtfMetro), U.n(c.dtfPorMetro,8));
    var I = e.insumos;
    v.insumos = (U.n(I.capelinha)+U.n(I.sacolinha))*U.n(c.kit)/2 + U.n(I.saqT)*U.n(c.saqT) + U.n(I.saqP)*U.n(c.saqP) +
      U.n(I.etiquetas)*U.div(U.n(c.etiquetaPacote),U.n(c.etiquetasPacote)) + U.n(I.cheirinho)*U.div(U.n(c.cheirinho),U.n(c.cheirinhoRende));
    v.total = v.lisas + v.malha + v.dtf + v.insumos;
    return v;
  },

  /* ---------- a caminho (compras não recebidas) ---------- */
  aCaminho: function(){
    var o = {lisas:{}, malhaKg:{}, dtf:{}, insumos:{}};
    Log.d().compras.forEach(function(cp){
      if(cp.recebido) return;
      (cp.itens||[]).forEach(function(i){
        if(i.tipo==='lisa') o.lisas[i.k] = (o.lisas[i.k]||0) + U.n(i.qtd);
        else if(i.tipo==='malha') o.malhaKg[i.k] = (o.malhaKg[i.k]||0) + U.n(i.qtd);
        else if(i.tipo==='dtf') o.dtf[i.k] = (o.dtf[i.k]||0) + U.n(i.qtd);
        else if(i.tipo==='insumo') o.insumos[i.k] = (o.insumos[i.k]||0) + U.n(i.qtd);
      });
    });
    return o;
  },

  /* ---------- reposição sugerida ---------- */
  reposicao: function(opt){
    opt = opt||{};
    var x = Log.d(), c = x.config, e = opt.e || x.estoque, r = opt.r || Log.ritmo(), pc = opt.pc || Log.participacao(), cam = opt.cam || Log.aCaminho();
    var semana = r.camDia*7, alvoTotal = semana*U.n(c.semanasAlvo,3);
    /* pedidos que ficaram sem camiseta lisa entram como prioridade */
    var faltas = opt.faltas;
    if(!faltas){
      faltas = {};
      Log.pedidosAbertos().forEach(function(p){ if(p.status==='novo'){ Log.checar(p).falta.forEach(function(f){ faltas[f.k]=(faltas[f.k]||0)+f.qtd; }); } });
    }
    var linhas = Log.variacoes().map(function(v){
      var alvo = Math.ceil(alvoTotal*pc[v.k]);
      var tem = U.n(e.lisas[v.k]), vem = U.n(cam.lisas[v.k]);
      var dia = r.camDia*pc[v.k];
      var cobertura = dia>0 ? (tem)/dia : null;
      var prec = Math.max(0, alvo + U.n(faltas[v.k]) - tem - vem);
      return {k:v.k, cor:v.cor, mod:v.mod, tam:v.tam, alvo:alvo, tem:tem, vem:vem, falta:U.n(faltas[v.k]), dia:dia, cobertura:cobertura, sugerido:prec};
    });
    var totalSug = linhas.reduce(function(s,l){ return s+l.sugerido; },0);
    var cap = U.n(c.capacidadeSemana);
    if(cap>0 && totalSug>cap){
      /* prioriza faltas e menor cobertura */
      var ord = linhas.slice().sort(function(a,b){ return (b.falta-a.falta) || ((a.cobertura===null?1e9:a.cobertura)-(b.cobertura===null?1e9:b.cobertura)); });
      var resta = cap;
      ord.forEach(function(l){ l.producao = 0; });
      ord.forEach(function(l){ var q = Math.min(l.falta, l.sugerido, resta); l.producao += q; resta -= q; });
      var restoPed = ord.map(function(l){ return l.sugerido - l.producao; });
      var somaR = restoPed.reduce(function(s,v){ return s+v; },0);
      if(resta>0 && somaR>0){
        var w = {}; ord.forEach(function(l,i){ w[i]=restoPed[i]; });
        var dist = Log.distribuir(resta, w);
        ord.forEach(function(l,i){ l.producao += Math.min(restoPed[i], dist[i]||0); });
      }
    } else linhas.forEach(function(l){ l.producao = l.sugerido; });
    var producao = linhas.reduce(function(s,l){ return s+l.producao; },0);

    /* malha */
    var malha = x.cores.map(function(co){
      var pecas = linhas.filter(function(l){ return l.cor.id===co.id; }).reduce(function(s,l){ return s+l.producao; },0);
      var kg = pecas*U.n(c.kgPorPeca);
      var tem = U.n(e.malhaKg[co.id]) + U.n(cam.malhaKg[co.id]);
      var faltaKg = Math.max(0, kg - tem);
      var rolos = faltaKg>0 ? Math.ceil(faltaKg/U.n(c.kgRolo,20)) : 0;
      var preco = U.n(co.clara===false ? c.precoKgEscuro : c.precoKgClaro);
      return {cor:co, pecas:pecas, kg:kg, tem:tem, rolos:rolos, kgCompra:rolos*U.n(c.kgRolo,20), valor:rolos*U.n(c.kgRolo,20)*preco};
    });

    /* DTF das estampas líderes (SP) */
    var est = (opt.estampas || Log.estampas()).slice(0, U.n(c.estampasSP,8));
    var dtf = est.map(function(s){
      var alvo = Math.ceil(s.part*r.camDia*7*U.n(c.semanasDtf,2));
      var tem = e.dtf.filter(function(d){ return d.estampa===s.estampa && d.cor===s.cor; }).reduce(function(t,d){ return t+U.n(d.qty); },0);
      var vem = U.n(cam.dtf[s.estampa+'|'+s.cor]);
      return {estampa:s.estampa, cor:s.cor, part:s.part, alvo:alvo, tem:tem, vem:vem, pedir:Math.max(0, alvo-tem-vem)};
    });
    var dtfPedir = dtf.reduce(function(s,d){ return s+d.pedir; },0);
    var metros = dtfPedir ? Math.ceil(dtfPedir/U.n(c.dtfPorMetro,8)) : 0;
    var espaco = metros*U.n(c.dtfPorMetro,8) - dtfPedir;
    if(espaco>0 && dtf.length){ var wd={}; dtf.forEach(function(d,i){ wd[i]=d.part; }); var dd=Log.distribuir(espaco, wd); dtf.forEach(function(d,i){ d.pedir += dd[i]||0; }); }

    /* insumos: 1 semana para os de D+1, 2 semanas para o resto */
    var I = e.insumos, pd = r.pedDia, ci = r.camDia;
    var ins = [
      {k:'capelinha', nome:'Capelinha', alvo:Math.ceil(pd*7), preco:U.n(c.kit)/2, lote:1, prazo:c.prazoKits, tipoCompra:'kits'},
      {k:'sacolinha', nome:'Sacolinha', alvo:Math.ceil(pd*7), preco:U.n(c.kit)/2, lote:1, prazo:c.prazoKits, tipoCompra:'kits'},
      {k:'saqT', nome:'Saquinho transparente', alvo:Math.ceil(ci*14), preco:U.n(c.saqT), lote:1, prazo:c.prazoEmbalagem, tipoCompra:'embalagem'},
      {k:'saqP', nome:'Saquinho preto', alvo:Math.ceil(pd*14), preco:U.n(c.saqP), lote:1, prazo:c.prazoEmbalagem, tipoCompra:'embalagem'},
      {k:'etiquetas', nome:'Etiquetas de envio', alvo:Math.ceil(pd*21), preco:U.div(U.n(c.etiquetaPacote),U.n(c.etiquetasPacote)), lote:U.n(c.etiquetasPacote,1800), prazo:c.prazoEtiquetas, tipoCompra:'embalagem', precoLote:U.n(c.etiquetaPacote), nomeLote:'pacote'},
      {k:'cheirinho', nome:'Cheirinho', alvo:Math.ceil(pd*21), preco:U.div(U.n(c.cheirinho),U.n(c.cheirinhoRende)), lote:U.n(c.cheirinhoRende,500), prazo:c.prazoEmbalagem, tipoCompra:'embalagem', precoLote:U.n(c.cheirinho), nomeLote:'frasco', unidade:'pedidos'}
    ].map(function(i){
      i.tem = U.n(I[i.k]); i.vem = U.n(cam.insumos[i.k]);
      var falta = Math.max(0, i.alvo - i.tem - i.vem);
      i.lotes = falta>0 ? Math.ceil(falta/i.lote) : 0;
      i.pedir = i.lotes*i.lote;
      i.valor = i.precoLote ? i.lotes*i.precoLote : i.pedir*i.preco;
      return i;
    });

    var valorOficina = producao*(U.n(c.corte)+U.n(c.costura));
    return {ritmo:r, participacao:pc, linhas:linhas, producao:producao, totalSugerido:totalSug, cap:cap,
      malha:malha, dtf:dtf, metros:metros, dtfPedir:dtf.reduce(function(s,d){ return s+d.pedir; },0), insumos:ins,
      valorMalha: malha.reduce(function(s,m){ return s+m.valor; },0), valorOficina:valorOficina,
      valorDtf: metros*U.n(c.dtfMetro), valorInsumos: ins.reduce(function(s,i){ return s+i.valor; },0)};
  },

  distribuir: function(total, pesos){
    var ks = Object.keys(pesos), soma = ks.reduce(function(s,k){ return s+U.n(pesos[k]); },0), out = {};
    if(!total || !soma){ ks.forEach(function(k){ out[k]=0; }); return out; }
    var usado = 0, rest = [];
    ks.forEach(function(k){ var ex = total*U.n(pesos[k])/soma; out[k]=Math.floor(ex); usado+=out[k]; rest.push([k, ex-out[k]]); });
    rest.sort(function(a,b){ return b[1]-a[1]; });
    for(var i=0;i<total-usado;i++) out[rest[i%rest.length][0]]++;
    return out;
  },

  /* ---------- compras ---------- */
  TIPOS: {
    malha:{nome:'Malha', grupo:'cmv', categoria:'Produção terceirizada'},
    corte:{nome:'Cortador', grupo:'cmv', categoria:'Produção terceirizada'},
    costura:{nome:'Costureiras', grupo:'cmv', categoria:'Produção terceirizada'},
    dtf:{nome:'DTF', grupo:'cmv', categoria:'Estampa'},
    kits:{nome:'Capelinha e sacolinha', grupo:'embalagem', categoria:'Brinde'},
    embalagem:{nome:'Embalagens', grupo:'embalagem', categoria:'Embalagem de envio'},
    outro:{nome:'Outro', grupo:'outros', categoria:'Não classificado'}
  },

  novaCompra: function(o){
    var cp = Object.assign({id:U.id(), criado:U.hoje(), data:U.hoje(), tipo:'outro', descricao:'', valor:0,
      vencimento:U.hoje(), chegada:U.hoje(), itens:[], pago:false, recebido:false}, o);
    Log.d().compras.push(cp);
    return cp;
  },

  /* monta as compras de uma reposição a partir de um dia (sem salvar) */
  planoCompras: function(rep, base){
    var c = Log.cfg(), out = [];
    var dia = Log.somaUteis(base, 0);
    rep.malha.forEach(function(m){
      if(!m.rolos) return;
      out.push({tipo:'malha', descricao:'Malha '+m.cor.nome.toLowerCase()+': '+m.rolos+' rolo'+(m.rolos>1?'s':'')+' ('+m.kgCompra+' kg)',
        valor:m.valor, vencimento:dia, chegada:Log.somaUteis(dia, U.n(c.prazoMalha)),
        itens:[{tipo:'malha', k:m.cor.id, qtd:m.kgCompra}]});
    });
    if(rep.producao>0){
      var inicioCorte = Log.somaUteis(dia, U.n(c.prazoMalha));
      var fimCorte = Log.somaUteis(inicioCorte, U.n(c.prazoCorte));
      var fimCostura = Log.somaUteis(fimCorte, U.n(c.prazoCostura));
      var itens = rep.linhas.filter(function(l){ return l.producao>0; }).map(function(l){ return {tipo:'lisa', k:l.k, qtd:l.producao}; });
      out.push({tipo:'corte', descricao:'Corte de '+rep.producao+' peças', valor:rep.producao*U.n(c.corte),
        vencimento:fimCorte, chegada:fimCorte, itens:[], consomeMalha: rep.malha.map(function(m){ return {cor:m.cor.id, kg:m.kg}; })});
      out.push({tipo:'costura', descricao:'Costura de '+rep.producao+' camisetas lisas', valor:rep.producao*U.n(c.costura),
        vencimento:fimCostura, chegada:fimCostura, itens:itens});
    }
    var dtfItens = rep.dtf.filter(function(d){ return d.pedir>0; }).map(function(d){ return {tipo:'dtf', k:d.estampa+'|'+d.cor, qtd:d.pedir}; });
    if(rep.metros>0 && dtfItens.length){
      out.push({tipo:'dtf', descricao:'DTF de São Paulo: '+rep.metros+' metro'+(rep.metros>1?'s':''), valor:rep.valorDtf,
        vencimento:dia, chegada:Log.somaDias(dia, U.n(c.prazoDtf)), itens:dtfItens});
    }
    var porTipo = {};
    rep.insumos.forEach(function(i){
      if(!i.pedir) return;
      var t = i.tipoCompra; if(!porTipo[t]) porTipo[t] = {valor:0, itens:[], nomes:[], prazo:0};
      porTipo[t].valor += i.valor; porTipo[t].itens.push({tipo:'insumo', k:i.k, qtd:i.pedir});
      porTipo[t].nomes.push(i.nomeLote ? i.lotes+' '+i.nomeLote+(i.lotes>1?'s':'')+' de '+i.nome.toLowerCase() : i.pedir+' '+i.nome.toLowerCase()+(i.pedir>1&&!/s$/.test(i.nome)?'s':''));
      porTipo[t].prazo = Math.max(porTipo[t].prazo, U.n(i.prazo));
    });
    Object.keys(porTipo).forEach(function(t){
      var x = porTipo[t];
      out.push({tipo:t, descricao:(t==='kits'?'Brindes: ':'Embalagens: ')+x.nomes.join(', '), valor:x.valor,
        vencimento:dia, chegada:x.prazo ? Log.somaUteis(dia, x.prazo) : dia, itens:x.itens});
    });
    return out;
  },

  gerarCompras: function(rep){
    var lista = Log.planoCompras(rep, U.hoje());
    lista.forEach(function(o){ Log.novaCompra(o); });
    Log.salvar(lista.length ? lista.length+' compra(s) criada(s). Os pagamentos já estão na Agenda.' : 'Nada para comprar agora');
    return lista.length;
  },

  getCompra: function(id){ return Log.d().compras.find(function(x){ return x.id===id; }); },

  /* no Financeiro: vira lançamento só se o grupo estiver em modo manual */
  viraLancamento: function(cp){
    var t = Log.TIPOS[cp.tipo] || Log.TIPOS.outro;
    if(t.grupo==='outros') return true;
    return Calc.cfg().modo[t.grupo] !== 'auto';
  },

  pagar: function(id, data){
    var cp = Log.getCompra(id); if(!cp || cp.pago) return;
    cp.pago = true; cp.pagoEm = data || U.hoje();
    if(Log.viraLancamento(cp)){
      var t = Log.TIPOS[cp.tipo] || Log.TIPOS.outro;
      var lid = U.id();
      Store.dados.lancamentos.push({
        id:lid, data:cp.pagoEm, tipo:'despesa', grupo:t.grupo, categoria:t.categoria,
        descricao:cp.descricao, canal:'', referencia:'', valor:U.n(cp.valor), freteCobrado:0, valorBruto:0, desconto:0, uf:'',
        pedidos:0, camisetas:0, pagamento:'', status:'pago', obs:'Compra da Logística',
        origem:'logistica', externoId:cp.id, criadoEm:new Date().toISOString()
      });
      cp.lancId = lid;
    }
    Log.salvar('Pagamento registrado');
  },
  desfazerPagamento: function(id){
    var cp = Log.getCompra(id); if(!cp) return;
    cp.pago = false; cp.pagoEm = null;
    if(cp.lancId){ Store.dados.lancamentos = Store.dados.lancamentos.filter(function(l){ return l.id!==cp.lancId; }); cp.lancId = null; }
    Log.salvar('Pagamento desfeito');
  },

  receber: function(id){
    var cp = Log.getCompra(id); if(!cp || cp.recebido) return;
    var e = Log.d().estoque;
    (cp.itens||[]).forEach(function(i){
      if(i.tipo==='lisa') e.lisas[i.k] = U.n(e.lisas[i.k]) + U.n(i.qtd);
      else if(i.tipo==='malha') e.malhaKg[i.k] = U.n(e.malhaKg[i.k]) + U.n(i.qtd);
      else if(i.tipo==='dtf') Log.addDtf(i.k.split('|')[0], i.k.split('|')[1], U.n(i.qtd));
      else if(i.tipo==='insumo') e.insumos[i.k] = U.n(e.insumos[i.k]) + U.n(i.qtd);
    });
    if(cp.consomeMalha){
      cp.malhaUsada = [];
      cp.consomeMalha.forEach(function(m){ var q = Math.min(U.n(e.malhaKg[m.cor]), U.n(m.kg)); e.malhaKg[m.cor] = Math.round((U.n(e.malhaKg[m.cor]) - q)*10)/10; cp.malhaUsada.push({cor:m.cor, kg:q}); });
    }
    cp.recebido = true; cp.recebidoEm = U.hoje();
    Log.salvar('Recebido e somado ao estoque');
  },
  desfazerRecebimento: function(id){
    var cp = Log.getCompra(id); if(!cp || !cp.recebido) return;
    var e = Log.d().estoque;
    (cp.itens||[]).forEach(function(i){
      if(i.tipo==='lisa') e.lisas[i.k] = Math.max(0, U.n(e.lisas[i.k]) - U.n(i.qtd));
      else if(i.tipo==='malha') e.malhaKg[i.k] = Math.max(0, U.n(e.malhaKg[i.k]) - U.n(i.qtd));
      else if(i.tipo==='dtf') Log.addDtf(i.k.split('|')[0], i.k.split('|')[1], -U.n(i.qtd));
      else if(i.tipo==='insumo') e.insumos[i.k] = Math.max(0, U.n(e.insumos[i.k]) - U.n(i.qtd));
    });
    (cp.malhaUsada||[]).forEach(function(m){ e.malhaKg[m.cor] = U.n(e.malhaKg[m.cor]) + U.n(m.kg); });
    e.dtf = e.dtf.filter(function(x){ return U.n(x.qty)>0; });
    cp.recebido = false; cp.recebidoEm = null; cp.malhaUsada = null;
    Log.salvar('Recebimento desfeito');
  },
  excluirCompra: function(id){
    var cp = Log.getCompra(id); if(!cp) return;
    if(cp.recebido) Log.desfazerRecebimento(id);
    if(cp.lancId) Store.dados.lancamentos = Store.dados.lancamentos.filter(function(l){ return l.id!==cp.lancId; });
    Log.d().compras = Log.d().compras.filter(function(x){ return x.id!==id; });
    Log.salvar('Compra excluída');
  },

  /* ---------- agenda do Financeiro ---------- */
  ocorrencias: function(ym){
    var hoje = U.hoje(), out = [];
    Log.d().compras.forEach(function(cp){
      var data = cp.pago ? (cp.pagoEm||cp.vencimento) : cp.vencimento;
      if(U.ym(data)!==ym || !U.n(cp.valor)) return;
      var t = Log.TIPOS[cp.tipo] || Log.TIPOS.outro;
      out.push({
        chave:'g:'+cp.id, origem:'logistica', refId:cp.id, ym:ym,
        nome:'Logística: '+cp.descricao, valor:U.n(cp.valor), data:data, tipo:'despesa',
        grupo:t.grupo, categoria:t.categoria, recorrente:false,
        status: cp.pago ? 'pago' : (data<hoje ? 'atrasado' : 'aberto'), obs:''
      });
    });
    return out;
  },

  /* ---------- indicadores do mês ---------- */
  indicadores: function(ym){
    var ps = Log.d().pedidos.filter(function(p){ return U.ym(p.data)===ym && !p.historico; });
    var env = ps.filter(function(p){ return p.status==='enviado' && p.enviadoEm; });
    var noPrazo = env.filter(function(p){ return p.enviadoEm <= Log.prazo(p); });
    var tempos = env.map(function(p){ return Log.uteisEntre(p.data, p.enviadoEm); });
    var hoje = U.hoje();
    var atrasados = ps.filter(function(p){ return p.status!=='enviado' && Log.prazo(p) < hoje; });
    var comFalta = ps.filter(function(p){ return p.faltouEm || (p.status==='novo' && p.falta && p.falta.length); });
    var local = ps.filter(function(p){ return p.dtfLocal && p.dtfLocal.length; });
    var compras = Log.d().compras.filter(function(cp){ return U.ym(cp.vencimento)===ym || (cp.pagoEm && U.ym(cp.pagoEm)===ym); });
    return {
      pedidos: ps.length, enviados: env.length, noPrazo: noPrazo.length,
      pctPrazo: env.length ? noPrazo.length/env.length*100 : null,
      tempoMedio: tempos.length ? tempos.reduce(function(s,v){ return s+v; },0)/tempos.length : null,
      atrasados: atrasados.length, comFalta: comFalta.length, dtfLocal: local.length,
      comprasPagas: compras.filter(function(c){ return c.pago; }).reduce(function(s,c){ return s+U.n(c.valor); },0),
      comprasAbertas: compras.filter(function(c){ return !c.pago; }).reduce(function(s,c){ return s+U.n(c.valor); },0)
    };
  }
};

/* marca pedidos que ficaram sem estoque (para o indicador de ruptura) */
(function(){
  var orig = Log.consumir;
  Log.consumir = function(p, forcar){
    var ok = orig(p, forcar);
    if(!ok && !p.faltouEm) p.faltouEm = U.hoje();
    return ok;
  };
})();

/* ---------- Agenda do Financeiro recebe as compras da Logística ---------- */
(function(){
  var ocorr = Agenda.ocorrencias, quitar = Agenda.quitar, desfazer = Agenda.desfazer;
  Agenda.ocorrencias = function(ym){
    var out = ocorr(ym);
    try{ out = out.concat(Log.ocorrencias(ym)); }catch(e){ console.error(e); }
    return out.sort(function(a,b){ return a.data<b.data?-1:(a.data>b.data?1:0); });
  };
  Agenda.quitar = function(oc){
    if(oc && oc.origem==='logistica'){ Log.pagar(oc.refId); return; }
    return quitar(oc);
  };
  Agenda.desfazer = function(oc){
    if(oc && oc.origem==='logistica'){ Log.desfazerPagamento(oc.refId); return; }
    return desfazer(oc);
  };
})();

Views.logistica = function(){
  var a = UI.aba;
  var h = '<div id="logRoot">';
  if(a==='estoque') h += Views.logEstoque();
  else if(a==='reposicao') h += Views.logReposicao();
  else if(a==='compras') h += Views.logCompras();
  else if(a==='agenda') h += Views.logAgenda();
  else if(a==='meta') h += Views.logMeta();
  else if(a==='indicadores') h += Views.logIndicadores();
  else if(a==='ajustes') h += Views.logAjustes();
  else h += Views.logExpedicao();
  return h + '</div>';
};

    h += UI.vazio('Nenhum pedido em aberto', 'Quando os pedidos chegarem, eles aparecem aqui na ordem de compra, com o prazo de envio de cada um.');
  } else {
    h += '<div class="tabela-env"><table><thead><tr><th>Pedido</th><th>Camisetas</th><th class="c">Envio até</th><th class="c">Situação</th><th></th></tr></thead><tbody>'+
      abertos.map(function(p){
        var pz = Log.prazo(p), ch = p.status==='novo' ? Log.checar(p) : null;
        var cls = pz<hoje ? 'fal' : (pz===hoje ? 'pen' : 'pag');

        var dl = ch ? ch.dtfLocal : (p.dtfLocal||[]);

        '<div class="campo"><label>Valor (R$)</label><input type="number" id="gcValor" step="0.01" value="'+(cp.valor===''?'':U.n(cp.valor))+'"></div>'+
      '</div>'+

        '<div class="campo"><label>Chega em</label><input type="date" id="gcCheg" value="'+U.esc(cp.chegada)+'"></div>'+
      '</div>'+
      (id && (cp.itens||[]).length ? '<div style="font-size:12px;color:var(--texto-medio)">Esta compra soma ao estoque ao ser recebida: '+cp.itens.map(function(i){ return U.num(i.qtd,i.tipo==='malha'?1:0)+(i.tipo==='malha'?' kg ':' ')+U.esc(i.tipo==='lisa'?Log.nomeVar(i.k):(i.tipo==='dtf'?i.k.split('|')[0].toLowerCase():(i.tipo==='malha'?Log.nomeCor(i.k):i.k))); }).join(', ')+'.</div>' : ''),
    rodape:'<button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="gcSalvar">Salvar</button>',
    aoAbrir: function(el, fechar){
      el.querySelector('#gcSalvar').addEventListener('click', function(){
        var desc = el.querySelector('#gcDesc').value.trim();
        if(!desc){ UI.toast('Descreva a compra.'); return; }

          vencimento:el.querySelector('#gcVenc').value||U.hoje(), chegada:el.querySelector('#gcCheg').value||U.hoje()};
        if(id){
          var alvo = Log.getCompra(id); Object.assign(alvo, dados);
          if(alvo.lancId){ var l = Store.getLancamento(alvo.lancId); if(l){ l.valor = dados.valor; l.descricao = dados.descricao; } }
          Log.salvar('Compra atualizada');
        } else { Log.novaCompra(dados); Log.salvar('Compra criada. O pagamento já está na Agenda.'); }
        fechar(); App.render();
      });
    }
  });
};

/* ---------- eventos da Logística ---------- */
Log.eventos = function(){
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-lg]'); if(!t) return;
    var ac = t.getAttribute('data-lg'), id = t.getAttribute('data-id');
    if(ac==='sinc'){ Log.sincronizar(12); return; }
    if(ac==='csv'){ var inp = document.getElementById('lgCsv'); if(inp) inp.click(); return; }
    if(ac==='status'){ Log.mudarStatus(id, t.getAttribute('data-st')); App.render(); return; }
    if(ac==='delPedido'){
      UI.confirmar('Excluir pedido da Logística?', 'O que ele tirou do estoque volta. No Financeiro nada muda.', function(){
        var p = Log.d().pedidos.find(function(x){ return x.id===id; }); if(p) Log.devolver(p);
        Log.d().excluidos = (Log.d().excluidos||[]).concat([id]).slice(-300);
        Log.d().pedidos = Log.d().pedidos.filter(function(x){ return x.id!==id; });
        Log.salvar('Pedido excluído'); App.render();
      });
      return;
    }
    if(ac==='addDtf'){
      var est = (document.getElementById('lgDtfEst').value||'').trim().toUpperCase();
      var q = U.n(document.getElementById('lgDtfQtd').value);
      if(!est || !q){ UI.toast('Informe a estampa e a quantidade.'); return; }
      Log.addDtf(est, document.getElementById('lgDtfCor').value, q);
      Log.salvar('DTF adicionado'); App.render(); return;
    }
    if(ac==='delDtf'){ Log.d().estoque.dtf.splice(parseInt(t.getAttribute('data-i'),10),1); Log.salvar('DTF removido'); App.render(); return; }
    if(ac==='zerarContagem'){
      var e2 = Log.d().estoque;
      Log.d().contagens.push({data:U.hoje(), lisas:Object.keys(e2.lisas).reduce(function(s,k){ return s+U.n(e2.lisas[k]); },0), valor:Log.valorEstoque().total});
      Log.salvar('Contagem registrada'); App.render(); return;
    }
    if(ac==='gerar'){
      var rep = Log.reposicao();
      UI.confirmar('Criar as compras desta reposição?',
        'Serão criadas as compras de malha, corte, costura, DTF e insumos sugeridas, com as datas de pagamento e de chegada. Os pagamentos entram na Agenda do Financeiro.',
        function(){ Log.gerarCompras(rep); UI.aba='compras'; App.render(); }, 'Criar compras');
      return;
    }
    if(ac==='novaCompra'){ Form.logCompra(); return; }
    if(ac==='editCompra'){ Form.logCompra(id); return; }
    if(ac==='delCompra'){ UI.confirmar('Excluir compra?', 'Se ela já foi recebida, o estoque volta ao que era. O pagamento sai da Agenda.', function(){ Log.excluirCompra(id); App.render(); }); return; }
    if(ac==='pagar'){ Log.pagar(id); App.render(); return; }
    if(ac==='despagar'){ Log.desfazerPagamento(id); App.render(); return; }
    if(ac==='receber'){ Log.receber(id); App.render(); return; }
    if(ac==='desreceber'){ Log.desfazerRecebimento(id); App.render(); return; }
    if(ac==='custoFin'){
      var novo = Math.ceil(Log.custos().camiseta*2)/2, ym = U.ymAtual();
      UI.confirmar('Atualizar o custo da camiseta no Financeiro?',
        'O produto padrão passa a custar <b>'+U.brl(novo)+'</b> a partir de '+U.nomeMes(ym)+'. Os meses anteriores continuam com o custo da época.',
        function(){
          var cfg = Calc.cfg(), prem = Store.snapshotPremissas(cfg);
          var pr = prem.produtos.find(function(x){ return x.padrao; }) || prem.produtos[0];
          if(pr) pr.custo = novo;
          Store.salvarVigencia(ym, prem, 'Custo real vindo da Logística');
          App.render();
        }, 'Atualizar custo');
      return;
    }
  });
  document.addEventListener('change', function(e){
    var el = e.target;
    if(el.id==='lgCsv'){
      var f = el.files && el.files[0]; if(!f) return;
      f.arrayBuffer().then(function(buf){
        var txt; try{ txt = new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(er){ txt = new TextDecoder('windows-1252').decode(buf); }
        try{ Log.importar(Log.csv(txt)); App.render(); }
        catch(er){ UI.toast(er.message); }
      });
      return;
    }
    var cam = el.getAttribute && el.getAttribute('data-lgset');
    if(!cam) return;
    var val = el.type==='number' ? (el.value===''?0:U.n(el.value)) : el.value;
    var partes = cam.split('.'), alvo = Log.d();
    for(var i=0;i<partes.length-1;i++){ if(alvo[partes[i]]===undefined) alvo[partes[i]] = {}; alvo = alvo[partes[i]]; }
    alvo[partes[partes.length-1]] = val;
    Log.salvar();
    var ativo = document.activeElement;
    var sel = ativo && ativo.getAttribute ? ativo.getAttribute('data-lgset') : null;
    App.render();
    if(sel){ var n = document.querySelector('[data-lgset="'+sel.replace(/"/g,'\\"')+'"]'); if(n){ n.focus(); if(n.select) try{ n.select(); }catch(er){} } }
  });
};

/* ============ LOGÍSTICA: PROJEÇÃO, AGENDA E META ============ */
Log.camPorPedido = function(){
  var r = Log.ritmo();
  return r.ped30>0 ? r.cam30/r.ped30 : (U.n(Calc.cfg().camisetasPorPedidoPadrao,2)||2);
};
/* ritmo de venda num dia futuro: meta do mês (se escolhida e cadastrada) ou ritmo atual */
Log.ritmoEm = function(iso, atual, modo){
  var ym = iso.slice(0,7), meta = Store.meta(ym);
  if((modo||Log.cfg().projecao)==='meta' && U.n(meta.pedidos)>0){
    var dias = U.diasNoMes(ym), cpp = Log.camPorPedido();
    return {pedDia:U.n(meta.pedidos)/dias, camDia:U.n(meta.pedidos)*cpp/dias, fonte:'meta'};
  }
  return {pedDia:atual.pedDia, camDia:atual.camDia, fonte:atual.fonte};
};
Log.subUteis = function(iso, k){
  var H = Log.feriados(), d = Log.dt(iso), c = 0;
  while(c<k){ d.setDate(d.getDate()-1); if(Log.util(d,H)) c++; }
  return U.iso(d);
};
Log.INSUMOS = [
  {k:'capelinha', nome:'Capelinha', base:'ped', prazo:'prazoKits'},
  {k:'sacolinha', nome:'Sacolinha', base:'ped', prazo:'prazoKits'},
  {k:'saqT', nome:'Saquinho transparente', base:'cam', prazo:'prazoEmbalagem'},
  {k:'saqP', nome:'Saquinho preto', base:'ped', prazo:'prazoEmbalagem'},
  {k:'etiquetas', nome:'Etiquetas de envio', base:'ped', prazo:'prazoEtiquetas'},
  {k:'cheirinho', nome:'Cheirinho', base:'ped', prazo:'prazoEmbalagem'}
];

/* Simula dia a dia: chegadas, reposição semanal, consumo.
   op.semReposicao = só o estoque atual e o que já foi comprado. */
Log.projetar = function(dias, op){
  op = op||{};
  var x = Log.d(), c = x.config, hoje = U.hoje(), fim = Log.somaDias(hoje, dias);
  var e = JSON.parse(JSON.stringify(x.estoque));
  var atual = Log.ritmo(), pc = Log.participacao(), est = Log.estampas();
  var lideres = est.slice(0, U.n(c.estampasSP,8));
  var modo = op.modo || c.projecao;
  var pend = [], pagamentos = [], reposicoes = [], acabou = {}, depois = {}, primeira = null;
  x.compras.forEach(function(cp){
    if(!cp.recebido) pend.push({data: cp.chegada<hoje?hoje:cp.chegada, itens:cp.itens||[], consomeMalha:cp.consomeMalha});
    if(!cp.pago) pagamentos.push({data:cp.vencimento, descricao:cp.descricao, valor:U.n(cp.valor), tipo:cp.tipo, real:true, id:cp.id});
  });
  var criouHoje = x.compras.some(function(cp){ return cp.criado===hoje; });
  var addDtf = function(k, q){
    var p = k.split('|'), it = e.dtf.find(function(z){ return z.estampa===p[0] && z.cor===p[1]; });
    if(it) it.qty = U.n(it.qty)+q; else e.dtf.push({estampa:p[0], cor:p[1], qty:q});
  };
  var aplicar = function(p){
    (p.itens||[]).forEach(function(i){
      if(i.tipo==='lisa') e.lisas[i.k] = U.n(e.lisas[i.k]) + U.n(i.qtd);
      else if(i.tipo==='malha') e.malhaKg[i.k] = U.n(e.malhaKg[i.k]) + U.n(i.qtd);
      else if(i.tipo==='dtf') addDtf(i.k, U.n(i.qtd));
      else if(i.tipo==='insumo') e.insumos[i.k] = U.n(e.insumos[i.k]) + U.n(i.qtd);
    });
    (p.consomeMalha||[]).forEach(function(m){ e.malhaKg[m.cor] = Math.max(0, U.n(e.malhaKg[m.cor]) - U.n(m.kg)); });
  };
  var caminho = function(){
    var o = {lisas:{}, malhaKg:{}, dtf:{}, insumos:{}};
    pend.forEach(function(p){ (p.itens||[]).forEach(function(i){
      var alvo = i.tipo==='lisa'?o.lisas:(i.tipo==='malha'?o.malhaKg:(i.tipo==='dtf'?o.dtf:o.insumos));
      alvo[i.k] = (alvo[i.k]||0) + U.n(i.qtd);
    }); });
    return o;
  };
  var marcar = function(k, d){ if(!acabou[k]) acabou[k] = d; };
  for(var i=0;i<=dias;i++){
    var d = Log.somaDias(hoje, i);
    pend = pend.filter(function(p){ if(p.data>d) return true; aplicar(p); return false; });
    if(!op.semReposicao && Log.dt(d).getDay()===U.n(c.diaReposicao,1) && !(i===0 && criouHoje)){
      var r = Log.ritmoEm(d, atual, modo);
      var eS = {lisas:{}, malhaKg:e.malhaKg, insumos:{},
        dtf: e.dtf.filter(function(z){ return U.n(z.qty)>0; }).map(function(z){ return {estampa:z.estampa, cor:z.cor, qty:Math.floor(z.qty)}; })};
      var faltas = {};
      Object.keys(e.lisas).forEach(function(k){ var v = U.n(e.lisas[k]); if(v<0) faltas[k] = Math.ceil(-v); eS.lisas[k] = Math.max(0, Math.floor(v)); });
      Object.keys(e.insumos).forEach(function(k){ eS.insumos[k] = Math.max(0, Math.floor(U.n(e.insumos[k]))); });
      var rep = Log.reposicao({e:eS, r:r, pc:pc, cam:caminho(), faltas:faltas, estampas:est});
      var plano = Log.planoCompras(rep, d);
      var tot = 0;
      plano.forEach(function(o){
        tot += U.n(o.valor);
        pagamentos.push({data:o.vencimento, descricao:o.descricao, valor:U.n(o.valor), tipo:o.tipo, real:false, pedirEm:d});
        pend.push({data:o.chegada, itens:o.itens, consomeMalha:o.consomeMalha});
        if(o.tipo==='costura' && (!primeira || o.chegada<primeira)) primeira = o.chegada;
      });
      if(plano.length) reposicoes.push({data:d, valor:tot, pecas:rep.producao, sugerido:rep.totalSugerido, cap:rep.cap, metros:rep.metros});
    }
    var rd = Log.ritmoEm(d, atual, modo);
    Log.variacoes().forEach(function(v){
      e.lisas[v.k] = U.n(e.lisas[v.k]) - rd.camDia*pc[v.k];
      if(e.lisas[v.k] < 0 && rd.camDia*pc[v.k] > 0){ marcar('lisa|'+v.k, d); if(primeira && d>primeira && !depois[v.k]) depois[v.k] = d; }
    });
    lideres.forEach(function(s){
      var k = s.estampa+'|'+s.cor, q = rd.camDia*s.part;
      addDtf(k, -q);
      var tem = e.dtf.filter(function(z){ return z.estampa===s.estampa && z.cor===s.cor; }).reduce(function(t,z){ return t+U.n(z.qty); },0);
      if(tem < 0) marcar('dtf|'+k, d);
    });
    Log.INSUMOS.forEach(function(it){
      e.insumos[it.k] = U.n(e.insumos[it.k]) - (it.base==='cam' ? rd.camDia : rd.pedDia);
      if(e.insumos[it.k] < 0) marcar('ins|'+it.k, d);
    });
  }
  pagamentos = pagamentos.filter(function(p){ return p.data<=fim; }).sort(function(a,b){ return a.data<b.data?-1:(a.data>b.data?1:0); });
  return {inicio:hoje, fim:fim, pagamentos:pagamentos, reposicoes:reposicoes, acabou:acabou, depois:depois, primeira:primeira, lideres:lideres, atual:atual, modo:modo};
};

/* quando cada item acaba sem novas compras, e até quando pedir */
Log.quandoAcaba = function(){
  var c = Log.cfg(), hoje = U.hoje(), p = Log.projetar(180, {semReposicao:true}), seg = U.n(c.segurancaDias,2);
  var leadLisa = U.n(c.prazoMalha)+U.n(c.prazoCorte)+U.n(c.prazoCostura);
  var linha = function(nome, k, tipoPrazo, lead){
    var acaba = p.acabou[k] || null, pedir = null;
    if(acaba) pedir = tipoPrazo==='corridos' ? Log.somaDias(acaba, -(lead+seg)) : Log.subUteis(acaba, lead+seg);
    var n = !acaba ? 'ok' : (pedir<=hoje ? 'cr' : (pedir<=Log.somaDias(hoje,7) ? 'at' : 'ok'));
    return {nome:nome, k:k, acaba:acaba, pedir:pedir, n:n, lead:lead, tipoPrazo:tipoPrazo};
  };
  var out = [];
  var porCor = {};
  Log.variacoes().forEach(function(v){
    var l = linha(Log.nomeVar(v.k), 'lisa|'+v.k, 'uteis', leadLisa);
    l.grupo = 'Camisetas lisas'; l.cor = v.cor.id;
    out.push(l);
  });
  p.lideres.forEach(function(s){
    var l = linha('DTF '+s.estampa.toLowerCase()+' ('+Log.nomeCor(s.cor).toLowerCase()+')', 'dtf|'+s.estampa+'|'+s.cor, 'corridos', U.n(c.prazoDtf));
    l.grupo = 'DTF das estampas líderes'; out.push(l);
  });
  Log.INSUMOS.forEach(function(it){
    var l = linha(it.nome, 'ins|'+it.k, 'uteis', U.n(c[it.prazo]));
    l.grupo = 'Brindes e embalagens'; out.push(l);
  });
  return {linhas:out, proj:p};
};

/* a operação aguenta a meta? */
Log.avaliarMeta = function(pedidosMes, ym){
  var c = Log.cfg(), cpp = Log.camPorPedido(), dias = U.diasNoMes(ym||U.ymAtual());
  var ped = U.n(pedidosMes), cam = ped*cpp;
  var camSem = cam/dias*7, pedDia = ped/dias, pedSem = ped/dias*7;
  var cap = U.n(c.capacidadeSemana), pessoas = Math.max(1, U.n(c.pessoasOficina,2));
  var porPessoa = cap/pessoas;
  var folga = 1.15;
  var capNec = Math.ceil(camSem*folga/10)*10;
  var pessoasNec = porPessoa>0 ? Math.ceil(camSem*folga/porPessoa) : null;
  var capCorte = U.n(c.capacidadeCorte);
  var kgSem = camSem*U.n(c.kgPorPeca), rolosSem = kgSem/U.n(c.kgRolo,20);
  var est = Log.estampas(), lid = est.slice(0, U.n(c.estampasSP,8));
  var partLid = lid.reduce(function(s,x){ return s+x.part; },0) || 0.7;
  var metrosSem = camSem*partLid/U.n(c.dtfPorMetro,8);
  var localSem = camSem*(1-partLid);
  var custos = Log.custos();
  var minutos = pedDia*U.n(c.minutosPorPedido,6);
  var horasDia = minutos/60;
  var pessoasExp = Math.max(1, Math.ceil(horasDia/U.n(c.horasExpedicao,6)));
  var alvoPecas = camSem*U.n(c.semanasAlvo,3);
  var alvoValor = alvoPecas*custos.lisa + camSem*U.n(c.semanasDtf,2)*partLid*custos.dtf + pedSem*2*custos.brindes;
  var valorAtual = Log.valorEstoque().total;
  var comprasMes = cam*(custos.lisa) + cam*partLid*custos.dtf + cam*(1-partLid)*U.div(U.n(c.dtfLocalMetro),U.n(c.dtfPorMetro,8)) + ped*custos.brindes;
  var leadSem = (U.n(c.prazoMalha)+U.n(c.prazoCorte)+U.n(c.prazoCostura))/5;
  var ajustes = [];
  if(cap>0 && camSem*folga > cap){
    ajustes.push({n:'cr', t:'Aumentar a oficina para '+U.num(capNec)+' peças por semana',
      x:'Hoje ela faz '+U.num(cap)+'. Com '+U.num(porPessoa,0)+' peças por costureira, são '+pessoasNec+' costureira(s), '+Math.max(0,pessoasNec-pessoas)+' a mais que hoje.', acao:'oficina'});
  }
  if(capCorte>0 && camSem*folga > capCorte) ajustes.push({n:'cr', t:'O cortador não acompanha', x:'Ele corta '+U.num(capCorte)+' peças por semana e a meta pede '+U.num(camSem*folga,0)+'. Procure um segundo cortador ou peça mais dias.'});
  if(U.n(c.semanasAlvo) < leadSem+1) ajustes.push({n:'at', t:'Aumentar o estoque de lisas para '+Math.ceil(leadSem+1)+' semanas', x:'Uma reposição leva '+U.num(leadSem*7,0)+' dias entre malha, corte e costura. Com menos estoque que isso, um atraso da oficina vira pedido atrasado.'});
  if(alvoValor > valorAtual*1.05) ajustes.push({n:'at', t:'Investir '+U.brl(alvoValor-valorAtual,0)+' para chegar ao estoque alvo', x:'O estoque alvo dessa meta vale '+U.brl(alvoValor,0)+'. Hoje há '+U.brl(valorAtual,0)+'.'});
  if(pessoasExp>1) ajustes.push({n:'at', t:'Ter '+pessoasExp+' pessoas na expedição', x:'São '+U.num(pedDia,1)+' pedidos por dia, cerca de '+U.num(horasDia,1)+' horas de separar, prensar e embalar.'});
  if(rolosSem>=1) ajustes.push({n:'ok', t:'Comprar malha toda semana', x:U.num(rolosSem,1)+' rolo(s) por semana. Vale negociar preço por volume.'});
  var ok = !ajustes.some(function(a){ return a.n==='cr'; });
  return {ped:ped, cpp:cpp, cam:cam, camSem:camSem, pedDia:pedDia, pedSem:pedSem, cap:cap, pessoas:pessoas, porPessoa:porPessoa,
    capNec:capNec, pessoasNec:pessoasNec, kgSem:kgSem, rolosSem:rolosSem, metrosSem:metrosSem, localSem:localSem, partLid:partLid,
    horasDia:horasDia, pessoasExp:pessoasExp, alvoPecas:alvoPecas, alvoValor:alvoValor, valorAtual:valorAtual,
    comprasMes:comprasMes, leadSem:leadSem, ajustes:ajustes, ok:ok, uso: cap? camSem/cap*100 : null};
};

          var st = !l.acaba ? '<span class="etq rec">não acaba em 6 meses</span>' : (l.n==='cr' ? '<span class="etq fal">pedir hoje</span>' : (l.n==='at' ? '<span class="etq pen">pedir esta semana</span>' : '<span class="etq pag">no prazo</span>'));

  if(!pags.length) h += '<div style="font-size:13px;color:var(--texto-fraco);margin-top:10px">Nada a pagar no período.</div>';

        linhas += '<tr class="total"><td colspan="3">Semana de '+U.dataBr(ks).slice(0,5)+' a '+U.dataBr(fimS).slice(0,5)+'</td><td class="r" style="white-space:nowrap">'+U.brl(soma)+'</td><td></td></tr>';
      }
      var t = x.fin ? {nome:'Financeiro'} : (Log.TIPOS[x.tipo]||Log.TIPOS.outro);
      linhas += '<tr><td style="white-space:nowrap">'+U.dataBr(x.data)+' <span style="color:var(--texto-fraco);font-size:11.5px">'+U.diaSemana(x.data)+'</span></td>'+
        '<td>'+U.esc(x.descricao)+(x.pedirEm && x.pedirEm!==x.data?' <span style="color:var(--texto-fraco);font-size:11.5px">(pedido em '+U.dataBr(x.pedirEm).slice(0,5)+')</span>':'')+'</td>'+
        '<td style="color:var(--texto-medio)">'+U.esc(t.nome)+'</td>'+
        '<td class="r" style="font-weight:600;white-space:nowrap">'+U.brl(x.valor)+'</td>'+
        '<td class="c" style="white-space:nowrap">'+(x.fin ? '<span class="etq pag">conta</span>' : (x.real ? (x.data<hoje?'<span class="etq fal">vencida</span>':'<span class="etq pen">comprada</span>') : '<span class="etq pag">previsão</span>'))+
          (x.real && x.id ? ' <button class="btn sm sec" data-lg="pagar" data-id="'+x.id+'">Pagar</button>' : '')+'</td></tr>';
    });

  }
  h += '</div>';

};

      '08:05 | Ligar a prensa em 120 °C e ver o plano do dia',
      '08:10 | Recortar de uma vez todos os DTF do dia',
      '08:40 | Onda 1: separar, prensar, conferir e embalar',
      '11:00 | Onda 2: separar e prensar',
      '12:00 | Almoço (de 1 a 2 horas, marque no ponto)',
      '13:00 | Onda 2: conferir e embalar',
      '13:45 | Pagar todas as etiquetas, imprimir e colar',
      '14:15 | Levar à agência (hoje o limite é 15:00)',
      '15:15 | Dar baixa na Nuvemshop dos pedidos postados, com o link de rastreio (aba Envio)',
      '15:30 | Apoio: kits de brinde, camisetas que chegaram, recorte dos DTF de segunda',
      '16:30 | Limpeza da semana',
      '17:40 | Limpeza e arrumação'].join('\n'),
    rotinaSabado: ['08:00 | Imprimir as OS do dia, ligar a prensa e ver o plano',
      '08:10 | Separar, prensar, conferir e embalar os pedidos que vencem',
      '10:45 | Pagar e colar as etiquetas',
      '11:15 | Levar à agência (sábado o limite é 12:00)',
      '12:15 | Dar baixa na Nuvemshop dos pedidos postados (aba Envio)'].join('\n'),
    limpezaDia: 'Tirar os recortes e filmes de DTF das mesas\nLimpar a base e o teflon da prensa, com ela fria\nVarrer o chão\nEsvaziar o lixo\nDevolver as cestas vazias ao lugar\nDesligar a prensa da tomada',
    limpezaSemana: 'Limpar as prateleiras\nContar as camisetas lisas e anotar\nOrganizar as pastas de DTF por estampa\nRepor saquinhos, etiquetas e kits na mesa de embalagem',
    guia: ''
  },
  pins: {},
  ETAPAS: ['separar','prensar','conferir','embalar','etiqueta','expedir'],
  NOME: {separar:'A separar', prensar:'A prensar', conferir:'A conferir', embalar:'A embalar', etiqueta:'Etiqueta', expedir:'Levar à agência'},

  d: function(){
    if(!Store.dados.producao || typeof Store.dados.producao!=='object') Store.dados.producao = {};
    var p = Store.dados.producao;
    if(!Array.isArray(p.equipe)) p.equipe = [];
    if(!p.config || typeof p.config!=='object') p.config = {};
    return p;
  },
  cfg: function(){
    var c = Prod.d().config, o = {};
    Object.keys(Prod.PADRAO).forEach(function(k){ o[k] = (c[k]!==undefined && c[k]!=='') ? c[k] : Prod.PADRAO[k]; });
    o.limites = Object.assign({}, Prod.PADRAO.limites, c.limites||{});
    o.prensa = Object.assign({}, Prod.PADRAO.prensa, c.prensa||{});
    return o;
  },
  url: function(params){
    var u = Integra.url('producao', params);
    if(u) return u;
    if(/^https?:/.test(location.protocol)){
      var q = Object.keys(params||{}).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
      return '/api/producao'+(q?'?'+q:'');
    }
    return null;
  },
  portal: function(){
    var base = (Integra.cfg().proxyUrl||'').replace(/\/+$/,'').replace(/\/api$/,'');
    if(base) return base+'/producao';
    return /^https?:/.test(location.protocol) ? location.origin+'/producao' : '/producao';
  },
  chamar: function(acao, corpo, extra){
    var u = Prod.url(Object.assign({acao:acao}, extra||{}));
    if(!u) return Promise.reject(new Error('Configure o endereço do conector em Integrações.'));
    var h = {'x-arcanju-key': Integra.cfg().chave||''};
    var op = {method: corpo?'POST':'GET', headers:h};
    if(corpo){ h['content-type']='application/json'; op.body = JSON.stringify(corpo); }
    return fetch(u, op).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok) throw new Error(j.erro || ('O portal respondeu com erro '+r.status+'.'));
        return j;
      });
    }).catch(function(e){
      if(/Failed to fetch|NetworkError/i.test(e.message||'')) throw new Error('Não foi possível falar com o portal. Confira se api/producao.js foi publicado.');
      throw e;
    });
  },

  /* pedido da Logística → ordem de serviço */
  paraOS: function(p){
    return {
      id: p.id, pedidoId: p.id, numero: p.numero, data: p.data, cliente: p.cliente||'', uf: p.uf||'', prazo: Log.prazo(p),
      destino: p.destino||null, link: p.link||'', outros: p.outros||[],
      itens: (p.itens||[]).map(function(i){ return {estampa:i.estampa, cor:i.cor, corNome:Log.nomeCor(i.cor), mod:i.mod, tam:i.tam, qty:i.qty}; }),
      brindes: true
    };
  },
  ultimaEtapa: function(o){
    var e = o.etapas||{}, u = null;
    Prod.ETAPAS.forEach(function(x){ if(e[x]) u = x; });
    return u;
  },

  /* traz o andamento, atualiza a Logística e envia os pedidos abertos */
  sincronizar: function(silencioso){
    if(!silencioso) UI.toast('Sincronizando com a produção…');
    return Prod.chamar('painel').then(function(r){
      var remotas = (r.ordens && r.ordens.arcanju) || [];
      var x = Log.d(), mudou = 0;
      var ordem = {novo:0, separado:1, pronto:2, enviado:3};
      remotas.forEach(function(o){
        var p = x.pedidos.find(function(y){ return y.id===o.id; });
        if(!p) return;
        var u = Prod.ultimaEtapa(o);
        var alvo = u==='expedir' ? 'enviado' : ((u==='embalar'||u==='etiqueta') ? 'pronto' : (u ? 'separado' : null));
        if(!alvo || ordem[alvo] <= ordem[p.status]) return;
        if(p.status==='novo'){ Log.consumir(p, true); }
        p.status = alvo;
        if(alvo==='enviado') p.enviadoEm = U.iso(new Date(o.etapas.expedir.em));
        mudou++;
      });
      /* pedidos que o portal trouxe direto da loja entram na Logística */
      var novos = 0;
      remotas.forEach(function(o){
        if(x.pedidos.some(function(y){ return y.id===o.id; })) return;
        if((x.excluidos||[]).indexOf(o.id)>=0) return;
        var u = Prod.ultimaEtapa(o);
        Log.upsertPedido({id:o.id, numero:o.numero, data:o.data||U.hoje(), cliente:o.cliente, uf:o.uf, origem:'portal',
          itens:(o.itens||[]).map(function(i){ return {estampa:i.estampa, cor:i.cor, mod:i.mod, tam:i.tam, qty:i.qty}; }),
          destino:o.destino, link:o.link, outros:o.outros});
        var p = x.pedidos.find(function(y){ return y.id===o.id; });
        if(p && u){
          Log.consumir(p, true);
          p.status = u==='expedir' ? 'enviado' : ((u==='embalar'||u==='etiqueta') ? 'pronto' : 'separado');
          if(u==='expedir') p.enviadoEm = U.iso(new Date(o.etapas.expedir.em));
        }
        novos++;
      });
      var abertos = Log.pedidosAbertos();
      var excl = x.excluidos||[];
      var remover = remotas.filter(function(o){ return excl.indexOf(o.id)>=0 && !(o.etapas && o.etapas.separar); }).map(function(o){ return o.id; });
      var etapas = {};
      abertos.forEach(function(p){ if(p.status==='pronto') etapas[p.id]='embalar'; });
      /* enviados aqui mas ainda abertos no portal: fecham lá também */
      var enviados = x.pedidos.filter(function(p){ return p.status==='enviado' && !p.historico; });
      var abertosRemotos = {}; remotas.forEach(function(o){ if(!(o.etapas && o.etapas.expedir)) abertosRemotos[o.id]=1; });
      enviados.forEach(function(p){ if(abertosRemotos[p.id]){ etapas[p.id]='expedir'; abertos.push(p); } });
      var d = Prod.d();
      if(r.galeria && Object.keys(r.galeria).length) d.galeria = r.galeria;
      d.remoto = {ordens: remotas, avisos: r.avisos||[], feitos: r.feitos||{}, hoje: r.hoje, nuvemStatus: r.nuvemStatus||null};
      d.equipe = r.equipe || d.equipe;
      if(r.config && Object.keys(r.config).length && !d.configLocal) d.config = r.config;
      d.sincronizado = new Date().toISOString();
      Log.salvar((mudou||novos) ? (mudou+novos)+' pedido(s) atualizados pela produção' : undefined);
      return Prod.chamar('publicar', {modo:'arcanju', ordens: abertos.map(Prod.paraOS), remover: remover, etapas: etapas}).then(function(res){
        return Prod.chamar('painel').then(function(r2){
          Prod.d().remoto.ordens = (r2.ordens && r2.ordens.arcanju) || [];
          Store.salvar();
          if(!silencioso) UI.toast(res.enviadas+' ordem(ns) na produção'+(mudou?', '+mudou+' pedido(s) atualizados aqui':''));
          App.render();
        });
      });
    }).catch(function(e){ if(!silencioso) UI.toast(e.message); App.render(); });
  },

  trazerLoja: function(){
    UI.toast('Buscando pedidos na Nuvemshop…');
    return Prod.chamar('nuvemshop', null, {forcar:'1'}).then(function(r){
      if(r.desligado){ UI.toast('A busca automática está desligada em Guia e rotina.'); return; }
      if(r.lazarusAtivo){ UI.toast('O Projeto Lazarus está ativo, então os pedidos entram pelos lotes dele.'); return; }
      UI.toast((r.novas||0)+' pedido(s) novo(s) no portal');
      return Prod.sincronizar(true);
    }).catch(function(e){ UI.toast(e.message); });
  },

  salvarEquipe: function(){
    var d = Prod.d();
    var lista = d.equipe.map(function(f){ return {id:f.id, nome:f.nome, pin:Prod.pins[f.id]||'', dias:f.dias, inicio:f.inicio, fim:f.fim, capacidade:f.capacidade, jornada:f.jornada||8, almocoMin:f.almocoMin||60, almocoMax:f.almocoMax||120, ativo:f.ativo!==false}; });
    if(lista.some(function(f){ return !f.nome; })){ UI.toast('Toda pessoa precisa de um nome.'); return; }
    Prod.chamar('equipe', {equipe:lista}).then(function(r){
      d.equipe = r.equipe; Prod.pins = {}; Store.commit('Equipe enviada ao portal'); App.render();
    }).catch(function(e){ UI.toast(e.message); });
  },
  salvarConfig: function(){
    var d = Prod.d(); d.configLocal = true;
    var c = Prod.cfg();
    c.prazoEnvio = U.n(Log.cfg().prazoEnvio,2); c.feriados = Log.cfg().feriados;
    c.nuvemAtualizar = !(c.nuvemAtualizar===false || c.nuvemAtualizar==='nao');
    c.avisarCliente = !(c.avisarCliente===false || c.avisarCliente==='nao');
    Prod.chamar('config', {config:c}).then(function(){ Store.commit('Guia enviado ao portal'); App.render(); })
      .catch(function(e){ Store.salvar(); UI.toast(e.message); });
  },
  capacidadeSemana: function(){
    var s = 0; Prod.d().equipe.forEach(function(f){ if(f.ativo!==false) s += U.n(f.capacidade,20)*(f.dias||[]).length; });
    return s;
  }
};

Views.prodPainel = function(){
  var d = Prod.d(), rem = d.remoto, hoje = U.hoje();
  var capSem = Prod.capacidadeSemana();
  var r = Log.ritmo(), meta = Store.meta(U.ymAtual());
  var pedSem = U.n(meta.pedidos)>0 ? U.n(meta.pedidos)/U.diasNoMes(U.ymAtual())*7 : r.pedDia*7;
  var h = '';
  var falta = capSem>0 && pedSem > capSem;
  h += '<section class="veredito '+(!capSem?'atencao':(falta?'critico':''))+'" style="margin-bottom:16px">'+

Prod.pontos = {};
Prod.carregarPontos = function(mes){
  Prod.pontos[mes] = {carregando:true};
  Prod.chamar('pontos', null, {mes:mes}).then(function(r){ Prod.pontos[mes] = {lista:r.registros||[]}; App.render(); })
    .catch(function(e){ Prod.pontos[mes] = {erro:e.message}; App.render(); });
};
Prod.hm = function(iso){ if(!iso) return ''; return new Date(iso).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit'}); };
Prod.calcDia = function(r, f){
  var m = function(a,b){ return (new Date(b)-new Date(a))/60000; };
  var trab = null, almoco = null;
  if(r.entrada && r.saida){
    if(r.almoco && r.volta){ almoco = m(r.almoco, r.volta); trab = m(r.entrada, r.almoco) + m(r.volta, r.saida); }
    else trab = m(r.entrada, r.saida);
  }
  var jornada = U.n((f||{}).jornada, 8)*60;
  return {trab:trab, almoco:almoco, saldo: trab===null ? null : trab - jornada};
};
Prod.dur = function(min){ if(min===null||min===undefined) return '—'; var s = min<0?'−':''; min=Math.abs(Math.round(min)); return s+Math.floor(min/60)+'h'+String(min%60).padStart(2,'0'); };

  if(st.carregando) return h + '<div class="info">Carregando…</div>';
  if(st.erro) return h + '<div class="aviso">'+U.esc(st.erro)+'</div>';
  var equipe = Prod.d().equipe;
  if(!equipe.length) return h + UI.vazio('Sem equipe', 'Cadastre a equipe para ver o ponto.');
  equipe.forEach(function(f){
    var regs = st.lista.filter(function(r){ return r.id===f.id; }).sort(function(a,b){ return a.data<b.data?-1:1; });

      (regs.length ? regs.map(function(r){
        var c = Prod.calcDia(r, f);
        var fora = c.almoco!==null && (c.almoco < U.n(f.almocoMin,60)-1 || c.almoco > U.n(f.almocoMax,120)+1);
        var ajustado = (r.historico||[]).some(function(x){ return x.tipo==='ajuste'; });
        return '<tr><td style="white-space:nowrap">'+U.dataBr(r.data).slice(0,5)+' '+U.diaSemana(r.data)+(ajustado?' <span class="etq pag">ajustado</span>':'')+'</td>'+
          ['entrada','almoco','volta','saida'].map(function(k){ return '<td class="c">'+(Prod.hm(r[k])||'<span style="color:var(--texto-fraco)">—</span>')+'</td>'; }).join('')+
          '<td class="c">'+(c.almoco===null?'—':'<span'+(fora?' style="color:var(--rubro);font-weight:600"':'')+'>'+Prod.dur(c.almoco)+'</span>')+'</td>'+
          '<td class="c">'+Prod.dur(c.trab)+'</td><td class="c">'+(c.saldo===null?'<span class="etq pen">aberto</span>':Prod.dur(c.saldo))+'</td>'+
          '<td class="c"><button class="btn-icone" title="Ajustar" data-pd="pontoAjustar" data-f="'+U.esc(f.id)+'" data-dia="'+r.data+'">✎</button></td></tr>';
      }).join('') : '<tr><td colspan="9" style="color:var(--texto-fraco)">Nenhuma marcação neste mês.</td></tr>')+
      '</tbody></table></div></div>';
  });
  return h;
};

Prod.csvPontos = function(){
  var mes = UI.ym, st = Prod.pontos[mes]; if(!st || !st.lista) return;
  var eq = Prod.d().equipe;
  var linhas = [['Pessoa','Dia','Entrada','Saída almoço','Volta almoço','Saída','Almoço (min)','Trabalhado (min)','Saldo (min)','Ajustes']];
  st.lista.slice().sort(function(a,b){ return (a.nome+a.data)<(b.nome+b.data)?-1:1; }).forEach(function(r){
    var f = eq.find(function(x){ return x.id===r.id; }), c = Prod.calcDia(r, f);
    var aj = (r.historico||[]).filter(function(x){ return x.tipo==='ajuste'; }).map(function(x){ return x.motivo||'ajuste'; }).join(' | ');
    linhas.push([r.nome||(f&&f.nome)||'', r.data, Prod.hm(r.entrada), Prod.hm(r.almoco), Prod.hm(r.volta), Prod.hm(r.saida),
      c.almoco===null?'':Math.round(c.almoco), c.trab===null?'':Math.round(c.trab), c.saldo===null?'':Math.round(c.saldo), aj]);
  });
  var csv = '\ufeff'+linhas.map(function(l){ return l.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';'); }).join('\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'ponto-'+mes+'.csv'; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
};

(function(){

    var t = e.target.closest('[data-pd]'); if(!t) return;
    var ac = t.getAttribute('data-pd'), d = Prod.d();
    if(ac==='sinc'){ Prod.sincronizar(false); return; }
    if(ac==='loja'){ Prod.trazerLoja(); return; }
    if(ac==='pontoAtualizar'){ Prod.carregarPontos(UI.ym); App.render(); return; }
    if(ac==='pontoCsv'){ Prod.csvPontos(); return; }
    if(ac==='pontoAjustar'){ Prod.ajustarPonto(t.getAttribute('data-f'), t.getAttribute('data-dia')); return; }
    if(ac==='pontoNovo'){ Prod.ajustarPonto(t.getAttribute('data-f'), null); return; }
    if(ac==='addPessoa'){ d.equipe.push({id:U.id(), nome:'', dias:[1,2,3,4,5], inicio:'08:00', fim:'18:00', capacidade:20, jornada:8, almocoMin:60, almocoMax:120, ativo:true}); App.render(); return; }
    if(ac==='delPessoa'){ d.equipe.splice(parseInt(t.getAttribute('data-i'),10),1); App.render(); return; }
    if(ac==='salvarEquipe'){ Prod.salvarEquipe(); return; }
    if(ac==='salvarGuia'){ Prod.salvarConfig(); return; }
    if(ac==='guiaPadrao'){ UI.confirmar('Voltar ao roteiro padrão?', 'O roteiro, a limpeza e o guia voltam ao texto padrão, que já inclui imprimir as OS no começo do dia e dar baixa na Nuvemshop no fim. Prensa, horários da agência e links continuam como estão.', function(){ var c = Prod.d().config; ['rotina','rotinaSexta','rotinaSabado','limpezaDia','limpezaSemana','guia'].forEach(function(k){ delete c[k]; }); Prod.salvarConfig(); }, 'Voltar ao padrão'); return; }
    if(ac==='selTodos'){ Log.pedidosAbertos().forEach(function(p){ Views._prodSel[p.id]=true; }); App.render(); return; }
    if(ac==='imprimir'){ Prod.imprimir(); return; }
    if(ac==='aviso' || ac==='avisoDel'){
      var id = t.getAttribute('data-id');
      Prod.chamar('aviso', ac==='avisoDel' ? {id:id, excluir:true} : {id:id, resolvido: t.getAttribute('data-res')==='1'})
        .then(function(){ return Prod.sincronizar(true); }).catch(function(er){ UI.toast(er.message); });
      return;
    }
  });
  document.addEventListener('change', function(e){
    var el = e.target, v;
    if((v = el.getAttribute && el.getAttribute('data-pdeq'))){
      var p = v.split('.'), f = Prod.d().equipe[+p[0]]; if(!f) return;
      if(p[1]==='_pin'){ Prod.pins[f.id] = el.value.replace(/\D/g,''); return; }
      f[p[1]] = el.type==='checkbox' ? el.checked : (el.type==='number' ? U.n(el.value) : el.value);
      Store.salvar();
      return;
    }
    if((v = el.getAttribute && el.getAttribute('data-pddia'))){
      var q = v.split('.'), g = Prod.d().equipe[+q[0]], dia = +q[1]; if(!g) return;
      g.dias = (g.dias||[]).filter(function(x){ return x!==dia; });
      if(el.checked) g.dias.push(dia);
      g.dias.sort(); Store.salvar(); return;
    }
    if((v = el.getAttribute && el.getAttribute('data-pdcfg'))){
      var c = Prod.d().config, partes = v.split('.');
      if(partes.length===2){ c[partes[0]] = Object.assign({}, Prod.cfg()[partes[0]], c[partes[0]]||{}); c[partes[0]][partes[1]] = el.type==='number' ? U.n(el.value) : el.value; }
      else c[v] = el.value;
      Prod.d().configLocal = true;
      Store.salvar(); return;
    }
    if((v = el.getAttribute && el.getAttribute('data-pdsel'))){ Views._prodSel[v] = el.checked; App.render(); return; }
  });
})();


/* ============================================================
   MARKETING — tráfego pago é o coração da empresa.
   Dados em Store.dados.marketing. Lê do Financeiro (vendas e gasto
   de marketing já lançados/sincronizados) e das campanhas da Meta.
============================================================ */
var Mk = {
  ETAPAS: {topo:'Topo', meio:'Meio', fundo:'Fundo'},
  STATUS: {teste:'Em teste', vencedor:'Vencedor', fadiga:'Em fadiga', pausado:'Pausado'},
  CHECK: ['Roteiros e ângulos definidos','Gravação','Edição','Subida dos anúncios','Teste (7 dias)','Escolha dos vencedores'],
  padrao: function(){
    return {
      config: { teto:29, ticket:249.90, degrau:20, diasCiclo:90, storiesDia:3 },
      estrutura: [
        {id:'e1', nome:'Post viral turbinado (Instagram)', etapa:'topo',  valor:23,  filtro:'Publicação', teste:false, ativa:true},
        {id:'e2', nome:'Engajamento ThruPlay — topo de funil', etapa:'topo',  valor:52,  filtro:'TOPO DE FUNIL', teste:false, ativa:true},
        {id:'e3', nome:'Adição ao carrinho — qualificação', etapa:'meio',  valor:40,  filtro:'QUALIFICA', teste:false, ativa:true},
        {id:'e4', nome:'Vendas normal + lookalike (principal)', etapa:'fundo', valor:187, filtro:'NORMAL E LOOKALIKE', teste:false, ativa:true},
        {id:'e5', nome:'Vendas — produto vencedor (TESTE)', etapa:'fundo', valor:187, filtro:'PRODUTO VENCEDOR', teste:true, ativa:true}
      ],
      criativos: [], decisoes: [], posts: [],
      ciclos: { topo:{ultima:'', check:{}}, meio:{ultima:'', check:{}}, fundo:{ultima:'', check:{}} }
    };
  },
  d: function(){
    var b = Mk.padrao(), d = Store.dados.marketing;
    if(!d || typeof d!=='object'){ Store.dados.marketing = b; return b; }
    d.config = Object.assign({}, b.config, d.config||{});
    ['estrutura','criativos','decisoes','posts'].forEach(function(k){ if(!Array.isArray(d[k])) d[k] = b[k]; });
    d.ciclos = Object.assign({}, b.ciclos, d.ciclos||{});
    return d;
  },
  num: function(v){ var x = parseFloat(String(v===undefined||v===null?'':v).replace(',','.')); return isNaN(x)?0:x; },
  salvar: function(msg){ Store.salvar(); if(msg) UI.toast(msg); },
  somaDias: function(iso, n){ var p=iso.split('-'); var d=new Date(+p[0], +p[1]-1, +p[2]+n); return U.iso(d); },
  diasEntre: function(a, b){ var pa=a.split('-'), pb=b.split('-'); return Math.round((new Date(+pb[0],+pb[1]-1,+pb[2]) - new Date(+pa[0],+pa[1]-1,+pa[2]))/86400000); },

  /* régua: teto em % do faturamento → ROAS mínimo e CPA máximo */
  regua: function(ticket){
    var c = Mk.d().config, t = Mk.num(c.teto);
    var tk = ticket || Mk.num(c.ticket);
    return { teto:t, roasMin: t>0 ? 100/t : 0, cpaMax: tk*t/100, ticket:tk };
  },
  nivel: function(pct, teto){ if(!pct) return 'nu'; if(pct<=teto*0.85) return 'ok'; if(pct<=teto) return 'at'; return 'cr'; },

  /* estrutura */
  base: function(){ return Mk.d().estrutura.filter(function(e){ return e.ativa && !e.teste; }); },
  testes: function(){ return Mk.d().estrutura.filter(function(e){ return e.ativa && e.teste; }); },
  total: function(lista){ return lista.reduce(function(s,e){ return s+Mk.num(e.valor); },0); },

  /* desempenho real por item da estrutura (casando pelo filtro no nome da campanha da Meta) */
  real: function(ym){
    var camps = (Store.dados.campanhas||[]).filter(function(c){ return c.ym===ym; });
    return Mk.d().estrutura.map(function(e){
      var f = String(e.filtro||'').toLowerCase().trim();
      var r = {id:e.id, gasto:0, compras:0, receita:0, cliques:0, impressoes:0};
      if(f) camps.forEach(function(c){
        if(String(c.campanha||'').toLowerCase().indexOf(f)>=0){
          r.gasto+=U.n(c.gasto); r.compras+=U.n(c.compras); r.receita+=U.n(c.receita); r.cliques+=U.n(c.cliques); r.impressoes+=U.n(c.impressoes);
        }
      });
      r.cpa = U.div(r.gasto, r.compras); r.roas = U.div(r.receita, r.gasto);
      r.ctr = U.div(r.cliques, r.impressoes)*100; r.cpm = U.div(r.gasto, r.impressoes)*1000;
      return r;
    });
  },
  metaDia: function(ym){
    var m = {};
    (Store.dados.campanhas||[]).forEach(function(c){
      if(c.ym!==ym) return;
      var x = m[c.data] || (m[c.data] = {cliques:0, impressoes:0, gasto:0});
      x.cliques+=U.n(c.cliques); x.impressoes+=U.n(c.impressoes); x.gasto+=U.n(c.gasto);
    });
    return m;
  },
  decidir: function(texto){ Mk.d().decisoes.unshift({id:U.id(), data:U.hoje(), texto:texto}); }
};
