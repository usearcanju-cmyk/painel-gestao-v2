/* ------------------------------------------------------------
   CALC — motor de cálculo
   Nenhuma tela guarda número. Tudo é derivado daqui.
------------------------------------------------------------ */
var Calc = {

  cfg: function(){ return Store.dados.config; },

  /* Premissas válidas num mês. Sem vigência cadastrada, usa a configuração atual. */
  cfgM: function(ym){
    if(!ym) return Store.dados.config;
    var p = Store.premissasDe(ym);
    return p ? Object.assign({}, Store.dados.config, p) : Store.dados.config;
  },

  custoCamiseta: function(ym){
    var ps = Calc.cfgM(ym).produtos || [];
    var p = ps.find(function(x){ return x.padrao; }) || ps[0];
    return p ? U.n(p.custo) : 0;
  },
  /* custo do kit de embalagem para um pedido com N camisetas */
  kitEmbalagem: function(qtd, ym){
    var faixas = (Calc.cfgM(ym).embalagemFaixas||[]).slice()
      .sort(function(a,b){ return U.n(a.ate)-U.n(b.ate); });
    if(!faixas.length) return 0;
    var q = Math.max(1, Math.round(U.n(qtd,1)||1));
    for(var i=0;i<faixas.length;i++){ if(q<=U.n(faixas[i].ate)) return U.n(faixas[i].custo); }
    return U.n(faixas[faixas.length-1].custo);
  },
  insumosPorPedido: function(ym){
    var c = Calc.cfgM(ym);
    /* com brindes por oferta, o catálogo não é somado em todo pedido */
    if(c.brindesPorOferta) return 0;
    return (c.insumos||[]).filter(function(i){ return i.ativo!==false && i.base==='pedido'; })
      .reduce(function(s,i){ return s+U.n(i.custo); },0);
  },

  /* custo dos brindes escolhidos para uma oferta */
  custoBrindes: function(ids, ym){
    var insumos = Calc.cfgM(ym).insumos || [];
    return (ids||[]).reduce(function(s,id){
      var i = insumos.find(function(x){ return x.id===id; });
      return s + (i ? U.n(i.custo) : 0);
    },0);
  },
  insumosPorCamiseta: function(ym){
    return (Calc.cfgM(ym).insumos||[]).filter(function(i){ return i.ativo!==false && i.base==='camiseta'; })
      .reduce(function(s,i){ return s+U.n(i.custo); },0);
  },
  pctTaxas: function(ym){ var c=Calc.cfgM(ym); return U.n(c.gateway)+U.n(c.checkout); },

  lancamentosDoMes: function(ym){
    return Store.dados.lancamentos.filter(function(l){ return U.ym(l.data)===ym; });
  },

  camisetasDe: function(l){
    if(U.n(l.camisetas)>0) return U.n(l.camisetas);
    return U.n(l.pedidos) * U.n(Calc.cfg().camisetasPorPedidoPadrao, 1);
  },
  /* Custo médio de brindes por pedido, quando os brindes são escolhidos por promoção.
     Pondera as promoções ativas pela distribuição real de pedidos. */
  brindeMedio: function(ym){
    var c = Calc.cfgM(ym);
    if(!c.brindesPorOferta) return 0;
    var ativas = Store.promocoes(true);
    if(!ativas.length) return 0;
    var dist = Calc.distribuicaoReal().dist;
    var soma = 0, peso = 0;
    ativas.forEach(function(o){
      var q = U.clamp(Math.round(U.n(o.camisetas,1)),1,5);
      var pt = dist[q];
      if(pt===undefined) pt = 1;           /* sem histórico, peso igual */
      soma += pt * Calc.custoBrindes(o.itens, ym);
      peso += pt;
    });
    return peso ? soma/peso : 0;
  },

  /* embalagem de um conjunto de pedidos, pela média de peças por pedido */
  embalagemDe: function(pedidos, camisetas, ym){
    if(!pedidos) return 0;
    var media = U.div(camisetas, pedidos);
    return pedidos * (Calc.kitEmbalagem(media, ym) + Calc.insumosPorPedido(ym) + Calc.brindeMedio(ym))
         + camisetas * Calc.insumosPorCamiseta(ym);
  },

  /* ---------- APURAÇÃO DO PERÍODO ---------- */
  apurar: function(ym){
    var c = Calc.cfgM(ym);
    var ls = Calc.lancamentosDoMes(ym);
    var a = {
      ym: ym, temDados: ls.length>0,
      faturamento:0, outrasReceitas:0, freteCobrado:0, pedidos:0, camisetas:0,
      manual:{}, auto:{}, custo:{}, conflitos:[],
      recebido:0, aReceber:0, pagoSaida:0, aPagar:0
    };
    Object.keys(GRUPOS).forEach(function(g){ a.manual[g]=0; });

    ls.forEach(function(l){
      var v = U.n(l.valor);
      a.manual[l.grupo] = (a.manual[l.grupo]||0) + v;
      if(l.tipo==='receita'){
        if(l.grupo==='vendas'){
          a.faturamento += v;
          a.freteCobrado += U.n(l.freteCobrado);
          a.pedidos += U.n(l.pedidos);
          a.camisetas += Calc.camisetasDe(l);
        } else a.outrasReceitas += v;
        if(l.status==='pago') a.recebido += v; else a.aReceber += v;
      }else{
        if(l.status==='pago') a.pagoSaida += v; else a.aPagar += v;
      }
    });

    /* Valores que o sistema calcula sozinho a partir de poucos dados */
    a.baseTaxavel     = a.faturamento + a.freteCobrado;
    a.auto.taxas      = a.baseTaxavel * Calc.pctTaxas(ym)/100 + a.pedidos * U.n(c.gatewayFixo);
    a.auto.imposto    = a.baseTaxavel * U.n(c.imposto)/100;
    a.auto.cmv        = a.camisetas * Calc.custoCamiseta(ym);
    a.auto.embalagem  = Calc.embalagemDe(a.pedidos, a.camisetas, ym);
    a.auto.frete      = a.pedidos * U.n(c.freteMedio);
    a.auto.operacional= a.faturamento * U.n(c.operacionalPct)/100;

    ['cmv','embalagem','frete','taxas','imposto','operacional'].forEach(function(g){
      var modo = c.modo[g]==='auto' ? 'auto' : 'manual';
      a.custo[g] = modo==='auto' ? a.auto[g] : a.manual[g];
      if(modo==='auto' && a.manual[g] > 0.009){
        a.conflitos.push({grupo:g, valor:a.manual[g]});
      }
    });
    ['marketing','comissao','falha','outros'].forEach(function(g){ a.custo[g] = a.manual[g]; });

    /* Frete real informado no fechamento do mês vence qualquer estimativa. */
    a.fretePrevisto = a.custo.frete;
    var aj = Store.ajusteFreteDe(ym);
    a.freteAjustado = (aj !== null);
    if(a.freteAjustado) a.custo.frete = aj;

    a.despesaTotal = Object.keys(a.custo).reduce(function(s,g){ return s+a.custo[g]; },0);
    a.receitaTotal = a.faturamento + a.outrasReceitas + a.freteCobrado;
    a.lucro   = a.receitaTotal - a.despesaTotal;
    a.margem  = U.div(a.lucro, a.faturamento)*100;
    a.ticket  = U.div(a.faturamento, a.pedidos);
    a.lucroPorPedido = U.div(a.lucro, a.pedidos);
    a.lucroPorCamiseta = U.div(a.lucro, a.camisetas);
    a.cpa     = U.div(a.custo.marketing, a.pedidos);
    a.marketingPct = U.div(a.custo.marketing, a.faturamento)*100;
    a.roas    = U.div(a.faturamento, a.custo.marketing);
    a.falhaPct= U.div(a.custo.falha, a.faturamento)*100;
    a.falhaPorPedido = U.div(a.custo.falha, a.pedidos);
    a.cmvPct  = U.div(a.custo.cmv, a.faturamento)*100;
    a.fretePct= U.div(a.custo.frete, a.faturamento)*100;
    a.fretePorPedido = U.div(a.custo.frete, a.pedidos);
    a.camisetasPorPedido = U.div(a.camisetas, a.pedidos);

    /* margem de contribuição: tudo que varia com a venda */
    var variaveis = a.custo.cmv+a.custo.embalagem+a.custo.frete+a.custo.taxas+a.custo.imposto+a.custo.marketing+a.custo.comissao;
    a.contribuicao = a.faturamento + a.freteCobrado - variaveis;
    a.contribuicaoPct = U.div(a.contribuicao, a.faturamento)*100;

    /* custo fixo do mês = operacional quando lançado manualmente */
    a.operacionalEhFixo = c.modo.operacional !== 'auto';
    a.custoFixoMes = a.operacionalEhFixo ? a.custo.operacional : 0;
    return a;
  },

  /* ---------- PROJEÇÃO ---------- */
  projetar: function(a){
    var ym = a.ym, hoje = U.hoje(), ymAtual = U.ymAtual();
    var dias = U.diasNoMes(ym);
    var p = {dias:dias, encerrado:false, futuro:false};
    if(ym < ymAtual){ p.decorridos = dias; p.encerrado = true; }
    else if(ym > ymAtual){ p.decorridos = 0; p.futuro = true; }
    else p.decorridos = Math.min(parseInt(hoje.slice(8,10),10), dias);
    p.restantes = Math.max(0, dias - p.decorridos);

    p.ritmoFat = U.div(a.faturamento, p.decorridos);
    p.ritmoPedidos = U.div(a.pedidos, p.decorridos);
    p.projFat = p.encerrado ? a.faturamento : p.ritmoFat * dias;
    p.projPedidos = p.encerrado ? a.pedidos : p.ritmoPedidos * dias;

    /* lucro projetado = contribuição projetada − custo fixo do mês */
    var contribPct = U.div(a.contribuicao, a.faturamento);
    var opPct = a.operacionalEhFixo ? 0 : U.div(a.custo.operacional, a.faturamento);
    var outrosPct = U.div(a.custo.falha + a.custo.outros, a.faturamento);
    p.margemVarPct = (contribPct - opPct - outrosPct);
    p.projLucro = p.encerrado ? a.lucro : (p.projFat * p.margemVarPct - a.custoFixoMes + a.outrasReceitas);
    p.projMargem = U.div(p.projLucro, p.projFat)*100;

    var meta = Store.meta(ym);
    p.metaFat = U.n(meta.faturamento); p.metaLucro = U.n(meta.lucro);
    p.metaPedidos = U.n(meta.pedidos); p.metaMargem = U.n(meta.margem, Calc.cfg().metaMargem);
    p.metaCpa = U.n(meta.cpaMax);

    p.faltaFat = Math.max(0, p.metaFat - a.faturamento);
    p.faltaLucro = Math.max(0, p.metaLucro - a.lucro);
    p.precisaFatDia = p.restantes>0 ? p.faltaFat/p.restantes : p.faltaFat;
    p.precisaLucroDia = p.restantes>0 ? p.faltaLucro/p.restantes : p.faltaLucro;
    p.atingeFat = p.metaFat>0 ? p.projFat >= p.metaFat : null;
    p.atingeLucro = p.metaLucro>0 ? p.projLucro >= p.metaLucro : null;
    p.pctMetaFat = U.div(a.faturamento, p.metaFat)*100;
    p.pctMetaLucro = U.div(a.lucro, p.metaLucro)*100;
    p.pctProjMetaFat = U.div(p.projFat, p.metaFat)*100;
    p.pctProjMetaLucro = U.div(p.projLucro, p.metaLucro)*100;
    return p;
  },

  /* ---------- SÉRIE DIÁRIA ---------- */
  serieDiaria: function(ym){
    var dias = U.diasNoMes(ym), c = Calc.cfgM(ym);
    var ls = Calc.lancamentosDoMes(ym);
    var mapa = {};
    for(var d=1; d<=dias; d++){
      var iso = ym+'-'+String(d).padStart(2,'0');
      mapa[iso] = {data:iso, dia:d, fat:0, freteCob:0, pedidos:0, camisetas:0, mkt:0, outrasDesp:0, falha:0};
    }
    ls.forEach(function(l){
      var m = mapa[l.data]; if(!m) return;
      if(l.tipo==='receita'){
        if(l.grupo==='vendas'){ m.fat+=U.n(l.valor); m.freteCob+=U.n(l.freteCobrado); m.pedidos+=U.n(l.pedidos); m.camisetas+=Calc.camisetasDe(l); }
      }else{
        if(l.grupo==='marketing'||l.grupo==='comissao') m.mkt+=U.n(l.valor);
        else if(l.grupo==='falha') m.falha+=U.n(l.valor);
        else if(['cmv','embalagem','frete','taxas','imposto','operacional'].indexOf(l.grupo)>=0){
          if(c.modo[l.grupo]!=='auto') m.outrasDesp+=U.n(l.valor);
        } else m.outrasDesp+=U.n(l.valor);
      }
    });
    var lista = Object.keys(mapa).sort().map(function(k){ return mapa[k]; });
    var accF=0, accL=0;
    lista.forEach(function(d){
      var autoCustos = 0;
      var baseT = d.fat + d.freteCob;
      if(c.modo.taxas==='auto')      autoCustos += baseT*Calc.pctTaxas(ym)/100 + d.pedidos*U.n(c.gatewayFixo);
      if(c.modo.imposto==='auto')    autoCustos += baseT*U.n(c.imposto)/100;
      if(c.modo.cmv==='auto')        autoCustos += d.camisetas*Calc.custoCamiseta(ym);
      if(c.modo.embalagem==='auto')  autoCustos += Calc.embalagemDe(d.pedidos, d.camisetas, ym);
      if(c.modo.frete==='auto')      autoCustos += d.pedidos*U.n(c.freteMedio);
      if(c.modo.operacional==='auto')autoCustos += d.fat*U.n(c.operacionalPct)/100;
      d.custoAuto = autoCustos;
      d.lucro = d.fat + d.freteCob - autoCustos - d.mkt - d.falha - d.outrasDesp;
      accF += d.fat; accL += d.lucro;
      d.accFat = accF; d.accLucro = accL;
      d.ticket = U.div(d.fat, d.pedidos);
      d.cpa = U.div(d.mkt, d.pedidos);
    });
    return lista;
  },

  /* ---------- CAIXA ---------- */
  caixa: function(){
    var c = Calc.cfg(), hoje = U.hoje();
    var entradas=0, saidas=0, aReceber=0, aPagar=0, atrasadoReceber=0, atrasadoPagar=0;
    Store.dados.lancamentos.forEach(function(l){
      var v=U.n(l.valor);
      if(l.tipo==='receita'){
        if(l.status==='pago') entradas+=v;
        else { aReceber+=v; if(l.data<hoje) atrasadoReceber+=v; }
      }else{
        if(l.status==='pago') saidas+=v;
        else { aPagar+=v; if(l.data<hoje) atrasadoPagar+=v; }
      }
    });
    /* custos automáticos já ocorridos também saem do caixa */
    var autoSaidas = 0;
    Store.meses().forEach(function(ym){
      var a = Calc.apurar(ym);
      ['cmv','embalagem','frete','taxas','imposto','operacional'].forEach(function(g){
        if(Calc.cfgM(ym).modo[g]==='auto') autoSaidas += a.auto[g];
      });
    });
    var reservaAportes = Store.dados.reservaMovs.reduce(function(s,m){
      return s + (m.tipo==='aporte' ? U.n(m.valor) : -U.n(m.valor));
    },0);

    var atual = U.n(c.saldoInicial) + entradas - saidas - autoSaidas;
    var projetado = atual + aReceber - aPagar;
    var custoFixo = U.n(c.custoFixoMensal);
    var metaReserva = custoFixo * U.n(c.reservaMetaMeses,3);
    return {
      saldoInicial:U.n(c.saldoInicial), entradas:entradas, saidas:saidas+autoSaidas,
      custosAutomaticos:autoSaidas, atual:atual, aReceber:aReceber, aPagar:aPagar,
      atrasadoReceber:atrasadoReceber, atrasadoPagar:atrasadoPagar, projetado:projetado,
      reserva:reservaAportes, metaReserva:metaReserva,
      pctReserva: U.div(reservaAportes, metaReserva)*100,
      mesesProtegidos: U.div(reservaAportes, custoFixo),
      custoFixoMensal:custoFixo,
      disponivel: atual - reservaAportes
    };
  },

  /* ---------- HISTÓRICO ---------- */
  historico: function(){
    return Store.meses().map(function(ym){
      var a = Calc.apurar(ym); var p = Calc.projetar(a);
      return {ym:ym, a:a, p:p};
    });
  },

  /* ---------- VENDAS POR CANAL ---------- */
  porCanal: function(ym){
    var ls = Calc.lancamentosDoMes(ym).filter(function(l){ return l.grupo==='vendas'; });
    var mapa = {};
    ls.forEach(function(l){
      var k = l.canal || 'Sem canal';
      if(!mapa[k]) mapa[k]={canal:k, fat:0, pedidos:0, camisetas:0};
      mapa[k].fat += U.n(l.valor);
      mapa[k].pedidos += U.n(l.pedidos);
      mapa[k].camisetas += Calc.camisetasDe(l);
    });
    var tot = Object.keys(mapa).reduce(function(s,k){ return s+mapa[k].fat; },0);
    return Object.keys(mapa).map(function(k){
      var o = mapa[k];
      o.ticket = U.div(o.fat, o.pedidos);
      o.part = U.div(o.fat, tot)*100;
      return o;
    }).sort(function(x,y){ return y.fat-x.fat; });
  },

  /* ---------- VENDAS POR ESTADO ---------- */
  porEstado: function(ym){
    var ls = Calc.lancamentosDoMes(ym).filter(function(l){ return l.grupo==='vendas'; });
    var mapa = {}, tot = 0, semUf = 0;
    ls.forEach(function(l){
      var v = U.n(l.valor); tot += v;
      var k = (l.uf||'').toUpperCase();
      if(!k){ semUf += v; return; }
      if(!mapa[k]) mapa[k] = {uf:k, fat:0, pedidos:0, camisetas:0};
      mapa[k].fat += v; mapa[k].pedidos += U.n(l.pedidos); mapa[k].camisetas += Calc.camisetasDe(l);
    });
    var lista = Object.keys(mapa).map(function(k){
      var o = mapa[k];
      o.ticket = U.div(o.fat, o.pedidos);
      o.part = U.div(o.fat, tot)*100;
      return o;
    }).sort(function(x,y){ return y.fat-x.fat; });
    lista.semUf = semUf; lista.total = tot;
    return lista;
  },

  /* ---------- CHECKLIST DE ESCALA ---------- */
  podeEscalar: function(a, p, cx){
    var c = Calc.cfg(), f = Store.fecho(a.ym);
    var itens = [
      {rot:'Margem na meta', ok: a.faturamento>0 && a.margem >= U.n(c.metaMargem,30),
       nota:'margem de '+U.pct(a.margem)+' contra '+U.pct(c.metaMargem,0)},
      {rot:'CPA dentro do teto', ok: !(p.metaCpa>0) || a.cpa<=p.metaCpa,
       nota: p.metaCpa>0 ? ('CPA de '+U.brl(a.cpa)+' contra teto de '+U.brl(p.metaCpa)) : 'nenhum teto de CPA definido'},
      {rot:'Caixa positivo', ok: cx.atual>0, nota:'caixa de '+U.brl(cx.atual,0)},
      {rot:'Reserva acima da metade', ok: cx.metaReserva===0 || cx.pctReserva>=50,
       nota: cx.metaReserva>0 ? (U.pct(cx.pctReserva,0)+' da reserva formada') : 'meta de reserva não definida'},
      {rot:'Custo da falha abaixo de 3%', ok: a.falhaPct < 3, nota:U.pct(a.falhaPct)+' do faturamento'},
      {rot:'Oferta aprovada', ok: !!f.ofertaAprovada, nota:'confirmado no fechamento do mês'},
      {rot:'Custos conferidos', ok: !!f.custosConferidos, nota:'inclui encargos e taxas reais'},
      {rot:'Falhas apuradas', ok: !!f.falhasApuradas, nota:'reenvios e devoluções lançados'}
    ];
    return {itens:itens, liberado: itens.every(function(i){ return i.ok; }),
            pendentes: itens.filter(function(i){ return !i.ok; }).length};
  },

  /* ---------- SIMULADOR DE OFERTAS (unit economics) ---------- */
  simular: function(o){
    var c = Calc.cfg();
    var qtd = Math.max(1, U.n(o.camisetas,1));
    var preco = U.n(o.preco);
    var custoCam = (o.custoCamiseta!==undefined && o.custoCamiseta!=='') ? U.n(o.custoCamiseta) : Calc.custoCamiseta();
    var kit = (o.kit!==undefined && o.kit!=='') ? U.n(o.kit) : Calc.kitEmbalagem(qtd);
    var insumoPed = (o.insumoPedido!==undefined && o.insumoPedido!=='') ? U.n(o.insumoPedido) : Calc.insumosPorPedido();
    var insumoCam = (o.insumoCamiseta!==undefined && o.insumoCamiseta!=='') ? U.n(o.insumoCamiseta) : Calc.insumosPorCamiseta();
    var brindes = U.n(o.brindes) + Calc.custoBrindes(o.itens);
    var frete = U.n(o.frete!==undefined&&o.frete!==''?o.frete:c.freteMedio);
    /* se o frete não é grátis, o cliente paga: vira receita e não sai da margem */
    var receitaFrete = o.freteGratis===false ? U.n(o.freteCobrado!==undefined&&o.freteCobrado!==''?o.freteCobrado:frete) : 0;

    var r = {qtd:qtd, preco:preco, receitaFrete:receitaFrete, total:preco+receitaFrete};
    r.cmv = qtd * custoCam;
    r.kit = kit;
    r.embalagem = kit + insumoPed + qtd*insumoCam + brindes;
    r.frete = frete;
    r.custoFisico = r.cmv + r.embalagem + r.frete;

    r.pctGateway = U.n(c.gateway); r.pctCheckout = U.n(c.checkout); r.pctImposto = U.n(c.imposto);
    r.gatewayFixo = U.n(o.gatewayFixo!==undefined&&o.gatewayFixo!=='' ? o.gatewayFixo : c.gatewayFixo);
    r.pctOperacional = (o.operacionalPct!==undefined&&o.operacionalPct!=='') ? U.n(o.operacionalPct) : U.n(c.operacionalPct);
    r.gateway = r.total*r.pctGateway/100 + r.gatewayFixo;
    r.checkout = r.total*r.pctCheckout/100;
    r.imposto = r.total*r.pctImposto/100;
    r.taxas = r.gateway + r.checkout;

    r.modoMkt = o.modoMkt==='cpa' ? 'cpa' : 'pct';
    if(r.modoMkt==='cpa'){
      r.marketing = U.n(o.cpa);
      r.marketingPct = U.div(r.marketing, r.total)*100;
    }else{
      r.marketingPct = (o.marketingPct!==undefined&&o.marketingPct!=='') ? U.n(o.marketingPct) : U.n(c.marketingBase);
      r.marketing = r.total*r.marketingPct/100;
    }

    r.contribuicao = r.total - r.custoFisico - r.taxas - r.imposto - r.marketing;
    r.contribuicaoPct = U.div(r.contribuicao, r.total)*100;
    r.operacional = r.total*r.pctOperacional/100;
    r.lucro = r.contribuicao - r.operacional;
    r.margem = U.div(r.lucro, r.total)*100;
    r.lucroPorCamiseta = r.lucro/qtd;
    r.precoPorCamiseta = preco/qtd;
    r.custoTotal = r.total - r.lucro;

    /* percentuais que variam com o preço (sem marketing) */
    var pctSemMkt = (r.pctGateway + r.pctCheckout + r.pctImposto + r.pctOperacional)/100;
    r.pctSemMkt = pctSemMkt;

    /* CPA máximo para diferentes margens */
    var fixosTotais = r.custoFisico + r.gatewayFixo - r.receitaFrete;
    r.cpaBreakeven = preco*(1-pctSemMkt) - fixosTotais;
    var alvo = (o.margemAlvo!==undefined&&o.margemAlvo!=='') ? U.n(o.margemAlvo) : U.n(c.metaMargem);
    r.margemAlvo = alvo;
    r.cpaMaxAlvo = preco*(1 - pctSemMkt - alvo/100) - fixosTotais;
    r.roasMinBreakeven = r.cpaBreakeven>0 ? preco/r.cpaBreakeven : Infinity;
    r.roasMinAlvo = r.cpaMaxAlvo>0 ? preco/r.cpaMaxAlvo : Infinity;
    r.roasAtual = r.marketing>0 ? preco/r.marketing : Infinity;

    /* preço necessário para a margem alvo, mantendo o modo de marketing */
    var denom;
    if(r.modoMkt==='pct'){
      denom = 1 - pctSemMkt - r.marketingPct/100 - alvo/100;
      r.precoParaAlvo = denom>0 ? fixosTotais/denom : null;
    }else{
      denom = 1 - pctSemMkt - alvo/100;
      r.precoParaAlvo = denom>0 ? (fixosTotais + r.marketing)/denom : null;
    }
    /* preço de equilíbrio (lucro zero) */
    var d0 = (r.modoMkt==='pct') ? (1 - pctSemMkt - r.marketingPct/100) : (1 - pctSemMkt);
    r.precoEquilibrio = d0>0 ? ((r.modoMkt==='pct'? fixosTotais : fixosTotais+r.marketing)/d0) : null;

    r.saudavel = r.margem >= alvo ? 'ok' : (r.margem >= alvo*0.7 ? 'at' : 'cr');
    return r;
  },

  /* escada de ofertas 1..n camisetas mantendo o preço por camiseta proporcional */
  escada: function(base, precos){
    return [1,2,3,4].map(function(q){
      var p = precos && precos[q]!==undefined && precos[q]!=='' ? U.n(precos[q]) : null;
      var o = Object.assign({}, base, {camisetas:q, preco: p!==null ? p : U.n(base.preco)/U.n(base.camisetas,1)*q});
      return Calc.simular(o);
    });
  },

  /* ---------- CUSTO FIXO MENSAL, VINDO DAS CONTAS CADASTRADAS ---------- */
  fixoMensal: function(){
    var contas = (Store.dados.contas||[]).filter(function(c){
      return c.ativo!==false && c.recorrencia!=='unica';
    });
    var pro = 0, outros = 0, lista = [];
    contas.forEach(function(c){
      var ehPro = (c.categoria==='Pró-labore') || /pró-labore|pro-labore/i.test(c.nome||'');
      if(ehPro) pro += U.n(c.valor); else outros += U.n(c.valor);
      lista.push({nome:c.nome, valor:U.n(c.valor), proLabore:ehPro});
    });
    return {proLabore:pro, operacional:outros, total:pro+outros, lista:lista};
  },

  /* ---------- MIX DE PEDIDOS ----------
     Quantos pedidos saem com 1, 2, 3, 4+ camisetas, em todo o histórico.
     Fonte primária: a contagem de peças do pedido, já sem capelinha e brindes.
     Fonte alternativa: faixas de valor, para conferência. ---------- */
  mix: function(){
    var vendas = Store.dados.lancamentos.filter(function(l){
      return l.grupo==='vendas' && U.n(l.pedidos)>0 && U.n(l.valor)>0;
    });
    var faixas = {}, semPeca = 0, totPed = 0, totCam = 0, totFat = 0;
    vendas.forEach(function(l){
      var ped = U.n(l.pedidos);
      var cam = U.n(l.camisetas);
      var v = U.n(l.valor) + U.n(l.freteCobrado);
      totPed += ped; totFat += v;
      if(!cam){ semPeca += ped; return; }
      totCam += cam;
      var q = Math.max(1, Math.round(cam/ped));
      if(q>=5) q = 5;
      if(!faixas[q]) faixas[q] = {qtd:q, pedidos:0, fat:0, camisetas:0};
      faixas[q].pedidos += ped;
      faixas[q].fat += v;
      faixas[q].camisetas += cam;
    });
    var comPeca = totPed - semPeca;
    var lista = Object.keys(faixas).map(function(k){ return faixas[k]; })
      .sort(function(a,b){ return a.qtd-b.qtd; });
    lista.forEach(function(f){
      f.part = U.div(f.pedidos, comPeca)*100;
      f.ticket = U.div(f.fat, f.pedidos);
    });
    return {
      faixas: lista,
      pedidos: totPed, comPeca: comPeca, semPeca: semPeca,
      camisetas: totCam, faturamento: totFat,
      mediaCamisetas: U.div(totCam, comPeca),
      ticketMedio: U.div(totFat, totPed),
      temDados: comPeca > 0
    };
  },

  /* Mesma leitura, mas classificando por valor do pedido — para conferir o mix */
  mixPorValor: function(cortes){
    cortes = cortes || [];
    var vendas = Store.dados.lancamentos.filter(function(l){
      return l.grupo==='vendas' && U.n(l.pedidos)>0 && U.n(l.valor)>0;
    });
    var baldes = cortes.map(function(c){ return {rot:c.rot, qtd:c.qtd, de:c.de, ate:c.ate, pedidos:0, fat:0}; });
    var totPed = 0;
    vendas.forEach(function(l){
      var v = (U.n(l.valor)+U.n(l.freteCobrado)) / Math.max(1,U.n(l.pedidos));
      var ped = U.n(l.pedidos); totPed += ped;
      for(var i=0;i<baldes.length;i++){
        if(v >= baldes[i].de && v < baldes[i].ate){ baldes[i].pedidos += ped; baldes[i].fat += U.n(l.valor)+U.n(l.freteCobrado); break; }
      }
    });
    baldes.forEach(function(b){ b.part = U.div(b.pedidos, totPed)*100; b.ticket = U.div(b.fat, b.pedidos); });
    return {baldes:baldes, pedidos:totPed};
  },

  /* economia de uma promoção cadastrada */
  promoEconomia: function(p){
    var r = Calc.simular(p);
    r.promo = p;
    return r;
  },

  /* mix esperado a partir das promoções ativas + distribuição real */
  promoMix: function(brindesPorQtd){
    var ativas = Store.promocoes(true);
    var real = Calc.distribuicaoReal().dist;
    var precos = {}, partes = {}, itens = {};
    ativas.forEach(function(o){
      var q = U.clamp(Math.round(U.n(o.camisetas,1)),1,5);
      precos[q] = U.n(o.preco) + (o.freteGratis===false ? U.n(o.freteCobrado) : 0);
      itens[q] = (o.itens||[]).slice();
      partes[q] = real[q]!==undefined ? real[q] : 0;
    });
    return {precos:precos, partes:partes, itens:itens, ativas:ativas, real:real};
  },

  /* ---------- CAIXA ACUMULADO ----------
     Meta: meses de operação garantida. Conta estrutura fixa e produção dos
     pedidos, porque os pedidos continuam chegando e precisam ser entregues.
     Não conta marketing: sem caixa, a primeira coisa que se desliga é o tráfego. ---------- */
  planoReserva: function(){
    var pl = Store.dados.reservaPlano, c = Calc.cfg();
    var fixo = Calc.fixoMensal();
    var mx = Calc.mix();
    var camPorPedido = mx.temDados ? mx.mediaCamisetas : U.n(c.camisetasPorPedidoPadrao, 2);

    /* volume mensal de referência: média dos últimos meses com venda */
    var hist = Calc.historico().filter(function(x){ return x.a.pedidos>0; });
    var ultimos = hist.slice(-3);
    var mediaPedidos = ultimos.length
      ? ultimos.reduce(function(s,x){ return s+x.a.pedidos; },0) / ultimos.length : 0;
    var pedidos = (pl.pedidosMes===null || pl.pedidosMes==='') ? mediaPedidos : U.n(pl.pedidosMes);

    var custoPorPedido = camPorPedido*Calc.custoCamiseta()
                       + Calc.kitEmbalagem(camPorPedido) + Calc.insumosPorPedido()
                       + U.n(c.freteMedio);
    var producao = pedidos * custoPorPedido;

    /* marketing, quando incluído: mantém o tráfego rodando no mesmo volume */
    var ticketRef = mx.temDados && mx.ticketMedio>0 ? mx.ticketMedio : 0;
    var marketing = 0;
    if(pl.incluirMarketing !== false){
      marketing = pedidos * ticketRef * U.n(c.marketingBase)/100;
    }

    var r = {
      meses: U.n(pl.meses, 3),
      fixo: fixo.total, fixoDetalhe: fixo,
      pedidosMes: pedidos, mediaPedidos: mediaPedidos, pedidosManual: !(pl.pedidosMes===null||pl.pedidosMes===''),
      camPorPedido: camPorPedido, custoPorPedido: custoPorPedido, producao: producao,
      incluirMarketing: pl.incluirMarketing !== false,
      marketing: marketing, ticketRef: ticketRef, marketingPct: U.n(c.marketingBase)
    };
    r.custoMensal = r.fixo + r.producao + r.marketing;
    r.meta = r.custoMensal * r.meses;

    r.atual = U.n(pl.caixaAtual);
    r.falta = Math.max(0, r.meta - r.atual);
    r.pct = U.div(r.atual, r.meta)*100;
    r.mesesCobertos = U.div(r.atual, r.custoMensal);

    /* ritmo: quanto sobra por mês, pela média de lucro dos meses com venda */
    var mediaLucro = ultimos.length
      ? ultimos.reduce(function(s,x){ return s+x.a.lucro; },0) / ultimos.length : 0;
    r.mediaLucro = mediaLucro;
    r.aporteAuto = Math.max(0, mediaLucro);
    r.aporte = (pl.aporteMensal===null || pl.aporteMensal==='') ? r.aporteAuto : U.n(pl.aporteMensal);
    r.aporteManual = !(pl.aporteMensal===null||pl.aporteMensal==='');

    if(r.falta<=0){ r.mesesParaMeta = 0; r.dataMeta = null; }
    else if(r.aporte<=0){ r.mesesParaMeta = null; r.dataMeta = null; }
    else {
      r.mesesParaMeta = r.falta / r.aporte;
      var d = new Date();
      d.setMonth(d.getMonth() + Math.ceil(r.mesesParaMeta));
      r.dataMeta = d.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
    }
    return r;
  },

  /* ---------- TICKET A PARTIR DA PROMOÇÃO ----------
     Aplica a distribuição de pedidos (quantos saem com 1, 2, 3, 4 camisetas)
     sobre os preços da promoção escolhida. ---------- */
  ticketDaPromo: function(precos, partes, brindes){
    brindes = brindes || {};
    var linhas = [], somaPart = 0;
    [1,2,3,4,5].forEach(function(q){
      var pt = U.n(partes[q]);
      if(pt<=0) return;
      somaPart += pt;
      linhas.push({qtd:q, preco:U.n(precos[q]), part:pt, brindes:brindes[q]||[]});
    });
    if(!somaPart) return {ticket:0, camPorPedido:0, linhas:[], somaPart:0, embalagemMedia:0, cmvMedio:0};
    var ticket = 0, cam = 0, emb = 0;
    linhas.forEach(function(l){
      l.peso = l.part / somaPart;
      l.kit = Calc.kitEmbalagem(l.qtd);
      l.custoBrindes = Calc.custoBrindes(l.brindes);
      l.embalagem = l.kit + l.custoBrindes + Calc.insumosPorPedido();
      l.cmv = l.qtd * Calc.custoCamiseta();
      l.custoDireto = l.cmv + l.embalagem;
      ticket += l.peso * l.preco;
      cam += l.peso * l.qtd;
      emb += l.peso * l.embalagem;
      l.partNorm = l.peso * 100;
      l.contribTicket = l.peso * l.preco;
    });
    return {ticket:ticket, camPorPedido:cam, linhas:linhas, somaPart:somaPart,
            embalagemMedia:emb, cmvMedio:cam*Calc.custoCamiseta()};
  },

  /* distribuição real, em percentual por quantidade de camisetas */
  distribuicaoReal: function(){
    var mx = Calc.mix(), d = {};
    mx.faixas.forEach(function(f){ d[f.qtd] = Math.round(f.part*10)/10; });
    return {dist:d, mix:mx};
  },

  /* ---------- VISÃO DO GESTOR ----------
     Parte do faturamento desejado e abre todos os custos. ---------- */
  gestor: function(o){
    var c = Calc.cfg();
    var fat = U.n(o.faturamento);
    var camPorPedido = Math.max(0.01, U.n(o.camisetasPorPedido, 2));
    var ticket = Math.max(0.01, U.n(o.ticket, 249.90));
    var dias = U.diasNoMes(o.ym || U.ymAtual());

    var g = {faturamento:fat, ticket:ticket, camisetasPorPedido:camPorPedido, dias:dias};
    g.pedidos = fat / ticket;
    g.camisetas = g.pedidos * camPorPedido;
    g.pedidosDia = g.pedidos / dias;
    g.camisetasDia = g.camisetas / dias;

    g.custoCamiseta = U.n(o.custoCamiseta, Calc.custoCamiseta());
    g.freteUnit = U.n(o.freteMedio, c.freteMedio);
    g.embalagemUnit = U.n(o.embalagemUnit, Calc.kitEmbalagem(camPorPedido) + Calc.insumosPorPedido());

    g.cmv        = g.camisetas * g.custoCamiseta;
    g.frete      = g.pedidos * g.freteUnit;
    g.embalagem  = g.pedidos * g.embalagemUnit;
    g.marketing  = fat * U.n(o.marketingPct, c.marketingBase)/100;
    g.gateway    = fat * U.n(o.gatewayPct, c.gateway)/100 + g.pedidos * U.n(o.gatewayFixo, c.gatewayFixo);
    g.checkout   = fat * U.n(o.checkoutPct, c.checkout)/100;
    g.imposto    = fat * U.n(o.impostoPct, c.imposto)/100;
    g.operacional= U.n(o.operacional, Calc.fixoMensal().total);

    g.linhas = [
      {id:'operacional', rot:'Custo operacional', valor:g.operacional, editavel:true, nota:'fixo mensal, vem da Agenda'},
      {id:'cmv',        rot:'CMV', valor:g.cmv,       nota:U.num(g.camisetas,0)+' camisetas × '+U.brl(g.custoCamiseta)},
      {id:'embalagem',  rot:'Embalagem e brindes', valor:g.embalagem, nota:U.num(g.pedidos,0)+' pedidos × '+U.brl(g.embalagemUnit)},
      {id:'marketing',  rot:'Marketing', valor:g.marketing, editavel:true, nota:'% do faturamento'},
      {id:'gateway',    rot:'Gateway', valor:g.gateway,  nota:U.pct(U.n(o.gatewayPct,c.gateway),2)+(U.n(o.gatewayFixo,c.gatewayFixo)?' + '+U.brl(U.n(o.gatewayFixo,c.gatewayFixo))+' por pedido':'')},
      {id:'checkout',   rot:'Checkout', valor:g.checkout, nota:U.pct(U.n(o.checkoutPct,c.checkout),2)+' do faturamento'},
      {id:'frete',      rot:'Frete', valor:g.frete,     nota:U.num(g.pedidos,0)+' pedidos × '+U.brl(g.freteUnit)},
      {id:'imposto',    rot:'Imposto', valor:g.imposto, nota:U.pct(U.n(o.impostoPct,c.imposto),2)+' do faturamento'}
    ];
    g.linhas.forEach(function(l){ l.pct = U.div(l.valor, fat)*100; });

    g.custoTotal = g.linhas.reduce(function(s,l){ return s+l.valor; },0);
    g.margem = fat - g.custoTotal;
    g.margemPct = U.div(g.margem, fat)*100;
    g.lucroPorPedido = U.div(g.margem, g.pedidos);
    g.custoMedioCamisetaFrete = U.div(g.cmv + g.frete + g.embalagem, g.pedidos);

    /* ponto de equilíbrio em pedidos */
    var variavelPorPedido = (g.cmv + g.frete + g.embalagem + g.marketing + g.gateway + g.checkout + g.imposto) / Math.max(1,g.pedidos);
    g.contribPedido = ticket - variavelPorPedido;
    g.pedidosEquilibrio = g.contribPedido>0 ? Math.ceil(g.operacional / g.contribPedido) : null;
    g.pedidosDiaEquilibrio = g.pedidosEquilibrio!==null ? g.pedidosEquilibrio/dias : null;

    var alvo = U.n(o.margemAlvo, c.metaMargem)/100;
    var porPedidoAlvo = g.contribPedido - alvo*ticket;
    g.pedidosParaAlvo = porPedidoAlvo>0 ? Math.ceil(g.operacional / porPedidoAlvo) : null;
    g.faturamentoParaAlvo = g.pedidosParaAlvo!==null ? g.pedidosParaAlvo*ticket : null;
    g.margemAlvo = alvo*100;
    return g;
  },

  /* ---------- CENÁRIO MENSAL ----------
     Projeta um mês inteiro a partir de uma oferta e de um volume de pedidos.
     Usa custo fixo real (contas cadastradas), não percentual. ---------- */
  cenario: function(o){
    var c = Calc.cfg();
    var r = Calc.simular(Object.assign({}, o, {operacionalPct:0}));
    var pedidos = Math.max(0, U.n(o.pedidosMes));
    var dias = U.diasNoMes(o.ym || U.ymAtual());
    var fixo = Calc.fixoMensal();
    if(o.incluirProLabore===false) fixo = {proLabore:0, operacional:fixo.operacional, total:fixo.operacional, lista:fixo.lista};

    var x = {
      qtd:r.qtd, preco:r.preco, receitaFrete:r.receitaFrete, totalPedido:r.total,
      pedidos:pedidos, dias:dias,
      camisetas: pedidos * r.qtd,
      pedidosDia: U.div(pedidos, dias)
    };
    x.faturamento = pedidos * r.preco;
    x.receitaFreteTotal = pedidos * r.receitaFrete;
    x.receitaTotal = x.faturamento + x.receitaFreteTotal;

    x.cmv        = pedidos * r.cmv;
    x.embalagem  = pedidos * r.embalagem;
    x.frete      = pedidos * r.frete;
    x.marketing  = pedidos * r.marketing;
    x.gateway    = pedidos * r.gateway;
    x.checkout   = pedidos * r.checkout;
    x.imposto    = pedidos * r.imposto;
    x.operacional= fixo.operacional;
    x.proLabore  = fixo.proLabore;
    x.fixo       = fixo;

    x.variaveis = x.cmv + x.embalagem + x.frete + x.marketing + x.gateway + x.checkout + x.imposto;
    x.custoTotal = x.variaveis + x.operacional + x.proLabore;
    x.lucro = x.receitaTotal - x.custoTotal;
    x.margem = U.div(x.lucro, x.receitaTotal)*100;
    x.lucroPorPedido = U.div(x.lucro, pedidos);

    /* contribuição por pedido: o que sobra para pagar o fixo */
    x.contribPedido = r.contribuicao;
    x.contribTotal = pedidos * r.contribuicao;
    x.pedidosEquilibrio = r.contribuicao>0 ? Math.ceil(fixo.total / r.contribuicao) : null;
    x.faturamentoEquilibrio = x.pedidosEquilibrio!==null ? x.pedidosEquilibrio * r.total : null;

    /* quantos pedidos para atingir a margem alvo */
    var alvo = U.n(o.margemAlvo, c.metaMargem)/100;
    var porPedido = r.contribuicao - alvo*r.total;
    x.margemAlvo = alvo*100;
    x.pedidosParaAlvo = porPedido>0 ? Math.ceil(fixo.total / porPedido) : null;
    x.unit = r;
    return x;
  },

  /* ---------- DIAGNÓSTICOS ---------- */
  diagnosticar: function(a, p, cx){
    var c = Calc.cfgM(a.ym), d = [];
    var nivel = {ok:0, at:1, cr:2, nu:-1};

    if(!a.temDados){
      d.push({n:'nu', t:'Sem lançamentos neste mês',
        x:'Registre a primeira venda em Lançamentos e todo o restante do sistema se preenche sozinho.',
        acao:'Registrar lançamento', ir:'novo'});
      return d;
    }

    /* Margem */
    if(a.faturamento>0){
      var alvo = U.n(c.metaMargem,30);
      if(a.margem >= alvo) d.push({n:'ok', t:'Margem dentro da meta', x:'Margem líquida de '+U.pct(a.margem)+' contra meta de '+U.pct(alvo,0)+'.'});
      else if(a.margem >= alvo*0.7) d.push({n:'at', t:'Margem abaixo da meta', x:'Margem líquida de '+U.pct(a.margem)+' contra meta de '+U.pct(alvo,0)+'. Faltam '+U.pct(alvo-a.margem)+' para o alvo estrutural.', acao:'Revisar a oferta no simulador', ir:'planejamento:simulador'});
      else if(a.margem >= 0) d.push({n:'cr', t:'Margem crítica', x:'Margem líquida de '+U.pct(a.margem)+'. A operação está trabalhando perto do limite.', acao:'Revisar preço e marketing', ir:'planejamento:simulador'});
      else d.push({n:'cr', t:'Prejuízo no período', x:'O resultado do mês está negativo em '+U.brl(Math.abs(a.lucro))+'. Cada venda adicional nas condições atuais aumenta a perda.', acao:'Revisar a oferta agora', ir:'planejamento:simulador'});
    }

    /* Marketing / CPA */
    if(a.custo.marketing>0 && a.faturamento>0){
      var base = U.n(c.marketingBase,25);
      if(a.marketingPct <= base) d.push({n:'ok', t:'Marketing dentro do cenário-base', x:'Marketing consumiu '+U.pct(a.marketingPct)+' do faturamento (base: '+U.pct(base,0)+'). ROAS de '+U.num(a.roas,2)+'.'});
      else d.push({n:'at', t:'Marketing acima do cenário-base', x:'Marketing consumiu '+U.pct(a.marketingPct)+' do faturamento, acima da base de '+U.pct(base,0)+'. Cada ponto acima sai direto da margem.'});
      if(p.metaCpa>0){
        if(a.cpa<=p.metaCpa) d.push({n:'ok', t:'CPA dentro do limite', x:'CPA de '+U.brl(a.cpa)+' contra limite de '+U.brl(p.metaCpa)+'.'});
        else d.push({n:'cr', t:'CPA acima do limite', x:'CPA de '+U.brl(a.cpa)+' contra limite de '+U.brl(p.metaCpa)+'. Escalar assim reduz o lucro por pedido.'});
      }
    }else if(a.faturamento>0){
      d.push({n:'nu', t:'Marketing ainda não lançado', x:'Sem o gasto de tráfego, o CPA e a margem real do mês ficam otimistas.', acao:'Lançar investimento em marketing', ir:'novo'});
    }

    /* Meta de lucro */
    if(p.metaLucro>0){
      if(p.encerrado){
        if(a.lucro>=p.metaLucro) d.push({n:'ok', t:'Meta de lucro atingida', x:'Lucro de '+U.brl(a.lucro)+' contra meta de '+U.brl(p.metaLucro)+'.'});
        else d.push({n:'cr', t:'Meta de lucro não atingida', x:'Fechou em '+U.brl(a.lucro)+', '+U.brl(p.metaLucro-a.lucro)+' abaixo da meta.'});
      }else if(p.atingeLucro){
        d.push({n:'ok', t:'Mantendo o ritmo, a meta de lucro será atingida', x:'Projeção de '+U.brl(p.projLucro)+' contra meta de '+U.brl(p.metaLucro)+'.'});
      }else{
        d.push({n:'at', t:'No ritmo atual a meta de lucro não será atingida',
          x:'Projeção de '+U.brl(p.projLucro)+' contra meta de '+U.brl(p.metaLucro)+'. Faltam '+U.brl(p.faltaLucro)+' em '+p.restantes+' dia(s): '+U.brl(p.precisaLucroDia)+' de lucro por dia.',
          acao:'Ver projeção diária', ir:'planejamento:cenario'});
      }
    }else{
      d.push({n:'nu', t:'Sem meta definida para o mês', x:'Sem meta, o sistema mostra o que aconteceu mas não consegue dizer se está bom.', acao:'Definir metas do mês', ir:'planejamento:cenario'});
    }

    /* Custo da falha */
    if(a.custo.falha>0){
      if(a.falhaPct>=3) d.push({n:'cr', t:'Custo da falha alto', x:U.brl(a.custo.falha)+' gastos corrigindo erros ('+U.pct(a.falhaPct)+' do faturamento, '+U.brl(a.falhaPorPedido)+' por pedido). Esse dinheiro sai inteiro do lucro.', acao:'Abrir custo da falha', ir:'resultados:falha'});
      else if(a.falhaPct>=1) d.push({n:'at', t:'Custo da falha em observação', x:U.brl(a.custo.falha)+' ('+U.pct(a.falhaPct)+' do faturamento) foram gastos corrigindo problemas.', acao:'Abrir custo da falha', ir:'resultados:falha'});
      else d.push({n:'ok', t:'Custo da falha sob controle', x:U.brl(a.custo.falha)+' ('+U.pct(a.falhaPct)+' do faturamento).'});
    }

    /* Caixa e reserva */
    if(cx.atual < 0) d.push({n:'cr', t:'Caixa negativo', x:'O caixa apurado está em '+U.brl(cx.atual)+'. Confira o saldo inicial em Configurações e os lançamentos pendentes.', acao:'Abrir caixa', ir:'caixa:saldo'});
    else if(cx.custoFixoMensal>0 && cx.metaReserva>0){
      if(cx.pctReserva>=100) d.push({n:'ok', t:'Reserva operacional completa', x:'A reserva cobre '+U.num(cx.mesesProtegidos,1)+' mês(es) de custo fixo.'});
      else if(cx.pctReserva>=50) d.push({n:'at', t:'Reserva em construção', x:U.pct(cx.pctReserva,0)+' da reserva formada — protege '+U.num(cx.mesesProtegidos,1)+' mês(es). Reserva não é lucro disponível.', acao:'Abrir caixa e reserva', ir:'caixa:saldo'});
      else d.push({n:'cr', t:'Reserva insuficiente', x:'Apenas '+U.pct(cx.pctReserva,0)+' da reserva está formada. A empresa está exposta a qualquer imprevisto de produção ou logística.', acao:'Abrir caixa e reserva', ir:'caixa:saldo'});
    }

    /* Conflito de apuração */
    if(a.conflitos.length){
      var nomes = a.conflitos.map(function(k){ return GRUPOS[k.grupo].nome; }).join(', ');
      d.push({n:'at', t:'Lançamentos ignorados no cálculo', x:'Estes grupos estão no modo automático e têm lançamentos manuais no mês: '+nomes+'. O sistema usou o valor calculado para não contar duas vezes.', acao:'Ajustar modo de apuração', ir:'custos'});
    }

    /* Recomendação de escala */
    if(a.faturamento>0 && a.custo.marketing>0){
      var margemOk = a.margem >= U.n(c.metaMargem,30);
      var caixaOk = cx.atual>0 && (cx.metaReserva===0 || cx.pctReserva>=50);
      var falhaOk = a.falhaPct < 3;
      if(margemOk && caixaOk && falhaOk) d.push({n:'ok', t:'Condições favoráveis para escalar', x:'Margem na meta, caixa positivo e custo da falha sob controle. O limite é o CPA: mantenha abaixo de '+U.brl(a.ticket*(1-U.n(c.metaMargem)/100-(U.n(c.gateway)+U.n(c.checkout)+U.n(c.imposto)+U.n(c.operacionalPct))/100)-(Calc.custoCamiseta(a.ym)*Math.max(1,a.camisetasPorPedido)+Calc.kitEmbalagem(a.camisetasPorPedido,a.ym)+Calc.insumosPorPedido(a.ym)+U.n(c.freteMedio)))+' por pedido.'});
      else d.push({n:'at', t:'Não recomendado escalar neste momento', x:'Escalar multiplica o que já existe. Antes de aumentar o investimento, corrija: '+[!margemOk?'margem abaixo da meta':null,!caixaOk?'caixa/reserva frágeis':null,!falhaOk?'custo da falha alto':null].filter(Boolean).join(', ')+'.'});
    }

    d.sort(function(x,y){ return nivel[y.n]-nivel[x.n]; });
    return d;
  },

  /* veredito do topo */
  veredito: function(a, p, cx, diags){
    if(!a.temDados) return {n:'neutro', frase:'Nenhum dado registrado em '+U.nomeMes(a.ym)+'.', apoio:'Comece registrando as vendas do período. O sistema calcula custos, margem, projeção e diagnóstico a partir disso.'};
    var temCritico = diags.some(function(x){ return x.n==='cr'; });
    var temAtencao = diags.some(function(x){ return x.n==='at'; });
    var frase, apoio, n;
    if(a.lucro<0){ n='critico'; frase='A operação está dando prejuízo.'; }
    else if(temCritico){ n='critico'; frase='Há um problema que precisa de decisão agora.'; }
    else if(temAtencao){ n='atencao'; frase='A operação está de pé, mas fora do alvo.'; }
    else { n='ok'; frase='A empresa está saudável neste período.'; }

    var partes = [];
    partes.push('Lucro de '+U.brl(a.lucro)+' sobre '+U.brl(a.faturamento)+' faturados ('+U.pct(a.margem)+' de margem).');
    if(!p.encerrado && p.ritmoFat>0) partes.push('Mantendo o ritmo, o mês fecha em '+U.brl(p.projFat)+' faturados e '+U.brl(p.projLucro)+' de lucro.');
    if(p.metaLucro>0 && !p.encerrado) partes.push(p.atingeLucro ? 'A meta de lucro deve ser atingida.' : 'A meta de lucro não será atingida neste ritmo.');
    apoio = partes.join(' ');
    return {n:n, frase:frase, apoio:apoio};
  }
};
/* ------------------------------------------------------------
   GRÁFICOS — SVG puro, sem dependências externas
------------------------------------------------------------ */
var Chart = {
  linha: function(op){
    var W=720, H=op.altura||220, ml=54, mr=12, mt=14, mb=26;
    var series = op.series.filter(function(s){ return s.pontos && s.pontos.length; });
    if(!series.length) return '<div class="vazio"><div class="vazio-txt">Sem dados para o gráfico.</div></div>';
    var n = op.n || Math.max.apply(null, series.map(function(s){ return s.pontos.length; }));
    if(n<1) n=1;
    var todos = [];
    series.forEach(function(s){ s.pontos.forEach(function(v){ todos.push(v); }); });
    var max = Math.max.apply(null, todos), min = Math.min.apply(null, todos.concat([0]));
    if(max===min) max = min+1;
    var pad = (max-min)*0.12; max+=pad; if(min<0) min-=pad;
    var px = function(i){ return ml + (n<=1?0:(W-ml-mr)*i/(n-1)); };
    var py = function(v){ return mt + (H-mt-mb)*(1-(v-min)/(max-min)); };
    var s='<svg class="grafico" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+U.esc(op.titulo||'gráfico')+'">';
    /* grade */
    for(var g=0; g<=4; g++){
      var v = min + (max-min)*g/4, y = py(v);
      s+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'" stroke="#eee7e2" stroke-width="1"/>';
      s+='<text x="'+(ml-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.brlCurto(v)+'</text>';
    }
    /* zero */
    if(min<0 && max>0) s+='<line x1="'+ml+'" y1="'+py(0)+'" x2="'+(W-mr)+'" y2="'+py(0)+'" stroke="#d6cec6" stroke-width="1"/>';
    /* séries */
    series.forEach(function(se){
      var d = se.pontos.map(function(v,i){ return (i?'L':'M')+px(i).toFixed(1)+' '+py(v).toFixed(1); }).join(' ');
      if(se.area){
        s+='<path d="'+d+' L'+px(n-1).toFixed(1)+' '+py(Math.max(0,min)).toFixed(1)+' L'+px(0).toFixed(1)+' '+py(Math.max(0,min)).toFixed(1)+' Z" fill="'+se.cor+'" opacity=".07"/>';
      }
      s+='<path d="'+d+'" fill="none" stroke="'+se.cor+'" stroke-width="'+(se.largura||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.tracejado?' stroke-dasharray="5 4"':'')+'/>';
      if(se.marcarFim && n>0){
        s+='<circle cx="'+px(n-1)+'" cy="'+py(se.pontos[n-1])+'" r="3.5" fill="'+se.cor+'" stroke="#fff" stroke-width="1.5"/>';
      }
    });
    /* eixo x */
    var passos = Math.min(n, 6);
    for(var i=0;i<passos;i++){
      var idx = Math.round((n-1)*i/(passos-1||1));
      s+='<text x="'+px(idx)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.esc(op.labels[idx]||'')+'</text>';
    }
    s+='</svg>';
    var leg = '<div class="gr-legenda">'+op.series.map(function(se){
      return '<span><i style="background:'+se.cor+(se.tracejado?';opacity:.6':'')+'"></i>'+U.esc(se.nome)+'</span>';
    }).join('')+'</div>';
    return s+leg;
  },

  barras: function(itens, op){
    op = op||{};
    if(!itens.length) return '<div class="vazio"><div class="vazio-txt">Sem dados.</div></div>';
    var max = Math.max.apply(null, itens.map(function(i){ return Math.abs(i.valor); }).concat([1]));
    return '<div style="display:flex;flex-direction:column;gap:9px">'+itens.map(function(i){
      var w = U.clamp(Math.abs(i.valor)/max*100, i.valor?1.5:0, 100);
      return '<div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;gap:10px;margin-bottom:3px">'+
          '<span style="color:var(--texto);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+U.esc(i.rot)+'</span>'+
          '<span class="num" style="color:var(--texto-medio);white-space:nowrap">'+(op.pct?U.pct(i.pct):U.brl(i.valor))+(op.pct===undefined&&i.pct!==undefined?' <span style="color:var(--texto-fraco)">· '+U.pct(i.pct)+'</span>':'')+'</span>'+
        '</div>'+
        '<div class="barra-prog"><span style="width:'+w+'%;background:'+(i.cor||'var(--vinho)')+'"></span></div>'+
      '</div>';
    }).join('')+'</div>';
  },

  colunas: function(itens, op){
    op=op||{};
    var W=720,H=op.altura||190, mb=30, mt=12, ml=50;
    if(!itens.length) return '<div class="vazio"><div class="vazio-txt">Sem dados.</div></div>';
    var max = Math.max.apply(null, itens.map(function(i){ return i.valor; }).concat([1]));
    var min = Math.min.apply(null, itens.map(function(i){ return i.valor; }).concat([0]));
    if(max===min) max=min+1;
    var faixa = max-min;
    var lw = (W-ml-10)/itens.length;
    var bw = Math.min(42, lw*0.62);
    var py = function(v){ return mt + (H-mt-mb)*(1-(v-min)/faixa); };
    var s='<svg class="grafico" viewBox="0 0 '+W+' '+H+'">';
    for(var g=0;g<=3;g++){
      var v=min+faixa*g/3, y=py(v);
      s+='<line x1="'+ml+'" y1="'+y+'" x2="'+(W-10)+'" y2="'+y+'" stroke="#eee7e2"/>';
      s+='<text x="'+(ml-8)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.brlCurto(v)+'</text>';
    }
    itens.forEach(function(it,i){
      var x = ml + lw*i + (lw-bw)/2;
      var y0 = py(Math.max(0,min)), y1 = py(it.valor);
      var y = Math.min(y0,y1), h = Math.max(2, Math.abs(y1-y0));
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(it.cor||'var(--vinho)')+'"><title>'+U.esc(it.rot)+': '+U.brl(it.valor)+'</title></rect>';
      s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" fill="#94897f" font-family="Inter,sans-serif">'+U.esc(it.rot)+'</text>';
    });
    s+='</svg>';
    return s;
  },

  rosca: function(itens, op){
    op=op||{};
    var tot = itens.reduce(function(s,i){ return s+Math.abs(i.valor); },0);
    if(!tot) return '<div class="vazio"><div class="vazio-txt">Sem custos lançados.</div></div>';
    var R=62, r=40, cx=72, cy=72, ang=-Math.PI/2, s='<svg viewBox="0 0 144 144" style="width:144px;height:144px;flex:0 0 144px">';
    itens.forEach(function(it){
      var frac = Math.abs(it.valor)/tot; if(frac<=0) return;
      var a2 = ang + frac*Math.PI*2, grande = frac>0.5?1:0;
      var x1=cx+R*Math.cos(ang), y1=cy+R*Math.sin(ang), x2=cx+R*Math.cos(a2), y2=cy+R*Math.sin(a2);
      var x3=cx+r*Math.cos(a2), y3=cy+r*Math.sin(a2), x4=cx+r*Math.cos(ang), y4=cy+r*Math.sin(ang);
      if(frac>=0.9999){
        s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+((R+r)/2)+'" fill="none" stroke="'+it.cor+'" stroke-width="'+(R-r)+'"/>';
      }else{
        s+='<path d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+grande+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
            ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+r+' '+r+' 0 '+grande+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+' Z" fill="'+it.cor+'"><title>'+U.esc(it.rot)+': '+U.brl(it.valor)+'</title></path>';
      }
      ang = a2;
    });
    s+='</svg>';
    var leg='<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">'+itens.filter(function(i){return i.valor>0;}).map(function(i){
      return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px">'+
        '<i style="width:9px;height:9px;border-radius:2px;background:'+i.cor+';flex:0 0 9px"></i>'+
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+U.esc(i.rot)+'</span>'+
        '<span class="num" style="color:var(--texto-medio)">'+U.pct(i.valor/tot*100,1)+'</span></div>';
    }).join('')+'</div>';
    return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+s+leg+'</div>';
  }
};

var UI = {
  tela: 'geral',
  aba: 'dashboard',
  ym: U.ymAtual(),

  toast: function(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg; t.classList.add('on');
    clearTimeout(UI._tt);
    UI._tt = setTimeout(function(){ t.classList.remove('on'); }, 2600);
  },

  modal: function(op){
    var mount = document.getElementById('modais');
    var fundo = document.createElement('div');
    fundo.className = 'fundo';
    fundo.innerHTML =
      '<div class="modal '+(op.larga?'larga':'')+(op.classe?' '+op.classe:'')+'" role="dialog" aria-modal="true">'+
        (op.titulo!==false ? '<div class="modal-topo"><div class="modal-tit">'+U.esc(op.titulo)+'</div>'+
          '<button class="btn-icone" data-fechar style="margin-left:auto" aria-label="Fechar">'+
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' : '')+
        '<div class="modal-corpo">'+op.corpo+'</div>'+
        (op.rodape ? '<div class="modal-rodape">'+op.rodape+'</div>' : '')+
      '</div>';
    mount.appendChild(fundo);
    var fechar = function(){ fundo.remove(); if(op.aoFechar) op.aoFechar(); };
    fundo.addEventListener('click', function(e){
      if(e.target===fundo && op.travado!==true) fechar();
      if(e.target.closest('[data-fechar]')) fechar();
    });
    var esc = function(e){ if(e.key==='Escape' && op.travado!==true){ fechar(); document.removeEventListener('keydown',esc); } };
    document.addEventListener('keydown', esc);
    if(op.aoAbrir) op.aoAbrir(fundo, fechar);
    var foco = fundo.querySelector('input,select,textarea,button:not([data-fechar])');
    if(foco) setTimeout(function(){ foco.focus(); }, 60);
    return {el:fundo, fechar:fechar};

  confirmar: function(titulo, texto, aoConfirmar, rotulo){

      titulo: titulo,

      aoAbrir: function(el, fechar){
        el.querySelector('#okConf').addEventListener('click', function(){ fechar(); aoConfirmar(); });

      (op.nota?'<div class="kpi-nota">'+(op.pt?'<span class="pt '+op.pt+'"></span>':'')+op.nota+'</div>':'')+
    '</div>';
  },

  vazio: function(tit, txt, botao){
    return '<div class="vazio"><div class="vazio-tit">'+U.esc(tit)+'</div><div class="vazio-txt">'+U.esc(txt)+'</div>'+(botao||'')+'</div>';

  nivelMargem: function(m){
    var alvo = U.n(Calc.cfg().metaMargem,30);
    if(m>=alvo) return 'ok'; if(m>=alvo*0.7) return 'at'; return 'cr';

  ],
  caixa: [

  ]
};

var Views = {};

/* ============ DASHBOARD ============ */
Views.dashboard = function(){
  var ym = UI.ym;
  var a = Calc.apurar(ym), p = Calc.projetar(a), cx = Calc.caixa();
  var diags = Calc.diagnosticar(a, p, cx);
  var v = Calc.veredito(a, p, cx, diags);
  var h = '';

  /* veredito */
  h += '<section class="veredito '+(v.n==='ok'?'':v.n)+'">'+
    '<div class="veredito-frase">'+U.esc(v.frase)+'</div>'+
    '<div class="veredito-apoio">'+U.esc(v.apoio)+'</div>';
  if(a.temDados){
    h += '<div class="veredito-linha">'+
      '<div class="mini"><div class="mini-rot">Faturamento</div><div class="mini-val">'+U.brl(a.faturamento,0)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Lucro líquido</div><div class="mini-val '+(a.lucro<0?'neg':'')+'">'+U.brl(a.lucro,0)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Margem</div><div class="mini-val"><span class="pt '+UI.nivelMargem(a.margem)+'"></span> '+U.pct(a.margem)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Pedidos</div><div class="mini-val">'+U.num(a.pedidos)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Lucro por pedido</div><div class="mini-val">'+U.brl(a.lucroPorPedido)+'</div></div>'+
    '</div>';
  }
  h += '</section>';

  if(!a.temDados){
    h += UI.vazio('Este mês ainda está em branco',
      'Registre uma venda com valor e quantidade de pedidos. O sistema calcula CMV, embalagem, frete, taxas e imposto sozinho, a partir do que está em Configurações.',
      '<button class="btn" data-acao="novo">Registrar primeiro lançamento</button>');
    return h;
  }

  if(a.conflitos.length){
    h += '<div class="aviso">Alguns grupos estão no modo automático e também receberam lançamentos manuais neste mês ('+
      a.conflitos.map(function(c){ return U.esc(GRUPOS[c.grupo].nome)+' — '+U.brl(c.valor); }).join('; ')+
      '). Para não contar duas vezes, o sistema usou o valor calculado. Ajuste o modo em Configurações se preferir usar os lançamentos manuais.</div>';
  }

  /* KPIs */
  h += '<div class="grade g5" style="margin-bottom:12px">'+
    UI.kpi({rot:'Faturamento', val:U.brl(a.faturamento,0), destaque:true,
      nota: p.metaFat>0 ? U.pct(p.pctMetaFat,0)+' da meta' : 'sem meta definida',
      pt: p.metaFat>0 ? (p.pctMetaFat>=100?'ok':(p.pctProjMetaFat>=100?'at':'cr')) : 'nu',
      ajuda:'Soma de todos os lançamentos de receita do grupo Vendas no mês.'})+
    UI.kpi({rot:'Lucro líquido', val:U.brl(a.lucro,0), destaque:true, classe:a.lucro<0?'neg':'',
      nota: p.metaLucro>0 ? U.pct(p.pctMetaLucro,0)+' da meta' : 'sem meta definida',
      pt: p.metaLucro>0 ? (p.pctMetaLucro>=100?'ok':(p.pctProjMetaLucro>=100?'at':'cr')) : 'nu',
      ajuda:'Receita total menos todos os custos: CMV, embalagem, frete, taxas, imposto, marketing, operacional, falhas e outros.'})+
    UI.kpi({rot:'Margem líquida', val:U.pct(a.margem), pt:UI.nivelMargem(a.margem),
      nota:'meta '+U.pct(Calc.cfg().metaMargem,0), ajuda:'Lucro líquido dividido pelo faturamento.'})+
    UI.kpi({rot:'Pedidos', val:U.num(a.pedidos), nota:U.num(a.camisetas)+' camisetas · '+U.num(a.camisetasPorPedido,2)+' por pedido'})+
    UI.kpi({rot:'Ticket médio', val:U.brl(a.ticket), nota:'lucro por pedido '+U.brl(a.lucroPorPedido)})+
  '</div>';

  h += '<div class="grade g5" style="margin-bottom:12px">'+
    UI.kpi({rot:'Marketing', val:U.brl(a.custo.marketing,0), pequeno:true,
      nota:U.pct(a.marketingPct)+' do faturamento', pt: a.marketingPct<=U.n(Calc.cfg().marketingBase)?'ok':'at'})+
    UI.kpi({rot:'CPA', val:U.brl(a.cpa), pequeno:true,
      nota: p.metaCpa>0 ? ('limite '+U.brl(p.metaCpa)) : ('ROAS '+(isFinite(a.roas)?U.num(a.roas,2):'—')),
      pt: p.metaCpa>0 ? (a.cpa<=p.metaCpa?'ok':'cr') : 'nu',
      ajuda:'Custo de aquisição por pedido: marketing dividido pelo número de pedidos.'})+
    UI.kpi({rot:'CMV', val:U.brl(a.custo.cmv,0), pequeno:true, nota:U.pct(a.cmvPct)+' do faturamento'+(Calc.cfg().modo.cmv==='auto'?' · automático':'')})+
    UI.kpi({rot:'Frete', val:U.brl(a.custo.frete,0), pequeno:true, nota:U.brl(a.fretePorPedido)+' por pedido'})+
    UI.kpi({rot:'Custos operacionais', val:U.brl(a.custo.operacional,0), pequeno:true,
      nota: a.operacionalEhFixo ? 'lançado manualmente' : U.pct(Calc.cfg().operacionalPct)+' do faturamento'})+
  '</div>';

  h += '<div class="grade g5" style="margin-bottom:20px">'+
    UI.kpi({rot:'Custo da falha', val:U.brl(a.custo.falha,0), pequeno:true, classe:a.custo.falha>0?'neg':'',
      nota:U.pct(a.falhaPct)+' do faturamento', pt:a.falhaPct>=3?'cr':(a.falhaPct>=1?'at':'ok'),
      ajuda:'Dinheiro gasto corrigindo erros: reenvios, extravios, devoluções e falhas de produção, logística ou atendimento.'})+
    UI.kpi({rot:'Caixa atual', val:U.brl(cx.atual,0), pequeno:true, classe:cx.atual<0?'neg':'',
      nota:'projetado '+U.brl(cx.projetado,0)})+
    UI.kpi({rot:'Reserva', val:U.brl(cx.reserva,0), pequeno:true,
      nota: cx.metaReserva>0 ? U.pct(cx.pctReserva,0)+' da meta · '+U.num(cx.mesesProtegidos,1)+' mês(es)' : 'meta não definida',
      pt: cx.metaReserva>0 ? (cx.pctReserva>=100?'ok':(cx.pctReserva>=50?'at':'cr')) : 'nu'})+
    UI.kpi({rot:'Projeção de faturamento', val:U.brl(p.projFat,0), pequeno:true,
      nota: p.encerrado?'mês encerrado':'ritmo de '+U.brl(p.ritmoFat,0)+'/dia'})+
    UI.kpi({rot:'Projeção de lucro', val:U.brl(p.projLucro,0), pequeno:true, classe:p.projLucro<0?'neg':'',
      nota: p.metaLucro>0 ? (p.atingeLucro?'atinge a meta':'abaixo da meta') : 'margem projetada '+U.pct(p.projMargem),
      pt: p.metaLucro>0 ? (p.atingeLucro?'ok':'at') : 'nu'})+
  '</div>';

  /* Realizado × Meta */
  h += '<div class="grade g2" style="margin-bottom:12px">';
  h += '<div class="cartao"><div class="cartao-tit">Realizado × Meta</div><div class="cartao-sub">Onde o mês está agora</div>'+
    Views._metaBarra('Faturamento', a.faturamento, p.metaFat)+
    Views._metaBarra('Lucro líquido', a.lucro, p.metaLucro)+
    Views._metaBarra('Pedidos', a.pedidos, p.metaPedidos, true)+
  '</div>';
  h += '<div class="cartao"><div class="cartao-tit">Projeção × Meta</div><div class="cartao-sub">Onde o mês termina se o ritmo se mantiver</div>'+
    Views._metaBarra('Faturamento projetado', p.projFat, p.metaFat)+
    Views._metaBarra('Lucro projetado', p.projLucro, p.metaLucro)+
    (p.restantes>0 && (p.faltaFat>0||p.faltaLucro>0) ?
      '<div class="info" style="margin:14px 0 0">Faltam '+p.restantes+' dia(s). Para bater as metas é preciso '+
      U.brl(p.precisaFatDia,0)+' de faturamento e '+U.brl(p.precisaLucroDia,0)+' de lucro por dia.</div>'
      : '')+
  '</div></div>';

  /* Gráficos */
  var serie = Calc.serieDiaria(ym);
  var labels = serie.map(function(d){ return String(d.dia); });
  var metaFatLinha = p.metaFat>0 ? serie.map(function(d){ return p.metaFat*d.dia/p.dias; }) : null;
  var metaLucLinha = p.metaLucro>0 ? serie.map(function(d){ return p.metaLucro*d.dia/p.dias; }) : null;
  var projFatLinha = (!p.encerrado && p.ritmoFat>0) ? serie.map(function(d){
    return d.dia<=p.decorridos ? d.accFat : (a.faturamento + p.ritmoFat*(d.dia-p.decorridos));
  }) : null;
  var projLucLinha = (!p.encerrado && p.ritmoFat>0) ? serie.map(function(d){
    return d.dia<=p.decorridos ? d.accLucro : (a.lucro + (p.ritmoFat*p.margemVarPct)*(d.dia-p.decorridos));
  }) : null;

  h += '<div class="grade g2" style="margin-bottom:12px">';
  h += '<div class="cartao"><div class="cartao-tit">Faturamento acumulado</div><div class="cartao-sub">Dia a dia contra a meta do mês</div>'+
    Chart.linha({labels:labels, n:p.dias, series:[
      {nome:'Realizado', cor:'#5a332e', pontos:serie.slice(0, Math.max(1,p.decorridos)).map(function(d){ return d.accFat; }), area:true, marcarFim:true},
      metaFatLinha?{nome:'Meta', cor:'#94897f', pontos:metaFatLinha, tracejado:true}:null,
      projFatLinha?{nome:'Projeção', cor:'#1f9d6c', pontos:projFatLinha, tracejado:true}:null
    ].filter(Boolean)})+'</div>';
  h += '<div class="cartao"><div class="cartao-tit">Lucro acumulado</div><div class="cartao-sub">Dia a dia contra a meta do mês</div>'+
    Chart.linha({labels:labels, n:p.dias, series:[
      {nome:'Realizado', cor:'#1f9d6c', pontos: serie.slice(0,Math.max(1,p.decorridos)).map(function(d){ return d.accLucro; }), area:true, marcarFim:true},
      metaLucLinha?{nome:'Meta', cor:'#94897f', pontos:metaLucLinha, tracejado:true}:null,
      projLucLinha?{nome:'Projeção', cor:'#b07a1e', pontos:projLucLinha, tracejado:true}:null
    ].filter(Boolean)})+'</div>';
  h += '</div>';

  /* Composição de custos + diagnósticos */
  h += '<div class="grade g2" style="margin-bottom:12px;align-items:start">';
  h += '<div class="cartao"><div class="cartao-tit">Para onde vai cada real</div><div class="cartao-sub">Composição do faturamento no mês</div>'+
    Chart.rosca(Views._composicao(a))+'</div>';
  var esc2 = Calc.podeEscalar(a, p, cx);
  h += '<div><div class="cartao" style="margin-bottom:12px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">'+
      '<div class="cartao-tit" style="margin:0">Podemos escalar?</div>'+
      '<span class="etq '+(esc2.liberado?'rec':'pen')+'" style="margin-left:auto">'+
        (esc2.liberado?'sim, com teste controlado':esc2.pendentes+' pendência(s))'.replace('))',')'))+'</span>'+
    '</div>'+
    '<div class="cartao-sub">Escalar multiplica o que já existe, inclusive o que está errado</div>'+
    esc2.itens.map(function(i){
      return '<div style="display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f4efeb">'+
        '<span class="pt '+(i.ok?'ok':'at')+'" style="margin-top:6px"></span>'+
        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">'+U.esc(i.rot)+'</div>'+
        '<div style="font-size:11.5px;color:var(--texto-fraco)">'+U.esc(i.nota)+'</div></div></div>';
    }).join('')+'</div>';
  h += '<div class="cartao-tit" style="margin-bottom:10px">Diagnóstico</div>'+
    diags.map(function(x){
      return '<div class="diag '+x.n+'"><span class="pt '+x.n+'" style="margin-top:5px"></span><div class="diag-corpo">'+
        '<div class="diag-tit">'+U.esc(x.t)+'</div><div class="diag-txt">'+U.esc(x.x)+'</div>'+
        (x.acao?'<button class="diag-acao" data-ir="'+U.esc(x.ir||'')+'">'+U.esc(x.acao)+'</button>':'')+
      '</div></div>';
    }).join('')+'</div>';
  h += '</div>';

  return h;
};

Views._composicao = function(a){
  var cores = {cmv:'#5a332e', embalagem:'#8a5a52', frete:'#b08a84', taxas:'#c9b3ae', imposto:'#b07a1e',
               marketing:'#1f9d6c', comissao:'#6aa98c', operacional:'#3f6b5c', falha:'#a8322c', outros:'#94897f'};
  var itens = ['cmv','embalagem','frete','taxas','imposto','marketing','comissao','operacional','falha','outros'].map(function(g){
    return {rot:GRUPOS[g].nome, valor:a.custo[g], cor:cores[g]};
  }).filter(function(i){ return i.valor>0.009; });
  if(a.lucro>0) itens.push({rot:'Lucro líquido', valor:a.lucro, cor:'#141414'});
  return itens;
};

Views._metaBarra = function(rot, real, meta, inteiro){
  var pct = meta>0 ? U.div(real,meta)*100 : 0;
  var cls = pct>=100?'':(pct>=70?'at':'cr');
  var fmt = inteiro ? function(v){ return U.num(v); } : function(v){ return U.brl(v,0); };
  return '<div style="margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;font-size:12.5px;gap:8px">'+
      '<span>'+U.esc(rot)+'</span>'+
      '<span class="num" style="font-weight:600">'+fmt(real)+(meta>0?' <span style="color:var(--texto-fraco);font-weight:400">/ '+fmt(meta)+'</span>':'')+'</span>'+
    '</div>'+
    (meta>0
      ? '<div class="barra-prog"><span class="'+cls+'" style="width:'+U.clamp(pct,0,100)+'%"></span></div><div class="leg"><span>'+U.pct(pct,0)+' da meta</span><span>'+(pct>=100?'meta batida':'faltam '+fmt(Math.max(0,meta-real)))+'</span></div>'
      : '<div class="leg"><span style="color:var(--texto-fraco)">Meta não definida</span><button class="diag-acao" data-ir="planejamento:cenario" style="font-size:12px">Definir meta</button></div>')+
  '</div>';
};

/* ============ LANÇAMENTOS ============ */
Views.filtro = {tipo:'', grupo:'', canal:'', status:'', texto:''};

Views.lancamentos = function(){
  var ym = UI.ym;
  var todos = Calc.lancamentosDoMes(ym).sort(function(a,b){
    return a.data===b.data ? (b.criadoEm>a.criadoEm?1:-1) : (a.data<b.data?1:-1);
  });
  var f = Views.filtro;
  var ls = todos.filter(function(l){
    if(f.tipo && l.tipo!==f.tipo) return false;
    if(f.grupo && l.grupo!==f.grupo) return false;
    if(f.canal && l.canal!==f.canal) return false;
    if(f.status && l.status!==f.status) return false;
    if(f.texto){
      var t=f.texto.toLowerCase();
      var alvo=(l.descricao+' '+l.categoria+' '+l.referencia+' '+l.obs+' '+l.canal).toLowerCase();
      if(alvo.indexOf(t)<0) return false;
    }
    return true;
  });
  var rec = ls.filter(function(l){return l.tipo==='receita';}).reduce(function(s,l){return s+U.n(l.valor)+U.n(l.freteCobrado);},0);
  var des = ls.filter(function(l){return l.tipo==='despesa';}).reduce(function(s,l){return s+U.n(l.valor);},0);

  var h = '';
  h += '<div class="cartao" style="margin-bottom:12px">'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'+
      '<div style="flex:1;min-width:170px"><label style="font-size:12px;color:var(--texto-medio)">Buscar</label>'+
        '<input type="text" id="fTexto" placeholder="descrição, pedido, observação" value="'+U.esc(f.texto)+'"></div>'+
      '<div style="min-width:120px"><label style="font-size:12px;color:var(--texto-medio)">Tipo</label>'+
        '<select id="fTipo"><option value="">Todos</option><option value="receita"'+(f.tipo==='receita'?' selected':'')+'>Receitas</option><option value="despesa"'+(f.tipo==='despesa'?' selected':'')+'>Despesas</option></select></div>'+
      '<div style="min-width:160px"><label style="font-size:12px;color:var(--texto-medio)">Grupo</label>'+
        '<select id="fGrupo"><option value="">Todos</option>'+Object.keys(GRUPOS).map(function(g){
          return '<option value="'+g+'"'+(f.grupo===g?' selected':'')+'>'+U.esc(GRUPOS[g].nome)+'</option>';
        }).join('')+'</select></div>'+
      '<div style="min-width:130px"><label style="font-size:12px;color:var(--texto-medio)">Situação</label>'+
        '<select id="fStatus"><option value="">Todas</option><option value="pago"'+(f.status==='pago'?' selected':'')+'>Pago/recebido</option><option value="pendente"'+(f.status==='pendente'?' selected':'')+'>Pendente</option></select></div>'+
      '<button class="btn sec" id="fLimpar">Limpar filtros</button>'+
      '<button class="btn sec" id="btnCSV">Exportar CSV</button>'+
      '<button class="btn" data-acao="novo">Novo lançamento</button>'+
    '</div>'+
    '<div style="display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linha);flex-wrap:wrap">'+
      '<div class="mini"><div class="mini-rot">Receitas no filtro</div><div class="mini-val pos">'+U.brl(rec)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Despesas no filtro</div><div class="mini-val neg">'+U.brl(des)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Saldo</div><div class="mini-val">'+U.brl(rec-des)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Lançamentos</div><div class="mini-val">'+U.num(ls.length)+'</div></div>'+
    '</div>'+
  '</div>';

  if(!ls.length){
    h += UI.vazio(todos.length?'Nenhum lançamento com esses filtros':'Nenhum lançamento em '+U.nomeMes(ym),
      todos.length?'Ajuste ou limpe os filtros para ver os lançamentos do mês.':'Registre a primeira receita ou despesa do período.',
      '<button class="btn" data-acao="novo">Novo lançamento</button>');
    return h;
  }

  h += '<div class="tabela-env"><table><thead><tr>'+
    '<th>Data</th><th>Descrição</th><th>Grupo</th><th>Categoria</th><th>Canal</th><th class="r">Pedidos</th><th class="r">Total pago</th><th class="c">Situação</th><th></th>'+
  '</tr></thead><tbody>';
  ls.forEach(function(l){
    var sinal = l.tipo==='receita' ? '+' : '−';
    var frete = U.n(l.freteCobrado);
    var total = U.n(l.valor) + frete;
    h += '<tr>'+
      '<td style="white-space:nowrap">'+U.dataBr(l.data)+'</td>'+
      '<td><div style="font-weight:500">'+U.esc(l.descricao||'(sem descrição)')+'</div>'+
        (l.referencia?'<div style="font-size:11.5px;color:var(--texto-fraco)">#'+U.esc(l.referencia)+'</div>':'')+'</td>'+
      '<td><span class="etq '+(l.grupo==='falha'?'fal':(l.tipo==='receita'?'rec':'des'))+'">'+U.esc(GRUPOS[l.grupo].nome)+'</span></td>'+
      '<td style="color:var(--texto-medio)">'+U.esc(l.categoria||'—')+'</td>'+
      '<td style="color:var(--texto-medio)">'+U.esc(l.canal||'—')+'</td>'+
      '<td class="r">'+(l.pedidos?U.num(l.pedidos):'—')+'</td>'+
      '<td class="r" style="color:'+(l.tipo==='receita'?'var(--verde)':'var(--texto)')+'">'+
        '<div style="font-weight:600">'+sinal+' '+U.brl(total)+'</div>'+
        (frete>0 ? '<div style="font-size:11px;color:var(--texto-fraco);font-weight:400">produto '+U.brl(l.valor)+' + frete '+U.brl(frete)+'</div>' : '')+
      '</td>'+
      '<td class="c"><span class="etq '+(l.status==='pendente'?'pen':'pag')+'">'+(l.status==='pendente'?'Pendente':'Pago')+'</span></td>'+
      '<td class="c" style="white-space:nowrap">'+
        '<button class="btn-icone" data-editar="'+l.id+'" title="Editar" aria-label="Editar lançamento"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4v16h16v-7M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>'+
        '<button class="btn-icone" data-excluir="'+l.id+'" title="Excluir" aria-label="Excluir lançamento"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>'+
      '</td>'+
    '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
};

/* ============ PROJEÇÃO DIÁRIA ============ */
Views.projecao = function(){
  var ym = UI.ym;
  var a = Calc.apurar(ym), p = Calc.projetar(a), serie = Calc.serieDiaria(ym);
  var h='';

  if(!a.temDados){
    return UI.vazio('Sem base para projetar', 'A projeção usa o ritmo diário do mês. Registre ao menos uma venda para o sistema começar a projetar.',
      '<button class="btn" data-acao="novo">Registrar lançamento</button>');
  }

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Dias decorridos', val:U.num(p.decorridos)+' de '+U.num(p.dias), pequeno:true, nota:p.restantes+' dia(s) restantes'})+
    UI.kpi({rot:'Ritmo de faturamento', val:U.brl(p.ritmoFat,0), pequeno:true, nota:U.num(p.ritmoPedidos,1)+' pedidos por dia',
      ajuda:'Média diária considerando os dias já decorridos no mês, inclusive os dias sem venda.'})+
    UI.kpi({rot:'Faturamento projetado', val:U.brl(p.projFat,0), destaque:true,
      nota:p.metaFat>0?(p.atingeFat?'atinge a meta':'abaixo da meta'):'sem meta', pt:p.metaFat>0?(p.atingeFat?'ok':'at'):'nu'})+
    UI.kpi({rot:'Lucro projetado', val:U.brl(p.projLucro,0), destaque:true, classe:p.projLucro<0?'neg':'',
      nota:'margem projetada '+U.pct(p.projMargem), pt:UI.nivelMargem(p.projMargem)})+
  '</div>';

  h += '<div class="cartao" style="margin-bottom:12px"><div class="cartao-tit">O que falta</div>'+
    '<div class="cartao-sub">Quanto ainda é preciso entregar até o fim de '+U.nomeMes(ym)+'</div>'+
    '<div class="grade g4">'+
      UI.kpi({rot:'Falta faturar', val:U.brl(p.faltaFat,0), pequeno:true, nota:p.metaFat>0?('meta '+U.brl(p.metaFat,0)):'defina a meta do mês'})+
      UI.kpi({rot:'Falta lucrar', val:U.brl(p.faltaLucro,0), pequeno:true, nota:p.metaLucro>0?('meta '+U.brl(p.metaLucro,0)):'defina a meta do mês'})+
      UI.kpi({rot:'Faturamento necessário por dia', val:U.brl(p.precisaFatDia,0), pequeno:true,
        nota: p.ritmoFat>0 ? (p.precisaFatDia<=p.ritmoFat ? 'abaixo do ritmo atual' : U.pct(U.div(p.precisaFatDia,p.ritmoFat)*100-100,0)+' acima do ritmo') : '—',
        pt: p.precisaFatDia<=p.ritmoFat?'ok':'at'})+
      UI.kpi({rot:'Lucro necessário por dia', val:U.brl(p.precisaLucroDia,0), pequeno:true, nota:p.restantes+' dia(s) para conseguir'})+
    '</div></div>';

  var labels = serie.map(function(d){ return String(d.dia); });
  h += '<div class="grade g2" style="margin-bottom:12px">'+
    '<div class="cartao"><div class="cartao-tit">Faturamento por dia</div><div class="cartao-sub">Somente dias já decorridos</div>'+
      Chart.colunas(serie.slice(0,Math.max(1,p.decorridos)).map(function(d){ return {rot:String(d.dia), valor:d.fat, cor:d.fat>0?'#5a332e':'#e7e1db'}; }))+'</div>'+
    '<div class="cartao"><div class="cartao-tit">Lucro por dia</div><div class="cartao-sub">Inclui custos automáticos e lançamentos do dia</div>'+
      Chart.colunas(serie.slice(0,Math.max(1,p.decorridos)).map(function(d){ return {rot:String(d.dia), valor:d.lucro, cor:d.lucro>=0?'#1f9d6c':'#a8322c'}; }))+'</div>'+
  '</div>';

  h += '<div class="tabela-env"><table><thead><tr>'+
    '<th>Dia</th><th class="r">Faturamento</th><th class="r">Pedidos</th><th class="r">Ticket</th><th class="r">Marketing</th><th class="r">CPA</th><th class="r">Lucro</th><th class="r">Fat. acumulado</th><th class="r">Lucro acumulado</th>'+
  '</tr></thead><tbody>';
  var hojeIso = U.hoje();
  serie.forEach(function(d){
    var futuro = d.data > hojeIso;
    h += '<tr'+(d.data===hojeIso?' class="hoje"':'')+' style="'+(futuro?'opacity:.42':'')+'">'+
      '<td style="white-space:nowrap">'+d.dia+' <span style="color:var(--texto-fraco);font-size:11.5px">'+U.diaSemana(d.data)+'</span></td>'+
      '<td class="r">'+(d.fat?U.brl(d.fat,0):'—')+'</td>'+
      '<td class="r">'+(d.pedidos?U.num(d.pedidos):'—')+'</td>'+
      '<td class="r">'+(d.pedidos?U.brl(d.ticket,0):'—')+'</td>'+
      '<td class="r">'+(d.mkt?U.brl(d.mkt,0):'—')+'</td>'+
      '<td class="r">'+(d.pedidos&&d.mkt?U.brl(d.cpa,0):'—')+'</td>'+
      '<td class="r" style="font-weight:600;color:'+(d.lucro<0?'var(--rubro)':(d.lucro>0?'var(--verde)':'var(--texto-fraco)'))+'">'+(d.fat||d.mkt||d.outrasDesp||d.falha?U.brl(d.lucro,0):'—')+'</td>'+
      '<td class="r" style="color:var(--texto-medio)">'+U.brl(d.accFat,0)+'</td>'+
      '<td class="r" style="color:var(--texto-medio)">'+U.brl(d.accLucro,0)+'</td>'+
    '</tr>';
  });
  h += '</tbody><tfoot><tr class="total">'+
    '<td>Total</td><td class="r">'+U.brl(a.faturamento,0)+'</td><td class="r">'+U.num(a.pedidos)+'</td>'+
    '<td class="r">'+U.brl(a.ticket,0)+'</td><td class="r">'+U.brl(a.custo.marketing,0)+'</td>'+
    '<td class="r">'+U.brl(a.cpa,0)+'</td><td class="r">'+U.brl(a.lucro,0)+'</td>'+
    '<td class="r">'+U.brl(a.faturamento,0)+'</td><td class="r">'+U.brl(a.lucro,0)+'</td>'+
  '</tr></tfoot></table></div>';
  return h;
};

    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
