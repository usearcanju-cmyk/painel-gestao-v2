<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Gestor · Use Arcanju</title>
<meta name="theme-color" content="#f3eee9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ARCANJU OS — sistema de gestão
   Tokens de design derivados da identidade Use Arcanju
   ============================================================ */
:root{
  --vinho:#5a332e;          /* marrom/vinho oficial da marca */
  --vinho-escuro:#2a1714;   /* superfície do menu lateral */
  --vinho-profundo:#1d0f0d;
  --vinho-claro:#8a5a52;
  --tinta:#141414;          /* preto oficial */
  --verde:#1f9d6c;          /* verde oficial — saudável */
  --verde-fundo:#e8f5ef;
  --ambar:#b07a1e;          /* atenção */
  --ambar-fundo:#fbf2e0;
  --rubro:#a8322c;          /* crítico */
  --rubro-fundo:#fbeceb;
  --papel:#fbf9f7;          /* canvas */
  --carta:#ffffff;          /* cartões */
  --rail-fundo:#f2ece6;     /* menu lateral em papel */
  --linha:#e9e3dc;
  --linha-forte:#d8cfc6;
  --texto:#1f1a18;
  --texto-medio:#6b615b;
  --texto-fraco:#94897f;
  --sombra:0 1px 2px rgba(42,23,20,.05);
  --sombra-alta:0 24px 60px -20px rgba(42,23,20,.35);
  --r-sm:6px; --r:10px; --r-lg:16px;
  --rail:248px;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--papel);
  color:var(--texto);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 1,"cv05" 1;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--vinho)}
:focus-visible{outline:2px solid var(--vinho);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------- Estrutura ---------------- */
.app{display:flex;min-height:100vh}

/* ---------------- Menu lateral ---------------- */
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--rail-fundo);
  color:var(--vinho);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  scrollbar-width:thin;border-right:1px solid #e3dbd3;
}
.rail::-webkit-scrollbar{width:6px}
.rail::-webkit-scrollbar-thumb{background:#d8cfc6;border-radius:3px}
.marca{padding:24px 20px 20px;border-bottom:1px solid #e3dbd3}
.marca-logo{width:152px;height:auto;display:block;margin-bottom:14px}
.marca-nome{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--vinho);letter-spacing:.005em;line-height:1.15}
.marca-sub{font-size:11px;color:#9b877f;margin-top:2px}
.nav{padding:12px 10px;flex:1}
.nav-grupo{font-size:10.5px;color:#a5908a;padding:16px 10px 6px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:8px 10px;border-radius:var(--r-sm);
  color:#5d4841;font-size:13.5px;text-align:left;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:#e8dfd7;color:var(--vinho)}
.nav-item.ativo{background:var(--vinho);color:#fff;font-weight:500;box-shadow:0 1px 3px rgba(90,51,46,.22)}
.nav-ico{width:16px;height:16px;flex:0 0 16px;opacity:.75}
.nav-item.ativo .nav-ico{opacity:1}
.nav-tag{margin-left:auto;font-size:9.5px;background:#e3dbd3;color:#9b877f;padding:2px 6px;border-radius:99px}
.rail-rodape{padding:16px 18px;border-top:1px solid #e3dbd3;font-size:11.5px;color:#8d7a73;font-family:var(--serif);font-style:italic;line-height:1.45}

/* ---------------- Área principal ---------------- */
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.barra{
  position:sticky;top:0;z-index:40;
  background:rgba(251,249,247,.94);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linha);
  padding:12px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.barra-tit{font-family:var(--serif);font-size:19px;font-weight:600}
.barra-dir{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.periodo{display:flex;align-items:center;gap:2px;background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:3px}
.periodo button{padding:5px 9px;border-radius:var(--r-sm);color:var(--texto-medio);line-height:1}
.periodo button:hover{background:var(--papel);color:var(--texto)}
.periodo-rot{font-size:13px;font-weight:600;padding:0 10px;min-width:118px;text-align:center;text-transform:capitalize}
.conteudo{padding:24px 28px 80px;max-width:1320px;width:100%}
.abas{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--linha);margin:-6px -28px 22px;padding:0 28px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{padding:9px 12px;font-size:13px;color:var(--texto-medio);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.aba:hover{color:var(--texto)}
.aba.ativa{color:var(--vinho);border-bottom-color:var(--vinho);font-weight:600}

/* ---------------- Veredito (herói) ---------------- */
.veredito{
  background:var(--carta);border:1px solid var(--linha);border-left:3px solid var(--verde);
  border-radius:var(--r-lg);padding:28px 30px;margin-bottom:20px;
  box-shadow:0 1px 2px rgba(90,51,46,.045);
}
.veredito.atencao{border-left-color:var(--ambar)}
.veredito.critico{border-left-color:var(--rubro)}
.veredito.neutro{border-left-color:var(--linha-forte)}
.veredito-eixo{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.veredito-frase{font-family:var(--serif);font-size:clamp(22px,3.2vw,32px);line-height:1.22;font-weight:500;letter-spacing:-.015em;max-width:26ch}
.veredito-apoio{margin-top:12px;font-size:13.5px;color:var(--texto-medio);max-width:64ch;line-height:1.6}
.veredito-linha{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--linha)}
.mini{min-width:108px}
.mini-rot{font-size:11.5px;color:var(--texto-fraco);margin-bottom:2px}
.mini-val{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------------- Cartões / KPI ---------------- */
.grade{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:18px}
.cartao-tit{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:2px}
.cartao-sub{font-size:12.5px;color:var(--texto-fraco);margin-bottom:14px}
.kpi{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:15px 16px;position:relative}
.kpi-rot{font-size:11.5px;color:var(--texto-medio);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.kpi-val{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-val.sm{font-size:20px}
.kpi-nota{font-size:11.5px;color:var(--texto-fraco);margin-top:5px;display:flex;align-items:center;gap:5px}
.kpi.destaque{border-color:var(--linha-forte);box-shadow:0 1px 2px rgba(90,51,46,.045)}
.pt{width:7px;height:7px;border-radius:50%;flex:0 0 7px;display:inline-block}
.pt.ok{background:var(--verde)} .pt.at{background:var(--ambar)} .pt.cr{background:var(--rubro)} .pt.nu{background:var(--linha-forte)}
.pos{color:var(--verde)} .neg{color:var(--rubro)} .warn{color:var(--ambar)}
.num{font-variant-numeric:tabular-nums}

/* ---------------- Diagnósticos ---------------- */
.diag{display:flex;gap:11px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--linha);background:var(--carta);margin-bottom:8px;align-items:flex-start}
.diag.ok{border-left:3px solid var(--verde)}
.diag.at{border-left:3px solid var(--ambar)}
.diag.cr{border-left:3px solid var(--rubro)}
.diag.nu{border-left:3px solid var(--linha-forte)}
.diag-corpo{flex:1;min-width:0}
.diag-tit{font-weight:600;font-size:13.5px;margin-bottom:2px}
.diag-txt{font-size:12.5px;color:var(--texto-medio);line-height:1.55}
.diag-acao{font-size:12.5px;color:var(--vinho);margin-top:5px;font-weight:500}

/* ---------------- Barras / progresso ---------------- */
.barra-prog{height:7px;background:#efe9e4;border-radius:99px;overflow:hidden;margin-top:8px}
.barra-prog span{display:block;height:100%;border-radius:99px;background:var(--verde);transition:width .35s ease}
.barra-prog span.at{background:var(--ambar)} .barra-prog span.cr{background:var(--rubro)} .barra-prog span.vi{background:var(--vinho)}
.leg{display:flex;justify-content:space-between;font-size:11.5px;color:var(--texto-medio);margin-top:6px}

/* ---------------- Tabelas ---------------- */
.tabela-env{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--r);background:var(--carta)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--texto-medio);
  background:#fbf9f8;border-bottom:1px solid var(--linha);white-space:nowrap;position:sticky;top:0;
}
td{padding:9px 12px;border-bottom:1px solid #f1ece8;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fdfcfb}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.total td{font-weight:700;background:#fbf9f8;border-top:1px solid var(--linha-forte)}
tr.hoje td{background:#fdf7f0}
.etq{display:inline-block;padding:2px 7px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.etq.rec{background:var(--verde-fundo);color:#136c4a}
.etq.des{background:#f4eeec;color:var(--vinho)}
.etq.fal{background:var(--rubro-fundo);color:var(--rubro)}
.etq.pen{background:var(--ambar-fundo);color:#8a5e13}
.etq.pag{background:#eef0ef;color:var(--texto-medio)}

/* ---------------- Formulários ---------------- */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;color:var(--texto-medio);margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--linha-forte);border-radius:var(--r-sm);
  background:#fff;font-size:13.5px;transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vinho);box-shadow:0 0 0 3px rgba(90,51,46,.10)}
input:disabled{background:#f6f3f1;color:var(--texto-fraco)}
textarea{resize:vertical;min-height:62px}
.linha-campos{display:grid;gap:12px}
.lc2{grid-template-columns:1fr 1fr}
.lc3{grid-template-columns:1fr 1fr 1fr}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;
  background:var(--vinho);color:#fff;border:1px solid var(--vinho);transition:background .12s,transform .06s;
}
.btn:hover{background:#6b3e37}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--texto);border-color:var(--linha-forte)}
.btn.sec:hover{background:var(--papel)}
.btn.perigo{background:#fff;color:var(--rubro);border-color:#e8c7c4}
.btn.perigo:hover{background:var(--rubro-fundo)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.bloco{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-icone{padding:4px 6px;border-radius:var(--r-sm);color:var(--texto-fraco)}
.btn-icone:hover{background:var(--papel);color:var(--vinho)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--vinho);cursor:pointer}
.segm{display:inline-flex;background:#f2ede9;border-radius:var(--r-sm);padding:2px;gap:2px}
.segm button{padding:5px 11px;border-radius:5px;font-size:12.5px;color:var(--texto-medio);font-weight:500}
.segm button.ativo{background:#fff;color:var(--vinho);box-shadow:var(--sombra);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:#e7e1db;border-radius:99px;padding:0;border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--vinho);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--vinho);cursor:pointer;border:2px solid #fff}

/* ---------------- Ajuda ---------------- */
.ajuda{
  width:14px;height:14px;border-radius:50%;border:1px solid var(--linha-forte);
  color:var(--texto-fraco);font-size:9.5px;line-height:12px;text-align:center;flex:0 0 14px;
  position:relative;font-weight:700;
}
.ajuda:hover{border-color:var(--vinho);color:var(--vinho)}
.ajuda:hover::after{
  content:attr(data-ajuda);position:absolute;bottom:135%;left:50%;transform:translateX(-50%);
  background:var(--tinta);color:#fff;padding:8px 10px;border-radius:var(--r-sm);
  font-size:11.5px;font-weight:400;line-height:1.45;width:230px;z-index:60;text-align:left;
  box-shadow:0 8px 24px rgba(0,0,0,.2);pointer-events:none;
}

/* ---------------- Modal ---------------- */
.fundo{position:fixed;inset:0;background:rgba(29,15,13,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.modal{background:var(--carta);border-radius:var(--r-lg);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;box-shadow:var(--sombra-alta)}
.modal.larga{max-width:820px}
.modal-topo{padding:18px 22px;border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--carta);z-index:2;border-radius:var(--r-lg) var(--r-lg) 0 0}
.modal-tit{font-family:var(--serif);font-size:18px;font-weight:600}
.modal-corpo{padding:20px 22px}
.modal-rodape{padding:14px 22px;border-top:1px solid var(--linha);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--carta)}

/* ---------------- Onboarding ---------------- */
.ob{max-width:560px;text-align:left}
.ob-passo{padding:34px 34px 26px}
.ob-conta{font-size:11.5px;color:var(--texto-fraco);margin-bottom:14px}
.ob-tit{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.2;margin-bottom:10px;letter-spacing:-.02em}
.ob-txt{font-size:14px;color:var(--texto-medio);line-height:1.65;max-width:52ch}
.ob-pontos{display:flex;gap:6px;margin-right:auto;align-items:center}
.ob-ponto{width:7px;height:7px;border-radius:50%;background:var(--linha-forte)}
.ob-ponto.on{background:var(--vinho);width:20px;border-radius:99px}

/* ---------------- Gráficos ---------------- */
.grafico{width:100%;overflow:visible}
.gr-legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--texto-medio);margin-top:10px}
.gr-legenda i{width:11px;height:3px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

/* ---------------- Vazio ---------------- */
.vazio{text-align:center;padding:46px 22px;color:var(--texto-medio)}
.vazio-tit{font-family:var(--serif);font-size:19px;color:var(--texto);margin-bottom:7px;font-weight:600}
.vazio-txt{font-size:13.5px;max-width:42ch;margin:0 auto 18px;line-height:1.6}

/* ---------------- Aviso / toast ---------------- */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120%);
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;
  z-index:200;box-shadow:0 12px 32px rgba(0,0,0,.28);transition:transform .25s cubic-bezier(.2,.8,.3,1);max-width:90vw;
}
.toast.on{transform:translateX(-50%) translateY(0)}
.aviso{background:var(--ambar-fundo);border:1px solid #ecd9ae;color:#7a5411;padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:12px;line-height:1.55}
.info{background:#f4f1ef;border:1px solid var(--linha);color:var(--texto-medio);padding:10px 13px;border-radius:var(--r-sm);font-size:12.5px;margin-bottom:12px;line-height:1.55}

/* ---------------- Em breve ---------------- */
.breve{max-width:560px;padding:44px 0}
.breve-tit{font-family:var(--serif);font-size:30px;font-weight:600;margin-bottom:10px;letter-spacing:-.02em}
.breve-txt{color:var(--texto-medio);font-size:14px;line-height:1.7;margin-bottom:22px}
.breve-lista{border-top:1px solid var(--linha)}
.breve-item{padding:11px 0;border-bottom:1px solid var(--linha);font-size:13.5px;display:flex;gap:12px;align-items:baseline}
.breve-item b{font-weight:600;min-width:150px}
.breve-item span{color:var(--texto-fraco);font-size:12.5px}

/* ---------------- Mobile ---------------- */
.menu-btn{display:none}
.rail-fundo{display:none}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .rail{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;z-index:120;height:100dvh}
  .rail.aberto{transform:translateX(0)}
  .rail-fundo.on{display:block;position:fixed;inset:0;background:rgba(29,15,13,.5);z-index:110}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--linha-forte);border-radius:var(--r-sm);background:var(--carta)}
  .rail{box-shadow:0 0 60px rgba(42,23,20,.28)}
  .barra{padding:10px 14px}
  .conteudo{padding:16px 14px 90px}
  .abas{margin:-2px -14px 16px;padding:0 14px}
  .g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .lc2,.lc3{grid-template-columns:1fr}
  .veredito{padding:20px;border-radius:var(--r)}
  .barra-tit{font-size:16px}
  .periodo-rot{min-width:96px;font-size:12.5px}
  .kpi-val{font-size:21px}
  .modal{max-height:96vh}
  .ob-passo{padding:26px 22px 20px}
  .ob-tit{font-size:23px}
  .ajuda:hover::after{width:180px;left:auto;right:-6px;transform:none}
}
@media (max-width:520px){
  .g3,.g4,.g5{grid-template-columns:1fr 1fr}
  .veredito-linha{gap:16px}
  .mini{min-width:calc(50% - 8px)}
}
/* ---------------- Planilha do gestor ---------------- */
.plan{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--carta)}
.plan th{background:#f6f2ef;color:var(--vinho);font-family:var(--serif);font-size:14px;font-weight:600;
  padding:11px 14px;text-align:left;border-bottom:1px solid var(--linha-forte)}
.plan td{padding:10px 14px;border-bottom:1px solid #f1ece8}
.plan tr:last-child td{border-bottom:none}
.plan .rot{font-weight:500;width:42%}
.plan .pc{text-align:right;color:var(--texto-medio);font-variant-numeric:tabular-nums;width:17%}
.plan .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;width:24%}
.plan .nt{font-size:11.5px;color:var(--texto-fraco);font-weight:400;margin-top:2px}
.plan tr.entrada td{background:#eef7f2}
.plan tr.entrada .vl{color:#136c4a}
.plan tr.saida .vl{color:var(--vinho)}
.plan tr.resultado td{background:#fbf8f6;border-top:1px solid var(--linha-forte);font-weight:700}
.plan tr.resultado td{padding-top:13px;padding-bottom:13px}
.plan input{border:1px solid #bcd9cb;background:#fff;text-align:right;font-weight:600;
  padding:6px 9px;border-radius:var(--r-sm);width:100%;max-width:150px;margin-left:auto;display:block}
.plan input:focus{border-color:var(--verde);box-shadow:0 0 0 3px rgba(31,157,108,.12)}
.plan .editavel{position:relative}
.legenda-cores{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--texto-medio);margin-top:12px}
.legenda-cores i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------------- Tela de acesso ---------------- */
.trava{position:fixed;inset:0;z-index:500;background:var(--rail-fundo);display:flex;align-items:center;justify-content:center;padding:24px}
.trava-caixa{width:100%;max-width:372px;text-align:center}
.trava-logo{width:190px;max-width:70vw;height:auto;margin:0 auto 30px;display:block}
.trava-frase{font-family:var(--serif);font-size:16px;font-style:italic;color:#8d7a73;line-height:1.5;margin-bottom:26px;min-height:48px;max-width:34ch;margin-left:auto;margin-right:auto}
.trava-campo{position:relative}
.trava-campo input{text-align:center;padding:12px 14px;font-size:15px;border-radius:var(--r);border-color:#dbd1c8;background:#fffdfc}
.trava-btn{margin-top:10px;width:100%;padding:11px}
.trava-erro{color:var(--rubro);font-size:12.5px;margin-top:12px;min-height:18px}
.trava-rodape{margin-top:34px;font-size:11px;color:#a5908a}
.saindo{opacity:0;transition:opacity .35s ease}

/* ---------------- Aviso de humor ---------------- */
.piada{font-family:var(--serif);font-style:italic;color:var(--texto-medio);font-size:13.5px;line-height:1.55;
  border-left:2px solid var(--linha-forte);padding-left:14px;margin:0 0 20px}

@media print{.rail,.barra-dir,.menu-btn{display:none}.conteudo{padding:0}}
/* ---------------- Logística e Projeto Lazarus ---------------- */
.lg-num{width:74px;padding:5px 7px;text-align:right}
.lg-cel{display:inline-flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:8px}
.lg-cel.cr{background:var(--rubro-fundo)}
.lg-cel.at{background:var(--ambar-fundo)}
.lg-cel.ok{background:var(--verde-fundo)}
.lg-dias{font-size:10.5px;color:var(--texto-fraco);white-space:nowrap;line-height:1.3}
.lg-aviso{font-size:11.5px;margin-top:4px;font-weight:600}
.lg-aviso.cr{color:var(--rubro)}
.lg-aviso.at{color:#8a5e13}
button.etq{cursor:pointer;border:none}
.conteudo.cheio{padding:0;max-width:none}
.lz-topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 28px;border-bottom:1px solid var(--linha);font-size:12.5px;color:var(--texto-medio);background:var(--carta)}
.lz-topo span{flex:1;min-width:200px}
.lz-quadro{display:block;width:100%;height:calc(100vh - 106px);border:0;background:#E4E9EC}

#printArea{display:none}
@page{size:A4;margin:8mm}
@media print{
  body.imprimindo > *:not(#printArea){display:none!important}
  body.imprimindo{background:#fff}
  body.imprimindo #printArea{display:block}
  .os-folha{height:277mm;display:grid;grid-template-rows:1fr 1fr;gap:4mm;page-break-after:always;break-after:page}
  .os-print{border:1.5px dashed #444;border-radius:3mm;padding:5mm 6mm;font-family:Arial,sans-serif;font-size:10.5pt;color:#000;display:flex;flex-direction:column;gap:2.5mm;overflow:hidden}
  .os-top{display:flex;justify-content:space-between;gap:4mm;border-bottom:1.5px solid #000;padding-bottom:2mm}
  .os-num{font-size:26pt;font-weight:800;line-height:1}
  .os-prazo{font-size:17pt;font-weight:800}
  .os-lab{font-size:8.5pt;color:#333}
  .os-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:4mm}
  .os-dest{border:1px solid #000;border-radius:2mm;padding:2.5mm 3mm;line-height:1.35}
  .os-dest b{font-size:11.5pt}
  .os-tab{width:100%;border-collapse:collapse}
  .os-tab th,.os-tab td{border-bottom:1px solid #999;padding:1.2mm 1.5mm;text-align:left;font-size:10pt;vertical-align:top}
  .os-tab th{font-size:8pt}
  .os-foto{width:15mm;height:15mm;object-fit:contain;border:1px solid #ccc;border-radius:1mm;background:#f7f3ef;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .os-etapas{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5mm 4mm;font-size:10pt;border-top:1px solid #000;padding-top:2mm}
}

</style>
</head>

var U = {
  brl: function(v, casas){
    if(v===null||v===undefined||isNaN(v)) v=0;
    var c = (casas===undefined)?2:casas;
    return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c, maximumFractionDigits:c});
  },
  brlCurto: function(v){
    if(v===null||v===undefined||isNaN(v)) v=0;
    var a=Math.abs(v), s=v<0?'-':'';
    if(a>=1000000) return s+'R$ '+(a/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'M';
    if(a>=1000) return s+'R$ '+(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+'k';
    return U.brl(v,0);
  },
  pct: function(v, casas){
    if(v===null||v===undefined||!isFinite(v)) return '—';
    var c=(casas===undefined)?1:casas;
    return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c})+'%';
  },
  num: function(v,casas){
    if(v===null||v===undefined||isNaN(v)) v=0;
    var c=(casas===undefined)?0:casas;
    return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
  },
  n: function(v, padrao){
    if(v===''||v===null||v===undefined) return padrao===undefined?0:padrao;
    var x = typeof v==='string' ? parseFloat(v.replace(/\./g,'').replace(',','.')) : Number(v);
    return isNaN(x) ? (padrao===undefined?0:padrao) : x;
  },
  esc: function(s){
    if(s===null||s===undefined) return '';

  },
  nomeMesCurto: function(ym){
    var p=ym.split('-'); var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1);

  },
  dataBr: function(iso){
    if(!iso) return '—';
    var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
  },
  somaMes: function(ym, delta){
    var p=ym.split('-'); var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1+delta, 1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  },
  diaSemana: function(iso){
    var p=iso.split('-'); var d=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));
    return ['dom','seg','ter','qua','qui','sex','sáb'][d.getDay()];

  clamp: function(v,a,b){ return Math.max(a,Math.min(b,v)); },
  div: function(a,b){ return (!b||!isFinite(b)) ? 0 : a/b; }
};

   Hoje: localStorage. Amanhã: trocar só estes 4 métodos por API.

var Store = {
  dados: null,
  ouvintes: [],
  disponivel: (function(){
    try{ var k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })(),

  carregar: function(){
    if(!Store.disponivel){ Store.dados = estadoPadrao(); return Store.dados; }
    try{
      var bruto = localStorage.getItem(CHAVE);
      if(!bruto){ Store.dados = estadoPadrao(); Store.salvar(); return Store.dados; }
      var d = JSON.parse(bruto);
      Store.dados = Store.migrar(d);
      return Store.dados;
    }catch(e){
      console.error('Falha ao ler dados salvos:', e);
      Store.dados = estadoPadrao();
      return Store.dados;
    }
  },

  migrar: function(d){
    var base = estadoPadrao();
    if(!d || typeof d!=='object') return base;
    /* preenche campos novos sem apagar o que já existe */
    d.esquema = ESQUEMA;
    d.config = Object.assign({}, base.config, d.config||{});
    d.config.modo = Object.assign({}, base.config.modo, (d.config&&d.config.modo)||{});
    if(!Array.isArray(d.config.produtos) || !d.config.produtos.length) d.config.produtos = base.config.produtos;
    if(!Array.isArray(d.config.insumos)) d.config.insumos = base.config.insumos;
    if(!Array.isArray(d.config.embalagemFaixas) || !d.config.embalagemFaixas.length)
      d.config.embalagemFaixas = base.config.embalagemFaixas;
    if(!Array.isArray(d.vigencias)) d.vigencias = [];
    if(!Array.isArray(d.config.canais) || !d.config.canais.length) d.config.canais = base.config.canais;
    if(!Array.isArray(d.lancamentos)) d.lancamentos = [];
    if(!Array.isArray(d.ofertas)) d.ofertas = [];
    d.ofertas = d.ofertas.map(function(o){
      if(o.ativa===undefined) o.ativa = true;
      if(!Array.isArray(o.itens)) o.itens = [];
      if(o.obs===undefined) o.obs = '';
      return o;
    });
    if(!Array.isArray(d.reservaMovs)) d.reservaMovs = [];
    if(!Array.isArray(d.contas)) d.contas = [];
    if(!Array.isArray(d.campanhas)) d.campanhas = [];
    if(!d.fechamento || typeof d.fechamento!=='object') d.fechamento = {};
    if(!d.ajusteFrete || typeof d.ajusteFrete!=='object') d.ajusteFrete = {};
    d.reservaPlano = Object.assign({}, base.reservaPlano, d.reservaPlano||{});
    d.integracoes = Object.assign({}, base.integracoes, d.integracoes||{});
    d.integracoes.loja = Object.assign({}, base.integracoes.loja, d.integracoes.loja||{});
    d.integracoes.ads = Object.assign({}, base.integracoes.ads, d.integracoes.ads||{});
    d.integracoes.frete = Object.assign({}, base.integracoes.frete, d.integracoes.frete||{});
    if(!d.metas || typeof d.metas!=='object') d.metas = {};
    d.onboarding = !!d.onboarding;
    /* normaliza lançamentos */
    d.lancamentos = d.lancamentos.map(function(l){
      return {
        id: l.id || U.id(),
        data: l.data || U.hoje(),
        tipo: l.tipo==='receita'?'receita':'despesa',
        grupo: GRUPOS[l.grupo] ? l.grupo : (l.tipo==='receita'?'vendas':'outros'),
        categoria: l.categoria || '',
        descricao: l.descricao || '',
        canal: l.canal || '',
        referencia: l.referencia || '',
        valor: U.n(l.valor),
        freteCobrado: U.n(l.freteCobrado),
        valorBruto: U.n(l.valorBruto),
        desconto: U.n(l.desconto),
        uf: l.uf || '',
        pedidos: U.n(l.pedidos),
        camisetas: U.n(l.camisetas),
        pagamento: l.pagamento || '',
        status: l.status==='pendente'?'pendente':'pago',
        obs: l.obs || '',
        origem: l.origem || 'manual',
        externoId: l.externoId || '',
        criadoEm: l.criadoEm || new Date().toISOString()
      };
    });
    return d;
  },

  /* ---- Vigências de custo ----

     Cada mudança vale a partir de um mês; meses anteriores mantêm o custo da época. ---- */
  CAMPOS_VIGENCIA: ['produtos','insumos','embalagemFaixas','freteMedio','gateway','gatewayFixo',

      .sort(function(a,b){ return a.desde<b.desde?-1:1; });

  salvarVigencia: function(desde, premissas, obs){
    var i = Store.dados.vigencias.findIndex(function(v){ return v.desde===desde; });
    var reg = {desde:desde, premissas:premissas, obs:obs||'', em:new Date().toISOString()};
    if(i>=0) Store.dados.vigencias[i] = reg; else Store.dados.vigencias.push(reg);
    Store.dados.vigencias.sort(function(a,b){ return a.desde<b.desde?-1:1; });
    /* a vigência mais recente também vira a configuração corrente */
    var ultima = Store.dados.vigencias[Store.dados.vigencias.length-1];
    Object.keys(ultima.premissas).forEach(function(k){
      Store.dados.config[k] = JSON.parse(JSON.stringify(ultima.premissas[k]));

  /* ---- Backup ---- */
  exportarJSON: function(){

  exportarCSV: function(lista){

    var cab = ['data','tipo','grupo','categoria','descricao','canal','uf','referencia','valor','freteCobrado','pedidos','camisetas','pagamento','status','obs','origem','externoId'];
    var linhas = [cab.join(';')];
    ls.forEach(function(l){
      linhas.push(cab.map(function(c){
        var v = l[c]===undefined?'':l[c];
        if(c==='valor') v = String(v).replace('.',',');
        return '"'+String(v).replace(/"/g,'""')+'"';
      }).join(';'));
    });
    Store.baixar('arcanju-lancamentos-'+U.hoje()+'.csv', '\ufeff'+linhas.join('\n'), 'text/csv;charset=utf-8');
  },
  baixar: function(nome, conteudo, tipo){
    try{
      var blob = new Blob([conteudo], {type:tipo});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = nome;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
      UI.toast('Arquivo gerado: '+nome);
    }catch(e){ UI.toast('Não foi possível gerar o arquivo neste navegador.'); }
  },
  importarJSON: function(texto){
    var d = JSON.parse(texto);
    if(!d || !d.lancamentos || !d.config) throw new Error('Arquivo fora do formato do Arcanju OS.');
    Store.dados = Store.migrar(d);
    Store.commit('Backup restaurado');
  },
  importarCSV: function(texto){
    var linhas = texto.replace(/^\ufeff/,'').split(/\r?\n/).filter(function(l){ return l.trim(); });
    if(linhas.length<2) throw new Error('CSV vazio.');
    var sep = (linhas[0].split(';').length > linhas[0].split(',').length) ? ';' : ',';
    var cab = quebrar(linhas[0], sep).map(function(c){ return c.trim().toLowerCase(); });
    var novos = 0;
    for(var i=1;i<linhas.length;i++){
      var c = quebrar(linhas[i], sep);
      var o = {}; cab.forEach(function(k,j){ o[k]=(c[j]||'').trim(); });
      if(!o.data || !o.valor) continue;
      var tipo = (o.tipo==='receita')?'receita':'despesa';
      var grupo = GRUPOS[o.grupo] ? o.grupo : (tipo==='receita'?'vendas':'outros');
      Store.dados.lancamentos.push({
        id:U.id(), data:o.data, tipo:tipo, grupo:grupo,
        categoria:o.categoria||'', descricao:o.descricao||'', canal:o.canal||'',
        uf:(o.uf||'').toUpperCase(), freteCobrado:U.n(o.fretecobrado||o.freteCobrado),
        referencia:o.referencia||'', valor:U.n(o.valor), pedidos:U.n(o.pedidos),
        camisetas:U.n(o.camisetas), pagamento:o.pagamento||'',
        status:(o.status==='pendente'?'pendente':'pago'), obs:o.obs||'',
        origem:o.origem||'csv', externoId:o.externoid||o.externoId||'',
        criadoEm:new Date().toISOString()
      });
      novos++;
    }
    Store.commit(novos+' lançamento(s) importado(s)');
    return novos;
    function quebrar(linha, s){
      var out=[], atual='', aspas=false;
      for(var k=0;k<linha.length;k++){
        var ch=linha[k];
        if(ch==='"'){ if(aspas && linha[k+1]==='"'){ atual+='"'; k++; } else aspas=!aspas; }
        else if(ch===s && !aspas){ out.push(atual); atual=''; }
        else atual+=ch;
      }
      out.push(atual); return out;
    }
  },

  /* ---- Upsert de dados vindos de integração (evita duplicar) ---- */
  upsertExterno: function(l){
    var i = Store.dados.lancamentos.findIndex(function(x){
      return x.externoId && l.externoId && x.origem===l.origem && x.externoId===l.externoId;
    });
    if(i>=0){
      var antigo = Store.dados.lancamentos[i];
      l.id=antigo.id; l.criadoEm=antigo.criadoEm;

      return 'atualizado';
    }
    l.id=U.id(); l.criadoEm=new Date().toISOString();
    Store.dados.lancamentos.push(l);
