var Views = {};

/* ============ DASHBOARD ============ */
Views.dashboard = function(){
  var ym = UI.ym;
  var a = Calc.apurar(ym), p = Calc.projetar(a), cx = Calc.caixa();
  var diags = Calc.diagnosticar(a, p, cx);
  var v = Calc.veredito(a, p, cx, diags);
  var h = '';

  /* veredito */
  h += '<section class="veredito '+(v.n==='ok'?'':v.n)+'">'+
    '<div class="veredito-frase">'+U.esc(v.frase)+'</div>'+
    '<div class="veredito-apoio">'+U.esc(v.apoio)+'</div>';
  if(a.temDados){
    h += '<div class="veredito-linha">'+
      '<div class="mini"><div class="mini-rot">Faturamento</div><div class="mini-val">'+U.brl(a.faturamento,0)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Lucro líquido</div><div class="mini-val '+(a.lucro<0?'neg':'')+'">'+U.brl(a.lucro,0)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Margem</div><div class="mini-val"><span class="pt '+UI.nivelMargem(a.margem)+'"></span> '+U.pct(a.margem)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Pedidos</div><div class="mini-val">'+U.num(a.pedidos)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Lucro por pedido</div><div class="mini-val">'+U.brl(a.lucroPorPedido)+'</div></div>'+
    '</div>';
  }
  h += '</section>';

  if(!a.temDados){
    h += UI.vazio('Este mês ainda está em branco',
      'Registre uma venda com valor e quantidade de pedidos. O sistema calcula CMV, embalagem, frete, taxas e imposto sozinho, a partir do que está em Configurações.',
      '<button class="btn" data-acao="novo">Registrar primeiro lançamento</button>');
    return h;
  }

  if(a.conflitos.length){
    h += '<div class="aviso">Alguns grupos estão no modo automático e também receberam lançamentos manuais neste mês ('+
      a.conflitos.map(function(c){ return U.esc(GRUPOS[c.grupo].nome)+' — '+U.brl(c.valor); }).join('; ')+
      '). Para não contar duas vezes, o sistema usou o valor calculado. Ajuste o modo em Configurações se preferir usar os lançamentos manuais.</div>';
  }

  /* KPIs */
  h += '<div class="grade g5" style="margin-bottom:12px">'+
    UI.kpi({rot:'Faturamento', val:U.brl(a.faturamento,0), destaque:true,
      nota: p.metaFat>0 ? U.pct(p.pctMetaFat,0)+' da meta' : 'sem meta definida',
      pt: p.metaFat>0 ? (p.pctMetaFat>=100?'ok':(p.pctProjMetaFat>=100?'at':'cr')) : 'nu',
      ajuda:'Soma de todos os lançamentos de receita do grupo Vendas no mês.'})+
    UI.kpi({rot:'Lucro líquido', val:U.brl(a.lucro,0), destaque:true, classe:a.lucro<0?'neg':'',
      nota: p.metaLucro>0 ? U.pct(p.pctMetaLucro,0)+' da meta' : 'sem meta definida',
      pt: p.metaLucro>0 ? (p.pctMetaLucro>=100?'ok':(p.pctProjMetaLucro>=100?'at':'cr')) : 'nu',
      ajuda:'Receita total menos todos os custos: CMV, embalagem, frete, taxas, imposto, marketing, operacional, falhas e outros.'})+
    UI.kpi({rot:'Margem líquida', val:U.pct(a.margem), pt:UI.nivelMargem(a.margem),
      nota:'meta '+U.pct(Calc.cfg().metaMargem,0), ajuda:'Lucro líquido dividido pelo faturamento.'})+
    UI.kpi({rot:'Pedidos', val:U.num(a.pedidos), nota:U.num(a.camisetas)+' camisetas · '+U.num(a.camisetasPorPedido,2)+' por pedido'})+
    UI.kpi({rot:'Ticket médio', val:U.brl(a.ticket), nota:'lucro por pedido '+U.brl(a.lucroPorPedido)})+
  '</div>';

  h += '<div class="grade g5" style="margin-bottom:12px">'+
    UI.kpi({rot:'Marketing', val:U.brl(a.custo.marketing,0), pequeno:true,
      nota:U.pct(a.marketingPct)+' do faturamento', pt: a.marketingPct<=U.n(Calc.cfg().marketingBase)?'ok':'at'})+
    UI.kpi({rot:'CPA', val:U.brl(a.cpa), pequeno:true,
      nota: p.metaCpa>0 ? ('limite '+U.brl(p.metaCpa)) : ('ROAS '+(isFinite(a.roas)?U.num(a.roas,2):'—')),
      pt: p.metaCpa>0 ? (a.cpa<=p.metaCpa?'ok':'cr') : 'nu',
      ajuda:'Custo de aquisição por pedido: marketing dividido pelo número de pedidos.'})+
    UI.kpi({rot:'CMV', val:U.brl(a.custo.cmv,0), pequeno:true, nota:U.pct(a.cmvPct)+' do faturamento'+(Calc.cfg().modo.cmv==='auto'?' · automático':'')})+
    UI.kpi({rot:'Frete', val:U.brl(a.custo.frete,0), pequeno:true, nota:U.brl(a.fretePorPedido)+' por pedido'})+
    UI.kpi({rot:'Custos operacionais', val:U.brl(a.custo.operacional,0), pequeno:true,
      nota: a.operacionalEhFixo ? 'lançado manualmente' : U.pct(Calc.cfg().operacionalPct)+' do faturamento'})+
  '</div>';

  h += '<div class="grade g5" style="margin-bottom:20px">'+
    UI.kpi({rot:'Custo da falha', val:U.brl(a.custo.falha,0), pequeno:true, classe:a.custo.falha>0?'neg':'',
      nota:U.pct(a.falhaPct)+' do faturamento', pt:a.falhaPct>=3?'cr':(a.falhaPct>=1?'at':'ok'),
      ajuda:'Dinheiro gasto corrigindo erros: reenvios, extravios, devoluções e falhas de produção, logística ou atendimento.'})+
    UI.kpi({rot:'Caixa atual', val:U.brl(cx.atual,0), pequeno:true, classe:cx.atual<0?'neg':'',
      nota:'projetado '+U.brl(cx.projetado,0)})+
    UI.kpi({rot:'Reserva', val:U.brl(cx.reserva,0), pequeno:true,
      nota: cx.metaReserva>0 ? U.pct(cx.pctReserva,0)+' da meta · '+U.num(cx.mesesProtegidos,1)+' mês(es)' : 'meta não definida',
      pt: cx.metaReserva>0 ? (cx.pctReserva>=100?'ok':(cx.pctReserva>=50?'at':'cr')) : 'nu'})+
    UI.kpi({rot:'Projeção de faturamento', val:U.brl(p.projFat,0), pequeno:true,
      nota: p.encerrado?'mês encerrado':'ritmo de '+U.brl(p.ritmoFat,0)+'/dia'})+
    UI.kpi({rot:'Projeção de lucro', val:U.brl(p.projLucro,0), pequeno:true, classe:p.projLucro<0?'neg':'',
      nota: p.metaLucro>0 ? (p.atingeLucro?'atinge a meta':'abaixo da meta') : 'margem projetada '+U.pct(p.projMargem),
      pt: p.metaLucro>0 ? (p.atingeLucro?'ok':'at') : 'nu'})+
  '</div>';

  /* Realizado × Meta */
  h += '<div class="grade g2" style="margin-bottom:12px">';
  h += '<div class="cartao"><div class="cartao-tit">Realizado × Meta</div><div class="cartao-sub">Onde o mês está agora</div>'+
    Views._metaBarra('Faturamento', a.faturamento, p.metaFat)+
    Views._metaBarra('Lucro líquido', a.lucro, p.metaLucro)+
    Views._metaBarra('Pedidos', a.pedidos, p.metaPedidos, true)+
  '</div>';
  h += '<div class="cartao"><div class="cartao-tit">Projeção × Meta</div><div class="cartao-sub">Onde o mês termina se o ritmo se mantiver</div>'+
    Views._metaBarra('Faturamento projetado', p.projFat, p.metaFat)+
    Views._metaBarra('Lucro projetado', p.projLucro, p.metaLucro)+
    (p.restantes>0 && (p.faltaFat>0||p.faltaLucro>0) ?
      '<div class="info" style="margin:14px 0 0">Faltam '+p.restantes+' dia(s). Para bater as metas é preciso '+
      U.brl(p.precisaFatDia,0)+' de faturamento e '+U.brl(p.precisaLucroDia,0)+' de lucro por dia.</div>'
      : '')+
  '</div></div>';

  /* Gráficos */
  var serie = Calc.serieDiaria(ym);
  var labels = serie.map(function(d){ return String(d.dia); });
  var metaFatLinha = p.metaFat>0 ? serie.map(function(d){ return p.metaFat*d.dia/p.dias; }) : null;
  var metaLucLinha = p.metaLucro>0 ? serie.map(function(d){ return p.metaLucro*d.dia/p.dias; }) : null;
  var projFatLinha = (!p.encerrado && p.ritmoFat>0) ? serie.map(function(d){
    return d.dia<=p.decorridos ? d.accFat : (a.faturamento + p.ritmoFat*(d.dia-p.decorridos));
  }) : null;
  var projLucLinha = (!p.encerrado && p.ritmoFat>0) ? serie.map(function(d){
    return d.dia<=p.decorridos ? d.accLucro : (a.lucro + (p.ritmoFat*p.margemVarPct)*(d.dia-p.decorridos));
  }) : null;

  h += '<div class="grade g2" style="margin-bottom:12px">';
  h += '<div class="cartao"><div class="cartao-tit">Faturamento acumulado</div><div class="cartao-sub">Dia a dia contra a meta do mês</div>'+
    Chart.linha({labels:labels, n:p.dias, series:[
      {nome:'Realizado', cor:'#5a332e', pontos:serie.slice(0, Math.max(1,p.decorridos)).map(function(d){ return d.accFat; }), area:true, marcarFim:true},
      metaFatLinha?{nome:'Meta', cor:'#94897f', pontos:metaFatLinha, tracejado:true}:null,
      projFatLinha?{nome:'Projeção', cor:'#1f9d6c', pontos:projFatLinha, tracejado:true}:null
    ].filter(Boolean)})+'</div>';
  h += '<div class="cartao"><div class="cartao-tit">Lucro acumulado</div><div class="cartao-sub">Dia a dia contra a meta do mês</div>'+
    Chart.linha({labels:labels, n:p.dias, series:[
      {nome:'Realizado', cor:'#1f9d6c', pontos: serie.slice(0,Math.max(1,p.decorridos)).map(function(d){ return d.accLucro; }), area:true, marcarFim:true},
      metaLucLinha?{nome:'Meta', cor:'#94897f', pontos:metaLucLinha, tracejado:true}:null,
      projLucLinha?{nome:'Projeção', cor:'#b07a1e', pontos:projLucLinha, tracejado:true}:null
    ].filter(Boolean)})+'</div>';
  h += '</div>';

  /* Composição de custos + diagnósticos */
  h += '<div class="grade g2" style="margin-bottom:12px;align-items:start">';
  h += '<div class="cartao"><div class="cartao-tit">Para onde vai cada real</div><div class="cartao-sub">Composição do faturamento no mês</div>'+
    Chart.rosca(Views._composicao(a))+'</div>';
  var esc2 = Calc.podeEscalar(a, p, cx);
  h += '<div><div class="cartao" style="margin-bottom:12px">'+
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">'+
      '<div class="cartao-tit" style="margin:0">Podemos escalar?</div>'+
      '<span class="etq '+(esc2.liberado?'rec':'pen')+'" style="margin-left:auto">'+
        (esc2.liberado?'sim, com teste controlado':esc2.pendentes+' pendência(s))'.replace('))',')'))+'</span>'+
    '</div>'+
    '<div class="cartao-sub">Escalar multiplica o que já existe, inclusive o que está errado</div>'+
    esc2.itens.map(function(i){
      return '<div style="display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f4efeb">'+
        '<span class="pt '+(i.ok?'ok':'at')+'" style="margin-top:6px"></span>'+
        '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">'+U.esc(i.rot)+'</div>'+
        '<div style="font-size:11.5px;color:var(--texto-fraco)">'+U.esc(i.nota)+'</div></div></div>';
    }).join('')+'</div>';
  h += '<div class="cartao-tit" style="margin-bottom:10px">Diagnóstico</div>'+
    diags.map(function(x){
      return '<div class="diag '+x.n+'"><span class="pt '+x.n+'" style="margin-top:5px"></span><div class="diag-corpo">'+
        '<div class="diag-tit">'+U.esc(x.t)+'</div><div class="diag-txt">'+U.esc(x.x)+'</div>'+
        (x.acao?'<button class="diag-acao" data-ir="'+U.esc(x.ir||'')+'">'+U.esc(x.acao)+'</button>':'')+
      '</div></div>';
    }).join('')+'</div>';
  h += '</div>';

  return h;
};

Views._composicao = function(a){
  var cores = {cmv:'#5a332e', embalagem:'#8a5a52', frete:'#b08a84', taxas:'#c9b3ae', imposto:'#b07a1e',
               marketing:'#1f9d6c', comissao:'#6aa98c', operacional:'#3f6b5c', falha:'#a8322c', outros:'#94897f'};
  var itens = ['cmv','embalagem','frete','taxas','imposto','marketing','comissao','operacional','falha','outros'].map(function(g){
    return {rot:GRUPOS[g].nome, valor:a.custo[g], cor:cores[g]};
  }).filter(function(i){ return i.valor>0.009; });
  if(a.lucro>0) itens.push({rot:'Lucro líquido', valor:a.lucro, cor:'#141414'});
  return itens;
};

Views._metaBarra = function(rot, real, meta, inteiro){
  var pct = meta>0 ? U.div(real,meta)*100 : 0;
  var cls = pct>=100?'':(pct>=70?'at':'cr');
  var fmt = inteiro ? function(v){ return U.num(v); } : function(v){ return U.brl(v,0); };
  return '<div style="margin-bottom:14px">'+
    '<div style="display:flex;justify-content:space-between;font-size:12.5px;gap:8px">'+
      '<span>'+U.esc(rot)+'</span>'+
      '<span class="num" style="font-weight:600">'+fmt(real)+(meta>0?' <span style="color:var(--texto-fraco);font-weight:400">/ '+fmt(meta)+'</span>':'')+'</span>'+
    '</div>'+
    (meta>0
      ? '<div class="barra-prog"><span class="'+cls+'" style="width:'+U.clamp(pct,0,100)+'%"></span></div><div class="leg"><span>'+U.pct(pct,0)+' da meta</span><span>'+(pct>=100?'meta batida':'faltam '+fmt(Math.max(0,meta-real)))+'</span></div>'
      : '<div class="leg"><span style="color:var(--texto-fraco)">Meta não definida</span><button class="diag-acao" data-ir="fin:metas" style="font-size:12px">Definir meta</button></div>')+
  '</div>';
};

/* ============ LANÇAMENTOS ============ */
Views.filtro = {tipo:'', grupo:'', canal:'', status:'', texto:''};

Views.lancamentos = function(){
  var ym = UI.ym;
  var todos = Calc.lancamentosDoMes(ym).sort(function(a,b){
    return a.data===b.data ? (b.criadoEm>a.criadoEm?1:-1) : (a.data<b.data?1:-1);
  });
  var f = Views.filtro;
  var ls = todos.filter(function(l){
    if(f.tipo && l.tipo!==f.tipo) return false;
    if(f.grupo && l.grupo!==f.grupo) return false;
    if(f.canal && l.canal!==f.canal) return false;
    if(f.status && l.status!==f.status) return false;
    if(f.texto){
      var t=f.texto.toLowerCase();
      var alvo=(l.descricao+' '+l.categoria+' '+l.referencia+' '+l.obs+' '+l.canal).toLowerCase();
      if(alvo.indexOf(t)<0) return false;
    }
    return true;
  });
  var rec = ls.filter(function(l){return l.tipo==='receita';}).reduce(function(s,l){return s+U.n(l.valor)+U.n(l.freteCobrado);},0);
  var des = ls.filter(function(l){return l.tipo==='despesa';}).reduce(function(s,l){return s+U.n(l.valor);},0);

  var h = '';
  h += '<div class="cartao" style="margin-bottom:12px">'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'+
      '<div style="flex:1;min-width:170px"><label style="font-size:12px;color:var(--texto-medio)">Buscar</label>'+
        '<input type="text" id="fTexto" placeholder="descrição, pedido, observação" value="'+U.esc(f.texto)+'"></div>'+
      '<div style="min-width:120px"><label style="font-size:12px;color:var(--texto-medio)">Tipo</label>'+
        '<select id="fTipo"><option value="">Todos</option><option value="receita"'+(f.tipo==='receita'?' selected':'')+'>Receitas</option><option value="despesa"'+(f.tipo==='despesa'?' selected':'')+'>Despesas</option></select></div>'+
      '<div style="min-width:160px"><label style="font-size:12px;color:var(--texto-medio)">Grupo</label>'+
        '<select id="fGrupo"><option value="">Todos</option>'+Object.keys(GRUPOS).map(function(g){
          return '<option value="'+g+'"'+(f.grupo===g?' selected':'')+'>'+U.esc(GRUPOS[g].nome)+'</option>';
        }).join('')+'</select></div>'+
      '<div style="min-width:130px"><label style="font-size:12px;color:var(--texto-medio)">Situação</label>'+
        '<select id="fStatus"><option value="">Todas</option><option value="pago"'+(f.status==='pago'?' selected':'')+'>Pago/recebido</option><option value="pendente"'+(f.status==='pendente'?' selected':'')+'>Pendente</option></select></div>'+
      '<button class="btn sec" id="fLimpar">Limpar filtros</button>'+
      '<button class="btn sec" id="btnCSV">Exportar CSV</button>'+
      '<button class="btn" data-acao="novo">Novo lançamento</button>'+
    '</div>'+
    '<div style="display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--linha);flex-wrap:wrap">'+
      '<div class="mini"><div class="mini-rot">Receitas no filtro</div><div class="mini-val pos">'+U.brl(rec)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Despesas no filtro</div><div class="mini-val neg">'+U.brl(des)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Saldo</div><div class="mini-val">'+U.brl(rec-des)+'</div></div>'+
      '<div class="mini"><div class="mini-rot">Lançamentos</div><div class="mini-val">'+U.num(ls.length)+'</div></div>'+
    '</div>'+
  '</div>';

  if(!ls.length){
    h += UI.vazio(todos.length?'Nenhum lançamento com esses filtros':'Nenhum lançamento em '+U.nomeMes(ym),
      todos.length?'Ajuste ou limpe os filtros para ver os lançamentos do mês.':'Registre a primeira receita ou despesa do período.',
      '<button class="btn" data-acao="novo">Novo lançamento</button>');
    return h;
  }

  h += '<div class="tabela-env"><table><thead><tr>'+
    '<th>Data</th><th>Descrição</th><th>Grupo</th><th>Categoria</th><th>Canal</th><th class="r">Pedidos</th><th class="r">Total pago</th><th class="c">Situação</th><th></th>'+
  '</tr></thead><tbody>';
  ls.forEach(function(l){
    var sinal = l.tipo==='receita' ? '+' : '−';
    var frete = U.n(l.freteCobrado);
    var total = U.n(l.valor) + frete;
    h += '<tr>'+
      '<td style="white-space:nowrap">'+U.dataBr(l.data)+'</td>'+
      '<td><div style="font-weight:500">'+U.esc(l.descricao||'(sem descrição)')+'</div>'+
        (l.referencia?'<div style="font-size:11.5px;color:var(--texto-fraco)">#'+U.esc(l.referencia)+'</div>':'')+'</td>'+
      '<td><span class="etq '+(l.grupo==='falha'?'fal':(l.tipo==='receita'?'rec':'des'))+'">'+U.esc(GRUPOS[l.grupo].nome)+'</span></td>'+
      '<td style="color:var(--texto-medio)">'+U.esc(l.categoria||'—')+'</td>'+
      '<td style="color:var(--texto-medio)">'+U.esc(l.canal||'—')+'</td>'+
      '<td class="r">'+(l.pedidos?U.num(l.pedidos):'—')+'</td>'+
      '<td class="r" style="color:'+(l.tipo==='receita'?'var(--verde)':'var(--texto)')+'">'+
        '<div style="font-weight:600">'+sinal+' '+U.brl(total)+'</div>'+
        (frete>0 ? '<div style="font-size:11px;color:var(--texto-fraco);font-weight:400">produto '+U.brl(l.valor)+' + frete '+U.brl(frete)+'</div>' : '')+
      '</td>'+
      '<td class="c"><span class="etq '+(l.status==='pendente'?'pen':'pag')+'">'+(l.status==='pendente'?'Pendente':'Pago')+'</span></td>'+
      '<td class="c" style="white-space:nowrap">'+
        '<button class="btn-icone" data-editar="'+l.id+'" title="Editar" aria-label="Editar lançamento"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4v16h16v-7M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>'+
        '<button class="btn-icone" data-excluir="'+l.id+'" title="Excluir" aria-label="Excluir lançamento"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>'+
      '</td>'+
    '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
};

/* ============ PROJEÇÃO DIÁRIA ============ */
Views.projecao = function(){
  var ym = UI.ym;
  var a = Calc.apurar(ym), p = Calc.projetar(a), serie = Calc.serieDiaria(ym);
  var h='';

  if(!a.temDados){
    return UI.vazio('Sem base para projetar', 'A projeção usa o ritmo diário do mês. Registre ao menos uma venda para o sistema começar a projetar.',
      '<button class="btn" data-acao="novo">Registrar lançamento</button>');
  }

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Dias decorridos', val:U.num(p.decorridos)+' de '+U.num(p.dias), pequeno:true, nota:p.restantes+' dia(s) restantes'})+
    UI.kpi({rot:'Ritmo de faturamento', val:U.brl(p.ritmoFat,0), pequeno:true, nota:U.num(p.ritmoPedidos,1)+' pedidos por dia',
      ajuda:'Média diária considerando os dias já decorridos no mês, inclusive os dias sem venda.'})+
    UI.kpi({rot:'Faturamento projetado', val:U.brl(p.projFat,0), destaque:true,
      nota:p.metaFat>0?(p.atingeFat?'atinge a meta':'abaixo da meta'):'sem meta', pt:p.metaFat>0?(p.atingeFat?'ok':'at'):'nu'})+
    UI.kpi({rot:'Lucro projetado', val:U.brl(p.projLucro,0), destaque:true, classe:p.projLucro<0?'neg':'',
      nota:'margem projetada '+U.pct(p.projMargem), pt:UI.nivelMargem(p.projMargem)})+
  '</div>';

  h += '<div class="cartao" style="margin-bottom:12px"><div class="cartao-tit">O que falta</div>'+
    '<div class="cartao-sub">Quanto ainda é preciso entregar até o fim de '+U.nomeMes(ym)+'</div>'+
    '<div class="grade g4">'+
      UI.kpi({rot:'Falta faturar', val:U.brl(p.faltaFat,0), pequeno:true, nota:p.metaFat>0?('meta '+U.brl(p.metaFat,0)):'defina a meta do mês'})+
      UI.kpi({rot:'Falta lucrar', val:U.brl(p.faltaLucro,0), pequeno:true, nota:p.metaLucro>0?('meta '+U.brl(p.metaLucro,0)):'defina a meta do mês'})+
      UI.kpi({rot:'Faturamento necessário por dia', val:U.brl(p.precisaFatDia,0), pequeno:true,
        nota: p.ritmoFat>0 ? (p.precisaFatDia<=p.ritmoFat ? 'abaixo do ritmo atual' : U.pct(U.div(p.precisaFatDia,p.ritmoFat)*100-100,0)+' acima do ritmo') : '—',
        pt: p.precisaFatDia<=p.ritmoFat?'ok':'at'})+
      UI.kpi({rot:'Lucro necessário por dia', val:U.brl(p.precisaLucroDia,0), pequeno:true, nota:p.restantes+' dia(s) para conseguir'})+
    '</div></div>';

  var labels = serie.map(function(d){ return String(d.dia); });
  h += '<div class="grade g2" style="margin-bottom:12px">'+
    '<div class="cartao"><div class="cartao-tit">Faturamento por dia</div><div class="cartao-sub">Somente dias já decorridos</div>'+
      Chart.colunas(serie.slice(0,Math.max(1,p.decorridos)).map(function(d){ return {rot:String(d.dia), valor:d.fat, cor:d.fat>0?'#5a332e':'#e7e1db'}; }))+'</div>'+
    '<div class="cartao"><div class="cartao-tit">Lucro por dia</div><div class="cartao-sub">Inclui custos automáticos e lançamentos do dia</div>'+
      Chart.colunas(serie.slice(0,Math.max(1,p.decorridos)).map(function(d){ return {rot:String(d.dia), valor:d.lucro, cor:d.lucro>=0?'#1f9d6c':'#a8322c'}; }))+'</div>'+
  '</div>';

  h += '<div class="tabela-env"><table><thead><tr>'+
    '<th>Dia</th><th class="r">Faturamento</th><th class="r">Pedidos</th><th class="r">Ticket</th><th class="r">Marketing</th><th class="r">CPA</th><th class="r">Lucro</th><th class="r">Fat. acumulado</th><th class="r">Lucro acumulado</th>'+
  '</tr></thead><tbody>';
  var hojeIso = U.hoje();
  serie.forEach(function(d){
    var futuro = d.data > hojeIso;
    h += '<tr'+(d.data===hojeIso?' class="hoje"':'')+' style="'+(futuro?'opacity:.42':'')+'">'+
      '<td style="white-space:nowrap">'+d.dia+' <span style="color:var(--texto-fraco);font-size:11.5px">'+U.diaSemana(d.data)+'</span></td>'+
      '<td class="r">'+(d.fat?U.brl(d.fat,0):'—')+'</td>'+
      '<td class="r">'+(d.pedidos?U.num(d.pedidos):'—')+'</td>'+
      '<td class="r">'+(d.pedidos?U.brl(d.ticket,0):'—')+'</td>'+
      '<td class="r">'+(d.mkt?U.brl(d.mkt,0):'—')+'</td>'+
      '<td class="r">'+(d.pedidos&&d.mkt?U.brl(d.cpa,0):'—')+'</td>'+
      '<td class="r" style="font-weight:600;color:'+(d.lucro<0?'var(--rubro)':(d.lucro>0?'var(--verde)':'var(--texto-fraco)'))+'">'+(d.fat||d.mkt||d.outrasDesp||d.falha?U.brl(d.lucro,0):'—')+'</td>'+
      '<td class="r" style="color:var(--texto-medio)">'+U.brl(d.accFat,0)+'</td>'+
      '<td class="r" style="color:var(--texto-medio)">'+U.brl(d.accLucro,0)+'</td>'+
    '</tr>';
  });
  h += '</tbody><tfoot><tr class="total">'+
    '<td>Total</td><td class="r">'+U.brl(a.faturamento,0)+'</td><td class="r">'+U.num(a.pedidos)+'</td>'+
    '<td class="r">'+U.brl(a.ticket,0)+'</td><td class="r">'+U.brl(a.custo.marketing,0)+'</td>'+
    '<td class="r">'+U.brl(a.cpa,0)+'</td><td class="r">'+U.brl(a.lucro,0)+'</td>'+
    '<td class="r">'+U.brl(a.faturamento,0)+'</td><td class="r">'+U.brl(a.lucro,0)+'</td>'+
  '</tr></tfoot></table></div>';
  return h;
};

        '<div><label style="font-size:11.5px;color:var(--texto-fraco)">Cobrado do cliente</label><input type="number" id="sFreteCob" value="'+U.n(s.freteCobrado, s.frete)+'" step="0.5" '+(s.freteGratis?'disabled':'')+'></div>'+

      (s.modoMkt==='pct'

        : '<input type="range" id="sCpaR" min="0" max="200" step="1" value="'+s.cpa+'"><div class="leg"><span>R$ 0</span><span style="font-weight:600;color:var(--texto)">'+U.brl(s.cpa,0)+'</span><span>R$ 200</span></div>')+

    '</div>'+

    '</div>'+

          '<button class="btn-icone" data-delOferta="'+o.id+'" title="Excluir cenário">✕</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div>';
  return h;

Views.simResultado = function(){
  var s = Views.sim, r = Calc.simular(s), c = Calc.cfg();
  var h = '';

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Lucro por pedido', val:U.brl(r.lucro), destaque:true, classe:r.lucro<0?'neg':''})+
    UI.kpi({rot:'Margem líquida', val:U.pct(r.margem), destaque:true, pt:r.saudavel, nota:'alvo '+U.pct(r.margemAlvo,0)})+
    UI.kpi({rot:'Margem de contribuição', val:U.pct(r.contribuicaoPct), pequeno:true, nota:U.brl(r.contribuicao)+' por pedido',
      ajuda:'O que sobra depois dos custos que variam com a venda, antes dos custos operacionais.'})+
    UI.kpi({rot:'Lucro por camiseta', val:U.brl(r.lucroPorCamiseta), pequeno:true, nota:U.brl(r.precoPorCamiseta)+' de preço por camiseta'})+
  '</div>';

  /* quebra completa */
  h += '<div class="cartao" style="margin-bottom:12px"><div class="cartao-tit">Onde vai cada real de '+U.brl(r.total,0)+'</div>'+
    '<div class="cartao-sub">'+(r.receitaFrete>0
      ? U.brl(r.preco,0)+' de produto + '+U.brl(r.receitaFrete,0)+' de frete cobrado do cliente'
      : 'Custo por pedido, item a item')+'</div>'+
    '<div class="tabela-env"><table><tbody>'+
      Views._linhaSim('CMV — '+U.num(r.qtd)+' camiseta(s)', r.cmv, r.total)+
      Views._linhaSim('Embalagem — kit de '+U.num(r.qtd)+' peça(s)'+(r.embalagem>r.kit?' + extras':''), r.embalagem, r.total)+
      Views._linhaSim('Frete', r.frete, r.total)+
      '<tr class="total"><td>Custo físico</td><td class="r">'+U.brl(r.custoFisico)+'</td><td class="r">'+U.pct(U.div(r.custoFisico,r.preco)*100)+'</td></tr>'+
      Views._linhaSim('Gateway ('+U.pct(r.pctGateway)+(r.gatewayFixo?' + '+U.brl(r.gatewayFixo)+' fixo':'')+')', r.gateway, r.total)+
      Views._linhaSim('Checkout ('+U.pct(r.pctCheckout)+')', r.checkout, r.total)+
      Views._linhaSim('Imposto ('+U.pct(r.pctImposto)+')', r.imposto, r.total)+
      Views._linhaSim('Marketing'+(r.modoMkt==='cpa'?' (CPA)':' ('+U.pct(r.marketingPct)+')'), r.marketing, r.total)+
      '<tr class="total"><td>Margem de contribuição</td><td class="r">'+U.brl(r.contribuicao)+'</td><td class="r">'+U.pct(r.contribuicaoPct)+'</td></tr>'+
      Views._linhaSim('Custo operacional ('+U.pct(r.pctOperacional)+')', r.operacional, r.total)+
      '<tr class="total"><td>Lucro líquido</td><td class="r" style="color:'+(r.lucro<0?'var(--rubro)':'var(--verde)')+'">'+U.brl(r.lucro)+'</td><td class="r">'+U.pct(r.margem)+'</td></tr>'+
    '</tbody></table></div></div>';

  /* limites de tráfego */
  h += '<div class="grade g3" style="margin-bottom:12px">'+
    UI.kpi({rot:'CPA máximo para '+U.pct(r.margemAlvo,0)+' de margem', val:r.cpaMaxAlvo>0?U.brl(r.cpaMaxAlvo):'impossível', pequeno:true,
      classe:r.cpaMaxAlvo<=0?'neg':'', nota:r.cpaMaxAlvo>0?('ROAS mínimo '+U.num(r.roasMinAlvo,2)):'o preço não comporta essa margem'})+
    UI.kpi({rot:'CPA de equilíbrio', val:U.brl(r.cpaBreakeven), pequeno:true,
      nota:'acima disso o pedido dá prejuízo', ajuda:'Valor máximo que pode ser gasto em tráfego por pedido para o lucro ficar exatamente em zero.'})+
    UI.kpi({rot:'ROAS atual da oferta', val:isFinite(r.roasAtual)?U.num(r.roasAtual,2):'—', pequeno:true,
      nota:'gasto de '+U.brl(r.marketing)+' por pedido'})+
  '</div>';

  /* respostas rápidas */
  var alvoPreco = r.precoParaAlvo;
  var simMkt20 = Calc.simular(Object.assign({}, s, {modoMkt:'pct', marketingPct:20}));
  var simMkt15 = Calc.simular(Object.assign({}, s, {modoMkt:'pct', marketingPct:15}));
  h += '<div class="cartao"><div class="cartao-tit">Respostas rápidas</div><div class="cartao-sub">As três perguntas que decidem a oferta</div>'+
    '<div class="diag ok"><span class="pt ok" style="margin-top:5px"></span><div class="diag-corpo">'+
      '<div class="diag-tit">Para ter '+U.pct(r.margemAlvo,0)+' de margem, quanto preciso cobrar?</div>'+
      '<div class="diag-txt">'+(alvoPreco
        ? 'Mantendo os custos atuais e '+(r.modoMkt==='pct'?'marketing em '+U.pct(r.marketingPct):'CPA de '+U.brl(r.marketing))+', o preço precisa ser '+
          '<b>'+U.brl(alvoPreco)+'</b> ('+U.brl(alvoPreco/r.qtd)+' por camiseta). Hoje está em '+U.brl(r.preco)+
          (alvoPreco>r.preco ? ' — faltam '+U.brl(alvoPreco-r.preco)+'.' : ' — o preço atual já supera o necessário.')
        : 'Com os percentuais atuais, nenhum preço atinge essa margem. Reduza marketing, imposto ou custo operacional primeiro.')+'</div></div></div>'+
    '<div class="diag '+(r.cpaMaxAlvo>0?'ok':'cr')+'"><span class="pt '+(r.cpaMaxAlvo>0?'ok':'cr')+'" style="margin-top:5px"></span><div class="diag-corpo">'+
      '<div class="diag-tit">Mantendo '+U.brl(r.preco,0)+', qual CPA máximo posso aceitar?</div>'+
      '<div class="diag-txt">'+(r.cpaMaxAlvo>0
        ? 'Até <b>'+U.brl(r.cpaMaxAlvo)+'</b> por pedido para manter '+U.pct(r.margemAlvo,0)+' de margem (ROAS mínimo de '+U.num(r.roasMinAlvo,2)+'). O limite absoluto, sem lucro nenhum, é '+U.brl(r.cpaBreakeven)+'.'
        : 'Esse preço não comporta '+U.pct(r.margemAlvo,0)+' de margem nem com marketing zerado. O limite sem prejuízo é '+U.brl(r.cpaBreakeven)+'.')+'</div></div></div>'+
    '<div class="diag ok"><span class="pt ok" style="margin-top:5px"></span><div class="diag-corpo">'+
      '<div class="diag-tit">O que acontece se o marketing cair de 25% para 20% ou 15%?</div>'+
      '<div class="diag-txt">Com marketing em 20%, o lucro vai para <b>'+U.brl(simMkt20.lucro)+'</b> por pedido ('+U.pct(simMkt20.margem)+' de margem). '+
        'Com 15%, vai para <b>'+U.brl(simMkt15.lucro)+'</b> ('+U.pct(simMkt15.margem)+'). '+
        'Cada ponto percentual de marketing economizado vale '+U.brl(r.preco/100)+' por pedido.</div></div></div>'+
  '</div>';

  /* escada de ofertas */
  var escada = Calc.escada(s, s.precos);
  h += '<div class="cartao" style="margin-top:12px"><div class="cartao-tit">Escada de ofertas</div>'+
    '<div class="cartao-sub">Mesmos custos, quantidades diferentes. Edite o preço de cada degrau para comparar.</div>'+
    '<div class="tabela-env"><table><thead><tr><th>Oferta</th><th class="r">Preço</th><th class="r">Preço/camiseta</th><th class="r">Custo físico</th><th class="r">Contribuição</th><th class="r">Lucro/pedido</th><th class="r">Lucro/camiseta</th><th class="r">Margem</th><th class="r">CPA máx.</th></tr></thead><tbody>';
  escada.forEach(function(e,i){
    var q=i+1;
    h += '<tr'+(q===s.camisetas?' style="background:#fdf7f0"':'')+'>'+
      '<td style="font-weight:500">'+q+' camiseta'+(q>1?'s':'')+'</td>'+
      '<td class="r"><input type="number" data-escada="'+q+'" value="'+Math.round(e.preco)+'" step="1" style="width:88px;padding:4px 7px;text-align:right"></td>'+
      '<td class="r">'+U.brl(e.precoPorCamiseta,0)+'</td>'+
      '<td class="r">'+U.brl(e.custoFisico)+'</td>'+
      '<td class="r">'+U.pct(e.contribuicaoPct)+'</td>'+
      '<td class="r" style="font-weight:600">'+U.brl(e.lucro)+'</td>'+
      '<td class="r">'+U.brl(e.lucroPorCamiseta)+'</td>'+
      '<td class="r"><span class="pt '+e.saudavel+'"></span> '+U.pct(e.margem)+'</td>'+
      '<td class="r">'+(e.cpaMaxAlvo>0?U.brl(e.cpaMaxAlvo,0):'—')+'</td>'+
    '</tr>';
  });
  h += '</tbody></table></div></div>';
  return h;
};

Views._linhaSim = function(rot, val, preco){
  return '<tr><td>'+U.esc(rot)+'</td><td class="r">'+U.brl(val)+'</td><td class="r" style="color:var(--texto-medio)">'+U.pct(U.div(val,preco)*100)+'</td></tr>';
};

    c.produtos.map(function(pr){
      return '<tr><td style="font-weight:500">'+U.esc(pr.nome)+'</td>'+

        '<td class="r">'+U.brl(pr.custo)+'</td>'+
        '<td class="c">'+(pr.padrao?'<span class="etq rec">padrão</span>':'<button class="btn sec sm" data-padrao="'+pr.id+'">Tornar padrão</button>')+'</td>'+
        '<td class="c" style="white-space:nowrap"><button class="btn-icone" data-editProduto="'+pr.id+'">✎</button>'+

    }).join('')+

  '</div>';

};

/* ============ FRETE & LOGÍSTICA ============ */
Views.frete = function(){
  var c = Calc.cfg(), a = Calc.apurar(UI.ym);
  var previsto = a.pedidos * U.n(c.freteMedio);
  var real = a.manual.frete;
  var reenvio = Calc.lancamentosDoMes(UI.ym).filter(function(l){ return l.grupo==='falha' && /reenvio|extravio|devolu/i.test(l.categoria||''); })
    .reduce(function(s,l){ return s+U.n(l.valor); },0);
  var h='';

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Frete médio configurado', val:U.brl(c.freteMedio), destaque:true, nota:'premissa usada nos cálculos'})+
    UI.kpi({rot:'Frete do mês', val:U.brl(a.custo.frete,0), pequeno:true,
      nota:U.pct(a.fretePct)+' do faturamento'+(a.freteAjustado?' · valor real':' · estimado'),
      pt: a.freteAjustado?'ok':'nu'})+
    UI.kpi({rot:'Frete por pedido', val:U.brl(a.fretePorPedido), pequeno:true,
      nota: a.pedidos ? (a.fretePorPedido<=U.n(c.freteMedio)?'dentro da premissa':'acima da premissa') : 'sem pedidos no mês',
      pt: a.pedidos ? (a.fretePorPedido<=U.n(c.freteMedio)?'ok':'at') : 'nu'})+
    UI.kpi({rot:'Frete de reenvio e extravio', val:U.brl(reenvio,0), pequeno:true, classe:reenvio>0?'neg':'', nota:'entra no custo da falha'})+
  '</div>';

  var aj = Store.ajusteFreteDe(UI.ym);
  var difAj = aj===null ? 0 : (aj - previsto);
  h += '<div class="cartao" style="margin-bottom:12px">'+
    '<div class="cartao-tit">Fechar o frete de '+U.nomeMes(UI.ym)+'</div>'+
    '<div class="cartao-sub">No fim do mês, informe quanto você realmente pagou em etiquetas. '+
      'Esse valor substitui a estimativa de pedidos × frete médio e recalcula margem, lucro e caixa.</div>'+
    '<div class="linha-campos lc2" style="align-items:end">'+
      '<div class="campo" style="margin-bottom:0"><label>Total pago em etiquetas (R$)</label>'+
        '<input type="number" id="ajFrete" step="0.01" placeholder="'+U.n(previsto,2)+'" value="'+(aj===null?'':U.n(aj))+'"></div>'+
      '<div style="display:flex;gap:8px">'+
        '<button class="btn" id="ajSalvar">Salvar frete real</button>'+
        (aj!==null?'<button class="btn sec" id="ajLimpar">Voltar à estimativa</button>':'')+
      '</div>'+
    '</div>'+
    (aj!==null
      ? '<div class="'+(Math.abs(difAj)>0.009?'aviso':'info')+'" style="margin:14px 0 0">'+
        'Usando o valor real de '+U.brl(aj)+'. A estimativa dava '+U.brl(previsto)+' — '+
        (Math.abs(difAj)<0.01 ? 'praticamente igual.'
          : (difAj>0 ? 'você pagou '+U.brl(difAj)+' a mais do que a premissa previa, e isso saiu do lucro.'
                     : 'você pagou '+U.brl(-difAj)+' a menos, e isso virou lucro.'))+
        (a.pedidos ? ' Frete real por pedido: '+U.brl(aj/a.pedidos)+'.' : '')+'</div>'
      : '<div class="info" style="margin:14px 0 0">Enquanto você não informar, o painel usa '+
        U.num(a.pedidos)+' pedido(s) × '+U.brl(c.freteMedio)+' = <b>'+U.brl(previsto)+'</b>.</div>')+
  '</div>';

  h += '<div class="cartao" style="margin-bottom:12px"><div class="cartao-tit">Premissa × realidade</div>'+
    '<div class="cartao-sub">Se o frete real ficar sistematicamente acima da premissa, toda margem calculada está otimista</div>'+
    Chart.barras([
      {rot:'Estimativa ('+U.num(a.pedidos)+' pedidos × '+U.brl(c.freteMedio)+')', valor:previsto, cor:'#b08a84'},
      {rot:'Lançado manualmente no mês', valor:real, cor:'#5a332e'},
      {rot:'Considerado no resultado'+(a.freteAjustado?' (valor real informado)':''), valor:a.custo.frete, cor:'#1f9d6c'}
    ])+
    '<div class="info" style="margin-top:14px">O grupo Frete está no modo <b>'+(c.modo.frete==='auto'?'automático':'manual')+'</b>. '+
      (c.modo.frete==='auto'
        ? 'O sistema calcula pedidos × frete médio. Lançamentos manuais de frete não entram no resultado para não contar duas vezes.'
        : 'O resultado usa apenas os lançamentos manuais do grupo Frete.')+'</div>'+
  '</div>';

  var canais = Calc.porCanal(UI.ym);
  h += '<div class="cartao"><div class="cartao-tit">Peso logístico por pedido</div>'+
    '<div class="cartao-sub">Quanto de cada pedido é consumido só para a mercadoria sair e chegar</div>'+
    '<div class="tabela-env"><table><tbody>'+
      Views._linhaSim('Frete', U.div(a.custo.frete,a.pedidos), a.ticket)+
      Views._linhaSim('Embalagem e brindes', U.div(a.custo.embalagem,a.pedidos), a.ticket)+
      Views._linhaSim('Custo da falha', a.falhaPorPedido, a.ticket)+
      '<tr class="total"><td>Custo logístico por pedido</td><td class="r">'+U.brl(U.div(a.custo.frete+a.custo.embalagem+a.custo.falha, a.pedidos))+'</td>'+
      '<td class="r">'+U.pct(U.div(a.custo.frete+a.custo.embalagem+a.custo.falha, a.faturamento)*100)+'</td></tr>'+
    '</tbody></table></div>'+
    (canais.length?'<div class="cartao-sub" style="margin-top:16px;margin-bottom:8px">Ticket médio por canal — canais com ticket baixo diluem menos o frete</div>'+
      Chart.barras(canais.map(function(cn){ return {rot:cn.canal, valor:cn.ticket, cor:'#5a332e'}; })):'')+
  '</div>';
  return h;
};

/* ============ VENDAS POR CANAL ============ */
Views.canal = function(){
  var a = Calc.apurar(UI.ym), canais = Calc.porCanal(UI.ym);

    return UI.vazio('Nenhuma venda registrada em '+U.nomeMes(UI.ym),

      '<button class="btn" data-acao="novo">Registrar venda</button>');

  var cores = ['#5a332e','#1f9d6c','#b07a1e','#8a5a52','#3f6b5c','#a8322c','#94897f'];

    '<div class="cartao"><div class="cartao-tit">Participação no faturamento</div><div class="cartao-sub">'+U.nomeMes(UI.ym)+'</div>'+

    '<div class="cartao"><div class="cartao-tit">Ticket médio por canal</div><div class="cartao-sub">Ticket alto dilui melhor frete e embalagem</div>'+
      Chart.barras(canais.map(function(cn){ return {rot:cn.canal, valor:cn.ticket, cor:'#5a332e'}; }))+'</div>'+
  '</div>';

  h += '<div class="tabela-env"><table><thead><tr><th>Canal</th><th class="r">Faturamento</th><th class="r">Participação</th><th class="r">Pedidos</th><th class="r">Camisetas</th><th class="r">Ticket médio</th><th class="r">Camisetas/pedido</th></tr></thead><tbody>';

    '<td class="r">'+U.num(a.pedidos)+'</td><td class="r">'+U.num(a.camisetas)+'</td>'+
    '<td class="r">'+U.brl(a.ticket,0)+'</td><td class="r">'+U.num(a.camisetasPorPedido,2)+'</td></tr>';
  h += '</tbody></table></div>';

  var ufs = Calc.porEstado(UI.ym);
  h += '<div class="cartao" style="margin-top:12px"><div class="cartao-tit">Vendas por estado</div>'+
    '<div class="cartao-sub">'+(ufs.length
      ? 'Onde a marca está sendo comprada — e onde o frete pesa mais'
      : 'Disponível quando os pedidos trouxerem o estado de entrega, o que a importação da loja já faz')+'</div>';
  if(ufs.length){
    h += Chart.barras(ufs.slice(0,12).map(function(u){ return {rot:u.uf, valor:u.fat, cor:'#5a332e', pct:u.part}; }))+
      '<div class="tabela-env" style="margin-top:14px"><table><thead><tr><th>UF</th><th class="r">Pedidos</th><th class="r">Participação</th><th class="r">Faturamento</th><th class="r">Ticket</th></tr></thead><tbody>'+
      ufs.map(function(u){
        return '<tr><td style="font-weight:500">'+U.esc(u.uf)+'</td><td class="r">'+U.num(u.pedidos)+'</td>'+
          '<td class="r">'+U.pct(u.part,1)+'</td><td class="r">'+U.brl(u.fat,0)+'</td><td class="r">'+U.brl(u.ticket,0)+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
      (ufs.semUf>0 ? '<div class="info" style="margin-top:12px">'+U.brl(ufs.semUf,0)+' em vendas sem estado informado ficaram fora desta tabela.</div>' : '');
  }
  h += '</div>';
  return h;
};

      '<tr><td>A pagar</td><td class="r neg">− '+U.brl(cx.aPagar)+'</td></tr>'+

      }).join('')+'</tbody></table></div></div>';
  }
  return h;
};

/* ============ CUSTO DA FALHA ============ */
Views.falha = function(){
  var ym = UI.ym, a = Calc.apurar(ym);
  var ls = Calc.lancamentosDoMes(ym).filter(function(l){ return l.grupo==='falha'; });
  var porCat = {};
  ls.forEach(function(l){
    var k = l.categoria || 'Não classificado';
    porCat[k] = (porCat[k]||0) + U.n(l.valor);
  });
  var hist = Calc.historico().slice(-6);
  var h='';

  h += '<div class="veredito '+(a.falhaPct>=3?'critico':(a.falhaPct>=1?'atencao':(a.custo.falha>0?'':'neutro')))+'" style="margin-bottom:16px">'+
    '<div class="veredito-frase">'+(a.custo.falha>0
      ? U.brl(a.custo.falha,0)+' foram gastos corrigindo erros neste mês.'
      : 'Nenhum custo de falha registrado neste mês.')+'</div>'+
    '<div class="veredito-apoio">'+(a.custo.falha>0
      ? 'Isso equivale a '+U.pct(a.falhaPct)+' do faturamento e '+U.brl(a.falhaPorPedido)+' por pedido. É dinheiro que sai inteiro do lucro: para recuperar '+U.brl(a.custo.falha,0)+' com '+U.pct(a.margem)+' de margem, seria preciso faturar '+U.brl(U.div(a.custo.falha, a.margem/100),0)+' a mais.'
      : 'Reenvios, extravios, devoluções e erros de produção, logística ou atendimento devem ser lançados no grupo Custo da falha para não sumirem dentro de “Outros”.')+'</div>'+
  '</div>';

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Custo da falha', val:U.brl(a.custo.falha,0), destaque:true, classe:a.custo.falha>0?'neg':''})+
    UI.kpi({rot:'% do faturamento', val:U.pct(a.falhaPct), pequeno:true, pt:a.falhaPct>=3?'cr':(a.falhaPct>=1?'at':'ok'), nota:'alvo: abaixo de 1%'})+
    UI.kpi({rot:'Por pedido', val:U.brl(a.falhaPorPedido), pequeno:true, nota:'diluído em '+U.num(a.pedidos)+' pedidos'})+
    UI.kpi({rot:'Faturamento necessário para repor', val:U.brl(a.margem>0?U.div(a.custo.falha, a.margem/100):0,0), pequeno:true,
      nota:'na margem atual de '+U.pct(a.margem), ajuda:'Quanto seria preciso vender a mais só para recuperar o dinheiro perdido com falhas.'})+
  '</div>';

  h += '<div class="grade g2" style="margin-bottom:12px;align-items:start">';
  h += '<div class="cartao"><div class="cartao-tit">Onde a falha acontece</div><div class="cartao-sub">'+U.nomeMes(ym)+'</div>'+
    (Object.keys(porCat).length
      ? Chart.barras(Object.keys(porCat).sort(function(x,y){ return porCat[y]-porCat[x]; }).map(function(k){
          return {rot:k, valor:porCat[k], cor:'#a8322c', pct:U.div(porCat[k], a.custo.falha)*100};
        }))
      : '<div style="font-size:13px;color:var(--texto-fraco)">Nada registrado no mês.</div>')+
  '</div>';
  h += '<div class="cartao"><div class="cartao-tit">Evolução</div><div class="cartao-sub">Custo da falha nos últimos meses</div>'+
    Chart.colunas(hist.map(function(x){ return {rot:U.nomeMesCurto(x.ym), valor:x.a.custo.falha, cor:'#a8322c'}; }))+
    '<div class="leg"><span>Cada mês em % do faturamento: '+hist.map(function(x){ return U.nomeMesCurto(x.ym)+' '+U.pct(x.a.falhaPct,1); }).join(' · ')+'</span></div>'+
  '</div>';
  h += '</div>';

  if(ls.length){
    h += '<div class="tabela-env"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Pedido</th><th class="r">Valor</th><th></th></tr></thead><tbody>';
    ls.sort(function(x,y){ return x.data<y.data?1:-1; }).forEach(function(l){
      h += '<tr><td>'+U.dataBr(l.data)+'</td><td style="font-weight:500">'+U.esc(l.descricao||'—')+'</td>'+
        '<td><span class="etq fal">'+U.esc(l.categoria||'—')+'</span></td>'+
        '<td style="color:var(--texto-medio)">'+U.esc(l.referencia||'—')+'</td>'+
        '<td class="r" style="font-weight:600">'+U.brl(l.valor)+'</td>'+
        '<td class="c" style="white-space:nowrap"><button class="btn-icone" data-editar="'+l.id+'">✎</button><button class="btn-icone" data-excluir="'+l.id+'">✕</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }else{
    h += UI.vazio('Sem falhas registradas', 'Sempre que houver reenvio, extravio, devolução ou erro que custe dinheiro, lance no grupo Custo da falha.',
      '<button class="btn" data-acao="novo-falha">Registrar custo de falha</button>');
  }
  return h;
};

    '<button class="btn sec" id="fFechar">'+(f.fechado?'Reabrir mês':'Fechar mês')+'</button>'+

      '<td class="r" style="color:'+(x.a.custo.falha>0?'var(--rubro)':'var(--texto-fraco)')+'">'+(x.a.custo.falha?U.brl(x.a.custo.falha,0):'—')+'</td>'+

  if(hist.length>1){
    h += '<div class="grade g2">'+
      '<div class="cartao"><div class="cartao-tit">Faturamento por mês</div>'+
        Chart.colunas(hist.map(function(x){ return {rot:U.nomeMesCurto(x.ym), valor:x.a.faturamento, cor:x.ym===ym?'#5a332e':'#b08a84'}; }))+'</div>'+
      '<div class="cartao"><div class="cartao-tit">Lucro por mês</div>'+

    '</div>';
  }
  return h;
};

    '<div class="veredito-frase">'+U.esc(v.frase)+'</div>'+

  h += '<div class="grade g2" style="align-items:start">';

      return '<div class="diag '+x.n+'"><span class="pt '+x.n+'" style="margin-top:5px"></span><div class="diag-corpo">'+

        (x.acao?'<button class="diag-acao" data-ir="'+U.esc(x.ir||'')+'">'+U.esc(x.acao)+'</button>':'')+'</div></div>';

    '<button class="btn sec" data-ir="financeiro" style="margin-top:6px">Abrir o Financeiro completo</button>'+
  '</div>';

  h += '<div class="cartao"><div class="cartao-tit">Departamentos</div>'+
    '<div class="cartao-sub">A reconstrução começa pelo Financeiro. Os demais entram depois, na mesma base de dados.</div>'+
    '<div class="breve-lista" style="border-top:none">'+
    [['Financeiro','Em operação','ok'],
     ['Vendas','Marketing, conteúdo, revenda e representantes','breve'],
     ['Produto','Catálogo, coleções e ficha de custo','breve'],
     ['Produção','Capacidade, fila e prazo de estampa','breve'],
     ['Logística','Envio, prazo e rastreio','breve'],
     ['Atendimento','Suporte, comunidade e reclamações','breve'],
     ['Gestão','Indicadores gerais e rotina de decisão','breve'],
     ['Jurídico','Contratos e obrigações','breve']
    ].map(function(d){
      return '<div class="breve-item"><b>'+d[0]+'</b><span>'+d[1]+'</span>'+
        (d[2]==='ok'?'<span class="etq rec" style="margin-left:auto">ativo</span>':'<span class="etq pag" style="margin-left:auto">em breve</span>')+'</div>';
    }).join('')+'</div></div>';

/* Mostra, enquanto digita, o que a mudança faz com a oferta principal. */
Views._impactoCustos = function(vals){
  var c = Calc.cfg();
  var ref = (Store.dados.ofertas||[]).find(function(o){ return U.n(o.camisetas)===2; }) || (Store.dados.ofertas||[])[0];
  if(!ref) return '';
  var atual = Calc.simular(ref);
  var novo = atual;
  if(vals){
    var faixaSim = null;
    if(vals.embalagemFaixas && vals.embalagemFaixas.length){
      var ord = vals.embalagemFaixas.slice().sort(function(a,b){ return U.n(a.ate)-U.n(b.ate); });
      for(var i=0;i<ord.length;i++){ if(U.n(ref.camisetas,1)<=U.n(ord[i].ate)){ faixaSim = U.n(ord[i].custo); break; } }
      if(faixaSim===null) faixaSim = U.n(ord[ord.length-1].custo);
    }
    var guarda = {gateway:c.gateway, checkout:c.checkout, imposto:c.imposto};
    c.gateway = vals.gateway; c.checkout = vals.checkout; c.imposto = vals.imposto;
    novo = Calc.simular(Object.assign({}, ref, {
      custoCamiseta: vals.custoCamiseta,
      kit: faixaSim!==null ? faixaSim : undefined,
      frete: vals.freteMedio,
      freteCobrado: ref.freteGratis===false ? U.n(ref.freteCobrado, vals.freteMedio) : 0,
      gatewayFixo: vals.gatewayFixo,
      marketingPct: vals.marketingBase
    }));
    c.gateway = guarda.gateway; c.checkout = guarda.checkout; c.imposto = guarda.imposto;
  }
  var dif = novo.lucro - atual.lucro;
  return '<div class="'+(vals && Math.abs(dif)>0.005 ? 'aviso' : 'info')+'" style="margin:4px 0 14px">'+
    'Na oferta <b>'+U.esc(ref.nome)+'</b>: lucro de <b>'+U.brl(novo.lucro)+'</b> por pedido, '+
    'margem de <b>'+U.pct(novo.margem)+'</b>'+
    (vals && Math.abs(dif)>0.005
      ? ' — '+(dif>0?'ganho':'perda')+' de '+U.brl(Math.abs(dif))+' por pedido em relação aos custos salvos.'
      : '.')+
  '</div>';
};

/* ============================================================
   AGENDA DE PAGAMENTOS
   Junta contas fixas recorrentes + lançamentos pendentes
============================================================ */
var Agenda = {
  ocorrencias: function(ym){
    var out = [], hoje = U.hoje(), dias = U.diasNoMes(ym);

    Store.dados.contas.forEach(function(c){
      if(c.ativo===false) return;
      var data;
      if(c.recorrencia==='unica'){
        if(U.ym(c.data)!==ym) return;
        data = c.data;
      }else{
        if(c.inicio && ym < c.inicio) return;
        if(c.fim && ym > c.fim) return;
        data = ym+'-'+String(Math.min(U.n(c.dia,1)||1, dias)).padStart(2,'0');
      }
      var pago = !!(c.pagos && c.pagos[ym]);
      out.push({
        chave:'c:'+c.id+':'+ym, origem:'conta', refId:c.id, ym:ym,
        nome:c.nome, valor:U.n(c.valor), data:data, tipo:c.tipo||'despesa',
        grupo:c.grupo||'operacional', categoria:c.categoria||'',
        recorrente:c.recorrencia!=='unica',
        status: pago?'pago':(data<hoje?'atrasado':'aberto'), obs:c.obs||''
      });
    });

    Store.dados.lancamentos.forEach(function(l){
      if(l.status!=='pendente') return;
      if(U.ym(l.data)!==ym) return;
      out.push({
        chave:'l:'+l.id, origem:'lancamento', refId:l.id, ym:ym,
        nome:l.descricao||GRUPOS[l.grupo].nome, valor:U.n(l.valor), data:l.data,
        tipo:l.tipo, grupo:l.grupo, categoria:l.categoria||'', recorrente:false,
        status: l.data<hoje?'atrasado':'aberto', obs:l.obs||''
      });
    });

    return out.sort(function(a,b){ return a.data<b.data?-1:(a.data>b.data?1:0); });
  },

  proximos: function(dias){
    var hoje = new Date(), lista = [];
    var limite = new Date(hoje.getTime() + dias*86400000);
    var meses = {};
    meses[U.ymAtual()]=1; meses[U.somaMes(U.ymAtual(),1)]=1; meses[U.somaMes(U.ymAtual(),2)]=1;
    Object.keys(meses).forEach(function(ym){
      Agenda.ocorrencias(ym).forEach(function(o){
        if(o.status==='pago') return;
        if(o.data > U.iso(limite)) return;
        lista.push(o);
      });
    });
    return lista.sort(function(a,b){ return a.data<b.data?-1:1; });
  },

  resumo: function(ym){
    var oc = Agenda.ocorrencias(ym), hoje = U.hoje();
    var r = {aPagar:0, aReceber:0, pago:0, atrasado:0, semana:0, total:0, itens:oc.length};
    var em7 = U.iso(new Date(Date.now()+7*86400000));
    oc.forEach(function(o){
      if(o.status==='pago'){ r.pago += o.valor; return; }
      if(o.tipo==='despesa') r.aPagar += o.valor; else r.aReceber += o.valor;
      if(o.status==='atrasado') r.atrasado += o.valor;
      else if(o.data<=em7) r.semana += o.valor;
    });
    r.total = r.aPagar + r.pago;
    return r;
  },

  quitar: function(oc){
    if(oc.origem==='lancamento'){
      var l = Store.getLancamento(oc.refId);
      if(!l) return;
      l.status='pago';
      Store.commit('Marcado como pago');
      return;
    }
    var c = Store.getConta(oc.refId);
    if(!c) return;
    c.pagos = c.pagos||{};
    c.pagos[oc.ym] = U.hoje();
    Store.dados.lancamentos.push({
      id:U.id(), data:oc.data, tipo:oc.tipo, grupo:oc.grupo, categoria:oc.categoria,
      descricao:oc.nome, canal:'', referencia:'', valor:oc.valor, pedidos:0, camisetas:0,
      pagamento:'', status:'pago', obs:'Gerado pela agenda de pagamentos',
      origem:'agenda', externoId:'', criadoEm:new Date().toISOString()
    });
    Store.commit('Pagamento registrado');
  },

  desfazer: function(oc){
    var c = Store.getConta(oc.refId);
    if(!c || !c.pagos) return;
    delete c.pagos[oc.ym];
    Store.dados.lancamentos = Store.dados.lancamentos.filter(function(l){
      return !(l.origem==='agenda' && l.data===oc.data && Math.abs(U.n(l.valor)-oc.valor)<0.01 && l.descricao===oc.nome);
    });
    Store.commit('Pagamento desfeito');
  }
};

Views._calendario = function(ym, oc){
  var dias = U.diasNoMes(ym), p = ym.split('-');
  var primeiro = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1).getDay();
  var porDia = {};
  oc.forEach(function(o){
    var d = parseInt(o.data.slice(8,10),10);
    if(!porDia[d]) porDia[d]={saida:0, entrada:0, atrasado:false, pago:0};
    if(o.status==='pago') porDia[d].pago += o.valor;
    else if(o.tipo==='despesa'){ porDia[d].saida += o.valor; if(o.status==='atrasado') porDia[d].atrasado=true; }
    else porDia[d].entrada += o.valor;
  });
  var hoje = U.hoje();
  var h = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px">';
  ['dom','seg','ter','qua','qui','sex','sáb'].forEach(function(d){
    h += '<div style="font-size:10.5px;color:var(--texto-fraco);text-align:center;padding-bottom:2px">'+d+'</div>';
  });
  for(var i=0;i<primeiro;i++) h += '<div></div>';
  for(var d=1; d<=dias; d++){
    var iso = ym+'-'+String(d).padStart(2,'0');
    var x = porDia[d];
    var borda = x && x.atrasado ? 'var(--rubro)' : (x && x.saida>0 ? 'var(--linha-forte)' : 'var(--linha)');
    var fundo = iso===hoje ? '#fdf7f0' : '#fff';

var Integra = {
  cfg: function(){ return Store.dados.integracoes; },

  url: function(rota, params){
    var base = (Integra.cfg().proxyUrl||'').replace(/\/+$/,'');
    if(!base) return null;
    var q = Object.keys(params||{}).map(function(k){ return k+'='+encodeURIComponent(params[k]); }).join('&');
    return base+'/'+rota+(q?'?'+q:'');
  },

  sincronizar: function(fonte, ym, aoTerminar, silencioso){
    var c = Integra.cfg();
    var rota = {loja:'vendas', ads:'ads', frete:'frete'}[fonte];
    var dias = U.diasNoMes(ym);
    var u = Integra.url(rota, {de: ym+'-01', ate: ym+'-'+dias});
    if(!u){ UI.toast('Configure primeiro o endereço do conector.'); return; }

    fetch(u, {headers: c.chave ? {'x-arcanju-key': c.chave} : {}})
      .then(function(res){
        if(!res.ok) throw new Error('O conector respondeu com erro '+res.status+'.');
        return res.json();
      })
      .then(function(json){
        var linhas = Array.isArray(json) ? json : (json.dados||json.data||[]);
        var novos=0, atualizados=0;
        linhas.forEach(function(x){
          var l = Integra.mapear(fonte, x);
          if(!l) return;
          var r = Store.upsertExterno(l);
          if(r==='novo') novos++; else atualizados++;
          if(fonte==='ads') Integra.guardarCampanha(x, l);
        });
        c[fonte].ativo = true;
        c[fonte].ultima = new Date().toISOString();
        if(silencioso){ Store.salvar(); }
        else Store.commit(novos+' novo(s) e '+atualizados+' atualizado(s) de '+U.nomeMes(ym));
        if(aoTerminar) aoTerminar(null, {novos:novos, atualizados:atualizados});
      })
      .catch(function(e){
        var msg = e.message||'falha';
        if(/Failed to fetch|NetworkError/i.test(msg)){
          msg = 'Não foi possível falar com o conector. Verifique o endereço, se ele está no ar e se libera CORS para este arquivo.';
        }
        UI.toast(msg);
        if(aoTerminar) aoTerminar(e);
      });
  },

  guardarCampanha: function(x, l){
    var nome = x.campanha || l.descricao || 'Sem nome';
    var data = String(x.data).slice(0,10);
    Store.upsertCampanha({
      chave: data+'|'+nome,
      ym: U.ym(data), data: data, campanha: nome,
      gasto: U.n(x.valor),
      compras: U.n(x.compras),
      receita: U.n(x.valorCompras!==undefined?x.valorCompras:x.receita),
      cliques: U.n(x.cliques), impressoes: U.n(x.impressoes)
    });
  },

  /* traz vários meses de uma vez */
  importarHistorico: function(fonte, meses, aoTerminar){
    var lista = [], ym = U.ymAtual();
    for(var i=0;i<meses;i++){ lista.push(U.somaMes(ym, -i)); }
    var i2 = 0, totalNovos = 0, erros = 0;
    (function proximo(){
      if(i2>=lista.length){
        Store.commit('Histórico importado: '+totalNovos+' registro(s) novo(s)'+(erros?' · '+erros+' mês(es) com erro':''));
        if(aoTerminar) aoTerminar();
        return;
      }
      var m = lista[i2++];
      UI.toast('Buscando '+U.nomeMes(m)+'…');
      Integra.sincronizar(fonte, m, function(err, r){
        if(err) erros++; else totalNovos += (r?r.novos:0);
        setTimeout(proximo, 350);
      }, true);
    })();
  },

  mapear: function(fonte, x){
    var id = String(x.id||x.numero||x.pedido||x.referencia||'');
    /* número visível do pedido (o de 4 dígitos). O id interno continua
       sendo a chave de deduplicação, mas não é o que aparece na tela. */
    var numero = String(x.referencia||x.numero||x.pedido||id);
    if(fonte==='loja'){
      if(!x.data || x.valor===undefined) return null;
      return {
        data:String(x.data).slice(0,10), tipo:'receita', grupo:'vendas',
        categoria:x.categoria||'Venda online', descricao:x.descricao||('Pedido #'+numero),
        canal:x.canal||'Loja (Nuvemshop)', referencia:numero, valor:U.n(x.valor),
        freteCobrado:U.n(x.freteCobrado), valorBruto:U.n(x.valorBruto), desconto:U.n(x.desconto),
        uf:(x.uf||'').toUpperCase(),
        pedidos:U.n(x.pedidos,1)||1, camisetas:U.n(x.camisetas), pagamento:x.pagamento||'',
        status:(x.status==='pendente'?'pendente':'pago'), obs:'', origem:'loja', externoId:id
      };
    }
    if(fonte==='ads'){
      if(!x.data || x.valor===undefined) return null;
      return {
        data:String(x.data).slice(0,10), tipo:'despesa', grupo:'marketing',
        categoria:x.plataforma||'Meta Ads', descricao:x.campanha||'Investimento em anúncios',
        canal:'', referencia:'', valor:U.n(x.valor), pedidos:0, camisetas:0,
        pagamento:'', status:'pago', obs:'', origem:'ads', externoId:id||('ads-'+String(x.data).slice(0,10)+'-'+(x.campanha||''))
      };
    }
    if(fonte==='frete'){
      if(!x.data || x.valor===undefined) return null;
      return {
        data:String(x.data).slice(0,10), tipo:'despesa', grupo:'frete',
        categoria:x.categoria||'Frete de envio', descricao:x.descricao||('Frete pedido #'+numero),
        canal:'', referencia:numero, valor:U.n(x.valor), pedidos:0, camisetas:0,
        pagamento:'', status:'pago', obs:'', origem:'frete', externoId:id||('frete-'+String(x.data).slice(0,10))
      };
    }
    return null;
  }
};

Views.campanhas = function(){
  var ym = UI.ym;
  var linhas = Store.dados.campanhas.filter(function(c){ return c.ym===ym; });
  var a = Calc.apurar(ym);

  if(!linhas.length){
    return UI.vazio('Sem dados de campanha em '+U.nomeMes(ym),
      'Esta tela é alimentada pela Meta: gasto, compras e receita por campanha. Conecte a fonte de anúncios em Integrações ou importe o relatório exportado do Gerenciador.',
      '<button class="btn" data-ir="integracoes">Abrir Integrações</button>');
  }

  var mapa = {};
  linhas.forEach(function(c){
    if(!mapa[c.campanha]) mapa[c.campanha] = {campanha:c.campanha, gasto:0, compras:0, receita:0, cliques:0, impressoes:0};
    var m = mapa[c.campanha];
    m.gasto+=U.n(c.gasto); m.compras+=U.n(c.compras); m.receita+=U.n(c.receita);
    m.cliques+=U.n(c.cliques); m.impressoes+=U.n(c.impressoes);
  });
  var camps = Object.keys(mapa).map(function(k){
    var m = mapa[k];
    m.cpa = U.div(m.gasto, m.compras);
    m.roas = U.div(m.receita, m.gasto);
    m.ticket = U.div(m.receita, m.compras);
    return m;
  }).sort(function(x,y){ return y.gasto-x.gasto; });

  var tot = camps.reduce(function(s,c){
    s.gasto+=c.gasto; s.compras+=c.compras; s.receita+=c.receita; return s;
  }, {gasto:0, compras:0, receita:0});
  tot.cpa = U.div(tot.gasto, tot.compras);
  tot.roas = U.div(tot.receita, tot.gasto);

  /* ROAS mínimo estrutural, vindo da oferta padrão */
  var ref = Calc.simular({camisetas:U.n(Calc.cfg().camisetasPorPedidoPadrao,2)||2, preco:a.ticket||239, freteGratis:true, modoMkt:'pct', marketingPct:U.n(Calc.cfg().marketingBase)});
  var roasMin = ref.roasMinAlvo;
  var cpaMax = ref.cpaMaxAlvo;

  var h='';
  h += '<div class="veredito '+(tot.roas>=roasMin?'':'atencao')+'" style="margin-bottom:16px">'+
    '<div class="veredito-frase">'+(tot.roas>=roasMin
      ? 'O tráfego está pagando a conta.'
      : 'O tráfego está acima do que a oferta suporta.')+'</div>'+
    '<div class="veredito-apoio">ROAS de '+U.num(tot.roas,2)+' contra o mínimo de '+U.num(roasMin,2)+
      ' necessário para manter '+U.pct(Calc.cfg().metaMargem,0)+' de margem no ticket atual. '+
      'CPA de '+U.brl(tot.cpa)+' contra o teto de '+U.brl(cpaMax)+'.</div></div>';

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Investido no mês', val:U.brl(tot.gasto,0), destaque:true, nota:camps.length+' campanha(s)'})+
    UI.kpi({rot:'Compras atribuídas', val:U.num(tot.compras), pequeno:true, nota:'segundo a Meta'})+
    UI.kpi({rot:'ROAS', val:U.num(tot.roas,2), destaque:true, pt:tot.roas>=roasMin?'ok':'cr', nota:'mínimo '+U.num(roasMin,2)})+
    UI.kpi({rot:'CPA', val:U.brl(tot.cpa), pequeno:true, pt:tot.cpa<=cpaMax?'ok':'cr', nota:'teto '+U.brl(cpaMax,0)})+
  '</div>';

  h += '<div class="grade g2" style="margin-bottom:12px;align-items:start">'+
    '<div class="cartao"><div class="cartao-tit">Investimento por campanha</div>'+
      Chart.barras(camps.map(function(c){ return {rot:c.campanha, valor:c.gasto, cor:'#5a332e'}; }))+'</div>'+
    '<div class="cartao"><div class="cartao-tit">ROAS por campanha</div>'+
      '<div class="cartao-sub">A linha de corte é '+U.num(roasMin,2)+'</div>'+
      Chart.barras(camps.map(function(c){
        return {rot:c.campanha, valor:c.roas, cor:c.roas>=roasMin?'#1f9d6c':'#a8322c', pct:c.roas};
      }), {pct:true})+'</div>'+
  '</div>';

  h += '<div class="tabela-env"><table><thead><tr><th>Campanha</th><th class="r">Investido</th><th class="r">Compras</th>'+
    '<th class="r">Receita</th><th class="r">CPA</th><th class="r">ROAS</th><th class="r">Ticket</th><th class="c">Veredito</th></tr></thead><tbody>';
  camps.forEach(function(c){
    var ok = c.roas>=roasMin, quase = c.roas>=roasMin*0.8;
    h += '<tr><td style="font-weight:500">'+U.esc(c.campanha)+'</td>'+
      '<td class="r">'+U.brl(c.gasto,0)+'</td><td class="r">'+U.num(c.compras)+'</td>'+
      '<td class="r">'+U.brl(c.receita,0)+'</td>'+
      '<td class="r">'+(c.compras?U.brl(c.cpa):'—')+'</td>'+
      '<td class="r" style="font-weight:600">'+U.num(c.roas,2)+'</td>'+
      '<td class="r">'+(c.compras?U.brl(c.ticket,0):'—')+'</td>'+
      '<td class="c"><span class="etq '+(ok?'rec':(quase?'pen':'fal'))+'">'+
        (ok?'escalar':(quase?'observar':'cortar'))+'</span></td></tr>';
  });
  h += '<tr class="total"><td>Total</td><td class="r">'+U.brl(tot.gasto,0)+'</td><td class="r">'+U.num(tot.compras)+'</td>'+
    '<td class="r">'+U.brl(tot.receita,0)+'</td><td class="r">'+U.brl(tot.cpa)+'</td>'+
    '<td class="r">'+U.num(tot.roas,2)+'</td><td class="r">'+U.brl(U.div(tot.receita,tot.compras),0)+'</td><td></td></tr>';
  h += '</tbody></table></div>';

  h += '<div class="info" style="margin-top:12px">Compras e receita vêm da atribuição da Meta, que costuma ser mais generosa que a realidade. '+
    'O número que manda é o do Dashboard, apurado pelas vendas reais. Use esta tela para comparar campanhas entre si, não para medir o resultado da empresa.</div>';
  return h;
};

/* ---------- Importação com mapeamento de colunas ---------- */
function parseCSV(texto){
  var linhas = texto.replace(/^\ufeff/,'').split(/\r?\n/).filter(function(l){ return l.trim(); });
  if(!linhas.length) return null;
  var sep = (linhas[0].split(';').length > linhas[0].split(',').length) ? ';' : ',';
  function quebrar(linha){
    var out=[], atual='', aspas=false;
    for(var k=0;k<linha.length;k++){
      var ch=linha[k];
      if(ch==='"'){ if(aspas && linha[k+1]==='"'){ atual+='"'; k++; } else aspas=!aspas; }
      else if(ch===sep && !aspas){ out.push(atual); atual=''; }
      else atual+=ch;
    }
    out.push(atual); return out;
  }
  var cab = quebrar(linhas[0]).map(function(c){ return c.trim(); });
  var dados = linhas.slice(1).map(function(l){
    var c = quebrar(l), o = {};
    cab.forEach(function(k,i){ o[k]=(c[i]||'').trim(); });
    return o;
  });
  return {cab:cab, dados:dados};
}

function valorBR(v){
  if(v===undefined||v===null) return 0;
  var s = String(v).replace(/[R$\s]/g,'');
  if(s.indexOf(',')>=0) s = s.replace(/\./g,'').replace(',','.');
  var n = parseFloat(s.replace(/[^0-9.\-]/g,''));
  return isNaN(n)?0:n;
}
function dataISO(v){
  if(!v) return '';
  var s = String(v).trim().slice(0,10);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  var m = s.match(/^(\d{2})[\/\-](\d{2})[\/\-](\d{4})$/);
  if(m) return m[3]+'-'+m[2]+'-'+m[1];
  var d = new Date(v);
  return isNaN(d.getTime()) ? '' : U.iso(d);
}

Form.importarFonte = function(fonte, texto){
  var p = parseCSV(texto);
  if(!p || !p.dados.length){ UI.toast('Não consegui ler esse arquivo.'); return; }
  var campos = {
    loja:[['data','Data do pedido',1],['valor','Valor total',1],['referencia','Número do pedido',0],
          ['pedidos','Quantidade de pedidos',0],['camisetas','Quantidade de peças',0],['canal','Canal',0]],
    ads:[['data','Data',1],['valor','Valor gasto',1],['campanha','Campanha',0]],
    frete:[['data','Data',1],['valor','Custo do frete',1],['referencia','Pedido',0]]
  }[fonte];

  function palpite(alvo){
    var dicas = {
      data:['data','date','dia','início','inicio','criado'],
      valor:['total','valor','amount','spend','gasto','custo','preço','preco'],
      referencia:['pedido','número','numero','order','id'],
      pedidos:['pedidos','orders'],
      camisetas:['quantidade','qtd','peças','pecas','itens','quantity'],
      canal:['canal','origem','channel'],
      campanha:['campanha','campaign','anúncio','anuncio']
    }[alvo]||[];
    var achou = '';
    p.cab.forEach(function(c){
      if(achou) return;
      var lc = c.toLowerCase();
      if(dicas.some(function(d){ return lc.indexOf(d)>=0; })) achou = c;
    });
    return achou;
  }

  var corpo = '<div class="info">Encontrei <b>'+p.dados.length+'</b> linha(s). Diga qual coluna é cada coisa — o resto o sistema calcula.</div>'+
    campos.map(function(f){
      var g = palpite(f[0]);
      return '<div class="campo"><label>'+f[1]+(f[2]?'':' (opcional)')+'</label><select data-mapa="'+f[0]+'">'+
        '<option value="">—</option>'+
        p.cab.map(function(c){ return '<option value="'+U.esc(c)+'"'+(c===g?' selected':'')+'>'+U.esc(c)+'</option>'; }).join('')+
      '</select></div>';
    }).join('')+
    (fonte==='loja' ? '<div class="info">Se o arquivo tiver uma linha por produto do pedido, marque o número do pedido em “Número do pedido”: o sistema soma as linhas do mesmo pedido e conta como um pedido só.</div>' : '');

  UI.modal({
    titulo:'Importar arquivo',
    larga:true,
    corpo: corpo,
    rodape:'<button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="impOk">Importar</button>',
    aoAbrir: function(el, fechar){
      el.querySelector('#impOk').addEventListener('click', function(){
        var mapa = {};
        el.querySelectorAll('[data-mapa]').forEach(function(s){ mapa[s.getAttribute('data-mapa')] = s.value; });
        if(!mapa.data || !mapa.valor){ UI.toast('Data e valor são obrigatórios.'); return; }

        var linhas = p.dados.map(function(d){
          return {
            data: dataISO(d[mapa.data]),
            valor: valorBR(d[mapa.valor]),
            referencia: mapa.referencia ? String(d[mapa.referencia]||'') : '',
            pedidos: mapa.pedidos ? valorBR(d[mapa.pedidos]) : 0,
            camisetas: mapa.camisetas ? valorBR(d[mapa.camisetas]) : 0,
            canal: mapa.canal ? String(d[mapa.canal]||'') : '',
            campanha: mapa.campanha ? String(d[mapa.campanha]||'') : ''
          };
        }).filter(function(x){ return x.data && x.valor; });

        if(fonte==='loja' && mapa.referencia){
          var agr = {};
          linhas.forEach(function(x){
            var k = x.referencia||('s/ref-'+x.data);
            if(!agr[k]) agr[k] = {data:x.data, valor:0, referencia:x.referencia, pedidos:1, camisetas:0, canal:x.canal};
            agr[k].valor += x.valor;
            agr[k].camisetas += x.camisetas;
            if(x.data < agr[k].data) agr[k].data = x.data;
          });
          linhas = Object.keys(agr).map(function(k){ return agr[k]; });
        }

        var novos=0, atualizados=0;
        linhas.forEach(function(x){
          var l = Integra.mapear(fonte, {
            id: x.referencia || (fonte+'-'+x.data+'-'+(x.campanha||'')+'-'+x.valor),
            data:x.data, valor:x.valor, pedidos:x.pedidos||1, camisetas:x.camisetas,
            canal:x.canal, campanha:x.campanha, referencia:x.referencia, status:'pago'
          });
          if(!l) return;
          var r = Store.upsertExterno(l);
          if(r==='novo') novos++; else atualizados++;
        });
        var c = Integra.cfg();
        c[fonte].ativo = true; c[fonte].ultima = new Date().toISOString();
        Store.commit(novos+' novo(s), '+atualizados+' atualizado(s)');
        fechar(); App.render();
      });
    }
  });
};

var Humor = {
  abertura: [
    'Nível de humor: 70%. Posso baixar, mas aí vira só planilha.',
    'Passei a noite somando. Não reclamo — é literalmente o que eu faço.',
    'Se os números estiverem ruins, não fui eu. Eu só conto.',
    'Projeto o futuro com régua, não com bola de cristal. Ajuste as expectativas.',
    'Nenhum número foi maltratado na preparação deste painel.',
    'Nível de sinceridade: 100%. Esse aqui não é ajustável.',
    'Já conferi tudo três vezes. Estava sem nada melhor para fazer.',
    'Pronto para trabalhar. Presumo que você também.',
    'Faturamento é vaidade, lucro é sanidade, caixa é sobrevivência. Eu cuido dos três.',
    'Eu não durmo, não esqueço e não arredondo para cima. Bom dia.'
  ],
  painel: [
    'Se eu pudesse dar palpite comercial, daria. Fico nos números.',
    'Margem não melhora sozinha. Já testei, esperando.',
    'Tudo aqui foi calculado duas vezes. A segunda por teimosia.',
    'Continuo achando que reserva é a parte mais chata e mais importante.',
    'Eu não tenho opinião sobre estampas. Tenho sobre custo por pedido.',
    'Nenhuma novidade dramática hoje. Isso costuma ser bom sinal.'
  ],
  nivel: function(){ return U.n(Calc.cfg().humor, 70); },
  frase: function(lista){
    var n = Humor.nivel();
    if(n<=0) return '';
    var arr = Humor[lista]||Humor.abertura;
    /* com humor baixo, só as falas mais secas (as primeiras) */
    var corte = Math.max(1, Math.round(arr.length * U.clamp(n,10,100)/100));
    return arr[Math.floor(Math.random()*corte)];
  }
};

/* ============================================================
   TELA DE ACESSO
============================================================ */
var Trava = {
  async sha(txt){
    if(window.crypto && crypto.subtle){
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
    return null;
  },
  iniciar: function(aoLiberar){
    var el = document.getElementById('trava');
    var frase = document.getElementById('travaFrase');
    var campo = document.getElementById('travaSenha');
    var erro = document.getElementById('travaErro');
    var tentativas = 0;

    frase.textContent = Humor.frase('abertura');

    if(sessionStorage.getItem('arcanju_ok')==='1'){ Trava.liberar(el, aoLiberar); return; }

    function tentar(){
      erro.textContent = '';
      var v = campo.value;
      if(!v){ erro.textContent = 'Digite a senha.'; return; }
      Trava.sha(v).then(function(h){
        var certo = h ? (h===SENHA_HASH) : false;
        if(certo){
          sessionStorage.setItem('arcanju_ok','1');
          Trava.liberar(el, aoLiberar);
        }else{
          tentativas++;
          campo.value=''; campo.focus();
          erro.textContent = tentativas>=3
            ? 'Ainda não. Nível de paciência: alto, mas não infinito.'
            : 'Senha incorreta.';
        }
      }).catch(function(){
        erro.textContent = 'Este navegador não consegue validar a senha. Abra o painel por https.';
      });
    }
    document.getElementById('travaEntrar').addEventListener('click', tentar);
    campo.addEventListener('keydown', function(e){ if(e.key==='Enter') tentar(); });
    setTimeout(function(){ campo.focus(); }, 120);
  },
  liberar: function(el, aoLiberar){
    el.classList.add('saindo');
    setTimeout(function(){ el.remove(); }, 360);
    aoLiberar();
  }
};

      var t = e.target.closest('[data-tela],[data-aba],[data-ir],[data-acao],[data-editar],[data-excluir],'+
        '[data-mes],[data-modo],[data-padrao],[data-editProduto],[data-delProduto],[data-editInsumo],[data-delInsumo],'+
        '[data-delCanal],[data-delOferta],[data-carregar],[data-delReserva],[data-sq],[data-smk],'+
        '[data-editConta],[data-delConta],[data-quitar],[data-desfazer],[data-sinc],[data-imp],[data-hist],'+
        '[data-delFaixa],[data-delVigencia]');
      if(!t) return;
      var g = function(a){ return t.getAttribute(a); };

      if(g('data-tela')){
        UI.tela = g('data-tela'); if(UI.tela==='financeiro') UI.aba='dashboard';
        rail.classList.remove('aberto'); fundo.classList.remove('on');
        App.render(); return;
      }
      if(g('data-aba')){ UI.aba = g('data-aba'); App.render(); return; }
      if(g('data-ir')){ App.ir(g('data-ir')); return; }
      if(g('data-acao')){ App.ir(g('data-acao')); return; }
      if(g('data-mes')){ UI.ym = g('data-mes'); App.render(); return; }

      if(g('data-editar')){ Form.lancamento(g('data-editar')); return; }
      if(g('data-excluir')){
        var l = Store.getLancamento(g('data-excluir'));
        UI.confirmar('Excluir lançamento?',
          '<b>'+U.esc(l.descricao||'(sem descrição)')+'</b> — '+U.brl(l.valor)+' em '+U.dataBr(l.data)+'. O dashboard, a projeção e o caixa serão recalculados.',
          function(){ Store.delLancamento(l.id); App.render(); });
        return;
      }

      if(g('data-modo')){
        var p = g('data-modo').split('|');
        Calc.cfg().modo[p[0]] = p[1];
        Store.commit('Modo atualizado'); App.render(); return;
      }
      if(g('data-padrao')){
        Calc.cfg().produtos.forEach(function(x){ x.padrao = (x.id===g('data-padrao')); });
        Store.commit('Produto padrão atualizado'); App.render(); return;
      }
      if(g('data-editProduto')){ Form.produto(g('data-editProduto')); return; }
      if(g('data-delProduto')){
        var idp = g('data-delProduto');
        UI.confirmar('Excluir produto?','O custo dele deixa de ser usado no CMV e no simulador.', function(){
          var c = Calc.cfg();
          c.produtos = c.produtos.filter(function(x){ return x.id!==idp; });
          if(!c.produtos.some(function(x){ return x.padrao; }) && c.produtos.length) c.produtos[0].padrao=true;
          Store.commit('Produto excluído'); App.render();
        });
        return;
      }
      if(g('data-editInsumo')){ Form.insumo(g('data-editInsumo')); return; }
      if(g('data-delInsumo')){
        var idi = g('data-delInsumo');
        UI.confirmar('Excluir insumo?','Ele sai do custo por pedido e do simulador.', function(){
          var c = Calc.cfg();
          c.insumos = c.insumos.filter(function(x){ return x.id!==idi; });
          Store.commit('Insumo excluído'); App.render();
        });
        return;
      }
      if(g('data-delCanal')){
        var ic = parseInt(g('data-delCanal'),10);
        Calc.cfg().canais.splice(ic,1); Store.commit('Canal removido'); App.render(); return;
      }
      if(g('data-delOferta')){
        var ido = g('data-delOferta');
        Store.dados.ofertas = Store.dados.ofertas.filter(function(x){ return x.id!==ido; });
        Store.commit('Cenário excluído'); App.render(); return;
      }
      if(g('data-carregar')){
        var o = Store.dados.ofertas.find(function(x){ return x.id===g('data-carregar'); });
        if(o){ Views.sim = Object.assign({}, o, {precos:o.precos||{}}); App.render(); }
        return;
      }
      if(g('data-delReserva')){
        var idr = g('data-delReserva');
        Store.dados.reservaMovs = Store.dados.reservaMovs.filter(function(x){ return x.id!==idr; });
        Store.commit('Movimentação removida'); App.render(); return;
      }
      if(g('data-sq')){ Views.sim.camisetas = parseInt(g('data-sq'),10); App.render(); return; }
      if(g('data-smk')){ Views.sim.modoMkt = g('data-smk'); App.render(); return; }

      if(g('data-editConta')){ Form.conta(g('data-editConta')); return; }
      if(g('data-delConta')){
        var idc = g('data-delConta');
        var ct = Store.getConta(idc);
        UI.confirmar('Excluir conta?','<b>'+U.esc(ct.nome)+'</b> deixa de aparecer na agenda. Os pagamentos já lançados continuam no Financeiro.',
          function(){ Store.delConta(idc); App.render(); });
        return;
      }
      if(g('data-quitar')||g('data-desfazer')){
        var chave = g('data-quitar')||g('data-desfazer');
        var ym = chave.indexOf('c:')===0 ? chave.split(':')[2] : UI.ym;
        var oc = Agenda.ocorrencias(ym).find(function(x){ return x.chave===chave; });
        if(!oc){
          var alt = Agenda.proximos(60).find(function(x){ return x.chave===chave; });
          oc = alt;
        }
        if(!oc){ UI.toast('Não encontrei esse compromisso.'); return; }
        if(g('data-quitar')) Agenda.quitar(oc); else Agenda.desfazer(oc);
        App.render(); return;
      }

      if(g('data-sinc')){
        var f = g('data-sinc');
        if(!Integra.cfg().proxyUrl){
          UI.toast('Configure o endereço do conector primeiro — ou use “Importar arquivo”.');
          return;
        }
        UI.toast('Buscando dados…');
        Integra.sincronizar(f, UI.ym, function(err){ if(!err) App.render(); });
        return;
      }
      if(g('data-delFaixa')){
        var ifx = parseInt(g('data-delFaixa'),10);
        var cf = Calc.cfg();
        if(cf.embalagemFaixas.length>1){ cf.embalagemFaixas.splice(ifx,1); Store.salvar(); App.render(); }
        else UI.toast('Deixe ao menos uma faixa.');
        return;
      }
      if(g('data-delVigencia')){
        var dv = g('data-delVigencia');
        UI.confirmar('Remover esta vigência?',
          'Os meses cobertos por ela voltam a usar os custos da vigência anterior.',
          function(){ Store.removerVigencia(dv); App.render(); });
        return;
      }
      if(g('data-hist')){
        var fh = g('data-hist');
        if(!Integra.cfg().proxyUrl){ UI.toast('Configure o conector primeiro — ou use “Importar arquivo”.'); return; }
        UI.confirmar('Trazer os últimos 12 meses?',
          'O painel vai pedir mês a mês ao conector e preencher o histórico. Registros já existentes são atualizados, não duplicados. Pode levar alguns segundos.',
          function(){ Integra.importarHistorico(fh, 12, function(){ App.render(); }); }, 'Trazer histórico');
        return;
      }
      if(g('data-imp')){
        var inp = document.getElementById('arqFonte');
        inp.setAttribute('data-fonte', g('data-imp'));
        inp.click(); return;
      }
    });

    /* checkbox de insumo ativo */
    document.addEventListener('change', function(e){
      var el = e.target.closest('[data-insumoAtivo]');
      if(!el) return;
      var id = el.getAttribute('data-insumoAtivo');
      var it = Calc.cfg().insumos.find(function(x){ return x.id===id; });
      if(it){ it.ativo = el.checked; Store.commit('Insumo atualizado'); App.render(); }
    });

    window.addEventListener('keydown', function(e){
      if(e.key==='n' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); Form.lancamento(); }
    });
  }
};

document.addEventListener('DOMContentLoaded', App.init);
})();
</script>
</body>
</html>
