Views.mkTermometro = function(){
  var ym = UI.ym, c = Mk.d().config;
  var serie = Calc.serieDiaria(ym);
  var fat=0, mkt=0, ped=0, diasCom=0;
  serie.forEach(function(d){ fat+=d.fat; mkt+=d.mkt; ped+=d.pedidos; if(d.fat||d.mkt) diasCom++; });
  var ticketReal = U.div(fat, ped);
  var rg = Mk.regua(ticketReal || 0);
  var pct = U.div(mkt, fat)*100, roas = U.div(fat, mkt), cpa = U.div(mkt, ped);
  var nv = Mk.nivel(pct, rg.teto);
  var folga = fat*rg.teto/100 - mkt;
  var hoje = U.hoje(), ontem = Mk.somaDias(hoje,-1);
  var dHoje = serie.find(function(d){ return d.data===hoje; }), dOntem = serie.find(function(d){ return d.data===ontem; });
  var orc = Mk.total(Mk.base()), orcT = orc + Mk.total(Mk.testes());
  var fatNec = rg.teto>0 ? orc/(rg.teto/100) : 0, fatNecT = rg.teto>0 ? orcT/(rg.teto/100) : 0;
  var tk = rg.ticket || Mk.num(c.ticket);

  var frase = !fat && !mkt ? 'Sem vendas nem investimento lançados em '+U.nomeMes(ym)+'.'
    : nv==='ok' ? 'O marketing está dentro do teto.'
    : nv==='at' ? 'O marketing está encostando no teto.'
    : 'O marketing passou do teto.';
  var h = '<div class="veredito '+(nv==='cr'?'critico':(nv==='at'?'atencao':(nv==='nu'?'neutro':'')))+'" style="margin-bottom:16px">'+
    '<div class="veredito-frase">'+frase+'</div>'+
    '<div class="veredito-apoio">No mês, '+U.pct(pct,1)+' do faturamento foi para marketing, contra o teto de '+U.pct(rg.teto,1)+'. '+
      (folga>=0 ? 'Ainda cabem <b>'+U.brl(folga,0)+'</b> de anúncios sem estourar o teto com o que já foi vendido.'
                : 'O mês está <b>'+U.brl(-folga,0)+'</b> acima do teto.')+'</div>'+
    '<div class="veredito-linha" style="align-items:flex-end">'+
      '<div class="campo" style="margin:0"><label>Teto de marketing (% do faturamento) '+UI.ajuda('Quanto do faturamento pode ir para anúncios. Mude quando quiser: ROAS mínimo, CPA máximo e as cores da página se recalculam.')+'</label>'+
        '<input type="number" step="0.5" min="1" max="100" data-mkset="config.teto" value="'+c.teto+'" style="width:110px"></div>'+
      '<div class="campo" style="margin:0"><label>Ticket de referência '+UI.ajuda('Usado quando o mês ainda não tem vendas. Com vendas, vale o ticket real.')+'</label>'+
        '<input type="number" step="0.01" min="0" data-mkset="config.ticket" value="'+c.ticket+'" style="width:120px"></div>'+
    '</div></div>';

  h += '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'% do faturamento no mês', val:U.pct(pct,1), destaque:true, pt:nv, nota:'teto '+U.pct(rg.teto,1)})+
    UI.kpi({rot:'ROAS do mês', val:U.num(roas,2), pt:roas? (roas>=rg.roasMin?'ok':'cr'):'nu', nota:'mínimo '+U.num(rg.roasMin,2), ajuda:'Faturamento real ÷ investimento. ROAS mínimo = 100 ÷ teto.'})+
    UI.kpi({rot:'CPA do mês', val:ped?U.brl(cpa):'—', pequeno:true, pt:ped?(cpa<=rg.teto/100*tk?'ok':'cr'):'nu', nota:'máximo '+U.brl(rg.teto/100*tk)+' (ticket '+U.brl(tk,0)+')', ajuda:'Investimento ÷ pedidos reais. CPA máximo = ticket × teto.'})+
    UI.kpi({rot:'Investido no mês', val:U.brl(mkt,0), pequeno:true, nota:U.brl(fat,0)+' faturados · '+U.num(ped)+' pedidos'})+
  '</div>';

  var linhaDia = function(rot, d){
    if(!d || (!d.fat && !d.mkt)) return UI.kpi({rot:rot, val:'—', pequeno:true, nota:'sem dados ainda'});
    var p = U.div(d.mkt, d.fat)*100;
    return UI.kpi({rot:rot, val:U.pct(p,1), pequeno:true, pt:Mk.nivel(p, rg.teto),
      nota:'ROAS '+U.num(U.div(d.fat,d.mkt),2)+' · CPA '+(d.pedidos?U.brl(U.div(d.mkt,d.pedidos),0):'—')+' · '+U.num(d.pedidos)+' ped.'});
  };
  h += '<div class="grade g4" style="margin-bottom:12px">'+
    linhaDia('Hoje', dHoje)+ linhaDia('Ontem', dOntem)+
    UI.kpi({rot:'Faturamento mínimo/dia', val:U.brl(fatNec,0), pequeno:true, nota:'para a estrutura de '+U.brl(orc,0)+'/dia ≈ '+U.num(U.div(fatNec,tk),1)+' pedidos', ajuda:'Orçamento diário ÷ teto. Abaixo disso, o dia estoura o teto.'})+
    UI.kpi({rot:'Com os testes ligados', val:U.brl(fatNecT,0), pequeno:true, nota:U.brl(orcT,0)+'/dia ≈ '+U.num(U.div(fatNecT,tk),1)+' pedidos'})+
  '</div>';

  if(serie.some(function(d){ return d.fat||d.mkt; })){

      '<td class="r">'+(d.mkt?U.num(U.div(d.fat,d.mkt),2):'—')+'</td>'+
      '<td class="r">'+(d.pedidos?U.brl(U.div(d.mkt,d.pedidos),0):'—')+'</td>'+
      '<td class="r">'+(d.pedidos?U.brl(U.div(d.fat,d.pedidos),0):'—')+'</td>'+

      '<td class="r">'+(m.impressoes?U.brl(U.div(m.gasto,m.impressoes)*1000,2):'—')+'</td>'+
      '<td class="c"><span class="pt '+nv+'"></span></td></tr>';
  });
  var pt = U.div(t.mkt,t.fat)*100;
  h += '<tr class="total"><td>Mês</td><td class="r">'+U.brl(t.mkt,0)+'</td><td class="r">'+U.brl(t.fat,0)+'</td><td class="r">'+U.num(t.ped)+'</td>'+

    '<td class="r">'+(t.ped?U.brl(U.div(t.fat,t.ped),0):'—')+'</td><td></td><td></td><td class="c"><span class="pt '+Mk.nivel(pt,rg.teto)+'"></span></td></tr>';
  h += '</tbody></table></div><div class="info" style="margin-top:12px">Verde: até 85% do teto. Amarelo: entre 85% e o teto. Vermelho: acima do teto de '+U.pct(rg.teto,1)+'. CTR e CPM vêm da Meta.</div>';

};

Views.mkEstrutura = function(){
  var d = Mk.d(), base = Mk.base(), tot = Mk.total(base), testes = Mk.testes();
  var real = Mk.real(UI.ym), porId = {}; real.forEach(function(r){ porId[r.id]=r; });
  var etapa = {topo:0, meio:0, fundo:0};
  base.forEach(function(e){ etapa[e.etapa] += Mk.num(e.valor); });
  var rg = Mk.regua();

  var h = '<div class="grade g4" style="margin-bottom:12px">'+
    UI.kpi({rot:'Estrutura validada', val:U.brl(tot,0)+'/dia', destaque:true, nota:base.length+' campanhas · '+U.brl(tot*30,0)+'/mês'})+
    ['topo','meio','fundo'].map(function(k){
      return UI.kpi({rot:Mk.ETAPAS[k]+' de funil', val:U.pct(U.div(etapa[k],tot)*100,1), pequeno:true, nota:U.brl(etapa[k],0)+'/dia'});
    }).join('')+'</div>';

  h += '<div class="tabela-env" style="margin-bottom:12px"><table><thead><tr><th>Campanha</th><th>Etapa</th><th class="r">R$/dia</th><th class="r">% estrutura</th>'+
    '<th>Filtro no nome (Meta) '+UI.ajuda('Parte do nome da campanha no Gerenciador. É assim que o painel liga esta linha aos dados reais da Meta.')+'</th>'+
    '<th class="c">Teste</th><th class="c">Ativa</th><th class="r">Gasto mês</th><th class="r">CPA</th><th class="r">ROAS</th><th></th></tr></thead><tbody>';
  d.estrutura.forEach(function(e, i){
    var r = porId[e.id]||{};
    h += '<tr'+(e.ativa?'':' style="opacity:.55"')+'><td><input data-mkset="estrutura.'+i+'.nome" value="'+U.esc(e.nome)+'" style="min-width:220px"></td>'+
      '<td><select data-mkset="estrutura.'+i+'.etapa" style="min-width:92px">'+Object.keys(Mk.ETAPAS).map(function(k){ return '<option value="'+k+'"'+(e.etapa===k?' selected':'')+'>'+Mk.ETAPAS[k]+'</option>'; }).join('')+'</select></td>'+
      '<td class="r"><input type="number" class="lg-num" step="1" min="0" data-mkset="estrutura.'+i+'.valor" value="'+e.valor+'"></td>'+
      '<td class="r">'+(e.teste||!e.ativa ? '<span class="etq pen">fora</span>' : U.pct(U.div(Mk.num(e.valor),tot)*100,1))+'</td>'+
      '<td><input data-mkset="estrutura.'+i+'.filtro" value="'+U.esc(e.filtro)+'" style="width:150px"></td>'+
      '<td class="c"><input type="checkbox" data-mkset="estrutura.'+i+'.teste"'+(e.teste?' checked':'')+'></td>'+
      '<td class="c"><input type="checkbox" data-mkset="estrutura.'+i+'.ativa"'+(e.ativa?' checked':'')+'></td>'+
      '<td class="r">'+(r.gasto?U.brl(r.gasto,0):'—')+'</td>'+
      '<td class="r">'+(r.compras?U.brl(r.cpa,0):'—')+'</td>'+
      '<td class="r">'+(r.gasto?'<span style="color:'+(r.roas>=rg.roasMin?'var(--verde)':'var(--rubro)')+';font-weight:600">'+U.num(r.roas,2)+'</span>':'—')+'</td>'+
      '<td class="c"><button class="btn sm perigo" data-mk="delEst" data-i="'+i+'">×</button></td></tr>';
  });
  h += '</tbody></table></div><button class="btn sec" data-mk="addEst" style="margin-bottom:18px">+ Campanha</button>';

  /* calculadora de escala */
  var alvo = Views._mkAlvo || Math.round(tot*1.2);
  var salto = U.div(alvo-tot, tot)*100, degrau = Mk.num(d.config.degrau);
  h += '<div class="cartao" style="margin-bottom:12px"><div class="cartao-tit">Calculadora de escala</div>'+
    '<div class="cartao-sub">Digite o novo orçamento diário da estrutura. O painel divide na mesma proporção que vendeu. Os testes ficam de fora.</div>'+
    '<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:10px 0">'+
      '<div class="campo" style="margin:0"><label>Novo total (R$/dia)</label><input type="number" id="mkAlvo" min="0" step="1" value="'+alvo+'" style="width:130px"></div>'+
      '<div class="campo" style="margin:0"><label>Degrau máximo (%)</label><input type="number" data-mkset="config.degrau" min="1" step="1" value="'+degrau+'" style="width:90px"></div>'+
      '<button class="btn sec" data-mk="calc">Calcular</button>'+
      '<button class="btn" data-mk="aplicar">Aplicar à estrutura</button></div>'+
    (salto>degrau ? '<div class="aviso">Aumento de '+U.pct(salto,0)+' de uma vez. Acima de '+U.pct(degrau,0)+' a campanha tende a voltar para a fase de aprendizado. Suba em degraus e espere 2 a 3 dias entre eles.</div>' : '')+
    '<div class="tabela-env"><table><thead><tr><th>Campanha</th><th class="r">Hoje</th><th class="r">Novo</th><th class="r">Diferença</th></tr></thead><tbody>'+
    base.map(function(e){
      var v = Math.round(Mk.num(e.valor)*U.div(alvo,tot));
      return '<tr><td>'+U.esc(e.nome)+'</td><td class="r">'+U.brl(Mk.num(e.valor),0)+'</td><td class="r" style="font-weight:600">'+U.brl(v,0)+'</td><td class="r">'+(v>=e.valor?'+':'')+U.brl(v-Mk.num(e.valor),0)+'</td></tr>';
    }).join('')+
    '<tr class="total"><td>Total</td><td class="r">'+U.brl(tot,0)+'</td><td class="r">'+U.brl(alvo,0)+'</td><td class="r">'+U.pct(salto,0)+'</td></tr></tbody></table></div>'+
    '<div class="info" style="margin-top:10px">Com '+U.brl(alvo,0)+'/dia, a loja precisa faturar pelo menos '+U.brl(rg.teto>0?alvo/(rg.teto/100):0,0)+'/dia para ficar no teto de '+U.pct(rg.teto,0)+'.</div></div>';

  /* testes × principal */
  if(testes.length){
    var princ = base.filter(function(e){ return e.etapa==='fundo'; }).sort(function(x,y){ return y.valor-x.valor; })[0];
    var rp = princ ? porId[princ.id] : null;
    h += '<div class="cartao"><div class="cartao-tit">Testes em andamento</div><div class="cartao-sub">Verba separada da estrutura. O teste vence se o CPA ficar abaixo da campanha principal.</div>';
    testes.forEach(function(e){
      var r = porId[e.id]||{};
      var ok = r.compras && rp && rp.compras && r.cpa < rp.cpa;
      h += '<div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--linha);flex-wrap:wrap"><div><b>'+U.esc(e.nome)+'</b><div style="font-size:12px;color:var(--texto-medio)">'+U.brl(Mk.num(e.valor),0)+'/dia · gasto no mês '+U.brl(r.gasto||0,0)+'</div></div>'+
        '<div style="font-size:13px">CPA '+(r.compras?U.brl(r.cpa,0):'—')+' vs principal '+(rp&&rp.compras?U.brl(rp.cpa,0):'—')+' '+
        (r.compras&&rp&&rp.compras ? '<span class="etq '+(ok?'rec':'fal')+'">'+(ok?'vencendo':'perdendo')+'</span>' : '<span class="etq pag">sem dados</span>')+'</div></div>';
    });
    h += '</div>';
  }
  return h;
};

Views.mkCiclo = function(){

Views.mkOrganico = function(){

      ord.map(function(p){
        return '<tr'+(p.data&&p.data<hoje&&p.status!=='publicado'?' style="background:var(--rubro-fundo)"':'')+'><td>'+(p.data?U.dataBr(p.data):'<span class="etq pag">ideia</span>')+'</td><td>'+TIPOS[p.tipo]+'</td><td>'+U.esc(p.tema)+'</td>'+
          '<td class="c"><select data-mkset="posts.'+ps.indexOf(p)+'.status">'+Object.keys(ST).map(function(k){ return '<option value="'+k+'"'+(p.status===k?' selected':'')+'>'+ST[k][0]+'</option>'; }).join('')+'</select></td>'+
          '<td class="c"><button class="btn sm perigo" data-mk="delPost" data-id="'+p.id+'">×</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  h += '<div class="campo" style="max-width:240px;margin-top:12px"><label>Meta de stories por dia</label><input type="number" min="0" step="1" data-mkset="config.storiesDia" value="'+d.config.storiesDia+'"></div>';
  return h;
};

/* ---------------- FORMULÁRIO DE CRIATIVO ---------------- */
Mk.formCri = function(id){
  var x = id ? Mk.d().criativos.find(function(c){ return c.id===id; }) : {etapa:'fundo', status:'teste', subida:U.hoje()};
  if(!x) return;
  var sel = function(nome, mapa, v){ return '<select id="'+nome+'">'+Object.keys(mapa).map(function(k){ return '<option value="'+k+'"'+(v===k?' selected':'')+'>'+mapa[k]+'</option>'; }).join('')+'</select>'; };
  var inp = function(nome, rot, v, tipo){ return '<div class="campo"><label>'+rot+'</label><input id="'+nome+'" type="'+(tipo||'text')+'"'+(tipo==='number'?' step="any"':'')+' value="'+U.esc(v===undefined?'':v)+'"></div>'; };
  UI.modal({
    titulo: id ? 'Editar criativo' : 'Novo criativo', larga:true,
    corpo: inp('cNome','Nome do criativo',x.nome)+
      '<div class="grade g3"><div class="campo"><label>Etapa</label>'+sel('cEtapa',Mk.ETAPAS,x.etapa)+'</div>'+
      '<div class="campo"><label>Status</label>'+sel('cStatus',Mk.STATUS,x.status)+'</div>'+inp('cSubida','Data de subida',x.subida,'date')+'</div>'+
      '<div class="grade g2">'+inp('cFormato','Formato (vídeo, carrossel, imagem…)',x.formato)+inp('cCamp','Campanha',x.campanha)+'</div>'+
      inp('cAngulo','Ângulo / copy / gancho',x.angulo)+
      '<div class="grade g3">'+inp('cCtr','CTR (%)',x.ctr,'number')+inp('cCpa','CPA (R$)',x.cpa,'number')+inp('cRoas','ROAS',x.roas,'number')+'</div>'+
      inp('cLink','Link do anúncio ou do arquivo',x.link)+inp('cMotivo','Por que venceu / perdeu',x.motivo),
    rodape: '<button class="btn sec" data-fechar>Cancelar</button><button class="btn" id="cSalvar">Salvar</button>',
    aoAbrir: function(el, fechar){
      el.querySelector('#cSalvar').addEventListener('click', function(){
        var g = function(s){ return el.querySelector(s).value; };
        if(!g('#cNome').trim()){ UI.toast('Dê um nome ao criativo.'); return; }
        var o = {id:id||U.id(), nome:g('#cNome').trim(), etapa:g('#cEtapa'), status:g('#cStatus'), subida:g('#cSubida'),
          formato:g('#cFormato'), campanha:g('#cCamp'), angulo:g('#cAngulo'), ctr:g('#cCtr'), cpa:g('#cCpa'), roas:g('#cRoas'), link:g('#cLink'), motivo:g('#cMotivo')};
        var lista = Mk.d().criativos, i = lista.findIndex(function(c){ return c.id===o.id; });
        if(i>=0) lista[i]=o; else lista.unshift(o);
        Mk.salvar('Criativo salvo'); fechar(); App.render();
      });
    }
  });
};

/* ---------------- EVENTOS ---------------- */
(function(){
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-mk]'); if(!t) return;
    var ac = t.getAttribute('data-mk'), id = t.getAttribute('data-id'), d = Mk.d();
    if(ac==='addEst'){ d.estrutura.push({id:U.id(), nome:'Nova campanha', etapa:'fundo', valor:0, filtro:'', teste:false, ativa:true}); Mk.salvar(); App.render(); return; }
    if(ac==='delEst'){ var i = +t.getAttribute('data-i'); UI.confirmar('Remover campanha da estrutura?', 'Os dados da Meta não são apagados, só esta linha.', function(){ d.estrutura.splice(i,1); Mk.salvar('Removida'); App.render(); }, 'Remover'); return; }
    if(ac==='calc'){ Views._mkAlvo = Mk.num(document.getElementById('mkAlvo').value); App.render(); return; }
    if(ac==='aplicar'){
      var alvo = Mk.num(document.getElementById('mkAlvo').value), base = Mk.base(), tot = Mk.total(base);
      if(!alvo || !tot){ UI.toast('Informe o novo total.'); return; }
      UI.confirmar('Aplicar o novo orçamento?', 'A estrutura passa de '+U.brl(tot,0)+' para '+U.brl(alvo,0)+' por dia, mantendo a proporção. Lembre de ajustar também no Gerenciador de Anúncios.', function(){
        base.forEach(function(e){ e.valor = Math.round(Mk.num(e.valor)*alvo/tot); });
        Mk.decidir('Estrutura ajustada de '+U.brl(tot,0)+' para '+U.brl(alvo,0)+'/dia ('+(alvo>=tot?'+':'')+U.pct((alvo-tot)/tot*100,0)+')');
        Views._mkAlvo = null; Mk.salvar('Estrutura atualizada'); App.render();
      }, 'Aplicar');
      return;
    }
    if(ac==='filtro'){ Views._mkFiltro = t.getAttribute('data-v'); App.render(); return; }
    if(ac==='novoCri'){ Mk.formCri(); return; }
    if(ac==='editCri'){ Mk.formCri(id); return; }
    if(ac==='delCri'){ UI.confirmar('Excluir criativo?', 'Ele sai da biblioteca e do mural.', function(){ d.criativos = d.criativos.filter(function(c){ return c.id!==id; }); Mk.salvar('Excluído'); App.render(); }); return; }
    if(ac==='fecharCiclo'){
      var k = t.getAttribute('data-v');
      UI.confirmar('Concluir a renovação de '+Mk.ETAPAS[k]+'?', 'A data da última renovação vira hoje e o checklist recomeça.', function(){
        d.ciclos[k] = {ultima:U.hoje(), check:{}}; Mk.decidir('Criativos de '+Mk.ETAPAS[k].toLowerCase()+' de funil renovados'); Mk.salvar('Ciclo renovado'); App.render();
      }, 'Concluir');
      return;
    }
    if(ac==='addDec'){ var v = (document.getElementById('mkDec').value||'').trim(); if(!v) return; Mk.decidir(v); Mk.salvar('Decisão registrada'); App.render(); return; }
    if(ac==='delDec'){ d.decisoes = d.decisoes.filter(function(x){ return x.id!==id; }); Mk.salvar(); App.render(); return; }
    if(ac==='addPost'){
      var tema = (document.getElementById('mkPTema').value||'').trim(); if(!tema){ UI.toast('Escreva o tema.'); return; }
      d.posts.push({id:U.id(), data:document.getElementById('mkPData').value, tipo:document.getElementById('mkPTipo').value, tema:tema, status:'ideia'});
      Mk.salvar('Adicionado'); App.render(); return;
    }
    if(ac==='delPost'){ d.posts = d.posts.filter(function(x){ return x.id!==id; }); Mk.salvar(); App.render(); return; }
  });
  document.addEventListener('change', function(e){
    var el = e.target, cam = el.getAttribute && el.getAttribute('data-mkset'); if(!cam) return;
    var p = cam.split('.'), o = Mk.d();
    for(var i=0;i<p.length-1;i++){ if(o[p[i]]===undefined||o[p[i]]===null) o[p[i]] = {}; o = o[p[i]]; }
    var ult = p[p.length-1];
    o[ult] = el.type==='checkbox' ? el.checked : (el.type==='number' ? Mk.num(el.value) : el.value);
    Mk.salvar(); App.render();
  });
})();


document.addEventListener('DOMContentLoaded', App.init);
})();
</script>
</body>
