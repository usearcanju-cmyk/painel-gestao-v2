<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1714">
<title>Produção · Use Arcanju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --vinho:#5a332e; --vinho-escuro:#2a1714; --vinho-claro:#8a5a52;
  --verde:#1f9d6c; --verde-fundo:#e8f5ef; --ambar:#b07a1e; --ambar-fundo:#fbf2e0; --rubro:#a8322c; --rubro-fundo:#fbeceb;
  --papel:#fbf9f7; --carta:#fff; --linha:#e9e3dc; --linha-forte:#d8cfc6;
  --texto:#1f1a18; --medio:#6b615b; --fraco:#94897f;
  --serif:'Spectral',Georgia,serif; --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--papel);color:var(--texto);font-family:var(--sans);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vinho);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* entrada */
.entrada{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--vinho-escuro);color:#f5ece6}
.entrada .caixa{width:100%;max-width:340px;text-align:center}
.entrada h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0 0 4px}
.entrada p{margin:0 0 22px;opacity:.75}
.pinvis{display:flex;justify-content:center;gap:12px;margin-bottom:20px}
.pinvis i{width:14px;height:14px;border-radius:50%;border:2px solid #f5ece6;display:block}
.pinvis i.on{background:#f5ece6}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.teclado button{height:62px;border-radius:14px;border:1px solid rgba(245,236,230,.25);background:rgba(245,236,230,.06);color:#f5ece6;font-size:24px;font-weight:600;cursor:pointer}
.teclado button:active{background:rgba(245,236,230,.2)}
.msg-erro{color:#ffb4ab;min-height:22px;margin-top:12px;font-size:14px}

/* app */
.topo{position:sticky;top:0;z-index:10;background:var(--vinho-escuro);color:#f5ece6;padding:12px 16px 0}
.topo .linha1{display:flex;align-items:center;gap:10px;max-width:980px;margin:0 auto}
.topo h1{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;flex:1;min-width:0}
.topo h1 small{display:block;font-family:var(--sans);font-size:12px;font-weight:400;opacity:.7}
.btn-topo{border:1px solid rgba(245,236,230,.3);background:none;color:#f5ece6;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.modos{display:flex;gap:6px;max-width:980px;margin:10px auto 0}
.modos button{flex:1;border:0;border-radius:10px 10px 0 0;padding:9px;font-weight:600;cursor:pointer;background:rgba(245,236,230,.08);color:#f5ece6}
.modos button[aria-pressed="true"]{background:var(--papel);color:var(--vinho-escuro)}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px}
.abas{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--carta);border-top:1px solid var(--linha);padding-bottom:env(safe-area-inset-bottom)}
.abas button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--fraco);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.abas button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.abas button[aria-selected="true"]{color:var(--vinho)}
@media (min-width:860px){
  .abas{position:static;max-width:980px;margin:0 auto;border:0;border-bottom:1px solid var(--linha);background:none}
  .abas button{flex-direction:row;justify-content:center;font-size:14px;padding:12px}
  main{padding-bottom:40px}
}

h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:4px 0 10px}
h3{font-size:15px;font-weight:700;margin:0 0 8px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.destaque{background:var(--vinho-escuro);color:#f5ece6;border:0}
.destaque .fraco{color:rgba(245,236,230,.7)}
.fraco{color:var(--fraco)}
.medio{color:var(--medio)}
.pequeno{font-size:13px}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--carta);border:1px solid var(--linha);border-radius:12px;padding:12px}
.kpi b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--medio)}
.barra{height:10px;border-radius:5px;background:rgba(245,236,230,.2);overflow:hidden;margin:10px 0 4px}
.barra i{display:block;height:100%;background:#7fd1ae}
.relogio{font-family:var(--serif);font-size:34px;line-height:1;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.cr{background:var(--rubro-fundo);color:var(--rubro)}
.chip.at{background:var(--ambar-fundo);color:#8a5e13}
.chip.ok{background:var(--verde-fundo);color:#157a53}
.chip.neu{background:#f1ece8;color:var(--medio)}

.tarefa{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha)}
.tarefa:last-child{border-bottom:0}
.tarefa .hora{font-variant-numeric:tabular-nums;font-weight:700;min-width:46px;color:var(--vinho)}
.tarefa .txt{flex:1}
.tarefa.feita .txt,.tarefa.feita .hora{opacity:.45;text-decoration:line-through}
.caixinha{width:28px;height:28px;border-radius:8px;border:2px solid var(--linha-forte);background:var(--carta);flex:0 0 auto;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:800}
.caixinha.on{background:var(--verde);border-color:var(--verde)}
.agora{background:var(--ambar-fundo);margin:0 -16px;padding:11px 16px}

.os{border:1px solid var(--linha);border-radius:14px;background:var(--carta);margin-bottom:10px;overflow:hidden}
.os-cab{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.os-cab .n{font-family:var(--serif);font-size:20px;font-weight:700}
.os-cab .quem{font-size:12.5px;color:var(--medio)}
.os-corpo{padding:0 14px 14px;border-top:1px solid var(--linha)}
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--linha);align-items:center}
.item:last-child{border-bottom:0}
.item .q{font-family:var(--serif);font-size:22px;font-weight:700;min-width:30px;text-align:center}
.cor{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--linha-forte);vertical-align:-2px;margin-right:4px}
.etapas{display:flex;gap:4px;margin:12px 0 10px}
.etapas span{flex:1;height:6px;border-radius:3px;background:var(--linha)}
.etapas span.on{background:var(--verde)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--vinho);color:#fff;font-size:15px}
.btn.grande{width:100%;padding:15px;font-size:16px}
.btn.sec{background:var(--carta);color:var(--vinho);border:1.5px solid var(--vinho)}
.btn.leve{background:#f1ece8;color:var(--texto)}
.btn:disabled{opacity:.45;cursor:default}
.linha-btn{display:flex;gap:8px;flex-wrap:wrap}
.onda-cab{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.onda-cab h3{margin:0;flex:1}
.grupo{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--linha)}
.grupo .q{font-family:var(--serif);font-size:26px;font-weight:700;min-width:44px;text-align:center}
.flutuante{position:fixed;right:16px;bottom:84px;z-index:11;border:0;border-radius:30px;padding:12px 16px;background:var(--rubro);color:#fff;font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);cursor:pointer}
@media (min-width:860px){ .flutuante{bottom:24px} }
.guia h3{margin-top:6px}
.guia ol{margin:0;padding-left:20px}
.guia li{margin:6px 0}
.vazio{text-align:center;padding:30px 10px;color:var(--medio)}
.modal-fundo{position:fixed;inset:0;background:rgba(20,10,8,.5);z-index:50;display:grid;place-items:end center}
.modal{background:var(--carta);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:90vh;overflow:auto}
@media (min-width:600px){ .modal-fundo{place-items:center} .modal{border-radius:18px} }
label.campo{display:block;font-size:13px;font-weight:600;color:var(--medio);margin:10px 0 4px}
select,textarea,input[type=text]{width:100%;padding:11px;border:1px solid var(--linha-forte);border-radius:10px;background:var(--carta)}
textarea{min-height:90px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--texto);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.lote{border-left:4px solid var(--ambar)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="entrada" id="telaEntrada">
  <div class="caixa">
    <h1>Produção</h1>
    <p>Use Arcanju. Digite o seu PIN.</p>
    <div class="pinvis" id="pinvis"></div>
    <div class="teclado" id="teclado"></div>
    <div class="msg-erro" id="erroPin" role="alert"></div>
  </div>
</section>

<div id="telaApp" hidden>
  <header class="topo">
    <div class="linha1">
      <h1 id="titulo">Produção<small id="subtitulo"></small></h1>
      <button class="btn-topo" id="btnAtualizar">Atualizar</button>
      <button class="btn-topo" id="btnSair">Sair</button>
    </div>
    <div class="modos" id="modos" role="group" aria-label="Linha de produção"></div>
  </header>
  <nav class="abas" role="tablist" id="abas"></nav>
  <main id="conteudo"></main>
  <button class="flutuante" id="btnProblema">Avisar problema</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var API = '/api/producao';
var ETAPAS = ['separar','prensar','conferir','embalar','etiqueta','expedir'];
var NOME_ETAPA = {separar:'Separar', prensar:'Prensar', conferir:'Conferir', embalar:'Embalar', etiqueta:'Etiqueta', expedir:'Levar à agência'};
var FEITO_ETAPA = {separar:'Separado', prensar:'Prensado', conferir:'Conferido', embalar:'Embalado', etiqueta:'Etiquetado', expedir:'Postado'};
var DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var CORES = {OFF:'#f1e9dc', PRETO:'#1c1c1c', BRANCA:'#ffffff', AZUL:'#1f3a64'};

var PADRAO = {
  limites: {'1':'17:00','2':'17:00','3':'17:00','4':'17:00','5':'15:00','6':'12:00'},
  prensa: {temp:120, tempo:10, pressao:'média'},
  rotina: ['08:00 | Ligar a prensa em 120 °C, abrir o portal e ver o plano do dia',
    '08:10 | Recortar de uma vez todos os DTF do dia (lista na aba Prensa)',
    '08:40 | Onda 1: separar as camisetas de cada pedido na sua cesta',
    '09:30 | Onda 1: prensar, agrupando pela mesma estampa',
    '10:45 | Onda 1: conferir e embalar',
    '12:00 | Almoço',
    '13:00 | Onda 2: separar e prensar',
    '14:15 | Onda 2: conferir e embalar',
    '15:15 | Pagar todas as etiquetas no site, imprimir e colar',
    '16:00 | Conferir o nome da etiqueta com a ordem e levar à agência',
    '17:00 | Apoio: montar kits de brinde, guardar camisetas que chegaram e repor as mesas',
    '17:40 | Limpeza e arrumação'].join('\n'),
  rotinaSexta: ['08:00 | Ligar a prensa em 120 °C, abrir o portal e ver o plano do dia',
    '08:10 | Recortar de uma vez todos os DTF do dia',
    '08:40 | Onda 1: separar, prensar, conferir e embalar',
    '11:00 | Onda 2: separar e prensar',
    '12:00 | Almoço',
    '13:00 | Onda 2: conferir e embalar',
    '13:45 | Pagar todas as etiquetas, imprimir e colar',
    '14:15 | Levar à agência (hoje o limite é 15:00)',
    '15:15 | Apoio: kits de brinde, camisetas que chegaram, recorte dos DTF de segunda',
    '16:30 | Limpeza da semana',
    '17:40 | Limpeza e arrumação'].join('\n'),
  rotinaSabado: ['08:00 | Ligar a prensa e ver o plano',
    '08:10 | Separar, prensar, conferir e embalar os pedidos que vencem',
    '10:45 | Pagar e colar as etiquetas',
    '11:15 | Levar à agência (sábado o limite é 12:00)'].join('\n'),
  limpezaDia: 'Tirar os recortes e filmes de DTF das mesas\nLimpar a base e o teflon da prensa, com ela fria\nVarrer o chão\nEsvaziar o lixo\nDevolver as cestas vazias ao lugar\nDesligar a prensa da tomada',
  limpezaSemana: 'Limpar as prateleiras\nContar as camisetas lisas e anotar\nOrganizar as pastas de DTF por estampa\nRepor saquinhos, etiquetas e kits na mesa de embalagem',
  guia: ['## Prensa',
    'Ligar e esperar chegar a 120 °C',
    'Pré-prensar a camiseta vazia por 2 segundos para tirar a umidade e as dobras',
    'Alinhar a estampa pela marca da base (gola encostada na marca)',
    'Prensar por 10 segundos, pressão média',
    'Tirar o filme do jeito certo para o seu filme (quente ou frio)',
    'Deixar a peça esfriar esticada antes de dobrar',
    '## Conferência',
    'Estampa centralizada e na altura certa',
    'Sem bolha, falha, sujeira ou brilho de cola',
    'Tamanho, cor e modelo iguais aos da ordem',
    'Com defeito: separar a peça, pegar outra e avisar pelo botão Avisar problema',
    '## Dobra com o gabarito',
    'Camiseta de frente para baixo em cima do gabarito',
    'Dobrar as laterais e as mangas sobre o gabarito',
    'Dobrar a parte de baixo para cima e tirar o gabarito',
    'A estampa fica visível de frente',
    '## Embalagem',
    'Colocar a camiseta dobrada (ou as camisetas) no saquinho transparente',
    'Colocar os brindes: capelinha, sacolinha e uma borrifada de cheirinho',
    'Fechar o zip do saquinho transparente',
    'Colocar no saquinho preto de envio, tirar o plástico da cola e fechar',
    'Colar a etiqueta de envio e a declaração ou nota fiscal',
    'Conferir: o nome da etiqueta é o mesmo da ordem de serviço',
    '## Etiquetas e postagem',
    'Pagar todas as etiquetas do dia de uma vez no site',
    'Imprimir tudo e colar na hora de embalar ou logo depois',
    'Separar os pacotes por transportadora na caixa Sai hoje',
    'Levar à agência antes do horário limite',
    '## Recorte do DTF',
    'Recortar de uma vez só, no começo do dia, tudo o que vai ser prensado',
    'Usar guilhotina ou refiladora de papel, cortando várias estampas juntas',
    'Guardar cada estampa recortada no envelope ou pasta dela',
    '## Camisetas que chegam das costureiras',
    'Contar e conferir com a ordem de corte',
    'Dobrar com o gabarito na hora, em lote',
    'Guardar na prateleira da cor, do modelo e do tamanho, as mais antigas na frente',
    '## Organização da sala',
    'A produção anda em uma direção: prateleira, separação, prensa, conferência, embalagem, saída',
    'Cada pedido tem a sua cesta com a ordem de serviço dentro',
    'Mesa de embalagem sempre com saquinhos, kits, cheirinho e fita',
    'Caixa Sai hoje perto da porta',
    'Nada no chão: o que não está sendo usado volta para o lugar'].join('\n')
};

var S = {token: localStorage.getItem('prod_token')||'', dados:null, modo: localStorage.getItem('prod_modo')||'arcanju', aba:'hoje', aberta:null, prensados:{}};
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(function(){ t.classList.remove('on'); },2600); }
function cfg(){ var c=(S.dados&&S.dados.config)||{}; var o={}; Object.keys(PADRAO).forEach(function(k){ o[k] = (c[k]!==undefined && c[k]!=='' ) ? c[k] : PADRAO[k]; }); return o; }
function dt(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function br(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'/'+p[1]; }
function hojeISO(){ return S.dados ? S.dados.hoje : new Date().toISOString().slice(0,10); }
function diaSemana(){ return dt(hojeISO()).getDay(); }

/* ---------- servidor ---------- */
function api(acao, corpo){
  var op = {method: corpo?'POST':'GET', headers:{'x-prod-token':S.token}};
  if(corpo){ op.headers['content-type']='application/json'; op.body=JSON.stringify(corpo); }
  return fetch(API+'?acao='+acao, op).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(r.status===401 && acao!=='entrar'){ sair(true); throw new Error(j.erro||'Sessão expirada.'); }
      if(!r.ok) throw new Error(j.erro||('Erro '+r.status));
      return j;
    });
  });
}
function carregar(silencioso){
  return api('dia').then(function(d){ S.dados=d; render(); })
    .catch(function(e){ if(!silencioso) toast(e.message); });
}

/* ---------- entrada ---------- */
var pin = '';
function desenharPin(){
  $('#pinvis').innerHTML = [0,1,2,3].map(function(i){ return '<i class="'+(i<pin.length?'on':'')+'"></i>'; }).join('') + (pin.length>4?'<i class="on"></i>'.repeat(pin.length-4):'');
}
function montarTeclado(){
  var t = ['1','2','3','4','5','6','7','8','9','Apagar','0','Entrar'];
  $('#teclado').innerHTML = t.map(function(k){ return '<button type="button" data-k="'+k+'" style="'+(k.length>1?'font-size:15px':'')+'">'+k+'</button>'; }).join('');
  $('#teclado').onclick = function(e){
    var b = e.target.closest('button'); if(!b) return;
    var k = b.getAttribute('data-k');
    if(k==='Apagar') pin = pin.slice(0,-1);
    else if(k==='Entrar') entrar();
    else if(pin.length<8) pin += k;
    $('#erroPin').textContent=''; desenharPin();
  };
  document.addEventListener('keydown', function(e){
    if(!$('#telaEntrada').hidden){
      if(/^\d$/.test(e.key) && pin.length<8){ pin+=e.key; desenharPin(); }
      else if(e.key==='Backspace'){ pin=pin.slice(0,-1); desenharPin(); }
      else if(e.key==='Enter') entrar();
    }
  });
}
function entrar(){
  if(pin.length<4){ $('#erroPin').textContent='O PIN tem pelo menos 4 números.'; return; }
  api('entrar', {pin:pin}).then(function(r){
    S.token = r.token; localStorage.setItem('prod_token', r.token); pin=''; desenharPin();
    mostrarApp();
  }).catch(function(e){ pin=''; desenharPin(); $('#erroPin').textContent=e.message; });
}
function sair(expirou){
  if(!expirou && S.token) api('sair',{}).catch(function(){});
  S.token=''; S.dados=null; localStorage.removeItem('prod_token');
  $('#telaApp').hidden = true; $('#telaEntrada').hidden = false;
  if(expirou) $('#erroPin').textContent='Sua sessão terminou. Entre de novo.';
}
function mostrarApp(){
  $('#telaEntrada').hidden = true; $('#telaApp').hidden = false;
  carregar();
}

/* ---------- plano do dia ---------- */
function equipeHoje(){
  var d = diaSemana();
  return ((S.dados&&S.dados.equipe)||[]).filter(function(f){ return (f.dias||[]).indexOf(d)>=0; });
}
function proxima(o){ var e=o.etapas||{}; for(var i=0;i<ETAPAS.length;i++){ if(!e[ETAPAS[i]]) return ETAPAS[i]; } return null; }
function feitasHoje(modo){
  var h = hojeISO();
  return ((S.dados&&S.dados.ordens[modo])||[]).filter(function(o){ return o.etapas && o.etapas.expedir && o.etapas.expedir.em && toLocalISO(o.etapas.expedir.em)===h; });
}
function toLocalISO(ts){ var d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function plano(modo){
  var h = hojeISO();
  var todas = ((S.dados&&S.dados.ordens[modo])||[]);
  var abertas = todas.filter(function(o){ return proxima(o); });
  var esperando = [];
  if(modo==='lazarus'){
    esperando = abertas.filter(function(o){ return o.liberadoEm && o.liberadoEm>h; });
    abertas = abertas.filter(function(o){ return !o.liberadoEm || o.liberadoEm<=h; });
  }
  abertas.sort(function(a,b){ return (a.prazo||'9')<(b.prazo||'9')?-1:((a.prazo||'9')>(b.prazo||'9')?1:(String(a.numero)<String(b.numero)?-1:1)); });

    atrasadas: abertas.filter(function(o){ return o.prazo && o.prazo<h; }), vencemHoje: abertas.filter(function(o){ return o.prazo===h; })};

  fundo.querySelector('#pbEnviar').onclick = function(){
    api('problema', {modo:S.modo, os:fundo.querySelector('#pbOs').value, tipo:fundo.querySelector('#pbTipo').value, texto:fundo.querySelector('#pbTxt').value})
      .then(function(){ fechar(); toast('Aviso enviado. O Mateus vai ver no painel.'); })
      .catch(function(e){ toast(e.message); });
  };
}

document.addEventListener('click', function(e){
  var t;
  if((t = e.target.closest('[data-aba]'))){ S.aba = t.getAttribute('data-aba'); render(); window.scrollTo(0,0); return; }
  if((t = e.target.closest('[data-modo]'))){ S.modo = t.getAttribute('data-modo'); localStorage.setItem('prod_modo', S.modo); S.aberta=null; render(); return; }
  if((t = e.target.closest('[data-abrir]'))){ var id = t.getAttribute('data-abrir'); S.aberta = S.aberta===id ? null : id; render(); return; }
  if((t = e.target.closest('[data-etapa]'))){ marcar([t.getAttribute('data-id')], t.getAttribute('data-etapa')); return; }
  if((t = e.target.closest('[data-desfazer]'))){ marcar([t.getAttribute('data-id')], t.getAttribute('data-desfazer'), false); return; }
  if((t = e.target.closest('[data-lote]'))){ var ids = (t.getAttribute('data-ids')||'').split(',').filter(Boolean); if(ids.length) marcar(ids, t.getAttribute('data-lote')); return; }
  if((t = e.target.closest('[data-tarefa]'))){ marcarTarefa(t.getAttribute('data-tarefa')); return; }
  if((t = e.target.closest('[data-problema]'))){ abrirProblema(t.getAttribute('data-problema')); return; }
});
$('#btnProblema').onclick = function(){ abrirProblema(''); };
$('#btnSair').onclick = function(){ sair(false); };
$('#btnAtualizar').onclick = function(){ carregar().then(function(){ toast('Atualizado'); }); };
setInterval(function(){ if(S.token && !$('#telaApp').hidden && document.visibilityState==='visible' && !document.querySelector('.modal-fundo')) carregar(true); }, 60000);

montarTeclado(); desenharPin();
if(S.token) mostrarApp();
})();
</script>
